<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARS — Система мониторинга</title>
<style>
:root{--p:#3b82f6;--ph:#2563eb;--g:#10b981;--w:#f59e0b;--r:#ef4444;--bg:#f1f5f9;--b:#e2e8f0;--t:#1e293b;--m:#64748b;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--t)}
nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--b)}.nav{max-width:1280px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;color:#475569;font-size:14px}.tab.active{color:var(--p);border-color:var(--p);font-weight:700}.user{display:flex;gap:8px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;font-weight:700}
main{max-width:1280px;margin:auto;padding:22px}.section{display:none}.section.active{display:block}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.title{font-size:24px;font-weight:700}.sub{font-size:14px;color:var(--m);margin-top:3px}
.panel{background:#fff;border:1px solid var(--b);border-radius:14px;box-shadow:0 1px 3px #0001;overflow:hidden;margin-bottom:18px}.info{background:#eff6ff;border-bottom:1px solid #bfdbfe;color:#1e40af;padding:14px 18px;font-size:14px}.toolbar{background:#f8fafc;border-bottom:1px solid var(--b);padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.content{padding:16px 18px;max-height:680px;overflow:auto}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--b)}
button,.btn{border:0;border-radius:9px;padding:8px 13px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;font-size:14px}button:hover{background:var(--ph)}button:disabled{opacity:.45;cursor:not-allowed}.outline{background:#fff;color:#334155;border:1px solid #cbd5e1}.outline:hover{background:#f8fafc}.ghost{background:transparent;color:#334155}.ghost:hover{background:#f1f5f9}.danger{background:var(--r)}.danger:hover{background:#dc2626}.success{background:var(--g)}.purple{background:var(--purple)}.sm{padding:5px 10px;font-size:12px}
input,select,textarea{border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;font-size:14px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #3b82f61a}.wide{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.hint{font-size:12px;color:var(--m);margin-top:4px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card:hover{border-color:var(--p);box-shadow:0 2px 8px #3b82f61a}.card.sel{background:#eff6ff;border-color:var(--p)}.left{display:flex;align-items:center;gap:12px;min-width:0}.icon{font-size:28px}.name{font-weight:800}.muted{color:var(--m);font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700;background:#f1f5f9;color:#334155}.blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#15803d}.amber{background:#fef3c7;color:#b45309}.red{background:#fee2e2;color:#b91c1c}.violet{background:#ede9fe;color:#6d28d9}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 18px;background:#f8fafc;border-bottom:1px solid var(--b)}.stat{background:#fff;border:1px solid var(--b);border-radius:11px;padding:13px}.stat .n{font-size:24px;font-weight:800}
.details{display:none;margin-top:12px;border-top:1px solid var(--b);padding-top:12px}.details.open{display:block}.svcitem{border:1px solid var(--b);border-radius:11px;padding:12px;margin:8px 0}.portrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--b)}.portrow input{width:90px}
.chk{width:18px;height:18px;accent-color:var(--p)}.empty{text-align:center;padding:28px;color:var(--m)}.rule{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:11px;padding:12px;margin-bottom:14px;font-size:14px}
.modalWrap{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modalWrap.show{display:flex}.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}.modalHead,.modalFoot{padding:14px 18px;background:#f8fafc;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;gap:10px}.modalFoot{border-top:1px solid var(--b);border-bottom:0}.modalBody{padding:18px;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;background:#1e293b;color:#fff;border-radius:10px;padding:13px 18px;box-shadow:0 12px 30px #0003;opacity:0;transform:translateY(80px);transition:.25s;z-index:80}.toast.show{opacity:1;transform:none}
@media(max-width:820px){.row,.stats{grid-template-columns:1fr}.card{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.nav{align-items:flex-start}.user select{width:100%}main{padding:14px}}
</style>
</head>
<body>
<nav><div class="nav"><div class="left"><span class="brand">🖥️ MARS</span><div class="tabs">
<span class="tab active" id="nav-hosts" onclick="switchSection('hosts')">Хосты</span>
<span class="tab" id="nav-services" onclick="switchSection('services')">🔌 Сервисы</span>
<span class="tab" id="nav-templates" onclick="switchSection('templates')">🧩 Шаблоны сервисов</span>
<span class="tab" id="nav-access" onclick="switchSection('access')">👥 Доступ</span>
<span class="tab" id="nav-collections" onclick="switchSection('collections')">📦 Коллекции</span>
</div></div><div class="user"><select id="userSel" onchange="switchUser(this.value)"></select><span class="avatar" id="avatar">A</span></div></div></nav>
<main>
<section id="sec-hosts" class="section active"></section>
<section id="sec-services" class="section"></section>
<section id="sec-templates" class="section"></section>
<section id="sec-access" class="section"></section>
<section id="sec-collections" class="section"></section>
</main>
<div id="modalWrap" class="modalWrap"><div class="modal"><div class="modalHead"><div><b id="modalTitle"></b><div class="muted" id="modalSub"></div></div><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalBody" class="modalBody"></div><div id="modalFoot" class="modalFoot"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='mars-ui-state-v7',LEGACY=['mars-ui-state-v6','mars-ui-state-v5','mars-ui-state-v4','mars-ui-state-v3','mars-ui-state-v2'];
let hosts=[],services=[],collections=[],users=[],groups=[],currentUserId='u-admin';
let selectedHosts=new Set(),selectedServices=new Set(),selectedTemplates=new Set(),expandedHost=null,attachCtx=null,attachStep=1,attachItem=null,attachAuth=[],editingService=null,editingHost=null,editingTpl=null,draftCert=null,draftTplCert=null,colDraft=[];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function demo(){return{
groups:[{id:'grp-infra',name:'Team-Infra',description:'Инфраструктурные сервисы и web/exporter мониторинг'},{id:'grp-data',name:'Team-Data',description:'Базы данных и аналитика'},{id:'grp-platform',name:'Team-Platform',description:'Платформа, Kubernetes и общие компоненты'}],
users:[{id:'u-admin',name:'Alice Admin',initials:'A',isAdmin:true,canMonitor:true,groupIds:['grp-infra','grp-data','grp-platform']},{id:'u-infra',name:'Ivan Infra',initials:'I',isAdmin:false,canMonitor:true,groupIds:['grp-infra']},{id:'u-data',name:'Daria Data',initials:'D',isAdmin:false,canMonitor:true,groupIds:['grp-data']},{id:'u-viewer',name:'Victor Viewer',initials:'V',isAdmin:false,canMonitor:false,groupIds:['grp-platform']}],
currentUserId:'u-admin',
services:[
{id:'svc-1',name:'PostgreSQL',groupId:'grp-data',createdBy:'u-data',type:'SQL',icon:'🐘',defaultPort:5432,metrics:'/metrics',protocol:null,auth:{mode:'basic',username:'monitor',password:''},isTemplate:false,usedBy:12},
{id:'svc-2',name:'Nginx',groupId:'grp-infra',createdBy:'u-infra',type:'ExporterScrape',icon:'🌐',defaultPort:80,metrics:'/nginx_metrics',protocol:'http',auth:{mode:'none'},isTemplate:false,usedBy:24},
{id:'svc-3',name:'Redis Cache',groupId:'grp-platform',createdBy:'u-admin',type:'ExporterScrape',icon:'🔴',defaultPort:6379,metrics:'/metrics',protocol:'http',auth:{mode:'none'},isTemplate:false,usedBy:8},
{id:'tpl-1',name:'Шаблон "Nginx Standard"',groupId:'grp-infra',createdBy:'u-infra',type:'ExporterScrape',icon:'🌐',defaultPort:80,metrics:'/metrics',protocol:'http',auth:null,isTemplate:true,usedBy:0},
{id:'tpl-2',name:'Шаблон "PostgreSQL Advanced"',groupId:'grp-data',createdBy:'u-data',type:'SQL',icon:'🐘',defaultPort:5432,metrics:'/metrics',protocol:null,auth:null,isTemplate:true,usedBy:0},
{id:'tpl-3',name:'Шаблон "Secure Exporter"',groupId:'grp-infra',createdBy:'u-infra',type:'ExporterScrape',icon:'🔒',defaultPort:443,metrics:'/metrics',protocol:'https',skipServerCertificateValidation:false,clientCertificate:null,auth:null,isTemplate:true,usedBy:0}],
collections:[{id:'col-1',name:'Web Stack',description:'Nginx + PostgreSQL',serviceIds:['svc-1','svc-2'],usedBy:12},{id:'col-2',name:'Cache Stack',description:'Redis + Nginx',serviceIds:['svc-2','svc-3'],usedBy:8}],
hosts:[
{id:1,name:'web-prod-01',createdBy:'u-infra',addressType:'ip',address:'10.0.1.50',segment:'prod-dmz',status:'UP',attachments:[{serviceId:'svc-1',auth:{mode:'basic',username:'admin',password:'secret'},portOverride:null,attachedBy:'u-infra'},{serviceId:'svc-2',auth:null,portOverride:null,attachedBy:'u-infra'}]},
{id:2,name:'db-analytics',createdBy:'u-data',addressType:'fqdn',address:'db-analytics.internal.example.com',segment:'analytics',status:'WARN',attachments:[{serviceId:'svc-1',auth:{mode:'basic',username:'admin',password:'pass123'},portOverride:null,attachedBy:'u-data'}]},
{id:3,name:'cache-01',createdBy:'u-admin',addressType:'ip',address:'192.168.1.10',segment:'k8s',status:'UP',attachments:[{serviceId:'svc-3',auth:null,portOverride:null,attachedBy:'u-admin'}]}]}}
function normAuth(a){if(!a)return{mode:'none'};if(a.mode==='basic')return{mode:'basic',username:a.username||'',password:a.password||''};if(a.mode==='bearer')return{mode:'bearer',token:a.token||''};if(a.mode==='none')return{mode:'none'};if('username'in a||'password'in a)return{mode:'basic',username:a.username||'',password:a.password||''};return{mode:'none'}}
function normSvc(s){let type=s.type||s.agent||'ExporterScrape',tpl=!!s.isTemplate;let groupId=s.groupId||(type==='SQL'?'grp-data':'grp-infra');return{...s,type,agent:type,groupId,createdBy:s.createdBy||'u-admin',defaultPort:Number(s.defaultPort)||80,metrics:s.metrics||'/metrics',protocol:type==='ExporterScrape'?(s.protocol||'http'):null,clientCertificate:s.clientCertificate||null,skipServerCertificateValidation:!!s.skipServerCertificateValidation,auth:tpl?null:normAuth(s.auth),isTemplate:tpl,usedBy:Number(s.usedBy)||0}}
function normalize(){let d=demo();groups=(groups?.length?groups:d.groups);users=(users?.length?users:d.users).map(u=>({...u,groupIds:u.groupIds||[]}));if(!users.some(u=>u.id===currentUserId))currentUserId=users[0]?.id||'u-admin';services=(services||[]).map(normSvc);hosts=(hosts||[]).map(h=>({...h,createdBy:h.createdBy||'u-admin',addressType:h.addressType||'ip',attachments:(h.attachments||[]).map(a=>({...a,auth:a.auth?normAuth(a.auth):null,portOverride:a.portOverride??null,attachedBy:a.attachedBy||'u-admin'}))}));collections=(collections||[]).map(c=>({...c,serviceIds:c.serviceIds||[],usedBy:+c.usedBy||0}))}
function save(){normalize();localStorage.setItem(KEY,JSON.stringify({hosts,services,collections,users,groups,currentUserId}))}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)for(let k of LEGACY){raw=localStorage.getItem(k);if(raw)break}if(!raw)return false;let d=JSON.parse(raw);hosts=d.hosts||[];services=d.services||[];collections=d.collections||[];users=d.users||[];groups=d.groups||[];currentUserId=d.currentUserId||'u-admin';normalize();save();return true}catch(e){console.warn(e);return false}}
function u(){return users.find(x=>x.id===currentUserId)||users[0]||{groupIds:[]}}function admin(){return!!u().isAdmin}function monitor(){return admin()||!!u().canMonitor}function gname(id){return(groups.find(g=>g.id===id)||{}).name||'Без группы'}function uname(id){return(users.find(u=>u.id===id)||{}).name||'Неизвестно'}function groupsForUser(){return admin()?groups:groups.filter(g=>(u().groupIds||[]).includes(g.id))}function inGroup(id){return admin()||(u().groupIds||[]).includes(id)}function canSvc(s){return!!s&&(admin()||inGroup(s.groupId))}function canTpl(s){return canSvc(s)}function canHostDel(h){return admin()||h.createdBy===currentUserId}function canHostEdit(h){return monitor()}
function authLabel(a){a=normAuth(a);return a.mode==='basic'?'Basic Auth':a.mode==='bearer'?'Bearer Token':'Без авторизации'}function hasAuth(a){return normAuth(a).mode!=='none'}function endpoint(h,a,s){let port=a.portOverride||s.defaultPort;return s.type==='ExporterScrape'?`${s.protocol||'http'}://${h.address}:${port}${s.metrics||'/metrics'}`:`${h.address}:${port}`}
function meta(s,auth=true){let tls=s.type==='ExporterScrape'&&s.protocol==='https';let p=`<span class="badge violet">👥 ${esc(gname(s.groupId))}</span><span class="badge blue">Тип: ${esc(s.type)}</span><span class="badge">Порт: ${s.defaultPort}</span>`;if(s.type==='ExporterScrape')p+=`<span class="badge ${tls?'amber':'green'}">${(s.protocol||'http').toUpperCase()}</span><span class="badge mono">${esc(s.metrics||'/metrics')}</span>`;if(tls){p+=`<span class="badge amber">cert: ${s.clientCertificate?'yes':'no'}</span>`;if(s.skipServerCertificateValidation)p+=`<span class="badge amber">skip verify</span>`}if(auth)p+=`<span class="badge ${hasAuth(s.auth)?'amber':''}">${hasAuth(s.auth)?'🔐':'🔓'} ${esc(authLabel(s.auth))}</span>`;return`<div class="pills">${p}</div>`}
function renderUser(){userSel.innerHTML=users.map(x=>`<option value="${x.id}">${esc(x.name)}${x.isAdmin?' · admin':''}</option>`).join('');userSel.value=currentUserId;avatar.textContent=u().initials||'?'}
function switchUser(id){currentUserId=id;selectedHosts.clear();selectedServices.clear();selectedTemplates.clear();save();renderAll();toast('Текущий пользователь: '+u().name)}
function switchSection(s){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('sec-'+s).classList.add('active');$('nav-'+s).classList.add('active')}

function renderAll(){renderUser();renderHosts();renderServices();renderTemplates();renderAccess();renderCollections()}
function page(id,title,sub,actions,body){$('sec-'+id).innerHTML=`<div class="head"><div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions||''}</div></div>${body}`}
function renderHosts(){let html=`<div class="panel"><div class="info"><b>Контекст: Хост.</b> Хосты уникальны, глобальны и видны всем пользователям MARS.</div><div class="toolbar"><div><input class="chk" type="checkbox" onchange="toggleAllHosts(this)"> Выбрано: <b>${selectedHosts.size}</b> из <b>${hosts.length}</b></div><div class="actions"><button class="sm ghost" ${!monitor()||!selectedHosts.size?'disabled':''} onclick="openAttach('service')">⚡ Присоединить сервис</button><button class="sm ghost" ${!monitor()||!selectedHosts.size?'disabled':''} onclick="openAttach('collection')">📦 Присоединить коллекцию</button><button class="sm danger" ${!selectedHosts.size||!hosts.some(h=>selectedHosts.has(h.id)&&canHostDel(h))?'disabled':''} onclick="bulkDeleteHosts()">🗑️ Удалить</button></div></div><div class="filters">🔍 <input id="hSearch" placeholder="Поиск..." oninput="renderHostList()"> <select id="hSeg" onchange="renderHostList()"><option value="all">Все сегменты</option><option value="prod-dmz">Production DMZ</option><option value="analytics">Analytics</option><option value="k8s">K8s Cluster</option></select></div><div class="content" id="hostList"></div></div>`;page('hosts','Управление Хостами','Присоединение сервисов и коллекций к хостам',`<button class="outline" onclick="resetDemo()">↺ Сбросить демо</button><button ${!monitor()?'disabled':''} onclick="openHostModal()">➕ Создать хост</button>`,html);renderHostList()}
function hostFiltered(){let q=($('hSearch')?.value||'').toLowerCase(),seg=$('hSeg')?.value||'all';return hosts.filter(h=>(h.name.toLowerCase().includes(q)||h.address.toLowerCase().includes(q))&&(seg==='all'||h.segment===seg))}
function renderHostList(){let list=$('hostList');if(!list)return;let arr=hostFiltered();list.innerHTML=arr.length?arr.map(h=>{let open=expandedHost===h.id,sel=selectedHosts.has(h.id);return`<div class="card ${sel?'sel':''}"><div style="width:100%"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="left"><input class="chk" type="checkbox" ${sel?'checked':''} onchange="toggleHost(${h.id})"><span class="icon">🖥️</span><div><div class="name mono">${esc(h.name)}</div><div class="muted"><span class="badge blue">${h.addressType.toUpperCase()}</span> ${esc(h.address)}</div><div class="pills"><span class="badge">Создал: ${esc(uname(h.createdBy))}</span><span class="badge">${h.attachments.length} сервисов</span><span class="badge ${h.status==='UP'?'green':'amber'}">${h.status}</span></div></div></div><div class="actions"><button class="sm ghost" onclick="toggleExpand(${h.id})">${open?'▲ Свернуть':'→ Детали'}</button>${canHostEdit(h)?`<button class="sm outline" onclick="openHostModal(${h.id})">✏️ Ред.</button>`:''}${canHostDel(h)?`<button class="sm danger" onclick="deleteHost(${h.id})">🗑️</button>`:'<span class="badge">удаляет создатель/admin</span>'}</div></div><div class="details ${open?'open':''}">${renderHostDetails(h)}</div></div></div>`}).join(''):'<div class="empty">Хосты не найдены</div>'}
function renderHostDetails(h){if(!h.attachments.length)return'<div class="muted">Нет присоединённых сервисов.</div>';return h.attachments.map((a,i)=>{let s=services.find(x=>x.id===a.serviceId);if(!s)return'';return`<div class="svcitem"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="left"><span class="icon">${s.icon}</span><div><b>${esc(s.name)}</b><div class="muted mono">Target: ${esc(endpoint(h,a,s))}</div>${meta(s,true)}<div class="pills"><span class="badge">Присоединил: ${esc(uname(a.attachedBy))}</span></div></div></div><div class="actions">${hasAuth(a.auth||s.auth)?`<span class="badge amber">🔐 ${esc(authLabel(a.auth||s.auth))}</span>`:'<span class="badge">🔓 Без авторизации</span>'}${monitor()?`<button class="sm danger" onclick="detach(${h.id},${i})">🔌 Отсоединить</button>`:'<span class="badge">только просмотр</span>'}</div></div><div class="portrow"><span class="muted">Порт:</span>${monitor()?`<input id="port-${h.id}-${i}" type="number" value="${a.portOverride||s.defaultPort}" min="1" max="65535"><button class="sm success" onclick="applyPort(${h.id},${i})">✓</button><button class="sm outline" onclick="resetPort(${h.id},${i})">↺</button>`:'<span class="badge">нет прав</span>'}<span class="muted">${a.portOverride?'переопределён':'по умолчанию'}: ${a.portOverride||s.defaultPort}</span></div></div>`}).join('')}
function toggleHost(id){selectedHosts.has(id)?selectedHosts.delete(id):selectedHosts.add(id);renderHosts()}function toggleAllHosts(ch){if(ch.checked)hosts.forEach(h=>selectedHosts.add(h.id));else selectedHosts.clear();renderHosts()}function toggleExpand(id){expandedHost=expandedHost===id?null:id;renderHostList()}
function validIp(v){let p=v.split('.');return p.length===4&&p.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255)}function validFqdn(v){return/^(?=.{1,253}$)([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/.test(v)}
function openHostModal(id){if(!monitor())return toast('Нет разрешения на постановку на мониторинг');editingHost=id||null;let h=id?hosts.find(x=>x.id===id):{name:'',addressType:'ip',address:'',segment:''};modal(id?'Редактировать хост':'Создать хост','Имя и IP/FQDN хоста',`<div class="field"><label>Имя хоста *</label><input id="mhName" class="wide" value="${esc(h.name)}" placeholder="web-prod-01"></div><div class="row"><div class="field"><label>Тип адреса</label><select id="mhType" class="wide"><option value="ip">IP</option><option value="fqdn">FQDN</option></select></div><div class="field"><label>Адрес *</label><input id="mhAddr" class="wide" value="${esc(h.address)}" placeholder="10.0.1.50 или host.example.com"></div></div><div class="field"><label>Сегмент *</label><select id="mhSeg" class="wide"><option value="">Выберите...</option><option value="prod-dmz">Production DMZ</option><option value="analytics">Analytics</option><option value="k8s">K8s Cluster</option></select></div>`,`<button class="outline" onclick="closeModal()">Отмена</button><button onclick="saveHostModal()">Сохранить</button>`);mhType.value=h.addressType;mhSeg.value=h.segment}
function saveHostModal(){let name=mhName.value.trim(),type=mhType.value,addr=mhAddr.value.trim(),seg=mhSeg.value;if(!name||!addr||!seg)return toast('Заполните обязательные поля');if(!/^[a-z0-9-]+$/i.test(name))return toast('Имя: только латиница, цифры и дефис');if(type==='ip'&&!validIp(addr))return toast('Неверный IP');if(type==='fqdn'&&!validFqdn(addr))return toast('Неверный FQDN');if(hosts.some(h=>h.id!==editingHost&&h.name.toLowerCase()===name.toLowerCase()))return toast('Имя хоста уже существует');if(hosts.some(h=>h.id!==editingHost&&h.addressType===type&&h.address.toLowerCase()===addr.toLowerCase()))return toast('Адрес уже существует');if(editingHost){let h=hosts.find(x=>x.id===editingHost);Object.assign(h,{name,addressType:type,address:addr,segment:seg})}else hosts.push({id:Date.now(),name,addressType:type,address:addr,segment:seg,status:'UP',createdBy:currentUserId,attachments:[]});save();closeModal();renderHosts();toast('Хост сохранён')}
function deleteHost(id){let h=hosts.find(x=>x.id===id);if(!canHostDel(h))return toast('Удалить может только создатель или admin');confirmBox('Удаление хоста',`Удалить ${esc(h.name)}?`,()=>{hosts=hosts.filter(x=>x.id!==id);selectedHosts.delete(id);save();renderHosts();toast('Хост удалён')})}
function bulkDeleteHosts(){let ids=[...selectedHosts].filter(id=>canHostDel(hosts.find(h=>h.id===id)));if(!ids.length)return toast('Нет хостов, которые можно удалить');confirmBox('Удаление хостов',`Удалить ${ids.length} хост(ов)?`,()=>{hosts=hosts.filter(h=>!ids.includes(h.id));selectedHosts.clear();save();renderHosts();toast('Хосты удалены')})}
function applyPort(hid,i){let h=hosts.find(h=>h.id===hid),n=parseInt($(`port-${hid}-${i}`).value);if(!monitor())return;if(isNaN(n)||n<1||n>65535)return toast('Некорректный порт');h.attachments[i].portOverride=n;save();renderHostList();toast('Порт обновлён')}function resetPort(hid,i){let h=hosts.find(h=>h.id===hid);h.attachments[i].portOverride=null;save();renderHostList();toast('Порт сброшен')}function detach(hid,i){if(!monitor())return;hosts.find(h=>h.id===hid).attachments.splice(i,1);save();renderHosts();toast('Сервис отсоединён')}

function renderServices(){let arr=services.filter(s=>!s.isTemplate),manageable=arr.filter(canSvc).length;let body=`<div class="panel"><div class="info"><b>Сервисы</b> принадлежат группам. Управление доступно участникам группы-владельца.</div><div class="toolbar"><div><input class="chk" type="checkbox" onchange="toggleAllServices(this)"> Выбрано: <b>${selectedServices.size}</b> из <b>${arr.length}</b></div><button class="sm danger" ${!selectedServices.size?'disabled':''} onclick="bulkDeleteServices()">🗑️ Удалить</button></div><div class="stats"><div class="stat"><div class="muted">Сервисов</div><div class="n">${arr.length}</div></div><div class="stat"><div class="muted">Используется</div><div class="n">${arr.reduce((n,s)=>n+usage(s.id),0)}</div></div><div class="stat"><div class="muted">Доступно к управлению</div><div class="n">${manageable}</div></div></div><div class="content">${arr.length?arr.map(serviceCard).join(''):'<div class="empty">Нет сервисов</div>'}</div></div>`;page('services','🔌 Библиотека Сервисов','Сервисы для сбора метрик',`<button ${!groupsForUser().length?'disabled':''} onclick="openServiceModal()">➕ Создать сервис</button>`,body)}
function serviceCard(s){let can=canSvc(s),sel=selectedServices.has(s.id);return`<div class="card ${sel?'sel':''}"><div class="left"><input class="chk" type="checkbox" ${sel?'checked':''} ${can?'':'disabled'} onchange="toggleService('${s.id}')"><span class="icon">${s.icon}</span><div><div class="name">${esc(s.name)} <span class="badge blue">Сервис</span></div>${meta(s,true)}<div class="pills"><span class="badge">Создал: ${esc(uname(s.createdBy))}</span></div></div></div><div class="actions"><span class="badge">${usage(s.id)} хостов</span>${can?`<button class="sm outline" onclick="openServiceModal('${s.id}')">✏️ Ред.</button><button class="sm danger" onclick="deleteService('${s.id}')">🗑️</button>`:`<span class="badge">🔒 ${esc(gname(s.groupId))}</span>`}</div></div>`}
function usage(id){return hosts.reduce((n,h)=>n+((h.attachments||[]).some(a=>a.serviceId===id)?1:0),0)}
function toggleService(id){let s=services.find(x=>x.id===id);if(!canSvc(s))return toast('Нет прав');selectedServices.has(id)?selectedServices.delete(id):selectedServices.add(id);renderServices()}function toggleAllServices(ch){let ids=services.filter(s=>!s.isTemplate&&canSvc(s)).map(s=>s.id);if(ch.checked)ids.forEach(id=>selectedServices.add(id));else ids.forEach(id=>selectedServices.delete(id));renderServices()}
function deleteService(id){let s=services.find(x=>x.id===id);if(!canSvc(s))return toast('Нет прав');confirmBox('Удаление сервиса',`Удалить ${esc(s.name)}?`,()=>{deleteServices([id]);renderAll();toast('Сервис удалён')})}function bulkDeleteServices(){deleteServices([...selectedServices]);selectedServices.clear();renderAll();toast('Сервисы удалены')}function deleteServices(ids){ids=ids.filter(id=>canSvc(services.find(s=>s.id===id)));services=services.filter(s=>!ids.includes(s.id));hosts.forEach(h=>h.attachments=h.attachments.filter(a=>!ids.includes(a.serviceId)));collections.forEach(c=>c.serviceIds=c.serviceIds.filter(id=>!ids.includes(id)));save()}
function groupOptions(selected){return groupsForUser().map(g=>`<option value="${g.id}" ${g.id===selected?'selected':''}>${esc(g.name)}</option>`).join('')}
function openServiceModal(id){let s=id?services.find(x=>x.id===id):null;if(s&&!canSvc(s))return toast('Нет прав на сервис');if(!groupsForUser().length)return toast('Нет доступных групп');editingService=id||null;draftCert=null;s=s||{name:'',groupId:groupsForUser()[0].id,type:'ExporterScrape',icon:'🌐',defaultPort:80,metrics:'/metrics',protocol:'http',auth:{mode:'none'},clientCertificate:null};modal(id?'Редактирование сервиса':'Создание сервиса','Auth, TLS и группа-владелец',serviceForm(s),`<button class="outline" onclick="closeModal()">Отмена</button><button onclick="saveServiceModal()">Сохранить</button>`);afterServiceForm(s)}
function serviceForm(s){let a=normAuth(s.auth);return`<div class="field"><label>Название *</label><input id="msName" class="wide" value="${esc(s.name)}" oninput="fillTplName()"></div><div class="row"><div class="field"><label>Тип *</label><select id="msType" class="wide" onchange="syncSvcForm()"><option>ExporterScrape</option><option>SQL</option><option>BlackBox</option></select></div><div class="field"><label>Иконка</label><select id="msIcon" class="wide"><option>🌐</option><option>🐘</option><option>🔴</option><option>📊</option><option>🐰</option><option>🔒</option></select></div></div><div class="field"><label>Группа-владелец *</label><select id="msGroup" class="wide">${groupOptions(s.groupId)}</select><div class="hint">Управлять сервисом могут участники этой группы или MARS admin.</div></div><div id="exporterBox" class="settings-box"><b>🌐 ExporterScrape</b><div class="row" style="margin-top:10px"><div class="field"><label>Протокол сбора</label><select id="msProtocol" class="wide" onchange="syncSvcForm()"><option value="http">HTTP</option><option value="https">HTTPS</option></select></div><div class="field"><label>Путь метрик</label><input id="msMetrics" class="wide mono" value="${esc(s.metrics||'/metrics')}"></div></div><div id="tlsBox" class="settings-box"><b>🔐 TLS / сертификаты</b><div class="field"><label>Клиентский сертификат</label><input type="file" id="msCert" class="wide" onchange="readCert('svc')"><div id="certInfo" class="hint"></div></div><label><input type="checkbox" id="msSkip"> Пропустить проверку серверного сертификата</label></div></div><div class="field"><label>Порт по умолчанию *</label><input type="number" id="msPort" class="wide" min="1" max="65535" value="${s.defaultPort||80}"></div><div class="settings-box"><b>🔑 Авторизация</b><div class="field" style="margin-top:10px"><label>Тип авторизации</label><select id="msAuth" class="wide" onchange="syncAuth()"><option value="none">Без авторизации</option><option value="basic">Basic Auth</option><option value="bearer">Bearer Token</option></select></div><div id="basicBox" class="row"><div class="field"><label>Username</label><input id="msUser" class="wide" value="${esc(a.username||'')}"></div><div class="field"><label>Password</label><input id="msPass" class="wide" type="password" value="${esc(a.password||'')}"></div></div><div id="bearerBox" class="field"><label>Bearer token</label><input id="msToken" class="wide" type="password" value="${esc(a.token||'')}"></div></div>${idTplTools(s)}`}
function idTplTools(s){return editingService?`<div class="settings-box" style="background:#f5f3ff"><b>🧩 Создание шаблона сервиса</b><div class="field" style="margin-top:10px"><label>Название шаблона</label><input id="tplNameFromSvc" class="wide" value='Шаблон "${esc(s.name||'Название сервиса')}"'><div class="hint">Аутентификация не переносится в шаблон.</div></div><button class="purple" onclick="createTemplateFromService()">🧩 Создать шаблон сервиса</button></div>`:''}
function afterServiceForm(s){msType.value=s.type;msIcon.value=s.icon;msProtocol.value=s.protocol||'http';msSkip.checked=!!s.skipServerCertificateValidation;msAuth.value=normAuth(s.auth).mode;renderCert('svc',s.clientCertificate);syncSvcForm();syncAuth()}
function syncSvcForm(){exporterBox.style.display=msType.value==='ExporterScrape'?'block':'none';tlsBox.style.display=msType.value==='ExporterScrape'&&msProtocol.value==='https'?'block':'none'}function syncAuth(){basicBox.style.display=msAuth.value==='basic'?'grid':'none';bearerBox.style.display=msAuth.value==='bearer'?'block':'none'}
function fillTplName(){let i=$('tplNameFromSvc');if(i&&!i.dataset.touched)i.value=`Шаблон "${msName.value||'Название сервиса'}"`}
document.addEventListener('input',e=>{if(e.target?.id==='tplNameFromSvc')e.target.dataset.touched='1'})
function collectAuth(){return msAuth.value==='basic'?{mode:'basic',username:msUser.value,password:msPass.value}:msAuth.value==='bearer'?{mode:'bearer',token:msToken.value}:{mode:'none'}}
function collectSvc(){let old=editingService?services.find(s=>s.id===editingService):null,cert=old?.clientCertificate||null;if(draftCert)cert=draftCert.clear?null:draftCert;return{name:msName.value.trim(),groupId:msGroup.value,type:msType.value,agent:msType.value,icon:msIcon.value,defaultPort:+msPort.value,metrics:msMetrics.value.trim()||'/metrics',protocol:msType.value==='ExporterScrape'?msProtocol.value:null,skipServerCertificateValidation:msType.value==='ExporterScrape'&&msProtocol.value==='https'?msSkip.checked:false,clientCertificate:msType.value==='ExporterScrape'&&msProtocol.value==='https'?cert:null,auth:collectAuth(),isTemplate:false}}
function saveServiceModal(){let data=collectSvc();if(!data.name||!data.defaultPort||data.defaultPort<1||data.defaultPort>65535)return toast('Заполните обязательные поля');if(!inGroup(data.groupId))return toast('Нет прав на выбранную группу');if(editingService){let s=services.find(x=>x.id===editingService);if(!canSvc(s))return toast('Нет прав');Object.assign(s,data,{id:s.id,createdBy:s.createdBy,usedBy:s.usedBy||0})}else services.push({...data,id:'svc-'+Date.now(),createdBy:currentUserId,usedBy:0});save();closeModal();renderAll();toast('Сервис сохранён')}
function createTemplateFromService(){let s=services.find(x=>x.id===editingService);if(!canSvc(s))return toast('Нет прав');services.push({id:'tpl-'+Date.now(),name:tplNameFromSvc.value.trim()||`Шаблон "${s.name}"`,groupId:s.groupId,createdBy:currentUserId,type:s.type,agent:s.type,icon:s.icon,defaultPort:s.defaultPort,metrics:s.metrics,protocol:s.protocol,skipServerCertificateValidation:!!s.skipServerCertificateValidation,clientCertificate:s.clientCertificate?{...s.clientCertificate}:null,auth:null,isTemplate:true,usedBy:0,sourceServiceId:s.id});save();renderAll();toast('Шаблон создан')}

function renderTemplates(){let arr=services.filter(s=>s.isTemplate);let body=`<div class="panel"><div class="info"><b>Шаблоны сервисов</b> не содержат аутентификацию и не отображают auth-настройки.</div><div class="toolbar"><div><input class="chk" type="checkbox" onchange="toggleAllTemplates(this)"> Выбрано: <b>${selectedTemplates.size}</b> из <b>${arr.length}</b></div><button class="sm danger" ${!selectedTemplates.size?'disabled':''} onclick="bulkDeleteTemplates()">🗑️ Удалить</button></div><div class="stats"><div class="stat"><div class="muted">Всего</div><div class="n">${arr.length}</div></div><div class="stat"><div class="muted">Создано сервисов</div><div class="n">${arr.reduce((n,t)=>n+(t.usedBy||0),0)}</div></div><div class="stat"><div class="muted">HTTPS</div><div class="n">${arr.filter(t=>t.type==='ExporterScrape'&&t.protocol==='https').length}</div></div></div><div class="content">${arr.length?arr.map(tplCard).join(''):'<div class="empty">Нет шаблонов</div>'}</div></div>`;page('templates','🧩 Шаблоны сервисов','Клик по шаблону создаёт сервис на его основе','',body)}
function tplCard(t){let can=canTpl(t),sel=selectedTemplates.has(t.id);return`<div class="card ${sel?'sel':''}" onclick="openSvcFromTpl('${t.id}')"><div class="left"><input class="chk" type="checkbox" ${sel?'checked':''} ${can?'':'disabled'} onclick="event.stopPropagation()" onchange="toggleTemplate('${t.id}')"><span class="icon">${t.icon}</span><div><div class="name">${esc(t.name)} <span class="badge violet">Шаблон</span></div>${meta(t,false)}<div class="pills"><span class="badge green">без аутентификации</span><span class="badge">Создал: ${esc(uname(t.createdBy))}</span></div></div></div><div class="actions" onclick="event.stopPropagation()"><span class="badge">создано: ${t.usedBy||0}</span><button class="sm" onclick="openSvcFromTpl('${t.id}')">➕ Сервис</button>${can?`<button class="sm outline" onclick="openTplEdit('${t.id}')">✏️</button><button class="sm danger" onclick="deleteTpl('${t.id}')">🗑️</button>`:`<span class="badge">🔒 ${esc(gname(t.groupId))}</span>`}</div></div>`}
function toggleTemplate(id){let t=services.find(s=>s.id===id);if(!canTpl(t))return toast('Нет прав');selectedTemplates.has(id)?selectedTemplates.delete(id):selectedTemplates.add(id);renderTemplates()}function toggleAllTemplates(ch){let ids=services.filter(s=>s.isTemplate&&canTpl(s)).map(s=>s.id);if(ch.checked)ids.forEach(id=>selectedTemplates.add(id));else ids.forEach(id=>selectedTemplates.delete(id));renderTemplates()}
function deleteTpl(id){let t=services.find(s=>s.id===id);if(!canTpl(t))return toast('Нет прав');confirmBox('Удаление шаблона',`Удалить ${esc(t.name)}?`,()=>{services=services.filter(s=>s.id!==id);selectedTemplates.delete(id);save();renderAll();toast('Шаблон удалён')})}function bulkDeleteTemplates(){let ids=[...selectedTemplates].filter(id=>canTpl(services.find(s=>s.id===id)));services=services.filter(s=>!ids.includes(s.id));selectedTemplates.clear();save();renderAll();toast('Шаблоны удалены')}
function openTplEdit(id){let t=services.find(s=>s.id===id);if(!canTpl(t))return toast('Нет прав');editingTpl=id;draftTplCert=null;modal('Редактирование шаблона','Без аутентификации',tplForm(t),`<button class="outline" onclick="closeModal()">Отмена</button><button onclick="saveTplEdit()">Сохранить</button>`);mtType.value=t.type;mtIcon.value=t.icon;mtGroup.value=t.groupId;mtProtocol.value=t.protocol||'http';mtSkip.checked=!!t.skipServerCertificateValidation;renderCert('tpl',t.clientCertificate);syncTplForm()}
function tplForm(t){return`<div class="field"><label>Название *</label><input id="mtName" class="wide" value="${esc(t.name)}"></div><div class="row"><div class="field"><label>Тип</label><select id="mtType" class="wide" onchange="syncTplForm()"><option>ExporterScrape</option><option>SQL</option><option>BlackBox</option></select></div><div class="field"><label>Иконка</label><select id="mtIcon" class="wide"><option>🌐</option><option>🐘</option><option>🔴</option><option>📊</option><option>🐰</option><option>🔒</option></select></div></div><div class="field"><label>Группа-владелец</label><select id="mtGroup" class="wide">${groupOptions(t.groupId)}</select></div><div id="mtExporter" class="settings-box"><b>🌐 ExporterScrape</b><div class="row" style="margin-top:10px"><div class="field"><label>Протокол</label><select id="mtProtocol" class="wide" onchange="syncTplForm()"><option value="http">HTTP</option><option value="https">HTTPS</option></select></div><div class="field"><label>Путь</label><input id="mtMetrics" class="wide mono" value="${esc(t.metrics||'/metrics')}"></div></div><div id="mtTls" class="settings-box"><b>🔐 TLS</b><div class="field"><label>Клиентский сертификат</label><input type="file" id="mtCert" class="wide" onchange="readCert('tpl')"><div id="tplCertInfo" class="hint"></div></div><label><input type="checkbox" id="mtSkip"> Пропустить проверку серверного сертификата</label></div></div><div class="field"><label>Порт *</label><input id="mtPort" type="number" min="1" max="65535" class="wide" value="${t.defaultPort}"></div><div class="rule">В UI шаблонов нет настроек аутентификации.</div>`}
function syncTplForm(){mtExporter.style.display=mtType.value==='ExporterScrape'?'block':'none';mtTls.style.display=mtType.value==='ExporterScrape'&&mtProtocol.value==='https'?'block':'none'}
function saveTplEdit(){let t=services.find(s=>s.id===editingTpl);if(!canTpl(t))return toast('Нет прав');let cert=t.clientCertificate;if(draftTplCert)cert=draftTplCert.clear?null:draftTplCert;Object.assign(t,{name:mtName.value.trim(),groupId:mtGroup.value,type:mtType.value,agent:mtType.value,icon:mtIcon.value,defaultPort:+mtPort.value,metrics:mtMetrics.value.trim()||'/metrics',protocol:mtType.value==='ExporterScrape'?mtProtocol.value:null,skipServerCertificateValidation:mtType.value==='ExporterScrape'&&mtProtocol.value==='https'?mtSkip.checked:false,clientCertificate:mtType.value==='ExporterScrape'&&mtProtocol.value==='https'?cert:null,auth:null});save();closeModal();renderAll();toast('Шаблон сохранён')}
function openSvcFromTpl(id){let t=services.find(s=>s.id===id);if(!groupsForUser().length)return toast('Нет доступных групп');modal('Создать сервис из шаблона',t.name,`<div class="field"><label>Название нового сервиса *</label><input id="newSvcName" class="wide" value="${esc(t.name.replace(/^Шаблон\\s*[\"«](.*)[\"»]$/i,'$1')||'Новый сервис')} service"></div><div class="field"><label>Группа-владелец *</label><select id="newSvcGroup" class="wide">${groupOptions(t.groupId)}</select><div class="hint">Аутентификация будет: Без авторизации.</div></div><div class="settings-box"><b>${t.icon} ${esc(t.name)}</b>${meta(t,false)}</div>`,`<button class="outline" onclick="closeModal()">Отмена</button><button onclick="createSvcFromTpl('${id}')">Создать сервис</button>`)}
function createSvcFromTpl(id){let t=services.find(s=>s.id===id),name=newSvcName.value.trim(),gid=newSvcGroup.value;if(!name)return toast('Введите название');if(!inGroup(gid))return toast('Нет прав на группу');services.push({id:'svc-'+Date.now(),name,groupId:gid,createdBy:currentUserId,type:t.type,agent:t.type,icon:t.icon,defaultPort:t.defaultPort,metrics:t.metrics,protocol:t.protocol,skipServerCertificateValidation:!!t.skipServerCertificateValidation,clientCertificate:t.clientCertificate?{...t.clientCertificate}:null,auth:{mode:'none'},isTemplate:false,usedBy:0,sourceTemplateId:t.id});t.usedBy=(t.usedBy||0)+1;save();closeModal();switchSection('services');renderAll();toast('Сервис создан')}

async function readCert(kind){let file=(kind==='svc'?msCert:mtCert).files[0];if(!file)return;let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});let obj={name:file.name,size:file.size,type:file.type||'application/octet-stream',content:data};if(kind==='svc')draftCert=obj;else draftTplCert=obj;renderCert(kind,obj)}
function renderCert(kind,cert){let id=kind==='svc'?'certInfo':'tplCertInfo',el=$(id);if(!el)return;el.innerHTML=cert?.name?`📄 ${esc(cert.name)} (${Math.ceil((cert.size||0)/1024)} KB) <button class="sm outline" onclick="clearCert('${kind}')">Удалить</button>`:'Сертификат не выбран'}function clearCert(kind){if(kind==='svc'){draftCert={clear:true};renderCert('svc',null);msCert.value=''}else{draftTplCert={clear:true};renderCert('tpl',null);mtCert.value=''}}

function renderCollections(){let body=`<div class="panel"><div class="info"><b>Коллекция</b> — набор сервисов для пакетного присоединения.</div><div class="stats"><div class="stat"><div class="muted">Всего</div><div class="n">${collections.length}</div></div><div class="stat"><div class="muted">Используется</div><div class="n">${collections.reduce((a,c)=>a+(c.usedBy||0),0)}</div></div><div class="stat"><div class="muted">Среднее сервисов</div><div class="n">${collections.length?(collections.reduce((a,c)=>a+c.serviceIds.length,0)/collections.length).toFixed(1):0}</div></div></div><div class="content">${collections.map(c=>{let svcs=c.serviceIds.map(id=>services.find(s=>s.id===id)).filter(Boolean);return`<div class="card"><div class="left"><span class="icon">📦</span><div><div class="name">${esc(c.name)} <span class="badge blue">${svcs.length} сервисов</span></div><div class="muted">${esc(c.description||'')}</div><div class="muted">Сервисы: ${svcs.map(s=>s.icon+' '+esc(s.name)).join(', ')}</div></div></div><button class="sm danger" onclick="deleteCollection('${c.id}')">🗑️</button></div>`}).join('')||'<div class="empty">Нет коллекций</div>'}</div></div>`;page('collections','📦 Библиотека Коллекций','Группы сервисов для пакетного присоединения','<button onclick="openCollection()">➕ Создать коллекцию</button>',body)}
function openCollection(){colDraft=[];modal('Создание коллекции','Выберите сервисы',`<div class="field"><label>Название *</label><input id="colName" class="wide"></div><div class="field"><label>Описание</label><textarea id="colDesc" class="wide"></textarea></div><div class="field"><label>Сервисы</label><div id="colPicked" class="settings-box"></div><button class="outline" onclick="pickServiceForCol()">➕ Добавить сервис</button></div>`,`<button class="outline" onclick="closeModal()">Отмена</button><button onclick="saveCollection()">Сохранить</button>`);renderColPicked()}
function renderColPicked(){let el=$('colPicked');if(!el)return;el.innerHTML=colDraft.length?colDraft.map(id=>{let s=services.find(x=>x.id===id);return`<div class="card"><span>${s.icon} ${esc(s.name)}</span><button class="sm danger" onclick="colDraft=colDraft.filter(x=>x!=='${id}');renderColPicked()">✕</button></div>`}).join(''):'<div class="muted">Коллекция пуста</div>'}
function pickServiceForCol(){modal('Выберите сервис','Добавление в коллекцию',services.filter(s=>!s.isTemplate).map(s=>`<div class="card" onclick="colDraft.includes('${s.id}')?null:(colDraft.push('${s.id}'),openCollectionResume())"><div class="left"><span class="icon">${s.icon}</span><div><b>${esc(s.name)}</b>${meta(s,true)}</div></div><span>${colDraft.includes(s.id)?'✓ Добавлен':'➕ Добавить'}</span></div>`).join(''),`<button class="outline" onclick="openCollectionResume()">Назад</button>`)}
function openCollectionResume(){let oldName=window.colName?.value||'',oldDesc=window.colDesc?.value||'';openCollection();colName.value=oldName;colDesc.value=oldDesc}
function saveCollection(){if(!colName.value.trim()||!colDraft.length)return toast('Заполните название и добавьте сервисы');collections.push({id:'col-'+Date.now(),name:colName.value.trim(),description:colDesc.value.trim(),serviceIds:[...colDraft],usedBy:0});save();closeModal();renderAll();toast('Коллекция создана')}
function deleteCollection(id){confirmBox('Удаление коллекции','Удалить коллекцию?',()=>{collections=collections.filter(c=>c.id!==id);save();renderAll();toast('Коллекция удалена')})}

function openAttach(type){if(!monitor())return toast('Нет разрешения на мониторинг');if(selectedHosts.size!==1)return toast('Выберите один хост');attachCtx={type,hostId:[...selectedHosts][0]};attachStep=1;attachItem=null;attachAuth=[];renderAttach()}
function renderAttach(){let h=hosts.find(x=>x.id===attachCtx.hostId),title=attachCtx.type==='service'?'Присоединение сервиса':'Присоединение коллекции';let body='';if(attachStep===1){let items=attachCtx.type==='service'?services.filter(s=>!s.isTemplate):collections;body=`<div class="rule">Хост: <b>${esc(h.name)}</b> · ${esc(h.address)}</div>`+items.map(i=>attachCtx.type==='service'?`<div class="card" onclick="attachItem='${i.id}';attachStep=2;renderAttach()"><div class="left"><span class="icon">${i.icon}</span><div><b>${esc(i.name)}</b>${meta(i,true)}</div></div></div>`:`<div class="card" onclick="attachItem='${i.id}';attachStep=2;renderAttach()"><div class="left"><span class="icon">📦</span><div><b>${esc(i.name)}</b><div class="muted">${i.serviceIds.length} сервисов</div></div></div></div>`).join('')}else if(attachStep===2)body='<div class="rule">Настройки порта можно поменять после присоединения в карточке хоста.</div>';else if(attachStep===3){let ids=attachCtx.type==='service'?[attachItem]:collections.find(c=>c.id===attachItem).serviceIds;let ss=ids.map(id=>services.find(s=>s.id===id)).filter(s=>s&&hasAuth(s.auth));body=ss.length?ss.map(s=>attachAuthForm(s)).join(''):'<div class="rule">Сервисы не требуют авторизации.</div>'}else{let ids=attachCtx.type==='service'?[attachItem]:collections.find(c=>c.id===attachItem).serviceIds;body=ids.map(id=>{let s=services.find(x=>x.id===id);return`<div class="card"><div><b>${s.icon} ${esc(s.name)}</b><div class="mono muted">Target: ${esc(endpoint(h,{portOverride:null},s))}</div><div class="muted">Auth: ${esc(authLabel(s.auth))}</div></div></div>`}).join('')}modal(title,`Шаг ${attachStep} из 4`,body,`<button class="outline" onclick="${attachStep===1?'closeModal()':'attachStep--;renderAttach()'}">${attachStep===1?'Отмена':'← Назад'}</button><button onclick="${attachStep===4?'confirmAttach()':'attachStep++;renderAttach()'}">${attachStep===4?'Применить':'Далее →'}</button>`)}
function attachAuthForm(s){let a=normAuth(s.auth);return a.mode==='basic'?`<div class="settings-box"><b>${s.icon} ${esc(s.name)} — Basic Auth</b><div class="row" style="margin-top:10px"><input id="au-${s.id}" placeholder="${esc(a.username||'admin')}"><input id="ap-${s.id}" type="password" placeholder="••••••"></div></div>`:`<div class="settings-box"><b>${s.icon} ${esc(s.name)} — Bearer Token</b><input id="at-${s.id}" class="wide" type="password" placeholder="Bearer token" style="margin-top:10px"></div>`}
function confirmAttach(){let h=hosts.find(x=>x.id===attachCtx.hostId),ids=attachCtx.type==='service'?[attachItem]:collections.find(c=>c.id===attachItem).serviceIds;ids.forEach(id=>{let s=services.find(x=>x.id===id),base=normAuth(s.auth),auth=null;if(base.mode==='basic')auth={mode:'basic',username:$('au-'+id)?.value||base.username,password:$('ap-'+id)?.value||base.password};if(base.mode==='bearer')auth={mode:'bearer',token:$('at-'+id)?.value||base.token};let ex=h.attachments.find(a=>a.serviceId===id);if(!ex)h.attachments.push({serviceId:id,auth,portOverride:null,attachedBy:currentUserId});else ex.auth=auth||ex.auth});if(attachCtx.type==='collection')collections.find(c=>c.id===attachItem).usedBy++;else services.find(s=>s.id===attachItem).usedBy++;save();closeModal();renderAll();toast('Присоединено')}

function renderAccess(){let body=`<div class="panel"><div class="info"><b>Правила:</b> сервис создаёт/редактирует/удаляет участник группы-владельца. Хосты видны всем. Удалить хост может создатель или MARS admin. Присоединять сервисы может пользователь с разрешением на постановку на мониторинг. Присоединённые сервисы видны всем.</div><div class="stats"><div class="stat"><div class="muted">Текущий пользователь</div><div class="n" style="font-size:18px">${esc(u().name)}</div></div><div class="stat"><div class="muted">Мониторинг</div><div class="n" style="font-size:18px">${monitor()?'Да':'Нет'}</div></div><div class="stat"><div class="muted">Admin</div><div class="n" style="font-size:18px">${admin()?'Да':'Нет'}</div></div></div><div class="content"><h3>Пользователи</h3>${users.map(x=>`<div class="card"><div class="left"><span class="icon">👤</span><div><b>${esc(x.name)}</b> ${x.id===currentUserId?'<span class="badge blue">текущий</span>':''} ${x.isAdmin?'<span class="badge red">MARS admin</span>':''}<div class="muted">Группы: ${x.groupIds.map(gname).join(', ')||'—'}</div><div class="pills"><span class="badge ${x.canMonitor?'green':''}">Постановка на мониторинг: ${x.canMonitor?'разрешена':'нет'}</span></div></div></div><button class="sm outline" onclick="switchUser('${x.id}')">Переключиться</button></div>`).join('')}<h3>Группы</h3>${groups.map(g=>`<div class="card"><div class="left"><span class="icon">👥</span><div><b>${esc(g.name)}</b><div class="muted">${esc(g.description)}</div><div class="muted">Участники: ${users.filter(u=>u.groupIds.includes(g.id)).map(u=>esc(u.name)).join(', ')||'—'}</div></div></div></div>`).join('')}</div></div>`;page('access','👥 Пользователи и группы','Демо-модель доступа MARS','',body)}

function modal(t,sub,body,foot){modalTitle.textContent=t;modalSub.textContent=sub||'';modalBody.innerHTML=body;modalFoot.innerHTML=foot||'<button onclick="closeModal()">Закрыть</button>';modalWrap.classList.add('show')}function closeModal(){modalWrap.classList.remove('show')}function confirmBox(t,msg,yes){modal(t,'Подтверждение',`<div class="rule" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">${msg}</div>`,`<button class="outline" onclick="closeModal()">Отмена</button><button class="danger" onclick="(${yes})();closeModal()">Удалить</button>`)}function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function resetDemo(){confirmBox('Сброс демо','Вернуть исходные данные прототипа?',()=>{let d=demo();hosts=d.hosts;services=d.services;collections=d.collections;users=d.users;groups=d.groups;currentUserId=d.currentUserId;selectedHosts.clear();selectedServices.clear();selectedTemplates.clear();save();renderAll();toast('Демо сброшено')})}
if(!load()){let d=demo();hosts=d.hosts;services=d.services;collections=d.collections;users=d.users;groups=d.groups;currentUserId=d.currentUserId;save()}renderAll();
</script>
</body></html>
