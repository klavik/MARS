const $=id=>document.getElementById(id);
function uid(p){return p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function hostKey(id){return String(id)}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function q(v){return "'"+String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"}
function num(v,f=0){const n=parseInt(v,10);return Number.isFinite(n)?n:f}
function nowText(){return new Date().toLocaleString('ru-RU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(t,s,b,f,small=false){$('modal-title').textContent=t;$('modal-sub').textContent=s||'';$('modal-body').innerHTML=b;$('modal-foot').innerHTML=f||'<button onclick="closeModal()">Закрыть</button>';$('modal').classList.toggle('small',!!small);$('modal-wrap').classList.add('show')}

function confirmModal(t,msg,fnName,args=''){openModal(t,'Подтвердите действие',`<div class="box red-box">${msg}</div>`,`<button class="outline" onclick="closeModal()">Отмена</button><button class="danger" onclick="${fnName}(${args});closeModal()">Удалить</button>`,true)}

function loadState(){
  let raw=localStorage.getItem(STORE_KEY);
  if(!raw){for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break}}
  if(raw){try{state=normalizeState(JSON.parse(raw))}catch(e){state=demoState()}}else state=demoState();
  state=normalizeState(state);saveState()
}
function normalizeState(s){
  const d=demoState(),ns={...d,...s};
  ns.users=Array.isArray(ns.users)&&ns.users.length?ns.users:d.users;
  ns.groups=Array.isArray(ns.groups)&&ns.groups.length?ns.groups:d.groups;
  ns.proxyGroups=Array.isArray(ns.proxyGroups)&&ns.proxyGroups.length?ns.proxyGroups:d.proxyGroups;
  ns.catalogSources=Array.isArray(ns.catalogSources)&&ns.catalogSources.length?ns.catalogSources:d.catalogSources;
  ns.catalogHosts=(Array.isArray(ns.catalogHosts)?ns.catalogHosts:d.catalogHosts).map(h=>({sourceId:h.sourceId||'cmdb-main',externalId:h.externalId||uid('ext'),name:h.name||'catalog-host',addressType:h.addressType||'ip',address:h.address||'127.0.0.1',proxyGroup:h.proxyGroup||h.segment||'prod-dmz',environment:h.environment||'prod',os:h.os||'Linux',updatedAt:h.updatedAt||nowText()}));
  ns.currentUserId=ns.users.some(u=>u.id===ns.currentUserId)?ns.currentUserId:ns.users[0].id;
  let rawServices=Array.isArray(ns.services)?ns.services:[];
  const migratedTemplates=rawServices.filter(s=>s.isTemplate).map(s=>normalizeTemplate(s,ns.currentUserId));
  ns.services=rawServices.filter(s=>!s.isTemplate).map(normalizeService);
  ns.serviceTemplates=[...(Array.isArray(ns.serviceTemplates)?ns.serviceTemplates:[]),...migratedTemplates].map(t=>normalizeTemplate(t,ns.currentUserId));
  ns.serviceTemplates=uniqueTemplates(ns.serviceTemplates);
  ns.hosts=(Array.isArray(ns.hosts)?ns.hosts:d.hosts).map(h=>{
    const host={...h};
    host.id=hostKey(host.id||uid('host'));host.name=host.name||'host';host.addressType=host.addressType||'ip';host.address=host.address||'127.0.0.1';host.proxyGroup=host.proxyGroup||host.segment||'prod-dmz';delete host.segment;
    host.status=host.status||'UP';host.sourceType=host.sourceType||'manual';host.createdBy=host.createdBy||ns.currentUserId;host.createdAt=host.createdAt||nowText();host.prefilledFromCatalog=host.prefilledFromCatalog||null;
    host.catalogBinding=host.sourceType==='catalog'?(host.catalogBinding||{sourceId:'cmdb-main',externalId:null,lastSyncAt:null,syncStatus:'unknown'}):null;
    host.attachments=(Array.isArray(host.attachments)?host.attachments:[]).map(a=>({serviceId:a.serviceId,createdBy:a.createdBy||a.attachedBy||host.createdBy||ns.currentUserId,ownerGroupId:a.ownerGroupId||(ns.services.find(s=>s.id===a.serviceId)||{}).ownerGroupId||'g-infra',portOverride:a.portOverride===undefined?null:a.portOverride})).filter(a=>ns.services.some(s=>s.id===a.serviceId));
    return host;
  });
  ns.collections=(Array.isArray(ns.collections)?ns.collections:d.collections).map(c=>({id:c.id||uid('col'),name:c.name||'Коллекция',description:c.description||'',serviceIds:(Array.isArray(c.serviceIds)?c.serviceIds:[]).filter(id=>ns.services.some(s=>s.id===id)),usedBy:num(c.usedBy,0)}));
  return ns;
}
function normalizeService(s){const oldAuth=s.auth||null;let authMode=s.authMode||'none';if(oldAuth&&!s.authMode)authMode=oldAuth.mode||'basic';const protocol=s.protocol||'http';return{id:s.id||uid('svc'),name:s.name||'Сервис',type:s.type||s.agent||'ExporterScrape',icon:s.icon||'🔌',defaultPort:num(s.defaultPort,80),metrics:s.metrics||'/metrics',ownerGroupId:s.ownerGroupId||s.groupId||'g-infra',authMode,basicUsername:s.basicUsername||(oldAuth?oldAuth.username||'':''),basicPassword:s.basicPassword||(oldAuth?oldAuth.password||'':''),bearerToken:s.bearerToken||(oldAuth?oldAuth.token||'':''),protocol,clientCertificate:protocol==='https'?(s.clientCertificate||''):'',skipServerCertCheck:protocol==='https'?!!(s.skipServerCertCheck||s.skipServerCertificateValidation):false,usedBy:num(s.usedBy,0),createdBy:s.createdBy||state.currentUserId||'u-admin'}}
function normalizeTemplate(t,u='u-admin'){return{id:t.id||uid('tpl'),name:t.name||'Шаблон сервиса',type:t.type||t.agent||'ExporterScrape',icon:t.icon||'🔌',defaultPort:num(t.defaultPort,80),metrics:t.metrics||'/metrics',protocol:t.protocol||'http',skipServerCertCheck:!!(t.skipServerCertCheck||t.skipServerCertificateValidation),ownerGroupId:t.ownerGroupId||t.groupId||'g-infra',createdBy:t.createdBy||u,usedBy:num(t.usedBy,0)}}
function uniqueTemplates(items){const seen=new Set();return items.filter(t=>{const k=t.name.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function resetDemo(){localStorage.removeItem(STORE_KEY);state=normalizeState(demoState());selectedHostIds.clear();selectedServiceIds.clear();selectedTemplateIds.clear();expandedHostId=null;saveState();renderAll();toast('Демо-данные сброшены')}

function currentUser(){return state.users.find(u=>u.id===state.currentUserId)||state.users[0]}
function userById(id){return state.users.find(u=>u.id===id)}
function groupById(id){return state.groups.find(g=>g.id===id)}
function isAdmin(){return !!currentUser().isAdmin}
function userGroupIds(){return new Set(currentUser().groups||[])}
function canMonitor(){return isAdmin()||!!currentUser().canMonitor}
function canManageGroup(gid){return isAdmin()||userGroupIds().has(gid)}
function canManageService(svc){return svc&&(isAdmin()||userGroupIds().has(svc.ownerGroupId))}
function canManageAttachment(a){return isAdmin()||a.createdBy===currentUser().id||userGroupIds().has(a.ownerGroupId)}
function hasAttachments(host){return (host.attachments||[]).length>0}
function canEditHost(host){if(!host)return false;if(host.sourceType==='catalog')return false;if(hasAttachments(host)&&!isAdmin())return false;return isAdmin()||host.createdBy===currentUser().id}
function canDeleteHost(host){if(!host)return false;if(hasAttachments(host))return isAdmin();return isAdmin()||host.createdBy===currentUser().id}
function hostLockReason(host){if(host.sourceType==='catalog')return'Чувствительные поля управляются справочником и обновляются синхронизацией.';if(hasAttachments(host)&&!isAdmin())return'Хост уже используется в мониторинге. Имя, IP/FQDN и группа прокси заблокированы, чтобы не сломать сбор метрик другим пользователям.';if(!(isAdmin()||host.createdBy===currentUser().id))return'Редактировать ручной хост может только создатель или администратор MARS.';return''}

function switchUser(id){state.currentUserId=id;selectedHostIds.clear();selectedServiceIds.clear();selectedTemplateIds.clear();saveState();renderAll()}
function switchSection(sec){activeSection=sec;document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));$('section-'+sec).classList.add('active');$('nav-'+sec).classList.add('active');renderAll()}
function renderAll(){renderUserSwitcher();renderHosts();renderServices();renderTemplates();renderCollections();renderAccess()}
function renderUserSwitcher(){const sel=$('current-user');sel.innerHTML=state.users.map(u=>`<option value="${u.id}" ${u.id===state.currentUserId?'selected':''}>${esc(u.name)}${u.isAdmin?' · admin':''}</option>`).join('');$('avatar').textContent=currentUser().initials||currentUser().name[0]}

function page(id,title,sub,actions,body){$('section-'+id).innerHTML=`<div class="page-head"><div><h1 class="title">${title}</h1><div class="sub">${sub||''}</div></div><div class="actions">${actions||''}</div></div>${body}`}
function selectOption(v,l,s){return`<option value="${esc(v)}" ${v===s?'selected':''}>${esc(l)}</option>`}
function proxyOptions(selected,all=false){return(all?selectOption('all','Все группы прокси',selected):'')+state.proxyGroups.map(g=>selectOption(g.id,g.name,selected)).join('')}
function typeOptions(s){return['ExporterScrape','SQL','BlackBox'].map(t=>selectOption(t,t,s)).join('')}
function iconOptions(s){return['🌐','🐘','🔴','📊','🐰','🔌','🔒'].map(i=>selectOption(i,i,s)).join('')}
function groupOptions(s){const gs=isAdmin()?state.groups:state.groups.filter(g=>userGroupIds().has(g.id));return gs.map(g=>selectOption(g.id,g.name,s||gs[0]?.id)).join('')}
function isValidIp(v){const p=v.split('.');return p.length===4&&p.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255)}
function isValidFqdn(v){return/^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}$/.test(v)}
function addressBadge(h){return h.addressType==='fqdn'?'<span class="addr fqdn">FQDN</span>':'<span class="addr ip">IP</span>'}
function sourceBadge(h){if(h.sourceType==='catalog')return'<span class="badge b-purple">📚 Справочник</span>';if(h.prefilledFromCatalog)return'<span class="badge b-amber">📋 Ручной · заполнен из справочника</span>';return'<span class="badge b-blue">✍️ Ручной</span>'}
function catalogByExternal(externalId){return state.catalogHosts.find(h=>h.externalId===externalId)}
function catalogHost(sourceId,externalId){return state.catalogHosts.find(h=>h.sourceId===sourceId&&h.externalId===externalId)}

function renderHosts(){
  const filtered=filteredHosts();
  const allSelected=filtered.length&&filtered.every(h=>selectedHostIds.has(hostKey(h.id)));
  const body=`<div class="panel">
    <div class="info"><b>Хост как monitoring target:</b> имя хоста, IP/FQDN и группа прокси считаются чувствительными полями. Для справочных хостов ими владеет CMDB; для ручных — MARS, но изменение блокируется, если хост уже используется в мониторинге.</div>
    <div class="toolbar"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><input class="checkbox" type="checkbox" ${allSelected?'checked':''} onchange="toggleAllHosts(this.checked)"><span class="muted">Выбрано: <b>${selectedHostIds.size}</b> из <b>${filtered.length}</b></span></div><div class="actions"><button class="sm outline" ${selectedHostIds.size===1&&canMonitor()?'':'disabled'} onclick="openAttachModal('service')">⚡ Присоединить сервис</button><button class="sm outline" ${selectedHostIds.size===1&&canMonitor()?'':'disabled'} onclick="openAttachModal('collection')">📦 Присоединить коллекцию</button></div></div>
    <div class="filters">🔍 <input id="host-search" class="input" value="${esc($('host-search')?.value||'')}" placeholder="Поиск..." oninput="renderHosts()"><select id="host-proxy-filter" onchange="renderHosts()">${proxyOptions($('host-proxy-filter')?.value||'all',true)}</select><select id="host-source-filter" onchange="renderHosts()">${selectOption('all','Все источники',$('host-source-filter')?.value||'all')}${selectOption('manual','Ручные',$('host-source-filter')?.value||'all')}${selectOption('catalog','Справочные',$('host-source-filter')?.value||'all')}</select></div>
    <div class="stats"><div class="stat"><div class="stat-label">Всего хостов</div><div class="stat-value">${state.hosts.length}</div></div><div class="stat"><div class="stat-label">Справочные</div><div class="stat-value">${state.hosts.filter(h=>h.sourceType==='catalog').length}</div></div><div class="stat"><div class="stat-label">Ручные</div><div class="stat-value">${state.hosts.filter(h=>h.sourceType!=='catalog').length}</div></div><div class="stat"><div class="stat-label">Attachment'ов</div><div class="stat-value">${state.hosts.reduce((s,h)=>s+h.attachments.length,0)}</div></div></div>
    <div class="content">${filtered.length?filtered.map(hostCard).join(''):'<div class="empty">Хосты не найдены</div>'}</div><div class="footer"><b>Manual</b> — MARS владеет полями. <b>Catalog</b> — CMDB владеет полями и обновляет их при синхронизации. <b>Prefill</b> — справочник используется только как подсказка для разового заполнения.</div></div>`;
  page('hosts','Управление хостами','Хосты глобальны для MARS. Источник данных определяет, кто владеет чувствительными полями.',`<button class="outline" onclick="syncCatalogHosts()">🔄 Синхронизировать справочник</button><button class="outline" onclick="resetDemo()">↺ Сбросить демо</button><button ${canMonitor()?'':'disabled'} onclick="openHostCreateModal()">➕ Создать хост</button>`,body)
}
function filteredHosts(){const s=($('host-search')?.value||'').toLowerCase(),p=$('host-proxy-filter')?.value||'all',src=$('host-source-filter')?.value||'all';return state.hosts.filter(h=>(h.name.toLowerCase().includes(s)||h.address.toLowerCase().includes(s)||h.proxyGroup.toLowerCase().includes(s))&&(p==='all'||h.proxyGroup===p)&&(src==='all'||h.sourceType===src))}
function hostCard(h){const key=hostKey(h.id),sel=selectedHostIds.has(key),open=hostKey(expandedHostId)===key,lock=hostLockReason(h),hid=q(key),creator=userById(h.createdBy),groups=[...new Set(h.attachments.map(a=>groupById(a.ownerGroupId)?.name).filter(Boolean))];return`<div class="card host-card ${sel?'selected':''}"><div class="host-top"><div class="card-main"><input class="checkbox" type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation()" onchange="toggleHost(${hid})"><span class="icon">🖥️</span><div><div class="card-title">${esc(h.name)}</div><div class="meta"><span class="mono">${addressBadge(h)}${esc(h.address)}</span> · Группа прокси: <b>${esc(proxyName(h.proxyGroup))}</b></div><div class="pills">${sourceBadge(h)}<span class="badge ${h.status==='UP'?'b-green':'b-amber'}">${h.status==='UP'?'🟢 UP':'🟡 WARN'}</span><span class="badge">${h.attachments.length} сервисов</span>${lock?'<span class="badge b-red">🔒 критичные поля заблокированы</span>':'<span class="badge b-green">🔓 можно редактировать</span>'}</div><div class="meta">Создал: ${esc(creator?.name||'—')} · Группы attachment'ов: ${groups.length?esc(groups.join(', ')):'—'}</div></div></div><div class="actions">${h.sourceType==='catalog'?`<button class="xs outline" onclick="syncOneCatalogHost(${hid})">🔄 Sync</button>`:''}<button class="xs outline" onclick="openHostEditModal(${hid})" ${canEditHost(h)?'':'disabled'}>✏️ Редактировать</button><button class="xs ghost" onclick="toggleHostDetails(${hid})">${open?'▲ Свернуть':'→ Детали'}</button><button class="xs danger" onclick="openDeleteHostModal(${hid})" ${canDeleteHost(h)?'':'disabled'}>🗑️ Удалить</button></div></div><div class="details ${open?'open':''}">${open?hostDetails(h):''}</div></div>`}
function proxyName(id){return state.proxyGroups.find(g=>g.id===id)?.name||id}
function hostDetails(h){const lock=hostLockReason(h);return`${lock?`<div class="box amber-box">⚠️ ${esc(lock)}</div>`:''}${sourceDetails(h)}<h4>Присоединённые сервисы</h4>${h.attachments.length?h.attachments.map((a,i)=>attachmentCard(h,a,i)).join(''):'<div class="empty">Нет присоединённых сервисов</div>'}`}
function sourceDetails(h){if(h.sourceType==='catalog'){const src=state.catalogSources.find(s=>s.id===h.catalogBinding?.sourceId),cat=catalogHost(h.catalogBinding?.sourceId,h.catalogBinding?.externalId);return`<div class="box purple-box"><b>Источник данных:</b> ${esc(src?.name||'CMDB')}<br><span class="muted">External ID:</span> <span class="mono">${esc(h.catalogBinding?.externalId||'—')}</span><br><span class="muted">Последняя синхронизация:</span> ${esc(h.catalogBinding?.lastSyncAt||'—')}<br><span class="muted">Статус:</span> ${cat?'<span class="badge b-green">synced</span>':'<span class="badge b-red">missing</span>'}<div class="hint">Имя хоста, IP/FQDN и группа прокси управляются справочником.</div></div>`}if(h.prefilledFromCatalog){const src=state.catalogSources.find(s=>s.id===h.prefilledFromCatalog.sourceId);return`<div class="box amber-box"><b>Ручной хост, разово заполненный из справочника.</b><br><span class="muted">Источник заполнения:</span> ${esc(src?.name||'CMDB')} · <span class="mono">${esc(h.prefilledFromCatalog.externalId)}</span><br><span class="muted">Скопировано:</span> ${esc(h.prefilledFromCatalog.copiedAt||'—')}<div class="hint">Автоматическое обновление выключено.</div></div>`}return`<div class="box"><b>Источник данных:</b> Ручной ввод. <span class="hint">Синхронизация справочника не меняет поля этого хоста.</span></div>`}
function attachmentCard(h,a,i){const svc=state.services.find(s=>s.id===a.serviceId);if(!svc)return'';const port=a.portOverride||svc.defaultPort,target=`${h.address}:${port}`,creator=userById(a.createdBy),g=groupById(a.ownerGroupId),can=canManageAttachment(a),hid=q(hostKey(h.id));return`<div class="attach-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div class="card-main"><span class="icon">${esc(svc.icon)}</span><div><div class="card-title">${esc(svc.name)}</div><div class="meta">Target: <span class="mono">${esc(target)}</span> · ${esc(svc.type)} · ${authBadge(svc)}</div><div class="meta">Attachment создал: ${esc(creator?.name||'—')} · Владелец: ${esc(g?.name||'—')}</div></div></div><button class="xs ghost" style="color:var(--danger)" onclick="detachService(${hid},${i})" ${can?'':'disabled'}>🔌 Отсоединить</button></div><div class="port-row"><span class="muted">Порт:</span><input type="number" min="1" max="65535" id="port-${hostKey(h.id)}-${i}" value="${esc(port)}" ${can?'':'disabled'}><button class="xs success" onclick="applyPort(${hid},${i})" ${can?'':'disabled'}>✓ Применить</button><button class="xs outline" onclick="resetPort(${hid},${i})" ${can?'':'disabled'}>↺ Сбросить</button><span class="hint">${a.portOverride?'переопределён':'по умолчанию'}: ${esc(port)}</span></div></div>`}
function toggleHost(id){const key=hostKey(id);selectedHostIds.has(key)?selectedHostIds.delete(key):selectedHostIds.add(key);renderHosts()}
function toggleAllHosts(checked){filteredHosts().forEach(h=>checked?selectedHostIds.add(hostKey(h.id)):selectedHostIds.delete(hostKey(h.id)));renderHosts()}
function toggleHostDetails(id){const key=hostKey(id);expandedHostId=hostKey(expandedHostId)===key?null:key;renderHosts()}

function openHostCreateModal(){if(!canMonitor())return toast('Нет права на постановку на мониторинг');hostDraft={mode:'manual',catalogExternalId:null,editingHostId:null};renderHostModal()}
function openHostEditModal(id){const host=state.hosts.find(h=>hostKey(h.id)===hostKey(id));if(!host)return;if(!canEditHost(host))return toast(hostLockReason(host)||'Недостаточно прав');hostDraft={mode:'edit',catalogExternalId:host.catalogBinding?.externalId||null,editingHostId:hostKey(host.id)};renderHostModal(host)}
function renderHostModal(host=null){const isEdit=!!host,cat=catalogByExternal(hostDraft.catalogExternalId);openModal(isEdit?'Редактировать хост':'Создать хост',isEdit?'Чувствительные поля можно менять только при соблюдении правил доступа':'Выберите источник данных для чувствительных полей хоста',isEdit?hostEditForm(host):hostCreateForm(cat),`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveHostFromModal()">${isEdit?'Сохранить изменения':'Создать хост'}</button>`)}
function hostCreateForm(cat){const mode=hostDraft.mode,p=cat||{name:'',addressType:'ip',address:'',proxyGroup:'prod-dmz'},ro=mode==='catalog';return`<div class="box blue-box"><b>Источник владения полями:</b> manual — поля ведутся в MARS; catalog — поля ведёт справочник и обновляет синхронизация.</div><div class="field"><label>Как создать хост?</label><select id="host-mode" class="wide" onchange="hostDraft.mode=this.value;hostDraft.catalogExternalId=null;renderHostModal()">${selectOption('manual','Ввести вручную',mode)}${selectOption('manual-prefill','Заполнить из справочника, но создать ручной хост',mode)}${selectOption('catalog','Создать справочный хост с автообновлением',mode)}</select></div>${mode==='catalog'||mode==='manual-prefill'?catalogPicker():''}${mode==='catalog'&&!cat?'<div class="box amber-box">Выберите запись справочника.</div>':''}${mode==='manual-prefill'&&cat?'<div class="box amber-box">Поля скопированы из справочника разово. После создания этот хост останется ручным.</div>':''}${hostFields(p,ro)}`}
function hostEditForm(h){return`${sourceDetails(h)}${hasAttachments(h)&&!isAdmin()?'<div class="box red-box">Хост используется в мониторинге. Имя, IP/FQDN и группа прокси заблокированы для обычного пользователя.</div>':''}${hostFields(h,!canEditHost(h))}`}
function hostFields(p,ro=false){return`<div class="row"><div class="field"><label>Имя хоста *</label><input id="host-name" class="wide" value="${esc(p.name)}" ${ro?'disabled':''} oninput="validateHostForm()"><div class="hint">Используется как label в метриках.</div></div><div class="field"><label>Группа прокси *</label><select id="host-proxy" class="wide" ${ro?'disabled':''} onchange="validateHostForm()">${proxyOptions(p.proxyGroup,false)}</select><div class="hint">Определяет route сбора через proxy/collector.</div></div></div><div class="row"><div class="field"><label>Тип адреса *</label><select id="host-addr-type" class="wide" ${ro?'disabled':''} onchange="validateHostForm()">${selectOption('ip','IP-адрес',p.addressType)}${selectOption('fqdn','FQDN',p.addressType)}</select></div><div class="field"><label>IP/FQDN *</label><input id="host-address" class="wide mono" value="${esc(p.address)}" ${ro?'disabled':''} oninput="validateHostForm()"><div id="host-val" class="hint"></div></div></div>`}
function catalogPicker(){const s=($('catalog-search')?.value||'').toLowerCase(),items=state.catalogHosts.filter(h=>!s||h.name.toLowerCase().includes(s)||h.address.toLowerCase().includes(s)||h.externalId.toLowerCase().includes(s));return`<div class="box"><div class="field"><label>Справочник хостов</label><input id="catalog-search" class="wide" value="${esc(s)}" placeholder="Поиск по имени, адресу или external ID..." oninput="renderHostModal()"></div><div style="max-height:220px;overflow:auto">${items.map(h=>`<div class="card clickable ${hostDraft.catalogExternalId===h.externalId?'selected':''}" onclick="hostDraft.catalogExternalId=${q(h.externalId)};renderHostModal()"><div class="card-main"><span class="icon">📚</span><div><div class="card-title">${esc(h.name)}</div><div class="meta"><span class="mono">${esc(h.address)}</span> · ${esc(proxyName(h.proxyGroup))} · ${esc(h.os)} · <span class="mono">${esc(h.externalId)}</span></div></div></div>${hostDraft.catalogExternalId===h.externalId?'<span class="badge b-green">✓ выбрано</span>':''}</div>`).join('')}</div></div>`}
function validateHostForm(){const v=$('host-val');if(!v)return true;const name=$('host-name')?.value.trim()||'',addr=$('host-address')?.value.trim()||'',type=$('host-addr-type')?.value||'ip',edit=hostDraft.editingHostId;if(!name){v.textContent='Имя хоста обязательно';v.style.color='var(--danger)';return false}if(state.hosts.some(h=>hostKey(h.id)!==hostKey(edit)&&h.name.toLowerCase()===name.toLowerCase())){v.textContent='Хост с таким именем уже существует';v.style.color='var(--danger)';return false}const ok=type==='ip'?isValidIp(addr):isValidFqdn(addr);v.textContent=ok?'Адрес корректен':'Проверьте формат IP/FQDN';v.style.color=ok?'var(--success)':'var(--danger)';return ok}
function saveHostFromModal(){if(hostDraft.editingHostId){const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostDraft.editingHostId));if(!h||!canEditHost(h))return toast('Редактирование недоступно');if(!validateHostForm())return;h.name=$('host-name').value.trim();h.addressType=$('host-addr-type').value;h.address=$('host-address').value.trim();h.proxyGroup=$('host-proxy').value;saveState();closeModal();renderAll();toast('Хост обновлён');return}const mode=hostDraft.mode,cat=catalogByExternal(hostDraft.catalogExternalId);if((mode==='catalog'||mode==='manual-prefill')&&!cat)return toast('Выберите запись справочника');let h;if(mode==='catalog'){if(state.hosts.some(x=>x.sourceType==='catalog'&&x.catalogBinding?.externalId===cat.externalId&&x.catalogBinding?.sourceId===cat.sourceId))return toast('Этот справочный хост уже заведён');h={id:uid('host'),name:cat.name,addressType:cat.addressType,address:cat.address,proxyGroup:cat.proxyGroup,status:'UP',sourceType:'catalog',createdBy:currentUser().id,createdAt:nowText(),prefilledFromCatalog:null,catalogBinding:{sourceId:cat.sourceId,externalId:cat.externalId,lastSyncAt:nowText(),syncStatus:'synced'},attachments:[]}}else{if(!validateHostForm())return;h={id:uid('host'),name:$('host-name').value.trim(),addressType:$('host-addr-type').value,address:$('host-address').value.trim(),proxyGroup:$('host-proxy').value,status:'UP',sourceType:'manual',createdBy:currentUser().id,createdAt:nowText(),prefilledFromCatalog:mode==='manual-prefill'&&cat?{sourceId:cat.sourceId,externalId:cat.externalId,copiedAt:nowText()}:null,catalogBinding:null,attachments:[]}}if(state.hosts.some(x=>x.name.toLowerCase()===h.name.toLowerCase()))return toast('Хост с таким именем уже существует');state.hosts.push(h);saveState();closeModal();renderAll();toast('Хост создан')}
function openDeleteHostModal(id){const h=state.hosts.find(x=>hostKey(x.id)===hostKey(id));if(!h)return;if(!canDeleteHost(h))return toast('Удаление недоступно');confirmModal('Удаление хоста',`Удалить <b>${esc(h.name)}</b>?<br>Присоединённых сервисов: ${h.attachments.length}`,'deleteHost',q(hostKey(id)))}
function deleteHost(id){state.hosts=state.hosts.filter(h=>hostKey(h.id)!==hostKey(id));selectedHostIds.delete(hostKey(id));if(hostKey(expandedHostId)===hostKey(id))expandedHostId=null;saveState();renderAll();toast('Хост удалён')}
function syncCatalogHosts(){let c=0;state.hosts.filter(h=>h.sourceType==='catalog').forEach(h=>{if(applyCatalogSync(h))c++});saveState();renderAll();toast(`Синхронизировано хостов: ${c}`)}
function syncOneCatalogHost(id){const h=state.hosts.find(x=>hostKey(x.id)===hostKey(id));if(!h)return;if(applyCatalogSync(h)){saveState();renderAll();toast('Хост синхронизирован')}else toast('Запись справочника не найдена')}
function applyCatalogSync(h){const c=catalogHost(h.catalogBinding?.sourceId,h.catalogBinding?.externalId);if(!c){h.catalogBinding.syncStatus='missing';return false}h.name=c.name;h.addressType=c.addressType;h.address=c.address;h.proxyGroup=c.proxyGroup;h.catalogBinding.lastSyncAt=nowText();h.catalogBinding.syncStatus='synced';return true}

function authBadge(s){if(s.authMode==='basic')return'<span class="badge b-amber">🔐 Basic Auth</span>';if(s.authMode==='bearer')return'<span class="badge b-purple">🔐 Bearer Token</span>';return'<span class="badge">🔓 Без авторизации</span>'}
function protocolLine(s){if(s.type!=='ExporterScrape')return'';return` · ${String(s.protocol||'http').toUpperCase()}${s.protocol==='https'?(s.clientCertificate?' · client cert':'')+(s.skipServerCertCheck?' · skip TLS verify':''):''}`}
function serviceCollections(id){return state.collections.filter(c=>c.serviceIds.includes(id))}
function usage(id){return state.hosts.reduce((n,h)=>n+h.attachments.filter(a=>a.serviceId===id).length,0)}
function renderServices(){const arr=state.services,all=arr.length&&arr.every(s=>selectedServiceIds.has(s.id));const body=`<div class="panel"><div class="info"><b>Auth доступна для любого типа сервиса:</b> без авторизации, Basic Auth или Bearer Token. Для ExporterScrape можно выбрать HTTP/HTTPS; при HTTPS доступна вставка клиентского сертификата строкой.</div><div class="toolbar"><div style="display:flex;gap:12px;align-items:center"><input class="checkbox" type="checkbox" ${all?'checked':''} onchange="toggleAllServices(this.checked)"><span class="muted">Выбрано: <b>${selectedServiceIds.size}</b> из <b>${arr.length}</b></span></div><button class="sm danger" ${selectedServiceIds.size?'':'disabled'} onclick="openBulkDeleteServices()">🗑️ Удалить выбранные</button></div><div class="stats"><div class="stat"><div class="stat-label">Сервисов</div><div class="stat-value">${arr.length}</div></div><div class="stat"><div class="stat-label">Basic Auth</div><div class="stat-value">${arr.filter(s=>s.authMode==='basic').length}</div></div><div class="stat"><div class="stat-label">Bearer Token</div><div class="stat-value">${arr.filter(s=>s.authMode==='bearer').length}</div></div><div class="stat"><div class="stat-label">HTTPS Exporter</div><div class="stat-value">${arr.filter(s=>s.type==='ExporterScrape'&&s.protocol==='https').length}</div></div></div><div class="content">${arr.length?arr.map(serviceCard).join(''):'<div class="empty">Нет сервисов</div>'}</div></div>`;page('services','🔌 Сервисы','Сервис принадлежит группе. Управлять им может участник группы или MARS admin.',`<button ${canMonitor()?'':'disabled'} onclick="openServiceModal()">➕ Создать сервис</button>`,body)}
function serviceCard(s){const can=canManageService(s),cols=serviceCollections(s.id),g=groupById(s.ownerGroupId);return`<div class="card ${selectedServiceIds.has(s.id)?'selected':''}"><div class="card-main"><input class="checkbox" type="checkbox" ${selectedServiceIds.has(s.id)?'checked':''} onchange="toggleService(${q(s.id)})" ${can?'':'disabled'}><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">Тип: ${esc(s.type)} · Порт: <span class="mono">${s.defaultPort}</span> · Метрики: <span class="mono">${esc(s.metrics)}</span>${protocolLine(s)}</div><div class="pills"><span class="badge b-blue">👥 ${esc(g?.name||'—')}</span>${authBadge(s)}<span class="badge">${usage(s.id)} хостов</span></div><div class="line"><span class="line-label">Коллекции:</span>${cols.length?cols.map(c=>`<span class="badge b-green">📦 ${esc(c.name)}</span>`).join(''):'<span class="muted">—</span>'}</div></div></div><div class="actions"><button class="xs outline" onclick="openCloneService(${q(s.id)})" ${can?'':'disabled'}>⧉ Клонировать</button><button class="xs purple" onclick="openCreateTemplateFromService(${q(s.id)})" ${can?'':'disabled'}>🧩 Создать шаблон</button><button class="xs outline" onclick="openServiceModal(${q(s.id)})" ${can?'':'disabled'}>✏️ Редактировать</button><button class="xs danger" onclick="openDeleteService(${q(s.id)})" ${can?'':'disabled'}>🗑️</button></div></div>`}
function toggleService(id){const s=state.services.find(x=>x.id===id);if(!canManageService(s))return toast('Нет прав');selectedServiceIds.has(id)?selectedServiceIds.delete(id):selectedServiceIds.add(id);renderServices()}
function toggleAllServices(ch){state.services.filter(canManageService).forEach(s=>ch?selectedServiceIds.add(s.id):selectedServiceIds.delete(s.id));renderServices()}
function openServiceModal(id='',base=null){const existing=id?state.services.find(s=>s.id===id):null;if(existing&&!canManageService(existing))return toast('Недостаточно прав');const s=existing||base||{name:'',type:'ExporterScrape',icon:'🌐',defaultPort:80,metrics:'/metrics',ownerGroupId:(isAdmin()?state.groups[0]?.id:currentUser().groups[0])||'g-infra',authMode:'none',basicUsername:'',basicPassword:'',bearerToken:'',protocol:'http',clientCertificate:'',skipServerCertCheck:false};openModal(existing?'Редактировать сервис':base?'Создать сервис из шаблона':'Создать сервис',existing?'Изменение доступно участникам группы-владельца':'Настрой один раз — применяй везде',serviceForm(s,!!base),`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveService(${q(existing?existing.id:'')})">${existing?'Сохранить':'Создать сервис'}</button>`);renderServiceDynamic()}
function serviceForm(s,fromTpl=false){return`<div class="row"><div class="field"><label>Название *</label><input id="svc-name" class="wide" value="${esc(s.name)}"></div><div class="field"><label>Группа-владелец *</label><select id="svc-group" class="wide">${groupOptions(s.ownerGroupId)}</select></div></div><div class="row3"><div class="field"><label>Тип *</label><select id="svc-type" class="wide" onchange="renderServiceDynamic()">${typeOptions(s.type)}</select></div><div class="field"><label>Иконка</label><select id="svc-icon" class="wide">${iconOptions(s.icon)}</select></div><div class="field"><label>Порт по умолчанию *</label><input id="svc-port" type="number" min="1" max="65535" class="wide" value="${esc(s.defaultPort)}"></div></div><div class="field"><label>Путь к метрикам</label><input id="svc-metrics" class="wide mono" value="${esc(s.metrics)}"></div><div id="exporter-fields" data-protocol="${esc(s.protocol||'http')}" data-cert="${esc(s.clientCertificate||'')}" data-skip="${s.skipServerCertCheck?'1':'0'}"></div><div class="field"><label>Авторизация</label><select id="svc-auth" class="wide" onchange="renderServiceDynamic()">${selectOption('none','Без авторизации',s.authMode||'none')}${selectOption('basic','Basic Auth',s.authMode||'none')}${selectOption('bearer','Bearer Token',s.authMode||'none')}</select></div><div id="auth-fields" data-user="${esc(s.basicUsername||'')}" data-pass="${esc(s.basicPassword||'')}" data-token="${esc(s.bearerToken||'')}"></div>${fromTpl?'<div class="box blue-box">Сервис создаётся из шаблона без auth. Авторизацию можно настроить здесь перед созданием.</div>':''}`}
function renderServiceDynamic(){const type=$('svc-type')?.value||'ExporterScrape',exp=$('exporter-fields');if(exp){const prevP=$('svc-protocol')?.value||exp.dataset.protocol||'http',prevC=$('svc-cert')?.value||exp.dataset.cert||'',prevS=$('svc-skip')?.checked||exp.dataset.skip==='1';exp.dataset.protocol=prevP;exp.dataset.cert=prevC;exp.dataset.skip=prevS?'1':'0';exp.innerHTML=type==='ExporterScrape'?`<div class="box"><div class="field"><label>Протокол сбора</label><select id="svc-protocol" class="wide" onchange="renderServiceDynamic()">${selectOption('http','HTTP',prevP)}${selectOption('https','HTTPS',prevP)}</select></div>${prevP==='https'?`<div class="field"><label>Клиентский сертификат</label><textarea id="svc-cert" rows="5" class="wide mono" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----">${esc(prevC)}</textarea><div class="hint">Сертификат вставляется строкой. При HTTP это поле не отображается.</div></div><label style="display:flex;gap:8px;align-items:center"><input id="svc-skip" type="checkbox" ${prevS?'checked':''}> Пропустить проверку серверного сертификата</label>`:''}</div>`:''}
  const auth=$('auth-fields');if(auth){const mode=$('svc-auth')?.value||'none',u=$('svc-user')?.value||auth.dataset.user||'',p=$('svc-pass')?.value||auth.dataset.pass||'',tok=$('svc-token')?.value||auth.dataset.token||'';auth.dataset.user=u;auth.dataset.pass=p;auth.dataset.token=tok;if(mode==='basic')auth.innerHTML=`<div class="box"><div class="row"><div class="field"><label>Username</label><input id="svc-user" class="wide" value="${esc(u)}"></div><div class="field"><label>Password</label><input id="svc-pass" type="password" class="wide" value="${esc(p)}"></div></div></div>`;else if(mode==='bearer')auth.innerHTML=`<div class="box"><div class="field"><label>Bearer Token</label><textarea id="svc-token" rows="3" class="wide mono">${esc(tok)}</textarea></div></div>`;else auth.innerHTML=''}}
function serviceFromForm(id=''){const type=$('svc-type').value,protocol=type==='ExporterScrape'?($('svc-protocol')?.value||'http'):'http';return{id:id||uid('svc'),name:$('svc-name').value.trim(),type,icon:$('svc-icon').value,defaultPort:num($('svc-port').value,0),metrics:$('svc-metrics').value.trim()||'/metrics',ownerGroupId:$('svc-group').value,authMode:$('svc-auth').value,basicUsername:$('svc-user')?.value||'',basicPassword:$('svc-pass')?.value||'',bearerToken:$('svc-token')?.value||'',protocol,clientCertificate:protocol==='https'?($('svc-cert')?.value||''):'',skipServerCertCheck:protocol==='https'?!!$('svc-skip')?.checked:false,usedBy:state.services.find(s=>s.id===id)?.usedBy||0,createdBy:state.services.find(s=>s.id===id)?.createdBy||currentUser().id}}
function saveService(id=''){const s=serviceFromForm(id);if(!s.name||s.defaultPort<1||s.defaultPort>65535)return toast('Заполните обязательные поля');if(!canManageGroup(s.ownerGroupId))return toast('Недостаточно прав на группу');if(state.services.some(x=>x.id!==id&&x.name.toLowerCase()===s.name.toLowerCase()))return toast('Сервис с таким именем уже существует');if(id){const i=state.services.findIndex(x=>x.id===id);if(i>-1)state.services[i]=s}else state.services.push(s);saveState();closeModal();renderAll();toast(id?'Сервис обновлён':'Сервис создан')}
function openCloneService(id){const s=state.services.find(x=>x.id===id);if(!s||!canManageService(s))return;openModal('Клонировать сервис',s.name,`<div class="field"><label>Имя нового сервиса</label><input id="clone-name" class="wide" value="${esc(s.name+' copy')}"></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="cloneService(${q(id)})">Создать копию</button>`,true)}
function cloneService(id){const s=state.services.find(x=>x.id===id),name=$('clone-name').value.trim();if(!name)return toast('Введите имя');if(state.services.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('Сервис с таким именем уже существует');state.services.push({...s,id:uid('svc'),name,usedBy:0,createdBy:currentUser().id});saveState();closeModal();renderAll();toast('Сервис склонирован')}
function openDeleteService(id){const s=state.services.find(x=>x.id===id);if(!s||!canManageService(s))return;confirmModal('Удаление сервиса',`Удалить <b>${esc(s.name)}</b>?<br>Attachment'ов: ${usage(id)}<br>Коллекций: ${serviceCollections(id).length}`,'deleteService',q(id))}
function deleteService(id){state.hosts.forEach(h=>h.attachments=h.attachments.filter(a=>a.serviceId!==id));state.collections.forEach(c=>c.serviceIds=c.serviceIds.filter(sid=>sid!==id));state.services=state.services.filter(s=>s.id!==id);selectedServiceIds.delete(id);saveState();renderAll();toast('Сервис удалён')}
function openBulkDeleteServices(){const ids=[...selectedServiceIds].filter(id=>canManageService(state.services.find(s=>s.id===id)));if(!ids.length)return toast('Нет доступных к удалению сервисов');openModal('Массовое удаление сервисов','Будут очищены связанные attachment и коллекции',`<div class="box red-box">Удалить сервисов: ${ids.length}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="bulkDeleteServices()">Удалить</button>`,true)}
function bulkDeleteServices(){[...selectedServiceIds].forEach(id=>{const s=state.services.find(x=>x.id===id);if(s&&canManageService(s))deleteServiceNoRender(id)});selectedServiceIds.clear();saveState();closeModal();renderAll();toast('Сервисы удалены')}
function deleteServiceNoRender(id){state.hosts.forEach(h=>h.attachments=h.attachments.filter(a=>a.serviceId!==id));state.collections.forEach(c=>c.serviceIds=c.serviceIds.filter(sid=>sid!==id));state.services=state.services.filter(s=>s.id!==id)}

function renderTemplates(){const arr=state.serviceTemplates,all=arr.length&&arr.every(t=>selectedTemplateIds.has(t.id));const body=`<div class="panel"><div class="info"><b>Правило:</b> шаблоны сервисов не содержат auth. Имя шаблона уникально.</div><div class="toolbar"><div style="display:flex;gap:12px;align-items:center"><input class="checkbox" type="checkbox" ${all?'checked':''} onchange="toggleAllTemplates(this.checked)"><span class="muted">Выбрано: <b>${selectedTemplateIds.size}</b> из <b>${arr.length}</b></span></div><button class="sm danger" ${selectedTemplateIds.size?'':'disabled'} onclick="openBulkDeleteTemplates()">🗑️ Удалить выбранные</button></div><div class="content">${arr.length?arr.map(templateCard).join(''):'<div class="empty">Нет шаблонов</div>'}</div></div>`;page('templates','🧩 Шаблоны сервисов','Клик по шаблону создаёт сервис на его основе. В UI шаблонов нет упоминаний об аутентификации.','',body)}
function templateCard(t){const g=groupById(t.ownerGroupId);return`<div class="card clickable ${selectedTemplateIds.has(t.id)?'selected':''}" onclick="openServiceFromTemplate(${q(t.id)})"><div class="card-main"><input class="checkbox" type="checkbox" ${selectedTemplateIds.has(t.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleTemplate(${q(t.id)})"><span class="icon">${esc(t.icon)}</span><div><div class="card-title">${esc(t.name)}</div><div class="meta">Тип: ${esc(t.type)} · Порт: <span class="mono">${t.defaultPort}</span> · Метрики: <span class="mono">${esc(t.metrics)}</span>${t.type==='ExporterScrape'?' · '+String(t.protocol||'http').toUpperCase():''}</div><div class="pills"><span class="badge b-blue">👥 ${esc(g?.name||'—')}</span><span class="badge">создано: ${t.usedBy||0}</span></div></div></div><div class="actions" onclick="event.stopPropagation()"><button class="xs outline" onclick="openEditTemplate(${q(t.id)})">✏️ Редактировать</button><button class="xs danger" onclick="openDeleteTemplate(${q(t.id)})">🗑️</button></div></div>`}
function toggleTemplate(id){selectedTemplateIds.has(id)?selectedTemplateIds.delete(id):selectedTemplateIds.add(id);renderTemplates()}
function toggleAllTemplates(ch){state.serviceTemplates.forEach(t=>ch?selectedTemplateIds.add(t.id):selectedTemplateIds.delete(t.id));renderTemplates()}
function openCreateTemplateFromService(id){const s=state.services.find(x=>x.id===id);if(!s)return;const name=`Шаблон "${s.name}"`;openModal('Создать шаблон сервиса','Из карточки сервиса',`<div class="box blue-box">Шаблон будет создан без аутентификации. Имя должно быть уникальным.</div><div class="field"><label>Название шаблона</label><input id="tpl-name" class="wide" value="${esc(name)}" oninput="validateTemplateName()"><div id="tpl-val" class="hint"></div></div><div class="box"><b>Основа:</b> ${esc(s.name)}<br>Тип: ${esc(s.type)} · Порт: ${s.defaultPort} · Метрики: <span class="mono">${esc(s.metrics)}</span></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="createTemplateFromService(${q(id)})">Создать шаблон</button>`,true);validateTemplateName()}
function validateTemplateName(editId=''){const el=$('tpl-name'),msg=$('tpl-val');if(!el||!msg)return false;const name=el.value.trim(),exists=state.serviceTemplates.some(t=>t.id!==editId&&t.name.toLowerCase()===name.toLowerCase());msg.textContent=!name?'Введите название':exists?'Шаблон с таким именем уже существует':'Имя свободно';msg.style.color=!name||exists?'var(--danger)':'var(--success)';return!!name&&!exists}
function createTemplateFromService(id){const s=state.services.find(x=>x.id===id);if(!s||!validateTemplateName())return;state.serviceTemplates.push({id:uid('tpl'),name:$('tpl-name').value.trim(),type:s.type,icon:s.icon,defaultPort:s.defaultPort,metrics:s.metrics,protocol:s.protocol||'http',skipServerCertCheck:!!s.skipServerCertCheck,ownerGroupId:s.ownerGroupId,createdBy:currentUser().id,usedBy:0});saveState();closeModal();renderAll();toast('Шаблон создан')}
function openServiceFromTemplate(id){const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;const s={name:t.name.replace(/^Шаблон\s+"(.+)"$/,'$1'),type:t.type,icon:t.icon,defaultPort:t.defaultPort,metrics:t.metrics,ownerGroupId:canManageGroup(t.ownerGroupId)?t.ownerGroupId:(isAdmin()?state.groups[0]?.id:currentUser().groups[0])||'g-infra',authMode:'none',basicUsername:'',basicPassword:'',bearerToken:'',protocol:t.protocol||'http',clientCertificate:'',skipServerCertCheck:!!t.skipServerCertCheck};openServiceModal('',s)}
function openEditTemplate(id){const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;openModal('Редактировать шаблон сервиса','Без настроек auth',`<div class="box blue-box">Шаблон не содержит авторизацию.</div><div class="field"><label>Название *</label><input id="tpl-name" class="wide" value="${esc(t.name)}" oninput="validateTemplateName(${q(id)})"><div id="tpl-val" class="hint"></div></div><div class="row3"><div class="field"><label>Тип</label><select id="tpl-type" class="wide">${typeOptions(t.type)}</select></div><div class="field"><label>Иконка</label><select id="tpl-icon" class="wide">${iconOptions(t.icon)}</select></div><div class="field"><label>Порт</label><input id="tpl-port" type="number" min="1" max="65535" class="wide" value="${t.defaultPort}"></div></div><div class="field"><label>Метрики</label><input id="tpl-metrics" class="wide mono" value="${esc(t.metrics)}"></div><div class="field"><label>Протокол для ExporterScrape</label><select id="tpl-protocol" class="wide">${selectOption('http','HTTP',t.protocol||'http')}${selectOption('https','HTTPS',t.protocol||'http')}</select></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveTemplate(${q(id)})">Сохранить</button>`);validateTemplateName(id)}
function saveTemplate(id){if(!validateTemplateName(id))return;const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;t.name=$('tpl-name').value.trim();t.type=$('tpl-type').value;t.icon=$('tpl-icon').value;t.defaultPort=num($('tpl-port').value,80);t.metrics=$('tpl-metrics').value.trim()||'/metrics';t.protocol=$('tpl-protocol').value;saveState();closeModal();renderAll();toast('Шаблон обновлён')}
function openDeleteTemplate(id){const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;confirmModal('Удаление шаблона',`Удалить шаблон <b>${esc(t.name)}</b>?`,'deleteTemplate',q(id))}
function deleteTemplate(id){state.serviceTemplates=state.serviceTemplates.filter(t=>t.id!==id);selectedTemplateIds.delete(id);saveState();renderAll();toast('Шаблон удалён')}
function openBulkDeleteTemplates(){openModal('Массовое удаление шаблонов','Подтвердите действие',`<div class="box red-box">Удалить шаблонов: ${selectedTemplateIds.size}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="bulkDeleteTemplates()">Удалить</button>`,true)}
function bulkDeleteTemplates(){state.serviceTemplates=state.serviceTemplates.filter(t=>!selectedTemplateIds.has(t.id));selectedTemplateIds.clear();saveState();closeModal();renderAll();toast('Шаблоны удалены')}

function renderCollections(){const avg=state.collections.length?(state.collections.reduce((s,c)=>s+c.serviceIds.length,0)/state.collections.length).toFixed(1):'0';const body=`<div class="panel"><div class="info"><b>Коллекция</b> хранит ссылки на сервисы. В карточках сервисов видно, в каких коллекциях они используются.</div><div class="stats three"><div class="stat"><div class="stat-label">Коллекций</div><div class="stat-value">${state.collections.length}</div></div><div class="stat"><div class="stat-label">Используется на хостах</div><div class="stat-value">${state.collections.reduce((s,c)=>s+c.usedBy,0)}</div></div><div class="stat"><div class="stat-label">Среднее сервисов</div><div class="stat-value">${avg}</div></div></div><div class="content">${state.collections.length?state.collections.map(collectionCard).join(''):'<div class="empty">Нет коллекций</div>'}</div></div>`;page('collections','📦 Коллекции','Группы сервисов для пакетного присоединения к хостам.',`<button onclick="openCollectionModal()">➕ Создать коллекцию</button>`,body)}
function collectionCard(c){const svcs=c.serviceIds.map(id=>state.services.find(s=>s.id===id)).filter(Boolean);return`<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c.name)} <span class="badge b-blue">${svcs.length} сервисов</span></div><div class="meta">${esc(c.description||'')}</div><div class="line"><span class="line-label">Сервисы:</span>${svcs.length?svcs.map(s=>`<span class="badge">${esc(s.icon)} ${esc(s.name)}</span>`).join(''):'<span class="muted">—</span>'}</div></div></div><div class="actions"><button class="xs danger" onclick="deleteCollection(${q(c.id)})">🗑️ Удалить</button></div></div>`}
function openCollectionModal(){collectionDraftIds=[];collectionDraftName='';collectionDraftDesc='';renderCollectionModal()}
function renderCollectionModal(){openModal('Создать коллекцию','Выберите сервисы из библиотеки',`<div class="field"><label>Название *</label><input id="col-name" class="wide" value="${esc(collectionDraftName)}" oninput="collectionDraftName=this.value"></div><div class="field"><label>Описание</label><textarea id="col-desc" rows="2" class="wide" oninput="collectionDraftDesc=this.value">${esc(collectionDraftDesc)}</textarea></div><div class="box"><b>Сервисы коллекции</b><div id="col-picked" style="margin-top:10px">${collectionDraftIds.length?collectionDraftIds.map(id=>{const s=state.services.find(x=>x.id===id);return s?`<span class="badge" style="margin:3px">${esc(s.icon)} ${esc(s.name)} <button class="xs ghost" onclick="removeFromCollectionDraft(${q(id)})">✕</button></span>`:''}).join(''):'<div class="muted">Коллекция пуста</div>'}</div><button class="outline" onclick="openServicePicker()">➕ Добавить сервис</button></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveCollection()">Сохранить</button>`)}
function openServicePicker(){const items=state.services.filter(s=>!collectionDraftIds.includes(s.id));openModal('Добавить сервис в коллекцию','Выберите сервис',items.length?items.map(s=>`<div class="card clickable" onclick="addToCollectionDraft(${q(s.id)})"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)} · ${s.defaultPort}</div></div></div></div>`).join(''):'<div class="empty">Все сервисы уже добавлены</div>',`<button class="ghost" onclick="renderCollectionModal()">Назад</button>`,true)}
function addToCollectionDraft(id){if(!collectionDraftIds.includes(id))collectionDraftIds.push(id);renderCollectionModal()}
function removeFromCollectionDraft(id){collectionDraftIds=collectionDraftIds.filter(x=>x!==id);renderCollectionModal()}
function saveCollection(){collectionDraftName=$('col-name')?.value.trim()||collectionDraftName;collectionDraftDesc=$('col-desc')?.value.trim()||collectionDraftDesc;if(!collectionDraftName||!collectionDraftIds.length)return toast('Введите название и добавьте сервисы');state.collections.push({id:uid('col'),name:collectionDraftName,description:collectionDraftDesc,serviceIds:[...collectionDraftIds],usedBy:0});saveState();closeModal();renderAll();toast('Коллекция создана')}
function deleteCollection(id){state.collections=state.collections.filter(c=>c.id!==id);saveState();renderAll();toast('Коллекция удалена')}

function openAttachModal(type){if(!canMonitor())return toast('Нет права на постановку на мониторинг');if(selectedHostIds.size!==1)return toast('Выберите один хост');const host=state.hosts.find(h=>hostKey(h.id)===[...selectedHostIds][0]),items=type==='service'?state.services:state.collections;openModal(type==='service'?'Присоединить сервис':'Присоединить коллекцию','Attachment получит владельца по группе сервиса',`<div class="box blue-box">Хост: <b>${esc(host.name)}</b> · ${esc(host.address)}</div>${items.length?items.map(i=>`<div class="card clickable" onclick="attachItem(${q(type)},${q(i.id)})"><div class="card-main"><span class="icon">${type==='service'?esc(i.icon):'📦'}</span><div><div class="card-title">${esc(i.name)}</div><div class="meta">${type==='service'?esc(i.type)+' · '+i.defaultPort:i.serviceIds.length+' сервисов'}</div></div></div></div>`).join(''):'<div class="empty">Нет доступных элементов</div>'}`,`<button class="ghost" onclick="closeModal()">Отмена</button>`)}
function attachItem(type,itemId){const host=state.hosts.find(h=>hostKey(h.id)===[...selectedHostIds][0]),ids=type==='service'?[itemId]:(state.collections.find(c=>c.id===itemId)?.serviceIds||[]);let added=0;ids.forEach(id=>{const s=state.services.find(x=>x.id===id);if(!s||host.attachments.some(a=>a.serviceId===id))return;host.attachments.push({serviceId:id,createdBy:currentUser().id,ownerGroupId:s.ownerGroupId,portOverride:null});added++});if(type==='collection'){const c=state.collections.find(x=>x.id===itemId);if(c)c.usedBy++}else{const s=state.services.find(x=>x.id===itemId);if(s)s.usedBy++}saveState();closeModal();expandedHostId=hostKey(host.id);renderAll();toast(`Присоединено сервисов: ${added}`)}
function detachService(hostId,i){const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostId)),a=h?.attachments[i];if(!h||!a)return;if(!canManageAttachment(a))return toast('Недостаточно прав');h.attachments.splice(i,1);saveState();renderAll();toast('Сервис отсоединён')}
function applyPort(hostId,i){const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostId)),a=h?.attachments[i];if(!a||!canManageAttachment(a))return toast('Недостаточно прав');const val=$(`port-${hostKey(hostId)}-${i}`).value.trim();if(!val)a.portOverride=null;else{const p=num(val,0);if(p<1||p>65535)return toast('Некорректный порт');a.portOverride=p}saveState();renderAll();toast('Порт обновлён')}
function resetPort(hostId,i){const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostId)),a=h?.attachments[i];if(!a||!canManageAttachment(a))return toast('Недостаточно прав');a.portOverride=null;saveState();renderAll();toast('Порт сброшен')}

function renderAccess(){const rows=[['Создать хост','Пользователь с правом “Постановка на мониторинг”'],['Редактировать manual host без attachment','Создатель или MARS admin'],['Редактировать manual host с attachment','Только MARS admin'],['Редактировать catalog host','Нельзя вручную: поля обновляются из справочника'],['Удалить хост без attachment','Создатель или MARS admin'],['Удалить хост с attachment','Только MARS admin'],['Присоединить сервис','Любой пользователь с правом “Постановка на мониторинг”'],['Отсоединить attachment','Автор attachment, участник группы-владельца или MARS admin']];const body=`<div class="panel"><div class="info"><b>Ключевая идея:</b> хосты и attachment'ы видны всем, но управление service/attachment зависит от группы. Чувствительные поля хоста защищены жизненным циклом и источником данных.</div><div class="content"><h3>Пользователи</h3>${state.users.map(u=>`<div class="card"><div class="card-main"><span class="avatar" style="background:${u.isAdmin?'#7C3AED':'var(--primary)'}">${esc(u.initials)}</span><div><div class="card-title">${esc(u.name)} ${u.id===state.currentUserId?'<span class="badge b-blue">текущий</span>':''}</div><div class="meta">${u.isAdmin?'MARS admin':'Пользователь'} · Постановка на мониторинг: ${u.canMonitor?'да':'нет'}</div><div class="pills">${u.groups.map(id=>`<span class="badge b-blue">${esc(groupById(id)?.name||id)}</span>`).join('')}</div></div></div><button class="sm outline" onclick="switchUser(${q(u.id)})">Переключиться</button></div>`).join('')}<h3>Группы</h3>${state.groups.map(g=>`<div class="card"><div class="card-main"><span class="icon">👥</span><div><div class="card-title">${esc(g.name)}</div><div class="meta">Участники: ${state.users.filter(u=>u.groups.includes(g.id)).map(u=>esc(u.name)).join(', ')||'—'}</div></div></div></div>`).join('')}<h3>Правила по хостам</h3><div class="box"><table style="width:100%;border-collapse:collapse"><tbody>${rows.map(r=>`<tr><td style="padding:8px;border-bottom:1px solid var(--slate-200);font-weight:800">${r[0]}</td><td style="padding:8px;border-bottom:1px solid var(--slate-200)">${r[1]}</td></tr>`).join('')}</tbody></table></div></div></div>`;page('access','👥 Доступ','Демо-модель пользователей, групп и прав для проверки сценариев.','',body)}

loadState();renderAll();
</script>
</body>
</html>
