let S,selH=new Set(),selS=new Set(),selT=new Set(),openH=null,editH=null,editS=null,editT=null,tplCreate=null,certDraft='',tplCertDraft='',colDraft=[],colName='',colDesc='',attach=null;

{id:'svc-1',name:'PostgreSQL',type:'SQL',icon:'🐘',port:5432,metrics:'/metrics',group:'grp-data',by:'u-data',auth:{mode:'basic',user:'monitor',pass:''},protocol:null,tls:null,template:false},

{id:'tpl-2',name:'Шаблон "PostgreSQL Advanced"',type:'SQL',icon:'🐘',port:5432,metrics:'/metrics',group:'grp-data',by:'u-data',auth:null,protocol:null,tls:null,template:true},

function load(){let raw=localStorage.getItem(KEY);if(!raw)for(const k of LEG){raw=localStorage.getItem(k);if(raw)break}try{S=raw?JSON.parse(raw):demo()}catch(e){S=demo()}norm();save()}
function save(){norm();localStorage.setItem(KEY,JSON.stringify(S))}
function norm(){let d=demo();S.users=Array.isArray(S.users)&&S.users.length?S.users:d.users;S.groups=Array.isArray(S.groups)&&S.groups.length?S.groups:d.groups;S.cur=S.cur||S.currentUserId||d.cur;if(!S.users.some(u=>u.id===S.cur))S.cur=S.users[0].id;S.services=Array.isArray(S.services)?S.services:[];S.collections=Array.isArray(S.collections)?S.collections:[];S.hosts=Array.isArray(S.hosts)?S.hosts:[];S.users.forEach(u=>u.groups=u.groups||u.groupIds||[]);S.services.forEach(x=>{x.id=x.id||id(x.template||x.isTemplate?'tpl':'svc');x.template=!!(x.template||x.isTemplate);x.type=x.type||x.agent||'ExporterScrape';x.icon=x.icon||'🌐';x.port=parseInt(x.port||x.defaultPort)||80;x.metrics=x.metrics||'/metrics';x.group=x.group||x.groupId||S.groups[0].id;x.by=x.by||x.createdBy||S.cur;x.protocol=x.type==='ExporterScrape'?(x.protocol||'http'):null;x.tls=x.type==='ExporterScrape'&&x.protocol==='https'?{cert:x.tls?.cert||x.tls?.clientCertificateName||x.clientCertificate?.name||'',skip:!!(x.tls?.skip||x.tls?.skipServerCertificateValidation||x.skipServerCertificateValidation)}:null;x.auth=x.template?null:authNorm(x.auth)});S.collections.forEach(c=>{c.id=c.id||id('col');c.services=(c.services||c.serviceIds||[]).filter(sid=>S.services.some(s=>s.id===sid&&!s.template));c.used=c.used||c.usedBy||0});S.hosts.forEach(h=>{h.id=h.id||id('host');h.addr=h.addr||h.address||'127.0.0.1';h.addrType=h.addrType||h.addressType||'ip';h.seg=h.seg||h.segment||'prod-dmz';h.by=h.by||h.createdBy||S.cur;h.att=h.att||h.attachments||[];h.att=h.att.filter(a=>S.services.some(s=>s.id===(a.sid||a.serviceId)&&!s.template));h.att.forEach(a=>{a.sid=a.sid||a.serviceId;a.port=a.port??a.portOverride??null;a.by=a.by||a.attachedBy||S.cur;a.auth=a.auth?authNorm(a.auth):null})})}
function authNorm(a){if(!a)return{mode:'none'};if(a.mode==='basic')return{mode:'basic',user:a.user||a.username||'',pass:a.pass||a.password||''};if(a.mode==='bearer')return{mode:'bearer',token:a.token||''};if(a.username||a.password)return{mode:'basic',user:a.username||'',pass:a.password||''};return{mode:'none'}}
const U=()=>S.users.find(u=>u.id===S.cur)||S.users[0], admin=()=>!!U().isAdmin, mon=()=>admin()||!!U().canMonitor, uname=i=>S.users.find(u=>u.id===i)?.name||'—', gname=i=>S.groups.find(g=>g.id===i)?.name||'—', canG=g=>admin()||U().groups.includes(g), canSvc=s=>canG(s.group), canHost=h=>admin()||h.by===S.cur;
function hasAuth(a){return authNorm(a).mode!=='none'}function authLbl(a){a=authNorm(a);return a.mode==='basic'?'Basic Auth':a.mode==='bearer'?'Bearer Token':'Без авторизации'}
function tls(s){if(s.type!=='ExporterScrape')return'';let r=`<span class="badge blue">${(s.protocol||'http').toUpperCase()}</span>`;if(s.protocol==='https'){if(s.tls?.cert)r+=` <span class="badge green">📄 Клиентский сертификат (${String(s.tls.cert).length} симв.)</span>`;if(s.tls?.skip)r+=' <span class="badge amber">⚠️ Skip server cert</span>'}return r}
function meta(s,auth=true){return `<div class="meta">Тип: ${esc(s.type)} · Порт: <code>${s.port}</code> · Метрики: <code>${esc(s.metrics)}</code> · Группа: ${esc(gname(s.group))}</div><div class="pills">${tls(s)} ${auth?`<span class="badge ${hasAuth(s.auth)?'amber':'green'}">${hasAuth(s.auth)?'🔐':'🔓'} ${esc(authLbl(s.auth))}</span>`:''}</div>`}
function cols(sid){return S.collections.filter(c=>c.services.includes(sid))}function colHtml(sid){let c=cols(sid);return `<div class="collections"><span class="label">Коллекции:</span>${c.length?c.map(x=>`<span class="badge violet">📦 ${esc(x.name)}</span>`).join(''):'<span class="badge">—</span>'}</div>`}function tplNameUnique(n,skip=null){n=(n||'').trim().toLowerCase();return !!n&&!S.services.some(s=>s.template&&s.id!==skip&&s.name.toLowerCase()===n)}

function renderUser(){let u=U();$('userSel').innerHTML=S.users.map(x=>`<option value="${x.id}" ${x.id===S.cur?'selected':''}>${esc(x.name)}${x.isAdmin?' · admin':''}</option>`).join('');$('avatar').textContent=u.initials||u.name[0]||'U'}function switchUser(v){S.cur=v;selH.clear();selS.clear();selT.clear();save();render();toast(`Текущий пользователь: ${U().name}`)}
function renderHosts(){let q=($('hSearch')?.value||'').toLowerCase(),seg=$('hSeg')?.value||'all',hs=S.hosts.filter(h=>(h.name.toLowerCase().includes(q)||h.addr.toLowerCase().includes(q))&&(seg==='all'||h.seg===seg));let body=`<div class="panel"><div class="info"><b>Контекст: Хост.</b>&nbsp; Хосты глобальны и видны всем пользователям MARS.</div><div class="toolbar"><div><input class="chk" type="checkbox" onchange="allHosts(this.checked)" ${hs.length&&hs.every(h=>selH.has(h.id))?'checked':''}> <span class="muted">Выбрано: <b>${selH.size}</b> из <b>${hs.length}</b></span></div><div class="actions"><button class="sm ghost" onclick="openAttach('service')" ${!mon()||selH.size!==1?'disabled':''}>⚡ Присоединить сервис</button><button class="sm ghost" onclick="openAttach('collection')" ${!mon()||selH.size!==1?'disabled':''}>📦 Присоединить коллекцию</button><button class="sm danger" onclick="bulkHostDel()" ${!selH.size?'disabled':''}>🗑️ Удалить</button></div></div><div class="filters"><span>🔍</span><input class="input" id="hSearch" value="${esc($('hSearch')?.value||'')}" oninput="renderHosts()" placeholder="Поиск..."><select id="hSeg" onchange="renderHosts()"><option value="all">Все группы прокси</option>${['prod-dmz','analytics','k8s'].map(x=>`<option value="${x}" ${seg===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="content">${hs.length?hs.map(hostCard).join(''):'<div class="empty">Хосты не найдены</div>'}</div><div class="footer">Присоединённые сервисы видны всем пользователям MARS.</div></div>`;page('hosts','Управление хостами','Постановка на мониторинг и присоединение сервисов/коллекций',`<button class="outline" onclick="resetDemo()">↺ Сбросить демо</button><button onclick="hostForm()" ${!mon()?'disabled':''}>➕ Создать хост</button>`,body)}
function hostCard(h){let det=(h.att||[]).map((a,i)=>{let s=S.services.find(x=>x.id===a.sid),au=a.auth||s.auth;return `<div class="svcitem"><div class="left"><span class="icon">${s.icon}</span><div><div class="name">${esc(s.name)}</div><div class="meta mono">Target: ${esc(h.addr)}:${a.port||s.port}</div>${meta(s,false)}<div class="pills"><span class="badge ${hasAuth(au)?'amber':'green'}">${hasAuth(au)?'🔐':'🔓'} ${esc(authLbl(au))}</span><span class="badge">Присоединил: ${esc(uname(a.by))}</span></div></div></div><div class="portrow"><span class="muted">Порт:</span><input id="p-${h.id}-${i}" type="number" min="1" max="65535" value="${a.port||s.port}"><button class="xs success" onclick="setPort('${h.id}',${i})" ${!mon()?'disabled':''}>✓</button><button class="xs outline" onclick="resetPort('${h.id}',${i})" ${!mon()?'disabled':''}>↺</button><button class="xs danger" onclick="detach('${h.id}',${i})" ${!mon()?'disabled':''}>Отсоединить</button></div></div>`}).join('')||'<div class="muted">Нет присоединённых сервисов.</div>';return `<div class="card ${selH.has(h.id)?'sel':''}"><div class="left"><input class="chk" type="checkbox" onchange="toggleH('${h.id}')" ${selH.has(h.id)?'checked':''}><span class="icon">🖥️</span><div><div class="name mono">${esc(h.name)}</div><div class="meta"><span class="addr ${h.addrType==='fqdn'?'fqdn':'ip'}">${h.addrType==='fqdn'?'FQDN':'IP'}</span>${esc(h.addr)}</div><div class="pills"><span class="badge ${h.status==='UP'?'green':'amber'}">${h.status}</span><span class="badge">Создал: ${esc(uname(h.by))}</span><span class="badge">Группа прокси: ${esc(h.seg)}</span><span class="badge">${h.att.length} сервисов</span></div></div></div><div class="actions"><button class="xs outline" onclick="hostForm('${h.id}')" ${!canHost(h)?'disabled':''}>✏️</button><button class="xs danger" onclick="delHost('${h.id}')" ${!canHost(h)?'disabled':''}>🗑️</button><button class="xs ghost" onclick="openH=openH==='${h.id}'?null:'${h.id}';renderHosts()">${openH===h.id?'▲':' function tplForm(i){let t=S.services.find(x=>x.id===i);if(!canSvc(t))return toast('Нет прав');editT=i;tplCertDraft='';M('Редактирование шаблона сервиса','Измените параметры шаблона',formHtml('tpl',t,false),`<button class="outline" onclick="closeM()">Отмена</button><button onclick="saveTpl()">Сохранить шаблон</button>`);fillForm('tpl',t)}function saveTpl(){let d=collect('tpl',true),t=S.services.find(x=>x.id===editT);if(!canG(d.group))return toast('Нет прав на группу');if(!tplNameUnique(d.name,editT))return toast('Шаблон с таким именем уже существует');Object.assign(t,d,{id:t.id,by:t.by,auth:null,template:true});save();closeM();render();toast('Шаблон обновлён')}function delTpl(i){let t=S.services.find(x=>x.id===i);if(!canSvc(t))return toast('Нет прав');C('Удаление шаблона',`Удалить <b>${esc(t.name)}</b>?`,()=>{S.services=S.services.filter(x=>x.id!==i);selT.delete(i);save();render();toast('Шаблон удалён')})}function bulkTplDel(){let ids=[...selT];if(ids.some(i=>!canSvc(S.services.find(s=>s.id===i))))return toast('В выборе есть шаблоны без прав удаления');C('Удаление шаблонов',`Удалить выбранные шаблоны: ${ids.length}?`,()=>{S.services=S.services.filter(s=>!selT.has(s.id));selT.clear();save();render();toast('Шаблоны удалены')})}
function createFromTpl(i){let t=S.services.find(x=>x.id===i);tplCreate=i;let gs=S.groups.map(g=>`<option value="${g.id}" ${(canG(t.group)?t.group:(U().groups[0]||S.groups[0].id))===g.id?'selected':''} ${!canG(g.id)?'disabled':''}>${esc(g.name)}${canG(g.id)?'':' · нет доступа'}</option>`).join('');M('Создать сервис из шаблона',t.name,`<div class="field"><label>Название нового сервиса *</label><input id="newSvc" class="wide" value="${esc(t.name.replace(/^Шаблон\s*/,'').replace(/^"|"$/g,''))}" oninput="$('newSvcBtn').disabled=!this.value.trim()"></div><div class="field"><label>Группа-владелец *</label><select id="newGroup" class="wide">${gs}</select></div><div class="box"><b>Предпросмотр конфигурации</b>${meta(t,false)}<div class="hint">После создания сервис можно донастроить в разделе «Сервисы».</div></div>`,`<button class="outline" onclick="closeM()">Отмена</button><button id="newSvcBtn" onclick="saveFromTpl()">Создать сервис</button>`)}function saveFromTpl(){let t=S.services.find(x=>x.id===tplCreate),g=$('newGroup').value,n=$('newSvc').value.trim();if(!n)return;if(!canG(g))return toast('Нет прав на группу');S.services.push({id:id('svc'),name:n,type:t.type,icon:t.icon,port:t.port,metrics:t.metrics,group:g,by:S.cur,protocol:t.protocol,tls:t.tls?{...t.tls}:null,auth:{mode:'none'},template:false});save();closeM();render();toast('Сервис создан из шаблона')}
function renderCollections(){let body=`<div class="panel"><div class="info"><b>Коллекции.</b>&nbsp; Наборы сервисов для пакетного присоединения.</div><div class="stats three"><div class="stat"><div class="muted">Коллекций</div><div class="n">${S.collections.length}</div></div><div class="stat"><div class="muted">Используется</div><div class="n">${S.collections.reduce((a,c)=>a+(c.used||0),0)}</div></div><div class="stat"><div class="muted">Среднее сервисов</div><div class="n">${S.collections.length?(S.collections.reduce((a,c)=>a+c.services.length,0)/S.collections.length).toFixed(1):0}</div></div></div><div class="content">${S.collections.length?S.collections.map(colCard).join(''):'<div class="empty">Нет коллекций</div>'}</div></div>`;page('collections','📦 Библиотека коллекций','Группы сервисов для пакетного присоединения',`<button onclick="colForm()">➕ Создать коллекцию</button>`,body)}
function colCard(c){let sv=c.services.map(i=>S.services.find(s=>s.id===i)).filter(Boolean);return `<div class="card"><div class="left"><span class="icon">📦</span><div><div class="name">${esc(c.name)} <span class="badge blue">${sv.length} сервисов</span></div><div class="meta">${esc(c.description||'')}</div><div class="collections"><span class="label">Сервисы:</span>${sv.map(s=>`<span class="badge">${s.icon} ${esc(s.name)}</span>`).join('')||'<span class="badge">—</span>'}</div></div></div><button class="xs danger" onclick="delCol('${c.id}')">🗑️ Удалить</button></div>`}function colForm(){colDraft=[];colName='';colDesc='';renderColForm()}function renderColForm(){M('Создание коллекции','Выберите сервисы',`<div class="field"><label>Название *</label><input id="colName" class="wide" value="${esc(colName)}" oninput="colName=this.value;chkCol()"></div><div class="field"><label>Описание</label><textarea id="colDesc" class="wide" rows="2" oninput="colDesc=this.value">${esc(colDesc)}</textarea></div><div class="field"><label>Состав</label><div class="box" id="colPicked"></div><button class="outline" onclick="pickSvc()">➕ Добавить сервис</button></div>`,`<button class="outline" onclick="closeM()">Отмена</button><button id="colSave" onclick="saveCol()">Сохранить</button>`);picked();chkCol()}function picked(){let e=$('colPicked');if(!e)return;e.innerHTML=colDraft.length?colDraft.map(i=>{let s=S.services.find(x=>x.id===i);return `<div class="card"><span>${s.icon} ${esc(s.name)}</span><button class="xs danger" onclick="colDraft=colDraft.filter(x=>x!=='${i}');picked();chkCol()">✕</button></div>`}).join(''):'<div class="muted">Коллекция пуста</div>'}function pickSvc(){colName=$('colName')?.value||colName;colDesc=$('colDesc')?.value||colDesc;M('Выберите сервис','Добавление в коллекцию',S.services.filter(s=>!s.template).map(s=>`<div class="card click" onclick="if(!colDraft.includes('${s.id}'))colDraft.push('${s.id}');renderColForm()"><div class="left"><span class="icon">${s.icon}</span><div><b>${esc(s.name)}</b>${meta(s,false)}${colHtml(s.id)}</div></div><span class="badge ${colDraft.includes(s.id)?'green':'blue'}">${colDraft.includes(s.id)?'✓ Добавлен':'➕ Добавить'}</span></div>`).join(''),`<button class="outline" onclick="renderColForm()">Назад</button>`)}function chkCol(){if($('colSave'))$('colSave').disabled=!(($('colName')?.value||colName).trim()&&colDraft.length)}function saveCol(){colName=($('colName')?.value||colName).trim();colDesc=($('colDesc')?.value||colDesc).trim();if(!colName||!colDraft.length)return toast('Заполните название и добавьте сервисы');S.collections.push({id:id('col'),name:colName,description:colDesc,services:[...colDraft],used:0});save();closeM();render();toast('Коллекция создана')}function delCol(i){let c=S.collections.find(x=>x.id===i);C('Удаление коллекции',`Удалить <b>${esc(c.name)}</b>?`,()=>{S.collections=S.collections.filter(x=>x.id!==i);save();render();toast('Коллекция удалена')})}
function openAttach(type){if(!mon())return toast('Нет разрешения на мониторинг');if(selH.size!==1)return toast('Выберите один хост');attach={type,hid:[...selH][0],item:null};let items=type==='service'?S.services.filter(s=>!s.template):S.collections;M(type==='service'?'Присоединить сервис':'Присоединить коллекцию','Выберите элемент',items.map(x=>type==='service'?`<div class="card click" onclick="attach.item='${x.id}';attachPreview()"><div class="left"><span class="icon">${x.icon}</span><div><b>${esc(x.name)}</b>${meta(x,true)}${colHtml(x.id)}</div></div></div>`:`<div class="card click" onclick="attach.item='${x.id}';attachPreview()"><div class="left"><span class="icon">📦</span><div><b>${esc(x.name)}</b><div class="meta">${x.services.length} сервисов</div></div></div></div>`).join('')||'<div class="empty">Нет элементов</div>',`<button class="outline" onclick="closeM()">Отмена</button>`)}function attachIds(){return attach.type==='service'?[attach.item]:(S.collections.find(c=>c.id===attach.item)?.services||[])}function attachPreview(){let h=S.hosts.find(x=>x.id===attach.hid),ids=attachIds(),forms=ids.map(i=>S.services.find(s=>s.id===i)).filter(s=>hasAuth(s.auth)).map(s=>{let a=authNorm(s.auth);return a.mode==='basic'?`<div class="box"><b>${s.icon} ${esc(s.name)} — Basic Auth</b><div class="row"><input id="au-${s.id}" placeholder="${esc(a.user||'username')}"><input id="ap-${s.id}" type="password" placeholder="••••••"></div></div>`:`<div class="box"><b>${s.icon} ${esc(s.name)} — Bearer Token</b><input class="wide" id="at-${s.id}" type="password" placeholder="Bearer token"></div>`}).join('');M('Предпросмотр присоединения',h.name,`<div class="rule">Хост: <b>${esc(h.name)}</b> · ${esc(h.addr)}</div>${ids.map(i=>{let s=S.services.find(x=>x.id===i);return `<div class="card"><div><b>${s.icon} ${esc(s.name)}</b><div class="meta mono">Target: ${esc(h.addr)}:${s.port}</div></div></div>`}).join('')}${forms||'<div class="rule">Дополнительные параметры не требуются.</div>'}`,`<button class="outline" onclick="openAttach('${attach.type}')">Назад</button><button onclick="doAttach()">Применить</button>`)}function doAttach(){let h=S.hosts.find(x=>x.id===attach.hid);attachIds().forEach(i=>{let s=S.services.find(x=>x.id===i),a=authNorm(s.auth),au=null;if(a.mode==='basic')au={mode:'basic',user:$('au-'+i)?.value||a.user,pass:$('ap-'+i)?.value||a.pass};if(a.mode==='bearer')au={mode:'bearer',token:$('at-'+i)?.value||a.token};let ex=h.att.find(x=>x.sid===i);if(ex)ex.auth=au||ex.auth;else h.att.push({sid:i,auth:au,port:null,by:S.cur})});if(attach.type==='collection'){let c=S.collections.find(c=>c.id===attach.item);if(c)c.used++}save();closeM();render();toast('Присоединено')}
function renderAccess(){let u=U();let body=`<div class="panel"><div class="info"><b>Правила доступа.</b>&nbsp; Сервисом управляет участник группы-владельца. Хосты уникальны и видны всем. Удалить хост может создатель или MARS admin. Присоединять сервисы может пользователь с разрешением на мониторинг.</div><div class="stats three"><div class="stat"><div class="muted">Текущий пользователь</div><div class="n" style="font-size:18px">${esc(u.name)}</div></div><div class="stat"><div class="muted">Мониторинг</div><div class="n" style="font-size:18px">${mon()?'Да':'Нет'}</div></div><div class="stat"><div class="muted">MARS admin</div><div class="n" style="font-size:18px">${admin()?'Да':'Нет'}</div></div></div><div class="content"><h3>Пользователи</h3>${S.users.map(x=>`<div class="card"><div class="left"><span class="icon">👤</span><div><div class="name">${esc(x.name)} ${x.id===S.cur?'<span class="badge blue">текущий</span>':''} ${x.isAdmin?'<span class="badge red">MARS admin</span>':''}</div><div class="meta">Группы: ${x.groups.map(gname).join(', ')||'—'}</div><div class="pills"><span class="badge ${x.canMonitor?'green':'red'}">Мониторинг: ${x.canMonitor?'разрешён':'нет'}</span></div></div></div><button class="xs outline" onclick="switchUser('${x.id}')">Переключиться</button></div>`).join('')}<h3>Группы</h3>${S.groups.map(g=>`<div class="card"><div class="left"><span class="icon">👥</span><div><div class="name">${esc(g.name)}</div><div class="meta">${esc(g.description)}</div><div class="meta">Участники: ${S.users.filter(u=>u.groups.includes(g.id)).map(u=>esc(u.name)).join(', ')||'—'}</div></div></div></div>`).join('')}</div></div>`;page('access','👥 Пользователи и группы','Демо-модель доступа MARS','',body)}
function M(t,s,b,f){$('mt').innerHTML=t;$('ms').innerHTML=s||'';$('mb').innerHTML=b;$('mf').innerHTML=f||'<button onclick="closeM()">Закрыть</button>';$('mw').classList.add('show')}function closeM(){$('mw').classList.remove('show')}function C(t,msg,yes){window.__yes=yes;M(t,'Подтверждение',`<div class="rule warn">${msg}</div>`,`<button class="outline" onclick="closeM()">Отмена</button><button class="danger" onclick="window.__yes();closeM()">Удалить</button>`)}function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function resetDemo(){C('Сброс демо','Вернуть исходные демо-данные?',()=>{S=demo();selH.clear();selS.clear();selT.clear();openH=null;save();render();toast('Демо сброшено')})}
load();render();
</script></body></html>
