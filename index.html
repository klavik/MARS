<style>

.registry-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.registry-filters select{min-width:150px}.registry-object-name{font-size:14px;font-weight:900}.registry-object-sub{font-size:12px;color:var(--muted);margin-top:3px}.registry-card-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}.registry-card-tabs button{background:transparent;color:var(--muted);border-radius:0;padding:9px 11px;border-bottom:3px solid transparent}.registry-card-tabs button:hover{background:#f8fafc}.registry-card-tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:850;background:transparent}.registry-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.registry-summary .box{margin:0}.registry-relation{cursor:pointer}.registry-relation:hover{border-color:#60a5fa;background:#f8fbff}.registry-source-row{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #eef2f7}.registry-source-row:last-child{border-bottom:0}.registry-attr-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.admin-object-toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.admin-object-list{max-height:560px;overflow:auto}.effective-main{font-weight:900}.effective-note{font-size:12px;color:var(--muted);margin-top:3px}.override-value{display:inline-flex;gap:6px;align-items:center}.readonly-note{padding:10px 12px;border-radius:9px;background:#f8fafc;color:#475569;font-size:12px;border:1px solid var(--line)}
.help-tip{
 display:inline;
 border:0;
 background:transparent;
 color:#60a5fa;

 font-weight:900;
 line-height:1;

 vertical-align:super;

 background:transparent;

}
.help-inline{display:inline-flex;align-items:center;gap:3px}
.help-popover{position:fixed;display:none;z-index:500;width:min(440px,calc(100vw - 28px));max-height:min(620px,calc(100vh - 28px));overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 14px 40px rgba(15,23,42,.18);padding:0}

/* v0.8.1 — вертикальный сайдбар фильтров для Постановки на мониторинг */
.filter-layout{display:grid;grid-template-columns:260px minmax(0,1fr);align-items:start;min-height:420px}
.filter-sidebar{border-right:1px solid var(--line);background:#f8fafc;padding:16px 14px;min-height:100%;position:sticky;top:0}

.filter-sidebar .field{margin-bottom:12px}.filter-sidebar .field:last-child{margin-bottom:0}

<body>
<aside id="product-sidebar" class="product-sidebar">
  <div class="sidebar-head">
    <div class="sidebar-brand">🖥️ MARS <span class="mars-version" onclick="showPrototypeHelp(event,\'prototype.version\')" title="Версия макета">v0.8.1</span></div>
    <div id="sidebar-context" class="sidebar-context">Основное меню</div>
  </div>
  <div id="sidebar-menu" class="sidebar-menu"></div>
  <div id="sidebar-foot" class="sidebar-foot"></div>
</aside>

<!-- 1. Постановка на мониторинг. Механика из исходного макета сохранена отдельным state/набором функций. -->
<div id="product-monitoring" class="app-section active">
<nav class="app-nav"><div class="nav"><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><div class="brand">Постановка на мониторинг</div><div class="tabs"><div id="nav-hosts" class="tab active" onclick="switchSection('hosts')">Хосты</div><div id="nav-services" class="tab" onclick="switchSection('services')">🔌 Сервисы</div><div id="nav-templates" class="tab" onclick="switchSection('templates')">🧩 Шаблоны</div><div id="nav-collections" class="tab" onclick="switchSection('collections')">📦 Коллекции</div><div id="nav-access" class="tab" onclick="switchSection('access')">👥 Доступ</div></div></div><div class="user"><select id="current-user" onchange="switchUser(this.value)"></select><div id="avatar" class="avatar">AI</div></div></div></nav>
<main><section id="section-hosts" class="section active"></section><section id="section-services" class="section"></section><section id="section-templates" class="section"></section><section id="section-collections" class="section"></section><section id="section-access" class="section"></section></main>
</div>

<!-- 2. Реестр объектов мониторинга -->
<div id="product-registry" class="app-section"><main id="registry-main"></main></div>
<!-- 3. Администрирование -->
<div id="product-admin" class="app-section"><main id="admin-main"></main></div>

<div id="modal-wrap" class="modal-wrap"><div id="modal" class="modal"><div class="modal-head"><div><div id="modal-title" class="modal-title"></div><div id="modal-sub" class="modal-sub"></div></div><button class="ghost" onclick="closeModal()">✕</button></div><div id="modal-body" class="modal-body"></div><div id="modal-foot" class="modal-foot"></div></div></div>
<div id="toast" class="toast"></div>
<div id="prototype-help-popover" class="help-popover" role="dialog" aria-live="polite">
  <div class="help-popover-head">
    <div><div id="prototype-help-title" class="help-popover-title"></div><div id="prototype-help-version" class="help-popover-version"></div></div>
    <button class="help-popover-close" onclick="hidePrototypeHelp()" aria-label="Закрыть">✕</button>
  </div>
  <div id="prototype-help-body" class="help-popover-body"></div>
</div>
<script>
const STORE_KEY='mars-ui-nonunique-hosts-v3';
let state=demoState();
let activeSection='hosts',hostView='connected',showHostsWithoutServices=false;
let selectedHostIds=new Set(),attachServiceIds=new Set(),attachHostId=null,bulkAttachServiceIds=new Set(),collectionServicePickerIds=new Set();
let hostDraft={mode:'manual',catalogId:'',selectedServiceIds:[],editingId:null,ownerGroupId:'',cloneFromId:null};
let collectionDraft={id:null,name:'',description:'',ownerGroupId:'',serviceIds:[],originalServiceIds:[]};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const q=v=>"'"+String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";const uid=p=>p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);const now=()=>new Date().toLocaleString('ru-RU',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function openModal(title,sub,body,foot,small=false){$('modal-title').textContent=title;$('modal-sub').textContent=sub||'';$('modal-body').innerHTML=body;$('modal-foot').innerHTML=foot||'<button onclick="closeModal()">Закрыть</button>';$('modal').classList.toggle('small',small);$('modal-wrap').classList.add('show')}

function normalizeState(s){const d=demoState(),n={...d,...s};n.users=n.users||d.users;n.groups=n.groups||d.groups;n.proxyGroups=n.proxyGroups||d.proxyGroups;n.catalogHosts=n.catalogHosts||d.catalogHosts;n.catalogSources=n.catalogSources||d.catalogSources;n.services=n.services||d.services;n.templates=n.templates||d.templates;n.collections=(n.collections||d.collections).map(c=>({...c,serviceIds:(c.serviceIds||[]).filter(id=>n.services.some(s=>s.id===id))}));n.hosts=(n.hosts||d.hosts).map(h=>({...h,collectionLinks:h.collectionLinks||[],attachments:(h.attachments||[]).map(a=>({...a,direct:a.direct===undefined?true:!!a.direct,collectionIds:a.collectionIds||[]}))}));if(!n.users.some(u=>u.id===n.currentUserId))n.currentUserId=n.users[0].id;return reconcileCollections(n)}
function reconcileCollections(n){n.hosts.forEach(h=>{const linked=new Set((h.collectionLinks||[]).map(l=>l.collectionId));h.attachments=(h.attachments||[]).map(a=>({...a,collectionIds:(a.collectionIds||[]).filter(cid=>linked.has(cid)&&n.collections.some(c=>c.id===cid))}));(h.collectionLinks||[]).forEach(link=>{const c=n.collections.find(x=>x.id===link.collectionId);if(!c)return;c.serviceIds.forEach(sid=>{let a=h.attachments.find(x=>x.serviceId===sid&&x.attachedByGroupId===c.ownerGroupId);if(a){if(!a.collectionIds.includes(c.id))a.collectionIds.push(c.id)}else h.attachments.push({id:uid('att'),serviceId:sid,attachedByGroupId:c.ownerGroupId,attachedByUserId:link.attachedByUserId,attachedAt:link.attachedAt||now(),portOverride:null,direct:false,collectionIds:[c.id]})})});h.attachments=h.attachments.filter(a=>a.direct||(a.collectionIds||[]).length)});return n}
function loadState(){try{state=localStorage.getItem(STORE_KEY)?normalizeState(JSON.parse(localStorage.getItem(STORE_KEY))):demoState()}catch(e){state=demoState()}saveState()}function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}function resetDemo(){localStorage.removeItem(STORE_KEY);state=normalizeState(demoState());selectedHostIds.clear();showHostsWithoutServices=false;saveState();renderAll();toast('Демо-данные сброшены')}
function currentUser(){return state.users.find(u=>u.id===state.currentUserId)||state.users[0]}function userById(id){return state.users.find(u=>u.id===id)}function groupById(id){return state.groups.find(g=>g.id===id)}function serviceById(id){return state.services.find(s=>s.id===id)}function templateById(id){return state.templates.find(t=>t.id===id)}function collectionById(id){return state.collections.find(c=>c.id===id)}function isAdmin(){return !!currentUser().isAdmin}function userGroupIds(){return new Set(currentUser().groups||[])}function hasMonitoringPermission(gid){return isAdmin()||!!currentUser().permissions?.[gid]?.includes('monitoring.manage')}function canManageService(s){return !!s&&hasMonitoringPermission(s.ownerGroupId)}function canManageTemplate(t){return !!t&&hasMonitoringPermission(t.ownerGroupId)}function canManageCollection(c){return !!c&&hasMonitoringPermission(c.ownerGroupId)}function visibleCollections(){return isAdmin()?state.collections:state.collections.filter(c=>userGroupIds().has(c.ownerGroupId))}function canAttachService(s){return canManageService(s)}function canDetach(a){return !!a&&hasMonitoringPermission(a.attachedByGroupId)}function isManualHost(h){return !!h&&h.sourceType!=='catalog'}function isCreatorGroupUser(h){return !!h?.ownerGroupId&&(isAdmin()||(userGroupIds().has(h.ownerGroupId)&&hasMonitoringPermission(h.ownerGroupId)))}function canEditHost(h){return !!h&&isManualHost(h)&&(isAdmin()||isCreatorGroupUser(h))}function canCloneHost(h){return canEditHost(h)}function canDeleteHost(h){return !!h&&(isAdmin()||(isManualHost(h)&&isCreatorGroupUser(h)&&h.attachments.length===0))}function hostDeleteReason(h){if(!h)return'Хост не найден';if(isAdmin())return'';if(!isManualHost(h))return'Хосты из справочника обычный пользователь удалить не может.';if(!isCreatorGroupUser(h))return'Удалить ручной хост могут создатель и его одногрупники с permission «Постановка на мониторинг».';if(h.attachments.length)return`Сначала отсоедините все сервисы. На хосте осталось подключений: ${h.attachments.length}.`;return''}
function sourceLabel(h){return h.sourceType==='catalog'?'Справочник':h.sourceType==='manual-prefill'?'Ручной · prefill':'Ручной'}function sourceBadge(h){return h.sourceType==='catalog'?'<span class="badge b-violet">📚 Справочник</span>':h.sourceType==='manual-prefill'?'<span class="badge b-amber">📋 Ручной · prefill</span>':'<span class="badge b-blue">✍️ Ручной</span>'}function addressBadge(h){return h.addressType==='fqdn'?'<span class="badge b-green">FQDN</span>':'<span class="badge b-blue">IP</span>'}function proxyName(id){return state.proxyGroups.find(x=>x.id===id)?.name||id}function findAttachment(h,sid,gid){return(h.attachments||[]).find(a=>a.serviceId===sid&&a.attachedByGroupId===gid)}function hasDirectService(h,sid,gid){return !!findAttachment(h,sid,gid)?.direct}function ownAttachments(h){return(h.attachments||[]).filter(a=>isAdmin()||userGroupIds().has(a.attachedByGroupId))}function isOwnedForUser(h){return isManualHost(h)&&h.ownerGroupId&&(isAdmin()||userGroupIds().has(h.ownerGroupId))}function visibleHostCollections(h){return(h.collectionLinks||[]).filter(l=>isAdmin()||userGroupIds().has(l.attachedByGroupId)).map(l=>collectionById(l.collectionId)).filter(Boolean)}
function switchSection(sec){activeSection=sec;document.querySelectorAll('#product-monitoring .section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('#product-monitoring .tab').forEach(s=>s.classList.remove('active'));$('section-'+sec).classList.add('active');$('nav-'+sec).classList.add('active');renderAll()}function switchUser(id){state.currentUserId=id;selectedHostIds.clear();saveState();renderAll();renderRegistry();renderAdmin();renderProductSidebar()}function renderAll(){renderUserSwitcher();renderHosts();renderServices();renderTemplates();renderCollections();renderAccess()}function renderUserSwitcher(){$('current-user').innerHTML=state.users.map(u=>`<option value="${esc(u.id)}" ${u.id===state.currentUserId?'selected':''}>${esc(u.name)}${u.isAdmin?' · admin':''}</option>`).join('');$('avatar').textContent=currentUser().initials||'U'}function page(sec,title,sub,actions,body){$('section-'+sec).innerHTML=`<div class="page-head"><div><h1 class="title">${title}</h1><div class="sub">${sub||''}</div></div><div class="actions">${actions||''}</div></div>${body}`}
function connectedHosts(){return state.hosts.filter(h=>ownAttachments(h).length||(isOwnedForUser(h)&&h.attachments.length)||(showHostsWithoutServices&&isOwnedForUser(h)&&!h.attachments.length))}function catalogHosts(){return state.hosts.filter(h=>h.sourceType==='catalog')}
function renderHosts(){const arr=hostView==='catalog'?catalogHosts():connectedHosts();const without=state.hosts.filter(h=>isOwnedForUser(h)&&!h.attachments.length).length;const canCreate=isAdmin()||[...userGroupIds()].some(hasMonitoringPermission);page('hosts',hostView==='catalog'?'Хосты из справочника':'Подключённые хосты',hostView==='catalog'?'Синхронизируемые хосты внешнего справочника.':'Хосты с мониторингом ваших групп и ручные Host вашей группы.',`<button class="outline" onclick="resetDemo()">↺ Сбросить демо</button>`,`<div class="panel"><div class="host-switch"><button class="${hostView==='connected'?'active':''}" onclick="hostView='connected';renderHosts()">🔗 Подключённые хосты</button><button class="${hostView==='catalog'?'active':''}" onclick="hostView='catalog';renderHosts()">📚 Хосты из справочника</button></div><div class="info">${hostView==='connected'?'<b>Механика сохранена:</b> ручной Host может существовать без сервисов; коллекции являются desired-state и не создают дублей Host-Service.':'<b>Каталог:</b> поля справочных Host обновляются синхронизацией.'}</div><div class="toolbar"><div class="actions">${hostView==='connected'?`<label class="badge ${showHostsWithoutServices?'b-amber':''}" style="cursor:pointer"><input class="checkbox" type="checkbox" ${showHostsWithoutServices?'checked':''} onchange="showHostsWithoutServices=this.checked;renderHosts()"> Показывать хосты без сервисов${without?` · ${without}`:''}</label>`:''}</div><div class="actions">${selectedHostIds.size?`<span class="muted">Выбрано: <b>${selectedHostIds.size}</b></span><button class="sm outline" onclick="openBulkAttachModal()">＋ Сервис</button><button class="sm outline" onclick="openBulkCollectionModal()">📦 Коллекция</button>`:''}${hostView==='connected'?`<button ${canCreate?'':'disabled'} onclick="openHostCreateModal()">➕ Создать хост</button>`:'<button class="outline" onclick="syncCatalogHosts()">🔄 Синхронизировать</button>'}</div></div>${renderHostTable(arr)}</div>`) }
function renderHostTable(arr){return`<div class="table-wrap"><table><thead><tr><th></th><th>Host ID</th><th>Имя</th><th>IP / FQDN</th><th>Источник</th><th>CMDB / External ID</th><th>Группа прокси</th><th>Коллекции</th><th>Сервисы моих групп</th><th>Действия</th></tr></thead><tbody>${arr.length?arr.map(h=>`<tr class="data-row" onclick="openHostDetails(${q(h.id)})"><td onclick="event.stopPropagation()"><input class="checkbox" type="checkbox" ${selectedHostIds.has(h.id)?'checked':''} onchange="this.checked?selectedHostIds.add(${q(h.id)}):selectedHostIds.delete(${q(h.id)});renderHosts()"></td><td class="mono"><b>${esc(h.id)}</b></td><td><b>${esc(h.name)}</b></td><td>${addressBadge(h)} <span class="mono">${esc(h.address)}</span></td><td>${sourceBadge(h)}</td><td class="mono">${esc(h.catalogBinding?.externalId||'—')}</td><td>${esc(proxyName(h.proxyGroup))}</td><td><div class="pill-row">${visibleHostCollections(h).map(c=>`<span class="badge b-green">📦 ${esc(c.name)}</span>`).join('')||'<span class="muted">—</span>'}</div></td><td><div class="pill-row">${ownAttachments(h).map(a=>{const s=serviceById(a.serviceId);return`<span class="badge b-blue">${esc(s?.icon||'🔌')} ${esc(s?.name||'')}</span>`}).join('')||'<span class="muted">—</span>'}</div></td><td onclick="event.stopPropagation()"><div class="actions"><button class="xs outline" onclick="openHostDetails(${q(h.id)})">Детали</button>${state.services.some(canAttachService)?`<button class="xs" onclick="openAttachModal(${q(h.id)})">＋ Сервис</button>`:''}${canCloneHost(h)?`<button class="xs outline" onclick="openCloneHost(${q(h.id)})">⧉</button>`:''}${canDeleteHost(h)?`<button class="xs danger" onclick="openDeleteHostModal(${q(h.id)})">🗑️</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="10" class="empty">Хосты не найдены</td></tr>`}</tbody></table></div>`}
function openHostDetails(id){const h=state.hosts.find(x=>x.id===id);if(!h)return;const links=h.collectionLinks||[];openModal(`Хост: ${h.name}`,`${h.id} · ${sourceLabel(h)}`,`${h.sourceType==='catalog'?`<div class="box violet-box"><b>Источник: ${esc(state.catalogSources.find(s=>s.id===h.catalogBinding?.sourceId)?.name||'CMDB')}</b><br>External ID: <span class="mono">${esc(h.catalogBinding?.externalId||'—')}</span></div>`:`<div class="box blue-box"><b>Группа создателя:</b> ${esc(groupById(h.ownerGroupId)?.name||'—')}</div>`}<div class="row"><div class="box"><b>Адрес</b><br>${addressBadge(h)} <span class="mono">${esc(h.address)}</span></div><div class="box"><b>Группа прокси</b><br>${esc(proxyName(h.proxyGroup))}</div></div><h3>Привязанные коллекции</h3>${links.length?links.map(l=>{const c=collectionById(l.collectionId);return`<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c?.name||'')}</div><div class="meta">Desired state · ${c?.serviceIds.length||0} сервисов</div></div></div>${c&&canManageCollection(c)?`<button class="xs outline" onclick="requestUnlinkCollection(${q(h.id)},${q(c.id)})">Отвязать</button>`:''}</div>`}).join(''):'<div class="empty">Нет привязанных коллекций</div>'}<h3>Подключения моих групп</h3>${ownAttachments(h).length?ownAttachments(h).map(a=>attachmentCard(h,a)).join(''):'<div class="empty">Нет подключений</div>'}`,`<button class="ghost" onclick="closeModal()">Закрыть</button>${state.services.some(canAttachService)?`<button class="outline" onclick="openAttachModal(${q(h.id)})">＋ Сервис</button><button class="outline" onclick="openAttachCollectionModal(${q(h.id)})">📦 Коллекция</button>`:''}${canEditHost(h)?`<button class="outline" onclick="openHostEditModal(${q(h.id)})">✏️ Редактировать</button>`:''}${canDeleteHost(h)?`<button class="danger" onclick="openDeleteHostModal(${q(h.id)})">Удалить</button>`:''}`)}
function attachmentCard(h,a){const s=serviceById(a.serviceId),cs=(a.collectionIds||[]).map(collectionById).filter(Boolean),effectivePort=a.portOverride??s?.defaultPort??'—';return`<div class="card"><div class="card-main"><span class="icon">${esc(s?.icon||'🔌')}</span><div><div class="card-title">${esc(s?.name||'')}</div><div class="meta">Группа: <b>${esc(groupById(a.attachedByGroupId)?.name||'—')}</b> · Target: <span class="mono">${esc(h.address)}:${esc(effectivePort)}</span></div><div class="pill-row">${a.direct?'<span class="badge b-blue">Самостоятельно</span>':''}${cs.map(c=>`<span class="badge b-green">📦 ${esc(c.name)}</span>`).join('')}${a.portOverride!==null&&a.portOverride!==undefined?`<span class="badge b-amber">Порт переопределён: ${esc(a.portOverride)}</span>`:`<span class="badge">Порт сервиса: ${esc(s?.defaultPort??'—')}</span>`}</div></div></div><div class="actions">${canDetach(a)?`<button class="xs outline" onclick="openAttachmentPortModal(${q(h.id)},${q(a.id)})">Порт: ${esc(effectivePort)}</button>`:''}${a.direct&&canDetach(a)?`<button class="xs danger" onclick="detachAttachment(${q(h.id)},${q(a.id)})">Отвязать</button>`:''}</div></div>`}

function ensureRegistryObjectSourceRaw(o){
 if(!o||o.source==='Manual'||!o.externalId)return;
 if(!o.sourceRaw||typeof o.sourceRaw!=='object')o.sourceRaw={};
 const collection=registryCurrentCollectionForType(o.type);
 const m=collection?registryEnsureMapping(o.type,collection,registryAssignedSource(o.type)):null;

 // Preserve same-name fields that are already present in the logical external snapshot.
 Object.entries(o.raw||{}).forEach(([k,v])=>{
   if(o.sourceRaw[k]===undefined)o.sourceRaw[k]=v
 });

 if(m){
   // First reconstruct source fields we already know from External ID and
   // ordinary attribute mappings. Only then resolve the field used as name.
   if(m.externalIdField&&o.sourceRaw[m.externalIdField]===undefined)o.sourceRaw[m.externalIdField]=o.externalId;
   Object.entries(m.attrs||{}).forEach(([attrId,sourceField])=>{
     if(!sourceField||o.sourceRaw[sourceField]!==undefined)return;
     if(o.raw?.[sourceField]!==undefined)o.sourceRaw[sourceField]=o.raw[sourceField];
     else if(o.raw?.[attrId]!==undefined)o.sourceRaw[sourceField]=o.raw[attrId];
     else if(o.values?.[attrId]!==undefined)o.sourceRaw[sourceField]=o.values[attrId]
   });
   if(m.objectNameField&&o.sourceRaw[m.objectNameField]===undefined){
     const direct=o.raw?.[m.objectNameField];
     const inverse=Object.entries(m.attrs||{}).find(([,sourceField])=>sourceField===m.objectNameField);
     const mappedValue=inverse?(o.raw?.[inverse[0]]!==undefined?o.raw[inverse[0]]:o.values?.[inverse[0]]):undefined;
     o.sourceRaw[m.objectNameField]=direct!==undefined?direct:(mappedValue!==undefined?mappedValue:(o.raw?.name!==undefined?o.raw.name:o.name))
   }
 }
}

function registrySourceFieldValue(o,type,sourceField){

 if(o.sourceRaw&&o.sourceRaw[sourceField]!==undefined)return o.sourceRaw[sourceField];
 if(o.raw&&o.raw[sourceField]!==undefined)return o.raw[sourceField];

 const collection=registryCurrentCollectionForType(type);
 const m=collection?registryEnsureMapping(type,collection,registryAssignedSource(type)):null;
 if(m){
   const pair=Object.entries(m.attrs||{}).find(([,field])=>field===sourceField);
   if(pair){
     const attrId=pair[0];

   o.raw.name=newExternalName;

   // Manual name remains effective if it exists.
   const effectiveName=o.manual?.name!==undefined?String(o.manual.name):newExternalName;
   const duplicate=registry.objects.find(x=>x.id!==o.id&&x.type===type&&x.name===effectiveName);
   if(duplicate){
     o.mappingConflict={kind:'name',value:effectiveName,conflictObjectId:duplicate.id,sourceField};
     conflicts++;return
   }

   delete o.mappingConflict;
   const oldName=o.name;
   o.name=effectiveName;
   if(oldName!==o.name){
     registryUpdateRelationNameReferences(type,oldName,o.name);
     updated++
   }
 });
 return{updated,skipped,conflicts}
}

function registrySerializableState(){
 return{
   version:REGISTRY_STORE_VERSION,
   objects:registry.objects,
   objectTypes,
   relationTypes,
   relationRules,
   sourceTypes:registrySourceTypes,
   sources:registrySources,
   sourceSyncSettings:registrySourceSyncSettings,
   sourceCollections:registrySourceCollections,
   collectionAssignments:registryCollectionAssignments,
   mappings:registryMappings,
   syncSelection:registrySyncSelection
 }
}
const DEFAULT_REGISTRY_PROTOTYPE_STATE=JSON.parse(JSON.stringify(registrySerializableState()));

function applyRegistryPrototypeState(s){
 if(!s||typeof s!=='object')return;
 if(Array.isArray(s.objects))registry.objects=s.objects;
 if(s.objectTypes&&typeof s.objectTypes==='object'){
   Object.keys(objectTypes).forEach(k=>delete objectTypes[k]);
   Object.entries(s.objectTypes).forEach(([k,v])=>objectTypes[k]=v)
 }
 if(Array.isArray(s.relationTypes)){
   relationTypes=s.relationTypes.map(t=>({id:t.id,name:t.name,description:t.description||''}))
 }
 if(Array.isArray(s.relationRules)){
   relationRules=s.relationRules.map(r=>{
     const cardinality=r.cardinality||(r.multiplicity==='one'?'N:1':'N:M');
     const copy={...r,cardinality};
     delete copy.multiplicity;
     return copy
   })
 }
 if(Array.isArray(s.sources))registrySources=s.sources;
 if(s.sourceSyncSettings&&typeof s.sourceSyncSettings==='object')registrySourceSyncSettings=s.sourceSyncSettings;
 if(s.sourceCollections&&typeof s.sourceCollections==='object')registrySourceCollections=s.sourceCollections;
 // Migration from v5 / earlier single-source state.
 if(s.syncSettings&&typeof s.syncSettings==='object'&&!s.sourceSyncSettings)registrySourceSyncSettings['galaxy-main']={...registrySyncSettingsFor('galaxy-main'),...s.syncSettings};
 if(Array.isArray(s.cmdbCollections)&&!s.sourceCollections)registrySourceCollections['galaxy-main']=s.cmdbCollections;
 if(s.collectionAssignments&&typeof s.collectionAssignments==='object'){
   registryCollectionAssignments={};
   Object.entries(s.collectionAssignments).forEach(([type,v])=>{
     registryCollectionAssignments[type]=typeof v==='string'?{sourceId:'galaxy-main',collectionId:v}:v
   })
 }
 if(s.mappings&&typeof s.mappings==='object')registryMappings=s.mappings;
 if(s.syncSelection&&typeof s.syncSelection==='object')registrySyncSelection={...registrySyncSelection,...s.syncSelection};
 if(!registrySources.some(x=>x.id===registrySyncSelection.sourceId))registrySyncSelection.sourceId=registrySources[0]?.id||'';
 refreshSelectedSourceCollections()
}
function normalizeRelationModel(){
 relationTypes=relationTypes.map(t=>({id:t.id,name:t.name,description:t.description||''}));
 relationRules=relationRules.map(r=>{
   const x={...r,cardinality:r.cardinality||(r.multiplicity==='one'?'N:1':'N:M')};
   delete x.multiplicity;
   return x
 });
 // dir remains tolerated in old persisted demo relations, but is no longer semantically used.
}

function saveRegistryPrototypeState(){
 try{
   localStorage.setItem(REGISTRY_STORE_KEY,JSON.stringify(registrySerializableState()));
   const el=$('registry-save-indicator');
   if(el)el.innerHTML='💾 Сохранено локально'
 }catch(e){console.warn('Registry prototype save failed',e)}
}
function loadRegistryPrototypeState(){
 try{
   const raw=localStorage.getItem(REGISTRY_STORE_KEY);
   if(!raw)return;
   const saved=JSON.parse(raw);
   applyRegistryPrototypeState(saved)
 }catch(e){console.warn('Registry prototype load failed',e)}
}
function resetRegistryPrototypeState(){
 if(!isAdmin())return toast('Недостаточно прав');
 localStorage.removeItem(REGISTRY_STORE_KEY);
 applyRegistryPrototypeState(JSON.parse(JSON.stringify(DEFAULT_REGISTRY_PROTOTYPE_STATE)));
 closeModal();renderRegistry();renderAdmin();renderProductSidebar();saveRegistryPrototypeState();toast('Демо-данные реестра сброшены')
}
function confirmResetRegistryPrototypeState(){
 openModal('Сбросить данные прототипа','Будут удалены локально сохранённые изменения Реестра объектов мониторинга.',`
   <div class="box red-box"><b>Будут восстановлены исходные демо-данные:</b><br>объекты, типы объектов, mapping, выбранные коллекции, параметры синхронизации, типы и правила связей.</div>
   <div class="hint">Механика и данные раздела «Постановка на мониторинг» этим действием не затрагиваются.</div>
 `,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="resetRegistryPrototypeState()">Сбросить</button>`,true)
}

 $('prototype-help-version').textContent=`Версия логики: ${PROTOTYPE_HELP_VERSION}`;

 const rules=prototypeHelpValue(h.constraints)||[];
 $('prototype-help-body').innerHTML=`<p>${esc(body)}</p>${rules.length?`<div class="help-rule"><b>Логика / ограничения</b><ul>${rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}`;
 pop.classList.add('show');
 const r=event?.currentTarget?.getBoundingClientRect?.();
 const w=Math.min(440,window.innerWidth-28),hgt=Math.min(pop.scrollHeight||340,620);

}
function hidePrototypeHelp(){$('prototype-help-popover')?.classList.remove('show')}
document.addEventListener('click',e=>{if(!e.target.closest('.help-popover')&&!e.target.closest('.help-tip'))hidePrototypeHelp()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePrototypeHelp()});


function registryAttrLabel(type,id){return(objectTypes[type]||[]).find(a=>a.id===id)?.label||id}
function registryEffectiveValue(o,id){return id==='name'?o.name:o.values?.[id]}
function registryIsOverride(o,id){return o.manual?.[id]!==undefined&&o.raw?.[id]!==undefined&&String(o.manual[id])!==String(o.raw[id])}
function registryEndpoint(o){if(o.type!=='Host')return'—';return o.values?.fqdn||o.values?.ip||'—'}
function registrySourceKind(o){return o.source==='Manual'?'manual':'external'}
function registryRelationNames(){return[...new Set(registry.objects.flatMap(o=>(o.relations||[]).map(r=>r.type)))].sort((a,b)=>a.localeCompare(b,'ru'))}
function registryEnvironments(){return[...new Set(registry.objects.map(o=>o.values?.environment).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'))}
function registryObjectByRelation(type,name){return registry.objects.find(o=>o.type===type&&o.name===name)}

function renderRegistry(){
 const qv=registry.search.toLowerCase();
 const arr=registry.objects.filter(o=>{
  const bag=[o.name,o.type,registryEndpoint(o),o.values?.environment,o.source,o.externalId,...Object.values(o.values||{}),(o.relations||[]).map(r=>r.object).join(' ')].join(' ').toLowerCase();
  return(registry.type==='all'||o.type===registry.type)&&(registry.source==='all'||registrySourceKind(o)===registry.source)&&(registry.environment==='all'||o.values?.environment===registry.environment)&&(registry.relation==='all'||(o.relations||[]).some(r=>r.type===registry.relation))&&(!qv||bag.includes(qv));
 });
 const envs=registryEnvironments(),rels=registryRelationNames();
 $('registry-main').innerHTML=`<div class="page-head"><div><h1 class="title">Реестр объектов мониторинга ${tip('nav.registry')}</h1><div class="sub">Пользовательский раздел: поиск объектов, effective-атрибуты и навигация по связям.</div></div><div class="actions"><span id="registry-save-indicator" class="persistence-indicator">💾 Сохраняется локально ${tip('persistence')}</span></div></div><div class="panel"><div class="info"><b>Раздел доступен для просмотра и навигации.</b> Создание объектов и изменение Manual/Override выполняются администратором в «Администрирование → Настройки реестра объектов мониторинга → Объекты».</div><div class="toolbar"><div class="registry-filters"><input id="reg-search" class="input" value="${esc(registry.search)}" placeholder="Имя, IP/FQDN, External ID…"><select id="reg-type"><option value="all">Все типы</option>${Object.keys(objectTypes).map(t=>`<option value="${t}" ${registry.type===t?'selected':''}>${t}</option>`).join('')}</select><select id="reg-source"><option value="all">Все источники</option><option value="external" ${registry.source==='external'?'selected':''}>Внешний источник</option><option value="manual" ${registry.source==='manual'?'selected':''}>Manual</option></select><select id="reg-env"><option value="all">Все окружения</option>${envs.map(v=>`<option value="${esc(v)}" ${registry.environment===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="reg-rel"><option value="all">Любые связи</option>${rels.map(v=>`<option value="${esc(v)}" ${registry.relation===v?'selected':''}>Связь: ${esc(v)}</option>`).join('')}</select><button class="sm outline" onclick="resetRegistryFilters()">Сбросить</button></div></div><div class="stats"><div class="stat"><label>Всего объектов</label><b>${registry.objects.length}</b></div><div class="stat"><label>После фильтра</label><b>${arr.length}</b></div><div class="stat"><label>С внешним источником</label><b>${registry.objects.filter(o=>o.source!=='Manual').length}</b></div><div class="stat"><label>С ручным override</label><b>${registry.objects.filter(o=>Object.keys(o.manual||{}).some(k=>registryIsOverride(o,k))).length}</b></div></div><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Тип</th><th>IP / FQDN</th><th>Окружение</th><th>Источник</th><th>Связи</th><th>Состояние</th></tr></thead><tbody>${arr.length?arr.map(o=>`<tr class="data-row" onclick="openRegistryObject(${q(o.id)},'overview')"><td><div class="registry-object-name">${esc(o.name)}</div></td><td><span class="badge b-blue">${esc(o.type)}</span></td><td class="mono">${esc(registryEndpoint(o))}</td><td>${o.values?.environment?`<span class="badge">${esc(o.values.environment)}</span>${registryIsOverride(o,'environment')?' <span class="badge b-amber">Переопределено</span>':''}`:'<span class="muted">—</span>'}</td><td>${o.source==='Manual'?'<span class="badge">✍️ Manual</span>':`<span class="badge b-violet">📚 ${esc(o.source)}</span>`}</td><td><span class="badge b-green">🔗 ${(o.relations||[]).length}</span></td><td><span class="badge ${o.lifecycle==='active'?'b-green':'b-amber'}">${o.lifecycle==='active'?'Активен':'Архив'}</span></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Объекты не найдены</td></tr>`}</tbody></table></div></div>`;
 $('reg-search').oninput=e=>{registry.search=e.target.value;renderRegistry()};$('reg-type').onchange=e=>{registry.type=e.target.value;renderRegistry()};$('reg-source').onchange=e=>{registry.source=e.target.value;renderRegistry()};$('reg-env').onchange=e=>{registry.environment=e.target.value;renderRegistry()};$('reg-rel').onchange=e=>{registry.relation=e.target.value;renderRegistry()};
}
function resetRegistryFilters(){registry.search='';registry.type='all';registry.source='all';registry.environment='all';registry.relation='all';renderRegistry()}

function registryCardTabs(id,tab){return`<div class="registry-card-tabs"><button class="${tab==='overview'?'active':''}" onclick="openRegistryObject(${q(id)},'overview')">Обзор</button><button class="${tab==='attributes'?'active':''}" onclick="openRegistryObject(${q(id)},'attributes')">Атрибуты</button><button class="${tab==='relations'?'active':''}" onclick="openRegistryObject(${q(id)},'relations')">Связи</button><button class="${tab==='sources'?'active':''}" onclick="openRegistryObject(${q(id)},'sources')">Источники</button></div>`}
function openRegistryObject(id,tab='overview'){
 const o=registry.objects.find(x=>x.id===id);if(!o)return;registry.cardTab=tab;
 let body=registryCardTabs(id,tab);
 if(tab==='overview')body+=renderRegistryOverview(o);
 if(tab==='attributes')body+=renderRegistryAttributes(o,false);
 if(tab==='relations')body+=renderRegistryRelations(o);
 if(tab==='sources')body+=renderRegistrySources(o);
 openModal(`${o.type}: ${o.name}`,`${o.id}${o.externalId?' · External ID: '+o.externalId:''}`,body,`<button onclick="closeModal()">Закрыть</button>`);
}
function renderRegistryOverview(o){
 const key=(objectTypes[o.type]||[]).filter(a=>a.id!=='name').slice(0,6);
 return`<div class="box blue-box"><b>${esc(o.name)}</b> · <span class="mono">${esc(o.id)}</span><br><span class="hint">object_id — постоянная идентичность объекта MARS.</span></div><div class="registry-summary"><div class="box"><b>Тип</b><br><span class="badge b-blue">${esc(o.type)}</span></div><div class="box"><b>Источник объекта</b><br>${o.source==='Manual'?'<span class="badge">✍️ Manual</span>':`<span class="badge b-violet">📚 ${esc(o.source)}</span>`}</div><div class="box"><b>Связи</b><br><span class="badge b-green">🔗 ${(o.relations||[]).length}</span></div></div><h3>Ключевые effective-значения</h3><div class="grid3cards">${key.map(a=>{const v=registryEffectiveValue(o,a.id);return`<div class="box"><b>${esc(a.label)}</b><br><span class="effective-main">${esc(v||'—')}</span>${registryIsOverride(o,a.id)?'<div class="effective-note"><span class="badge b-amber">Переопределено вручную</span> · Galaxy: '+esc(o.raw[a.id])+'</div>':''}</div>`}).join('')}</div>${(o.relations||[]).length?`<h3>Контекст по связям</h3>${renderRelationCards(o.relations.slice(0,3))}`:''}`;
}
function renderRegistryAttributes(o,adminMode=false){const attrs=objectTypes[o.type]||[];return`<div class="table-wrap" style="max-height:none"><table><thead><tr><th>Атрибут</th><th>Effective value</th><th>Источник effective</th><th>${adminMode?'Управление':'Исходное значение'}</th></tr></thead><tbody>${attrs.map(a=>{const eff=registryEffectiveValue(o,a.id),m=o.manual?.[a.id],x=o.raw?.[a.id],ov=registryIsOverride(o,a.id),hasExternal=x!==undefined;let src=ov?'<span class="badge b-amber">Переопределено вручную</span>':m!==undefined?'<span class="badge">Manual</span>':hasExternal?`<span class="badge b-violet">${esc(o.source)}</span>`:'<span class="muted">—</span>';let last=adminMode?renderRegistryAttrAdminActions(o,a,m,x,ov):hasExternal?`<span class="mono">${esc(x)}</span>${ov?`<div class="cell-sub">Manual: ${esc(m)}</div>`:''}`:'<span class="muted">—</span>';return`<tr><td><b>${esc(a.label)}</b><div class="cell-sub mono">${esc(a.id)}</div></td><td><span class="effective-main">${esc(eff||'—')}</span></td><td>${src}</td><td>${last}</td></tr>`}).join('')}</tbody></table></div>`}
function renderRegistryAttrAdminActions(o,a,m,x,ov){
 if(x!==undefined){return`<div class="registry-attr-actions">${ov?`<button class="xs outline" onclick="openRegistryValueEdit(${q(o.id)},${q(a.id)})">Изменить override</button><button class="xs danger" onclick="removeRegistryOverride(${q(o.id)},${q(a.id)})">Удалить override</button>`:`<button class="xs outline" onclick="openRegistryValueEdit(${q(o.id)},${q(a.id)})">Переопределить вручную ${tip('registry.override')}</button>`}</div>`}
 return`<button class="xs outline" onclick="openRegistryValueEdit(${q(o.id)},${q(a.id)})">${m!==undefined?'Изменить Manual':'Задать вручную'}</button>`;
}
function renderRegistryRelations(o){
 const rels=o.relations||[];
 return`<div class="box blue-box"><b>Связи ненаправленные.</b> ${tip('relations.rules')} Название типа связи показывается одинаково с обеих сторон. Нажмите на связанный объект, чтобы открыть его карточку.</div><h3>Связи</h3>${rels.length?renderRelationCards(rels):'<div class="empty">Связей нет</div>'}`
}
function renderRelationCards(list){return list.map(r=>{const target=registryObjectByRelation(r.objectType,r.object);return`<div class="card registry-relation" ${target?`onclick="openRegistryObject(${q(target.id)},'overview')"`:''}><div class="card-main"><span class="icon">🔗</span><div><div class="card-title">${esc(r.object)}</div><div class="meta"><span class="badge b-blue">${esc(r.objectType)}</span> · <b>${esc(r.type)}</b><br>Правило: ${esc(r.rule)}</div></div></div>${target?'<button class="xs outline">Открыть</button>':'<span class="badge b-amber">Объект не найден</span>'}</div>`}).join('')}
function renderRegistrySources(o){const attrs=objectTypes[o.type]||[];const ext=attrs.filter(a=>o.raw?.[a.id]!==undefined),man=attrs.filter(a=>o.manual?.[a.id]!==undefined);return`${o.identityNote?`<div class="box blue-box"><b>Идентичность сохранена:</b> ${esc(o.identityNote)}</div>`:''}<div class="registry-summary"><div class="box"><b>Основной источник</b><br>${o.source==='Manual'?'<span class="badge">Manual</span>':`<span class="badge b-violet">${esc(o.source)}</span>`}</div><div class="box"><b>External ID</b><br><span class="mono">${esc(o.externalId||'—')}</span></div><div class="box"><b>Последняя синхронизация</b><br>${esc(o.lastSync||'—')}</div></div><h3>Внешние значения</h3>${ext.length?ext.map(a=>`<div class="registry-source-row"><b>${esc(a.label)}</b><div><span class="mono">${esc(o.raw[a.id])}</span>${registryIsOverride(o,a.id)?' <span class="badge b-amber">не effective</span>':''}</div></div>`).join(''):'<div class="empty">Внешний источник не подключён</div>'}<h3>Ручные значения</h3>${man.length?man.map(a=>`<div class="registry-source-row"><b>${esc(a.label)}</b><div><span class="mono">${esc(o.manual[a.id])}</span>${registryIsOverride(o,a.id)?' <span class="badge b-amber">Override / Effective</span>':' <span class="badge">Manual</span>'}</div></div>`).join(''):'<div class="empty">Ручных значений нет</div>'}`}

/* Администрирование */
function renderAdmin(){
 const sectionTitle=adminTab==='data'?'Сбор данных':'Настройки реестра объектов мониторинга';
 const sectionSub=adminTab==='data'?'Административные настройки, относящиеся к постановке на мониторинг.':'Модель объектов, синхронизация Galaxy / CMDB, mapping и правила формирования связей.';
 if(!isAdmin()){$('admin-main').innerHTML=`<div class="page-head"><div><h1 class="title">${sectionTitle}</h1><div class="sub">Администрирование MARS.</div></div></div><div class="panel"><div class="content"><div class="box red-box"><b>Доступ только для администратора MARS.</b><br>Текущий пользователь: ${esc(currentUser().name)}.</div></div></div>`;return}
 const content=adminTab==='data'?renderDataAdmin():renderRegistrySettings();
 $('admin-main').innerHTML=`<div class="page-head"><div><h1 class="title">${sectionTitle}</h1><div class="sub">${sectionSub}</div></div></div><div class="panel">${content}</div>`
}
function renderDataAdmin(){return`<div class="info"><b>Сбор данных — административная часть постановки на мониторинг.</b> Пользовательская механика раздела «Постановка на мониторинг» остаётся отдельно и не меняется.</div><div class="content"><div class="grid3cards"><div class="card"><div class="card-main"><span class="icon">📚</span><div><div class="card-title">Источники инфраструктурных данных</div><div class="meta">CMDB Main</div></div></div></div><div class="card"><div class="card-main"><span class="icon">🌐</span><div><div class="card-title">Группы прокси</div><div class="meta">Production DMZ · Analytics · K8s</div></div></div></div><div class="card"><div class="card-main"><span class="icon">🔄</span><div><div class="card-title">Синхронизация справочника</div><div class="meta">Параметры получения данных для постановки на мониторинг.</div></div></div></div></div><div class="readonly-note" style="margin-top:14px">Этот подраздел не изменяет сценарии Хосты / Сервисы / Шаблоны / Коллекции в пользовательской «Постановке на мониторинг».</div></div>`}
function renderRegistrySettings(){let c='';if(registrySettingsTab==='objects')c=renderAdminObjects();if(registrySettingsTab==='types')c=renderTypeSettings();if(registrySettingsTab==='sync')c=renderSyncSettings();if(registrySettingsTab==='reltypes')c=renderRelationTypeSettings();if(registrySettingsTab==='rules')c=renderRuleSettings();return`<div class="info"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b>Здесь администратор управляет объектами и внутренней моделью реестра MARS.</b> ${tip('admin.registry')}</div><div class="actions"><span id="registry-save-indicator" class="persistence-indicator">💾 Сохраняется локально ${tip('persistence')}</span><button class="xs outline" onclick="confirmResetRegistryPrototypeState()">↺ Сбросить демо-данные</button></div></div></div><div class="inner-tabs"><button class="${registrySettingsTab==='objects'?'active':''}" onclick="registrySettingsTab='objects';renderAdmin()">Объекты ${tip('registry.objects')}</button><button class="${registrySettingsTab==='types'?'active':''}" onclick="registrySettingsTab='types';renderAdmin()">Типы объектов ${tip('types.section')}</button><button class="${registrySettingsTab==='sync'?'active':''}" onclick="registrySettingsTab='sync';renderAdmin()">Источники и синхронизация ${tip('sync.section')}</button><button class="${registrySettingsTab==='reltypes'?'active':''}" onclick="registrySettingsTab='reltypes';renderAdmin()">Типы связей ${tip('relations.types')}</button><button class="${registrySettingsTab==='rules'?'active':''}" onclick="registrySettingsTab='rules';renderAdmin()">Правила связей ${tip('relations.rules')}</button></div>${c}`}
function renderAdminObjects(){return`<div class="toolbar admin-object-toolbar"><div><b>Ручное управление объектами ${tip('registry.objects')}</b><div class="hint">Создание объектов и ручные переопределения доступны только MARS Admin.</div></div><button onclick="openAdminRegistryObjectCreate()">➕ Создать объект ${tip('registry.create')}</button></div><div class="content admin-object-list">${registry.objects.map(o=>`<div class="card"><div class="card-main"><span class="icon">${o.type==='Host'?'🖥️':o.type==='Database'?'🗄️':'📦'}</span><div><div class="card-title">${esc(o.name)}</div><div class="meta"><span class="badge b-blue">${esc(o.type)}</span> · <span class="mono">${esc(o.id)}</span> · ${o.source==='Manual'?'<span class="badge">Manual</span>':`<span class="badge b-violet">${esc(o.source)}</span>`}${Object.keys(o.manual||{}).some(k=>registryIsOverride(o,k))?' · <span class="badge b-amber">Есть override</span>':''}</div></div></div><div class="actions"><button class="xs outline" onclick="openRegistryObject(${q(o.id)},'overview')">Просмотр</button><button class="xs" onclick="openAdminRegistryObject(${q(o.id)})">Управление</button></div></div>`).join('')}</div>`}
function openAdminRegistryObjectCreate(){const type=Object.keys(objectTypes)[0];openModal('Создать объект мониторинга','Только MARS Admin. Объект создаётся с источником Manual.',`<div class="row"><div class="field"><label>Тип объекта *</label><select id="aro-type" class="wide">${Object.keys(objectTypes).map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div><div class="field"><label>Имя *</label><input id="aro-name" class="wide"></div></div><div id="aro-attrs"></div><div class="box blue-box"><b>Manual ≠ Override.</b> Для нового ручного объекта значения имеют источник Manual. Override возникает только если для этого же объекта позже появляется внешнее значение того же атрибута и ручное значение его переопределяет.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveAdminRegistryObject()">Создать</button>`);const render=()=>{$('aro-attrs').innerHTML=`<h3>Атрибуты</h3>${(objectTypes[$('aro-type').value]||[]).filter(a=>a.id!=='name'&&a.identityRole!=='externalId').map(a=>`<div class="field"><label>${esc(a.label)}</label><input class="wide" data-aro-attr="${esc(a.id)}"></div>`).join('')}`};$('aro-type').onchange=render;render()}
function saveAdminRegistryObject(){if(!isAdmin())return toast('Недостаточно прав');const type=$('aro-type').value,name=$('aro-name').value.trim();if(!name)return toast('Введите имя');const existing=registry.objects.find(o=>o.type===type&&o.name.toLowerCase()===name.toLowerCase());if(existing){closeModal();openAdminRegistryObject(existing.id);return toast('Объект с таким name + type уже существует')};const values={},manual={name};document.querySelectorAll('[data-aro-attr]').forEach(i=>{const v=i.value.trim();if(v){values[i.dataset.aroAttr]=v;manual[i.dataset.aroAttr]=v}});const prefix=type==='Host'?'H':type==='InformationSystem'?'IS':type==='Database'?'DB':'APP';registry.objects.push({id:'OBJ-'+prefix+'-'+(100+registry.objects.length),type,name,source:'Manual',externalId:'',lifecycle:'active',lastSync:'',values,raw:{},manual,relations:[]});saveRegistryPrototypeState();closeModal();renderAdmin();renderRegistry();toast('Объект создан')}
function openAdminRegistryObject(id){const o=registry.objects.find(x=>x.id===id);if(!o)return;openModal(`Управление: ${o.name}`,`${o.type} · ${o.id}`,`<div class="box blue-box"><b>Effective value ${tip('registry.effective')}</b> используется в реестре, событиях и последующей маршрутизации. Внешнее значение продолжает храниться и синхронизироваться даже при Manual override.</div>${renderRegistryAttributes(o,true)}<div class="separator"></div><h3>Источники</h3>${renderRegistrySources(o)}`,`<button class="ghost" onclick="closeModal()">Закрыть</button><button class="outline" onclick="openRegistryObject(${q(o.id)},'overview')">Открыть карточку</button>`)}

function ensureTypeAttribute(type,id,label=id,origin='manual',identityRole=''){

 if(!a){
   a={id,label,origin};
   if(identityRole)a.identityRole=identityRole;
   objectTypes[type].push(a)
 }else{
   if(!a.label)a.label=label;

function autoMapCollectionToType(type,collection,onlyMissing=false){
 if(!type||!collection)return;
 const fields=registryCmdbCollectionFields[collection]||[];
 const m=registryEnsureMapping(type,collection,registryAssignedSource(type)||registrySyncSelection.sourceId);
 const nameField=m.objectNameField||collectionDefaultNameField(collection);
 const externalIdField=m.externalIdField||collectionDefaultExternalIdField(collection);
 m.objectNameField=nameField;
 m.externalIdField=externalIdField;

 // name is the MARS object name and is shown in the external attribute list.
 ensureTypeAttribute(type,'name','name','external','name');
 m.objectNameAttrId='name';

 // External ID is source identity. Keep it represented in the model/UI,
 // but exclude it from the manual object form.
 const extAttrId='external_id';
 ensureTypeAttribute(type,extAttrId,'external_id','external','externalId');
 m.externalIdAttrId=extAttrId;

 fields.forEach(field=>{
   if(field===nameField){
     m.objectNameAttrId='name';
     return
   }
   if(field===externalIdField){
     m.externalIdAttrId=extAttrId;
     return
   }
   const alreadyMapped=Object.entries(m.attrs||{}).find(([,sourceField])=>sourceField===field);
   if(onlyMissing&&alreadyMapped)return;
   const attrId=field;
   ensureTypeAttribute(type,attrId,field,'external');
   if(!m.attrs)m.attrs={};
   if(!m.attrs[attrId]||!onlyMissing)m.attrs[attrId]=field
 });
 m.updatedAt=now();m.pending=true
}

function applyPendingMappingsForSelectedSource(){
 ensureAllRegistrySourceRaw();
 const selectedSourceId=registrySyncSelection.sourceId;
 let changedTypes=0,renamed=0,conflicts=0;
 Object.keys(registryCollectionAssignments).forEach(type=>{
   const binding=registryAssignedBinding(type);
   if(!binding.collectionId||binding.sourceId!==selectedSourceId)return;
   const m=registryEnsureMapping(type,binding.collectionId,binding.sourceId);
   if(!m?.pending)return;
   const result=m.objectNameField?applyObjectNameMappingToExistingObjects(type,m.objectNameField):{updated:0,conflicts:0};
   registry.objects.filter(o=>o.type===type&&o.source!=='Manual'&&o.externalId).forEach(o=>{
     ensureRegistryObjectSourceRaw(o);
     Object.entries(m.attrs||{}).forEach(([attrId,sourceField])=>{
       const v=registrySourceFieldValue(o,type,sourceField);
       if(v===undefined)return;
       if(!o.raw)o.raw={};
       o.raw[attrId]=v;
       if(o.manual?.[attrId]===undefined){
         if(!o.values)o.values={};
         o.values[attrId]=v
       }
     })
   });
   m.pending=false;m.lastAppliedAt=now();
   changedTypes++;renamed+=result.updated||0;conflicts+=result.conflicts||0
 });
 return{changedTypes,renamed,conflicts}
}

function findEquivalentRelationRule(candidate,excludeId=''){
 const cLeft=relationRuleEndpoint(candidate.sourceType,candidate.sourceAttr);
 const cRight=relationRuleEndpoint(candidate.targetType,candidate.targetAttr);

 for(const r of relationRules){
   if(r.id===excludeId||r.relationTypeId!==candidate.relationTypeId||r.operator!==candidate.operator)continue;
   const rLeft=relationRuleEndpoint(r.sourceType,r.sourceAttr);
   const rRight=relationRuleEndpoint(r.targetType,r.targetAttr);

   if(rLeft===cLeft&&rRight===cRight){
     return{rule:r,mode:'same',expectedCardinality:r.cardinality||'N:M'}
   }

   // "=" is symmetric: A=B and B=A describe the same matching condition.
   if(candidate.operator==='='&&rLeft===cRight&&rRight===cLeft){
     return{rule:r,mode:'inverse',expectedCardinality:inverseCardinality(r.cardinality||'N:M')}
   }
 }
 return null
}

 const r=duplicate.rule;

   :`Кардинальность отличается (${attempted} вместо ${existingShown}), но это не создаёт новое правило — измените существующее.`;

 el.innerHTML=`<div class="box amber-box">

 if(!hasGroups())return page(sec,sec==='hosts'?'Хосты':sec==='services'?'🔌 Сервисы':sec==='templates'?'🧩 Шаблоны сервисов':sec==='collections'?'📦 Коллекции':'👥 Доступ','', '', `<div class="panel"><div class="empty"><h3>Вы не состоите в группах</h3><p>Перейдите в раздел «Управление доступом» для вступления в группу.</p><button onclick="switchSection('access')">Перейти в Управление доступом</button></div></div>`);
 if(monitoringGloballyBlocked()&&sec!=='access')return page(sec,'Постановка на мониторинг','Глобальные настройки сборщиков отсутствуют','',`<div class="panel"><div class="empty"><h3>Необходимо заполнить глобальные настройки</h3><p>Ни для одного типа сервиса не настроены глобальные параметры. Обратитесь к администраторам системы.</p>${isAdmin()?'<button onclick="openAdminSection(\'data\');monUi.dataTab=\'settings\';renderAdmin()">Перейти в Сбор данных</button>':''}</div></div>`);
 render();
}
function roNote(){return !hasAnyMonitoringPermission()?'<div class="info"><b>Режим только просмотра.</b> У пользователя нет права «Постановка на мониторинг».</div>':''}
function paginate(arr,page,size=MONITORING_PAGE_SIZE){const pages=Math.max(1,Math.ceil(arr.length/size));page=Math.min(Math.max(page,1),pages);return{items:arr.slice((page-1)*size,page*size),page,pages,total:arr.length}}
function pagerHtml(key,p){return`<div class="toolbar"><div class="muted">Записей: <b>${p.total}</b></div><div class="actions"><button class="xs outline" ${p.page<=1?'disabled':''} onclick="monUi.${key}.page--;render${key[0].toUpperCase()+key.slice(1)}()">←</button><span class="badge">${p.page} / ${p.pages}</span><button class="xs outline" ${p.page>=p.pages?'disabled':''} onclick="monUi.${key}.page++;render${key[0].toUpperCase()+key.slice(1)}()">→</button></div></div>`}
function openColumnsModal(key,defs,mandatory=['name']){const ui=monUi[key];openModal('Столбцы','Настройка видимости столбцов',defs.map(d=>`<label class="card"><div class="card-main"><input class="checkbox" type="checkbox" ${ui.cols.includes(d[0])?'checked':''} ${mandatory.includes(d[0])?'disabled':''} onchange="this.checked?monUi.${key}.cols.push(${q(d[0])}):monUi.${key}.cols=monUi.${key}.cols.filter(x=>x!==${q(d[0])})"><b>${esc(d[1])}</b>${mandatory.includes(d[0])?'<span class="badge">обязательный</span>':''}</div></label>`).join(''),`<button onclick="closeModal();render${key[0].toUpperCase()+key.slice(1)}()">Готово</button>`,true)}
function dateTs(v){if(!v)return 0;const m=String(v).match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():0}
function isValidAddress(type,v){if(type==='ip'){const p=v.split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&+x>=0&&+x<=255)}return /^(?=.{3,253}$)([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[A-Za-z]{2,63}$/.test(v)}
function serviceUsage(sid){const hosts=state.hosts.filter(h=>h.attachments.some(a=>a.serviceId===sid));const collections=state.collections.filter(c=>c.serviceIds.includes(sid));return{hosts,collections}}
function masked(v){return v?'••••••••':'—'}

function groupHosts(){if(isAdmin())return state.hosts.filter(h=>isManualHost(h));const gids=userGroupIds();return state.hosts.filter(h=>isManualHost(h)&&gids.has(h.ownerGroupId))}
function applyHostFilters(arr){const f=monUi.hosts,qq=f.search.trim().toLowerCase();return arr.filter(h=>{
 const matchName=!qq||(f.nameMode==='notcontains'?!h.name.toLowerCase().includes(qq):(h.name.toLowerCase().includes(qq)||h.address.toLowerCase().includes(qq)));
 const has=h.attachments.length>0;const created=dateTs(h.createdAt);
 return matchName&&(f.proxy==='all'||h.proxyGroup===f.proxy)&&(f.source==='all'||h.sourceType===f.source)&&(f.group==='all'||h.ownerGroupId===f.group)&&(f.author==='all'||(h.updatedBy||h.createdBy)===f.author)&&(f.collection==='all'||h.collectionLinks.some(l=>l.collectionId===f.collection))&&(f.service==='all'||h.attachments.some(a=>a.serviceId===f.service))&&(f.hasService==='all'||(f.hasService==='yes'?has:!has))&&(!f.dateFrom||created>=new Date(f.dateFrom).getTime())&&(!f.dateTo||created<=new Date(f.dateTo+'T23:59:59').getTime());
 })}
function hostFilterBar(){const f=monUi.hosts;return`<div class="toolbar"><div class="actions"><input style="min-width:260px" placeholder="Имя или IP/FQDN" value="${esc(f.search)}" oninput="monUi.hosts.search=this.value;monUi.hosts.page=1;renderHosts()"><select onchange="monUi.hosts.nameMode=this.value;renderHosts()"><option value="contains" ${f.nameMode==='contains'?'selected':''}>содержит</option><option value="notcontains" ${f.nameMode==='notcontains'?'selected':''}>не содержит</option></select><button class="outline" onclick="openHostFilters()">⚙ Фильтры</button><button class="outline" onclick="openColumnsModal('hosts',HOST_COLS,['name'])">Столбцы</button><button class="ghost" onclick="resetHostFilters()">Очистить</button></div></div>`}
const HOST_COLS=[['id','Host ID'],['name','Название'],['address','IP/FQDN'],['owner','Группа-владелец'],['source','Источник'],['external','CMDB / External ID'],['proxy','Группа прокси'],['services','Сервисы'],['created','Создан/изменён'],['author','Автор']];
function openHostFilters(){const f=monUi.hosts;openModal('Фильтры Host','Условия применяются одновременно',`<div class="row3"><div class="field"><label>Группа прокси</label><select id="hf-proxy" class="wide"><option value="all">Все</option>${state.proxyGroups.map(g=>`<option value="${g.id}" ${f.proxy===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Источник</label><select id="hf-source" class="wide"><option value="all">Все</option><option value="manual" ${f.source==='manual'?'selected':''}>Ручной</option><option value="manual-prefill" ${f.source==='manual-prefill'?'selected':''}>Реестр → ручной</option></select></div><div class="field"><label>Наличие сервисов</label><select id="hf-has" class="wide"><option value="all">Все</option><option value="yes" ${f.hasService==='yes'?'selected':''}>С сервисами</option><option value="no" ${f.hasService==='no'?'selected':''}>Без сервисов</option></select></div></div><div class="row3"><div class="field"><label>Сервис</label><select id="hf-service" class="wide"><option value="all">Все</option>${visibleServices().map(s=>`<option value="${s.id}" ${f.service===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Коллекция</label><select id="hf-col" class="wide"><option value="all">Все</option>${visibleCollections().map(c=>`<option value="${c.id}" ${f.collection===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Группа-владелец</label><select id="hf-group" class="wide"><option value="all">Все</option>${state.groups.filter(g=>isAdmin()||userGroupIds().has(g.id)).map(g=>`<option value="${g.id}" ${f.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="row3"><div class="field"><label>Автор / изменил</label><select id="hf-author" class="wide"><option value="all">Все</option>${state.users.map(u=>`<option value="${u.id}" ${f.author===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Дата с</label><input id="hf-from" class="wide" type="date" value="${f.dateFrom}"></div><div class="field"><label>Дата по</label><input id="hf-to" class="wide" type="date" value="${f.dateTo}"></div></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="applyHostFilterModal()">Применить</button>`)}
function applyHostFilterModal(){Object.assign(monUi.hosts,{proxy:$('hf-proxy').value,source:$('hf-source').value,hasService:$('hf-has').value,service:$('hf-service').value,collection:$('hf-col').value,group:$('hf-group').value,author:$('hf-author').value,dateFrom:$('hf-from').value,dateTo:$('hf-to').value,page:1});closeModal();renderHosts()}
function resetHostFilters(){Object.assign(monUi.hosts,{search:'',nameMode:'contains',proxy:'all',source:'all',service:'all',hasService:'all',group:'all',collection:'all',author:'all',dateFrom:'',dateTo:'',page:1});renderHosts()}
function hostTableV08(arr){const c=monUi.hosts.cols;const th=(id,label)=>c.includes(id)?`<th>${label}</th>`:'';const td=(id,x)=>c.includes(id)?`<td>${x}</td>`:'';return`<div class="table-wrap"><table><thead><tr><th></th>${HOST_COLS.map(x=>th(x[0],x[1])).join('')}<th>Действия</th></tr></thead><tbody>${arr.length?arr.map(h=>`<tr class="data-row" onclick="openHostDetails(${q(h.id)})"><td onclick="event.stopPropagation()"><input class="checkbox" type="checkbox" ${selectedHostIds.has(h.id)?'checked':''} onchange="this.checked?selectedHostIds.add(${q(h.id)}):selectedHostIds.delete(${q(h.id)});renderHosts()"></td>${td('id',`<span class="mono">${esc(h.id)}</span>`)}${td('name',`<b>${esc(h.name)}</b>`)}${td('address',`${addressBadge(h)} <span class="mono">${esc(h.address)}</span>`)}${td('owner',esc(groupById(h.ownerGroupId)?.name||'—'))}${td('source',sourceBadge(h))}${td('external',`<span class="mono">${esc(h.catalogBinding?.externalId||h.prefilledFromCatalog?.externalId||'—')}</span>`)}${td('proxy',esc(proxyName(h.proxyGroup)))}${td('services',`<span class="badge">${h.attachments.length}</span>`)}${td('created',esc(h.updatedAt||h.createdAt||'—'))}${td('author',esc(userById(h.updatedBy||h.createdBy)?.name||'—'))}<td onclick="event.stopPropagation()"><button class="xs outline" onclick="openHostDetails(${q(h.id)})">Детали</button></td></tr>`).join(''):`<tr><td colspan="20" class="empty">Нет данных</td></tr>`}</tbody></table></div>`}
function renderHosts(){monitoringGate('hosts',()=>{const arr=hostView==='catalog'?catalogHosts():applyHostFilters(groupHosts());const p=paginate(arr,monUi.hosts.page);monUi.hosts.page=p.page;const canCreate=hasAnyMonitoringPermission()&&state.proxyGroups.length>0;const bulk=selectedHostIds.size&&hostView==='connected'?`<span class="muted">Выбрано: <b>${selectedHostIds.size}</b></span><button class="sm outline" onclick="openBulkAttachModal()">＋ Сервис</button><button class="sm outline" onclick="openBulkDetachModalV08()">− Сервис</button><button class="sm outline" onclick="openBulkCollectionModal()">＋ Коллекция</button><button class="sm outline" onclick="openBulkUnlinkCollectionV08()">− Коллекция</button><button class="sm danger" onclick="bulkDeleteHostsV08()">Удалить</button><button class="sm ghost" onclick="selectedHostIds.clear();renderHosts()">Снять выбор</button>`:'';page('hosts',hostView==='catalog'?'Хосты из реестра объектов':'Хосты моей группы',hostView==='catalog'?'Синхронизируемые CMDB-хосты. Реестр объектов в этой итерации не меняется.':'Ручные Host вашей группы отображаются независимо от наличия сервисов.',`<button class="outline" onclick="resetDemo()">↺ Сбросить демо</button>`,`<div class="panel"><div class="host-switch"><button class="${hostView==='connected'?'active':''}" onclick="hostView='connected';selectedHostIds.clear();renderHosts()">Хосты моей группы</button><button class="${hostView==='catalog'?'active':''}" onclick="hostView='catalog';selectedHostIds.clear();renderHosts()">Хосты из реестра объектов</button></div>${roNote()}${hostView==='connected'?hostFilterBar():''}<div class="toolbar"><div class="actions">${bulk}</div><div class="actions">${hostView==='connected'?`<button ${canCreate?'':'disabled title="Создание требует права и хотя бы одной группы прокси"'} onclick="openHostCreateModal()">➕ Создать хост</button>`:'<button class="outline" onclick="syncCatalogHosts()">🔄 Обновить</button>'}</div></div>${hostTableV08(p.items)}${pagerHtml('hosts',p)}</div>`)} )}
function openBulkDetachModalV08(){const hs=selectedHosts();const ids=[...new Set(hs.flatMap(h=>h.attachments.map(a=>a.serviceId)))];openModal('Массовое отсоединение сервисов',`Выбрано Host: ${hs.length}`,ids.map(id=>{const s=serviceById(id);return`<label class="card"><div class="card-main"><input class="checkbox" type="checkbox" data-bulk-detach="${id}"><b>${esc(s?.name||id)}</b></div></label>`}).join('')||'<div class="empty">Нет сервисов</div>',`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="applyBulkDetachV08()">Отсоединить</button>`,true)}

function openBulkUnlinkCollectionV08(){const ids=[...new Set(selectedHosts().flatMap(h=>(h.collectionLinks||[]).map(l=>l.collectionId)))];openModal('Массовое отсоединение коллекций','Удаляется только причина подключения через коллекцию',ids.map(id=>{const c=collectionById(id);return`<label class="card"><div class="card-main"><input class="checkbox" type="checkbox" data-bulk-col="${id}"><b>${esc(c?.name||id)}</b></div></label>`}).join('')||'<div class="empty">Нет коллекций</div>',`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="applyBulkUnlinkCollectionV08()">Отсоединить</button>`,true)}
function applyBulkUnlinkCollectionV08(){const cids=[...document.querySelectorAll('[data-bulk-col]:checked')].map(x=>x.dataset.bulkCol);selectedHosts().forEach(h=>cids.forEach(cid=>unlinkCollectionCoreV08(h,cid)));saveState();closeModal();renderHosts();toast('Коллекции отсоединены')}
function bulkDeleteHostsV08(){const hs=selectedHosts();const blocked=hs.filter(h=>!canDeleteHostV08(h));const allowed=hs.filter(canDeleteHostV08);openModal('Массовое удаление Host','Удаление выполняется частично',`<div class="box"><b>Можно удалить:</b> ${allowed.length}<br><b>Будут пропущены:</b> ${blocked.length}</div>${blocked.length?`<div class="box amber-box">${blocked.map(h=>esc(h.name)).join(', ')}</div>`:''}`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" ${allowed.length?'':'disabled'} onclick="applyBulkDeleteHostsV08(${JSON.stringify(allowed.map(h=>h.id)).replace(/"/g,'&quot;')})">Удалить доступные</button>`,true)}
function applyBulkDeleteHostsV08(ids){ids.forEach(id=>deleteHost(id,true));selectedHostIds.clear();saveState();closeModal();renderHosts();toast('Массовое удаление завершено')}
function canDeleteHostV08(h){return !!h&&isManualHost(h)&&(isAdmin()||(isCreatorGroupUser(h)&&h.attachments.length===0))}

function openHostEditModal(id){const h=state.hosts.find(x=>x.id===id);if(!h||!canEditHost(h))return;openModal('Редактировать ручной Host',h.id,`<div class="row"><div class="field"><label>Имя</label><input class="wide" value="${esc(h.name)}" disabled><div class="hint">Имя существующего Host не изменяется.</div></div><div class="field"><label>Группа прокси</label><select id="edit-host-proxy" class="wide">${state.proxyGroups.map(g=>`<option value="${g.id}" ${g.id===h.proxyGroup?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Тип адреса</label><select id="edit-host-type" class="wide"><option value="ip" ${h.addressType==='ip'?'selected':''}>IP</option><option value="fqdn" ${h.addressType==='fqdn'?'selected':''}>FQDN</option></select></div><div class="field"><label>IP / FQDN</label><input id="edit-host-address" class="wide mono" value="${esc(h.address)}"></div></div><div class="field"><label>Группа-владелец</label>${isAdmin()?`<select id="edit-host-owner" class="wide">${state.groups.map(g=>`<option value="${g.id}" ${g.id===h.ownerGroupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`:`<input class="wide" disabled value="${esc(groupById(h.ownerGroupId)?.name||'—')}">`}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveHostEdit(${q(id)})">Сохранить</button>`)}

function openDeleteHostModal(id){const h=state.hosts.find(x=>x.id===id);if(!h||!isManualHost(h))return toast('Удаление доступно только для ручных Host');if(!isAdmin()&&h.attachments.length)return openModal('Удаление Host недоступно','Сначала отсоедините сервисы',`<div class="box amber-box">К Host привязаны сервисы: ${h.attachments.map(a=>esc(serviceById(a.serviceId)?.name||a.serviceId)).join(', ')}.</div>`,`<button onclick="closeModal()">Закрыть</button>`,true);if(!canDeleteHostV08(h))return toast('Недостаточно прав');openModal('Удалить Host','Подтвердите действие',`<div class="box red-box">Удалить <b>${esc(h.name)}</b>?${isAdmin()&&h.attachments.length?`<br>Будет отсоединено сервисов: ${h.attachments.length}. Сами сервисы останутся в системе.`:''}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="deleteHost(${q(id)})">Удалить</button>`,true)}

function requestUnlinkCollection(hid,cid){const h=state.hosts.find(x=>x.id===hid),c=collectionById(cid);openModal('Отсоединить коллекцию','Сервисы не превращаются в самостоятельные автоматически',`<div class="box amber-box">Будет удалена связь Host ↔ коллекция <b>${esc(c?.name||'')}</b> и причина подключения сервисов через неё. Сервис останется только если удерживается самостоятельной привязкой или другой коллекцией.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="unlinkCollection(${q(hid)},${q(cid)})">Отсоединить</button>`,true)}

function openAttachmentPortModal(hid,aid){const h=state.hosts.find(x=>x.id===hid),a=h?.attachments.find(x=>x.id===aid),s=serviceById(a?.serviceId);if(!h||!a||!s||!canManageService(s))return toast('Переопределение порта доступно по правам на сервис');openModal('Переопределить порт',`${s.name} · ${h.name}`,`<div class="field"><label>Порт для этого Host</label><input id="port-override-v08" class="wide" type="number" min="1" max="65535" value="${a.portOverride??s.defaultPort}"></div><div class="hint">Изменяется только связь Host–Service. Порт сервиса по умолчанию: ${s.defaultPort}.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="resetPortOverrideV08(${q(hid)},${q(aid)})">Сбросить</button><button onclick="savePortOverrideV08(${q(hid)},${q(aid)})">Сохранить</button>`)}
function savePortOverrideV08(hid,aid){const h=state.hosts.find(x=>x.id===hid),a=h.attachments.find(x=>x.id===aid),v=Number($('port-override-v08').value);if(!Number.isInteger(v)||v<1||v>65535)return toast('Порт должен быть от 1 до 65535');a.portOverride=v;saveState();closeModal();openHostDetails(hid);toast('Порт переопределён только для этого Host')}
