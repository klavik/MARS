function normalizeState(s){const d=demoState(),n={...d,...s};n.users=n.users||d.users;n.groups=n.groups||d.groups;n.proxyGroups=n.proxyGroups||d.proxyGroups;n.catalogHosts=n.catalogHosts||d.catalogHosts;n.catalogSources=n.catalogSources||d.catalogSources;n.services=n.services||d.services;n.templates=n.templates||d.templates;n.collections=(n.collections||d.collections).map(c=>({...c,serviceIds:(c.serviceIds||[]).filter(id=>n.services.some(s=>s.id===id))}));n.hosts=(n.hosts||d.hosts).map(h=>({...h,collectionLinks:h.collectionLinks||[],attachments:(h.attachments||[]).map(a=>({...a,direct:a.direct===undefined?true:!!a.direct,collectionIds:a.collectionIds||[]}))}));if(!n.users.some(u=>u.id===n.currentUserId))n.currentUserId=n.users[0].id;return reconcileCollections(n)}
function reconcileCollections(n){n.hosts.forEach(h=>{const linked=new Set((h.collectionLinks||[]).map(l=>l.collectionId));h.attachments=(h.attachments||[]).map(a=>({...a,collectionIds:(a.collectionIds||[]).filter(cid=>linked.has(cid)&&n.collections.some(c=>c.id===cid))}));(h.collectionLinks||[]).forEach(link=>{const c=n.collections.find(x=>x.id===link.collectionId);if(!c)return;c.serviceIds.forEach(sid=>{let a=h.attachments.find(x=>x.serviceId===sid&&x.attachedByGroupId===c.ownerGroupId);if(a){if(!a.collectionIds.includes(c.id))a.collectionIds.push(c.id)}else h.attachments.push({id:uid('att'),serviceId:sid,attachedByGroupId:c.ownerGroupId,attachedByUserId:link.attachedByUserId,attachedAt:link.attachedAt||now(),portOverride:null,direct:false,collectionIds:[c.id]})})});h.attachments=h.attachments.filter(a=>a.direct||(a.collectionIds||[]).length)});return n}

function currentUser(){return state.users.find(u=>u.id===state.currentUserId)||state.users[0]}function userById(id){return state.users.find(u=>u.id===id)}function groupById(id){return state.groups.find(g=>g.id===id)}function serviceById(id){return state.services.find(s=>s.id===id)}function templateById(id){return state.templates.find(t=>t.id===id)}function collectionById(id){return state.collections.find(c=>c.id===id)}function isAdmin(){return !!currentUser().isAdmin}function userGroupIds(){return new Set(currentUser().groups||[])}function hasMonitoringPermission(gid){return isAdmin()||!!currentUser().permissions?.[gid]?.includes('monitoring.manage')}function canManageService(s){return !!s&&hasMonitoringPermission(s.ownerGroupId)}function canManageTemplate(t){return !!t&&hasMonitoringPermission(t.ownerGroupId)}function canManageCollection(c){return !!c&&hasMonitoringPermission(c.ownerGroupId)}function visibleCollections(){return isAdmin()?state.collections:state.collections.filter(c=>userGroupIds().has(c.ownerGroupId))}function canAttachService(s){return canManageService(s)}function canDetach(a){return !!a&&hasMonitoringPermission(a.attachedByGroupId)}function isManualHost(h){return !!h&&h.sourceType!=='catalog'}function isCreatorGroupUser(h){return !!h?.ownerGroupId&&(isAdmin()||(userGroupIds().has(h.ownerGroupId)&&hasMonitoringPermission(h.ownerGroupId)))}function canEditHost(h){return !!h&&isManualHost(h)&&(isAdmin()||isCreatorGroupUser(h))}function canCloneHost(h){return canEditHost(h)}function canDeleteHost(h){return !!h&&(isAdmin()||(isManualHost(h)&&isCreatorGroupUser(h)&&h.attachments.length===0))}function hostDeleteReason(h){if(!h)return'Хост не найден';if(isAdmin())return'';if(!isManualHost(h))return'Хосты из справочника обычный пользователь удалить не может.';if(!isCreatorGroupUser(h))return'Удалить ручной хост могут создатель и его одногрупники с permission «Постановка на мониторинг».';if(h.attachments.length)return`Сначала отсоедините все сервисы. На хо function switchSection(sec){activeSection=sec;document.querySelectorAll('#product-monitoring .section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('#product-monitoring .tab').forEach(s=>s.classList.remove('active'));$('section-'+sec).classList.add('active');$('nav-'+sec).classList.add('active');renderAll()}function switchUser(id){state.currentUserId=id;selectedHostIds.clear();saveState();renderAll()}function renderAll(){renderUserSwitcher();renderHosts();renderServices();renderTemplates();renderCollections();renderAccess()}function renderUserSwitcher(){$('current-user').innerHTML=state.users.map(u=>`<option value="${esc(u.id)}" ${u.id===state.currentUserId?'selected':''}>${esc(u.name)}${u.isAdmin?' · admin':''}</option>`).join('');$('avatar').textContent=currentUser().initials||'U'}function page(sec,title,sub,actions,body){$('section-'+sec).innerHTML=`<div class="page-head"><div><h1 class="title">${title}</h1><div class="sub">${sub||''}</div></div><div class="actions">${actions||''}</div></div>${body}`}

function openAttachModal(hostId){const h=state.hosts.find(x=>x.id===hostId);if(!h)return;attachHostId=hostId;attachServiceIds=new Set();renderAttachModal()}function renderAttachModal(){const h=state.hosts.find(x=>x.id===attachHostId),services=state.services.filter(canAttachService);openModal('Подключить сервисы',`${h.name} · ${h.id}`,`<div class="box blue-box"><b>Можно выбрать несколько сервисов.</b> Если сервис уже есть через коллекцию, дубль не создаётся — добавляется самостоятельная причина.</div><div class="service-picker">${services.map(s=>{const a=findAttachment(h,s.id,s.ownerGroupId),disabled=!!a?.direct,checked=attachServiceIds.has(s.id);return`<label class="card"><div class="card-main"><input class="checkbox" type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''} onchange="this.checked?attachServiceIds.add(${q(s.id)}):attachServiceIds.delete(${q(s.id)});renderAttachModal()"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(groupById(s.ownerGroupId)?.name||'')} · порт ${s.defaultPort}${a&&!a.direct?' · уже есть через коллекцию':''}</div></div></div></label>`}).join('')}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="attachSelectedServices()" ${attachServiceIds.size?'':'disabled'}>Подключить выбранные (${attachServiceIds.size})</button>`,true)}function attachSelectedServices(){const h=state.hosts.find(x=>x.id===attachHostId);let n=0;[...attachServiceIds].map(serviceById).filter(Boolean).forEach(s=>{if(markDirect(h,s))n++});saveState();closeModal();renderHosts();toast(`Подключено: ${n}`)}

function registryAttrLabel(type,id){return(objectTypes[type]||[]).find(a=>a.id===id)?.label||id}
function registryEffectiveValue(o,id){return id==='name'?o.name:o.values?.[id]}
function registryIsOverride(o,id){return o.manual?.[id]!==undefined&&o.raw?.[id]!==undefined&&String(o.manual[id])!==String(o.raw[id])}
function registryEndpoint(o){if(o.type!=='Host')return'—';return o.values?.fqdn||o.values?.ip||'—'}
function registrySourceKind(o){return o.source==='Manual'?'manual':'external'}
function registryRelationNames(){return[...new Set(registry.objects.flatMap(o=>(o.relations||[]).map(r=>r.type)))].sort((a,b)=>a.localeCompare(b,'ru'))}
function registryEnvironments(){return[...new Set(registry.objects.map(o=>o.values?.environment).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'))}
function registryObjectByRelation(type,name){return registry.objects.find(o=>o.type===type&&o.name===name)}

  return(registry.type==='all'||o.type===registry.type)&&(registry.source==='all'||registrySourceKind(o)===registry.source)&&(registry.environment==='all'||o.values?.environment===registry.environment)&&(registry.relation==='all'||(o.relations||[]).some(r=>r.type===registry.relation))&&(!qv||bag.includes(qv));

function resetRegistryFilters(){registry.search='';registry.type='all';registry.source='all';registry.environment='all';registry.relation='all';renderRegistry()}

function registryCardTabs(id,tab){return`<div class="registry-card-tabs"><button class="${tab==='overview'?'active':''}" onclick="openRegistryObject(${q(id)},'overview')">Обзор</button><button class="${tab==='attributes'?'active':''}" onclick="openRegistryObject(${q(id)},'attributes')">Атрибуты</button><button class="${tab==='relations'?'active':''}" onclick="openRegistryObject(${q(id)},'relations')">Связи</button><button class="${tab==='sources'?'active':''}" onclick="openRegistryObject(${q(id)},'sources')">Источники</button></div>`}
function openRegistryObject(id,tab='overview'){
 const o=registry.objects.find(x=>x.id===id);if(!o)return;registry.cardTab=tab;
 let body=registryCardTabs(id,tab);
 if(tab==='overview')body+=renderRegistryOverview(o);
 if(tab==='attributes')body+=renderRegistryAttributes(o,false);
 if(tab==='relations')body+=renderRegistryRelations(o);
 if(tab==='sources')body+=renderRegistrySources(o);
 openModal(`${o.type}: ${o.name}`,`${o.id}${o.externalId?' · External ID: '+o.externalId:''}`,body,`<button onclick="closeModal()">Закрыть</button>`);
}
function renderRegistryOverview(o){
 const key=(objectTypes[o.type]||[]).filter(a=>a.id!=='name').slice(0,6);
 return`<div class="box blue-box"><b>${esc(o.name)}</b> · <span class="mono">${esc(o.id)}</span><br><span class="hint">object_id — постоянная идентичность объекта MARS.</span></div><div class="registry-summary"><div class="box"><b>Тип</b><br><span class="badge b-blue">${esc(o.type)}</span></div><div class="box"><b>Источник объекта</b><br>${o.source==='Manual'?'<span class="badge">✍️ Manual</span>':`<span class="badge b-violet">📚 ${esc(o.source)}</span>`}</div><div class="box"><b>Связи</b><br><span class="badge b-green">🔗 ${(o.relations||[]).length}</span></div></div><h3>Ключевые effective-значения</h3><div class="grid3cards">${key.map(a=>{const v=registryEffectiveValue(o,a.id);return`<div class="box"><b>${esc(a.label)}</b><br><span class="effective-main">${esc(v||'—')}</span>${registryIsOverride(o,a.id)?'<div class="effective-note"><span class="badge b-amber">Переопределено вручную</span> · Galaxy: '+esc(o.raw[a.id])+'</div>':''}</div>`}).join('')}</div>${(o.relations||[]).length?`<h3>Контекст по связям</h3>${renderRelationCards(o.relations.slice(0,3))}`:''}`;
}
function renderRegistryAttributes(o,adminMode=false){const attrs=objectTypes[o.type]||[];return`<div class="table-wrap" style="max-height:none"><table><thead><tr><th>Атрибут</th><th>Effective value</th><th>Источник effective</th><th>${adminMode?'Управление':'Исходное значение'}</th></tr></thead><tbody>${attrs.map(a=>{const eff=registryEffectiveValue(o,a.id),m=o.manual?.[a.id],x=o.raw?.[a.id],ov=registryIsOverride(o,a.id),hasExternal=x!==undefined;let src=ov?'<span class="badge b-amber">Переопределено вручную</span>':m!==undefined?'<span class="badge">Manual</span>':hasExternal?`<span class="badge b-violet">${esc(o.source)}</span>`:'<span class="muted">—</span>';let last=adminMode?renderRegistryAttrAdminActions(o,a,m,x,ov):hasExternal?`<span class="mono">${esc(x)}</span>${ov?`<div class="cell-sub">Manual: ${esc(m)}</div>`:''}`:'<span class="muted">—</span>';return`<tr><td><b>${esc(a.label)}</b><div class="cell-sub mono">${esc(a.id)}</div></td><td><span class="effective-main">${esc(eff||'—')}</span></td><td>${src}</td><td>${last}</td></tr>`}).join('')}</tbody></table></div>`}
function renderRegistryAttrAdminActions(o,a,m,x,ov){
 if(x!==undefined){return`<div class="registry-attr-actions">${ov?`<button class="xs outline" onclick="openRegistryValueEdit(${q(o.id)},${q(a.id)})">Изменить override</button><button class="xs danger" onclick="removeRegistryOverride(${q(o.id)},${q(a.id)})">Удалить override</button>`:`<button class="xs outline" onclick="openRegistryValueEdit(${q(o.id)},${q(a.id)})">Переопределить вручную</button>`}</div>`}

function renderRegistryRelations(o){const out=(o.relations||[]).filter(r=>r.dir==='out'),inn=(o.relations||[]).filter(r=>r.dir==='in');return`<div class="box blue-box"><b>Связи навигационные.</b> Нажмите на связанный объект, чтобы открыть его карточку.</div><h3>Исходящие связи</h3>${out.length?renderRelationCards(out):'<div class="empty">Исходящих связей нет</div>'}<h3>Входящие связи</h3>${inn.length?renderRelationCards(inn):'<div class="empty">Входящих связей нет</div>'}`}

function renderAdminObjects(){return`<div class="toolbar admin-object-toolbar"><div><b>Ручное управление объектами</b><div class="hint">Создание объектов и ручные переопределения доступны только MARS Admin.</div></div><button onclick="openAdminRegistryObjectCreate()">➕ Создать объект</button></div><div class="content admin-object-list">${registry.objects.map(o=>`<div class="card"><div class="card-main"><span class="icon">${o.type==='Host'?'🖥️':o.type==='Database'?'🗄️':'📦'}</span><div><div class="card-title">${esc(o.name)}</div><div class="meta"><span class="badge b-blue">${esc(o.type)}</span> · <span class="mono">${esc(o.id)}</span> · ${o.source==='Manual'?'<span class="badge">Manual</span>':`<span class="badge b-violet">${esc(o.source)}</span>`}${Object.keys(o.manual||{}).some(k=>registryIsOverride(o,k))?' · <span class="badge b-amber">Есть override</span>':''}</div></div></div><div class="actions"><button class="xs outline" onclick="openRegistryObject(${q(o.id)},'overview')">Просмотр</button><button class="xs" onclick="openAdminRegistryObject(${q(o.id)})">Управление</button></div></div>`).join('')}</div>`}
function openAdminRegistryObjectCreate(){const type=Object.keys(objectTypes)[0];openModal('Создать объект мониторинга','Только MARS Admin. Объект создаётся с источником Manual.',`<div class="row"><div class="field"><label>Тип объекта *</label><select id="aro-type" class="wide">${Object.keys(objectTypes).map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div><div class="field"><label>Имя *</label><input id="aro-name" class="wide"></div></div><div id="aro-attrs"></div><div class="box blue-box"><b>Manual ≠ Override.</b> Для нового ручного объекта значения имеют источник Manual. Override возникает только если для этого же объекта позже появляется внешнее значение того же атрибута и ручное значение его переопределяет.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveAdminRegistryObject()">Создать</button>`);const render=()=>{$('aro-attrs').innerHTML=`<h3>Атрибуты</h3>${(objectTypes[$('aro-type').value]||[]).filter(a=>a.id!=='name').map(a=>`<div class="field"><label>${esc(a.label)}</label><input class="wide" data-aro-attr="${esc(a.id)}"></div>`).join('')}`};$('aro-type').onchange=render;render()}
function saveAdminRegistryObject(){if(!isAdmin())return toast('Недостаточно прав');const type=$('aro-type').value,name=$('aro-name').value.trim();if(!name)return toast('Введите имя');const existing=registry.objects.find(o=>o.type===type&&o.name.toLowerCase()===name.toLowerCase());if(existing){closeModal();openAdminRegistryObject(existing.id);return toast('Объект с таким name + type уже существует')};const values={},manual={name};document.querySelectorAll('[data-aro-attr]').forEach(i=>{const v=i.value.trim();if(v){values[i.dataset.aroAttr]=v;manual[i.dataset.aroAttr]=v}});const prefix=type==='Host'?'H':type==='InformationSystem'?'IS':type==='Database'?'DB':'APP';registry.objects.push({id:'OBJ-'+prefix+'-'+(100+registry.objects.length),type,name,source:'Manual',externalId:'',lifecycle:'active',lastSync:'',values,raw:{},manual,relations:[]});closeModal();renderAdmin();toast('Объект создан')}
function openAdminRegistryObject(id){const o=registry.objects.find(x=>x.id===id);if(!o)return;openModal(`Управление: ${o.name}`,`${o.type} · ${o.id}`,`<div class="box blue-box"><b>Effective value</b> используется в реестре, событиях и последующей маршрутизации. Внешнее значение продолжает храниться и синхронизироваться даже при Manual override.</div>${renderRegistryAttributes(o,true)}<div class="separator"></div><h3>Источники</h3>${renderRegistrySources(o)}`,`<button class="ghost" onclick="closeModal()">Закрыть</button><button class="outline" onclick="openRegistryObject(${q(o.id)},'overview')">Открыть карточку</button>`)}
function openRegistryValueEdit(id,attr){if(!isAdmin())return toast('Недостаточно прав');const o=registry.objects.find(x=>x.id===id),a=(objectTypes[o.type]||[]).find(x=>x.id===attr);if(!o||!a)return;const current=registryEffectiveValue(o,attr)||'';const external=o.raw?.[attr];const title=external!==undefined?(registryIsOverride(o,attr)?'Изменить ручное переопределение':'Переопределить вручную'):'Изменить ручное значение';openModal(title,`${o.type}: ${o.name} · ${a.label}`,`${external!==undefined?`<div class="box"><b>Значение внешнего источника:</b> <span class="mono">${esc(external)}</span><div class="hint">Оно сохранится и продолжит обновляться после создания override.</div></div>`:''}<div class="field"><label>Ручное значение</label><input id="aro-value" class="wide" value="${esc(o.manual?.[attr]!==undefined?o.manual[attr]:current)}"></div>`,`<button class="ghost" onclick="openAdminRegistryObject(${q(id)})">Отмена</button><button onclick="saveRegistryManualValue(${q(id)},${q(attr)})">Сохранить</button>`,true)}
function saveRegistryManualValue(id,attr){const o=registry.objects.find(x=>x.id===id);if(!o||!isAdmin())return;const v=$('aro-value').value.trim();if(!v)return toast('Введите значение');o.manual=o.manual||{};o.manual[attr]=v;if(attr==='name')o.name=v;else o.values[attr]=v;openAdminRegistryObject(id);toast(o.raw?.[attr]!==undefined?'Manual override сохранён':'Manual-значение сохранено')}
function removeRegistryOverride(id,attr){const o=registry.objects.find(x=>x.id===id);if(!o||!isAdmin()||o.raw?.[attr]===undefined)return;o.manual&&delete o.manual[attr];if(attr==='name')o.name=o.raw[attr];else o.values[attr]=o.raw[attr];openAdminRegistryObject(id);toast('Override удалён; effective снова берётся из внешнего источника')}
function renderTypeSettings(){return`<div class="content">${Object.entries(objectTypes).map(([t,a])=>`<div class="card"><div class="card-main"><span class="icon">🧩</span><div><div class="card-title">${t}</div><div class="pill-row" style="margin-top:8px">${a.map(x=>`<span class="badge">${x.label} · <span class="mono">${x.id}</span></span>`).join('')}</div></div></div></div>`).join('')}</div>`}
function registrySelectedCmdbCollections(){return registryCmdbCollections.filter(c=>c.selected)}
function toggleRegistryCmdbCollection(id,checked){
 const c=registryCmdbCollections.find(x=>x.id===id);if(!c)return;
 c.selected=!!checked;
 if(!c.selected){c.status='not_selected';c.lastSync='—'}
 else if(c.status==='not_selected')c.status='pending';
 if(registryMappingEditor.collection===id&&!c.selected){
   const allowed=registryAllowedCollectionsForType(registryMappingEditor.type);
   registryMappingEditor.collection=allowed[0]?.id||''
 }
 renderAdmin()
}
function toggleAllRegistryCmdbCollections(checked){
 registryCmdbCollections.forEach(c=>{c.selected=!!checked;if(!checked){c.status='not_selected';c.lastSync='—'}else if(c.status==='not_selected')c.status='pending'});
 const allowed=registryAllowedCollectionsForType(registryMappingEditor.type);
 if(!allowed.some(c=>c.id===registryMappingEditor.collection))registryMappingEditor.collection=allowed[0]?.id||'';
 renderAdmin()
}
function syncRegistryCmdbCollections(){
 const selected=registrySelectedCmdbCollections();if(!selected.length)return toast('Выберите хотя бы одну коллекцию для синхронизации');
 const ts=now();selected.forEach(c=>{c.status='synced';c.lastSync=ts});
 renderAdmin();toast(`Синхронизировано коллекций: ${selected.length}`)
}
function registryCmdbCollectionStatus(c){
 if(!c.selected)return'<span class="badge">Не выбрана</span>';
 if(c.status==='synced')return'<span class="badge b-green">● Синхронизируется</span>';
 return'<span class="badge b-amber">Ожидает синхронизации</span>'
}
function registryAllowedCollectionsForType(type){
 const selected=registrySelectedCmdbCollections();
 if(type==='Host')return selected.filter(c=>c.id==='HOSTOS');
 return selected
}
function registryEnsureMapping(type,collection){
 if(!type||!collection)return null;
 const key=`${type}|${collection}`;
 if(!registryMappings[key])registryMappings[key]={objectNameField:'',externalIdField:'',attrs:{},updatedAt:'—'};
 return registryMappings[key]
}
function registryMappingFieldOptions(collection,value,required=false){
 const fields=registryCmdbCollectionFields[collection]||[];
 return`${required?'':'<option value="">— Не синхронизировать —</option>'}${fields.map(f=>`<option value="${esc(f)}" ${f===value?'selected':''}>${esc(f)}</option>`).join('')}`
}
function setRegistryMappingType(type){
 registryMappingEditor.type=type;
 const allowed=registryAllowedCollectionsForType(type);
 if(!allowed.some(c=>c.id===registryMappingEditor.collection))registryMappingEditor.collection=allowed[0]?.id||'';
 renderAdmin()
}
function setRegistryMappingCollection(collection){registryMappingEditor.collection=collection;renderAdmin()}
function setRegistryMappingIdentity(kind,value){const m=registryEnsureMapping(registryMappingEditor.type,registryMappingEditor.collection);if(!m)return;m[kind]=value}
function setRegistryMappingAttribute(attr,value){const m=registryEnsureMapping(registryMappingEditor.type,registryMappingEditor.collection);if(!m)return;if(value)m.attrs[attr]=value;else delete m.attrs[attr]}
function saveRegistryMapping(){
 const type=registryMappingEditor.type,collection=registryMappingEditor.collection;
 const m=registryEnsureMapping(type,collection);if(!m)return toast('Сначала выберите тип и коллекцию');
 if(!m.objectNameField)return toast('Выберите поле внешнего источника для имени объекта');
 if(!m.externalIdField)return toast('Выберите поле External ID');
 m.updatedAt=now();renderAdmin();toast(`Mapping ${type} ← ${collection} сохранён`)
}

   <div class="actions"><label class="badge" style="padding:7px 10px;cursor:pointer"><input class="checkbox" type="checkbox" ${allSelected?'checked':''} onchange="toggleAllRegistryCmdbCollections(this.checked)"> Выбрать все</label><button class="sm outline" onclick="syncRegistryCmdbCollections()" ${selected.length?'':'disabled'}>🔄 Синхронизировать выбранные</button></div>
 </div>
 <div class="table-wrap"><table><thead><tr><th style="width:52px">Синхр.</th><th>Коллекция Galaxy / CMDB</th><th>Описание</th><th>Объектов доступно</th><th>Состояние</th><th>Последняя синхронизация</th></tr></thead><tbody>
 ${registryCmdbCollections.map(c=>`<tr><td><input class="checkbox" type="checkbox" ${c.selected?'checked':''} onchange="toggleRegistryCmdbCollection(${q(c.id)},this.checked)"></td><td><div class="cell-title">${esc(c.name)}</div><div class="cell-sub mono">${esc(c.id)}</div></td><td>${esc(c.description)}</td><td><b>${c.available.toLocaleString('ru-RU')}</b></td><td>${registryCmdbCollectionStatus(c)}</td><td>${esc(c.lastSync)}</td></tr>`).join('')}
 </tbody></table></div>
 <div class="content"><div class="box blue-box"><b>Текущий scope для Host:</b> тип <span class="mono">Host</span> может получать внешние значения только из <span class="mono">Galaxy/HOSTOS</span>. UABD/USP и другие коллекции не используются для наполнения Host. При этом они могут синхронизироваться для других типов объектов и будущих связей.</div></div>
 <div class="toolbar"><div><b>Mapping атрибутов MARS</b><div class="hint">Выберите тип объекта MARS и синхронизируемую коллекцию, затем сопоставьте внутренние атрибуты с полями внешнего источника.</div></div><div class="actions"><span class="muted">Замаплено атрибутов: <b>${mappedCount}</b> / ${attrs.length}</span></div></div>
 <div class="content">

     <div class="field"><label>Коллекция Galaxy / CMDB</label><select class="wide" onchange="setRegistryMappingCollection(this.value)" ${allowedCollections.length?'':'disabled'}>${allowedCollections.length?allowedCollections.map(c=>`<option value="${esc(c.id)}" ${c.id===collection?'selected':''}>${esc(c.name)}</option>`).join(''):'<option>Нет доступных выбранных коллекций</option>'}</select><div class="hint">${type==='Host'?'Для Host в текущем scope доступна только HOSTOS.':'Показываются только коллекции, отмеченные выше для синхронизации.'}</div></div>

function renderRelationTypeSettings(){return`<div class="toolbar"><span class="muted">Системные + пользовательские типы</span><button onclick="openRelationTypeCreate()">➕ Добавить тип связи</button></div><div class="content">${relationTypes.map(t=>`<div class="card"><div class="card-main"><span class="icon">🔗</span><div><div class="card-title">${t.name}</div><div class="meta">Обратное название: <b>${t.reverse}</b></div><div class="pill-row"><span class="badge ${t.system?'b-violet':'b-blue'}">${t.system?'Системный':'Пользовательский'}</span><span class="badge ${t.active?'b-green':'b-amber'}">${t.active?'Активен':'Выключен'}</span></div></div></div></div>`).join('')}</div>`}
function openRelationTypeCreate(){openModal('Добавить тип связи','Тип выбирается правилами из справочника.',`<div class="row"><div class="field"><label>Прямое название *</label><input id="rt-name" class="wide" placeholder="Например: Резервирует"></div><div class="field"><label>Обратное название *</label><input id="rt-rev" class="wide" placeholder="Например: Резервируется"></div></div><div class="box blue-box">Database <b>размещена на</b> Host<br>Host <b>размещает</b> Database</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveRelationType()">Добавить</button>`,true)}
function saveRelationType(){const n=$('rt-name').value.trim(),r=$('rt-rev').value.trim();if(!n||!r)return toast('Заполните оба названия');relationTypes.push({id:uid('rt'),name:n,reverse:r,system:false,active:true});closeModal();renderAdmin();toast('Тип связи создан')}
function renderRuleSettings(){return`<div class="toolbar"><span class="muted">Одна строка = одно правило формирования связи</span><button onclick="openRelationRule()">➕ Добавить правило</button></div><div class="table-wrap"><table><thead><tr><th>Название</th><th>Тип связи</th><th>Условие</th><th>Направление</th><th>Множественность</th><th>Проверка</th><th>Статус</th></tr></thead><tbody>${relationRules.map(r=>`<tr onclick="openRelationRule(${q(r.id)})" style="cursor:pointer"><td><b>${r.name}</b><div class="cell-sub mono">${r.id}</div></td><td><span class="badge b-violet">${relationTypes.find(t=>t.id===r.relationTypeId)?.name||'—'}</span></td><td class="mono">${r.sourceType}.${r.sourceAttr} ${r.operator} ${r.targetType}.${r.targetAttr}</td><td><b>${r.sourceType}</b> → <b>${r.targetType}</b></td><td>${r.multiplicity==='one'?'<span class="badge b-blue">Один</span>':'<span class="badge b-green">Несколько</span>'}</td><td><span class="badge b-green">✓ ${r.formed}</span> ${r.missing?`<span class="badge b-amber">0: ${r.missing}</span>`:''} ${r.ambiguous?`<span class="badge b-red">⚠ ${r.ambiguous}</span>`:''}</td><td><span class="badge ${r.active?'b-green':'b-amber'}">${r.active?'Активно':'Выключено'}</span></td></tr>`).join('')}</tbody></table></div>`}
function typeOptions(sel){return Object.keys(objectTypes).map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('')}
function attrOptions(t,sel){return objectTypes[t].map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${a.label} · ${a.id}</option>`).join('')}
function openRelationRule(id=''){const r=id?relationRules.find(x=>x.id===id):{name:'Host относится к ИТ-системе',sourceType:'Host',sourceAttr:'informationSystemId',operator:'=',targetType:'InformationSystem',targetAttr:'externalId',relationTypeId:'belongs',multiplicity:'one',active:true};openModal(id?'Редактировать правило связи':'Добавить правило связи','Одна настройка = одно правило.',`<div class="field"><label>Название</label><input id="rr-name" class="wide" value="${esc(r.name)}"></div><div class="separator"></div><h3>1. Какие объекты связываем</h3><div class="rule-flow"><div><div class="field"><label>Исходный тип</label><select id="rr-st" class="wide">${typeOptions(r.sourceType)}</select></div><div class="field"><label>Исходный атрибут</label><select id="rr-sa" class="wide">${attrOptions(r.sourceType,r.sourceAttr)}</select></div></div><div class="field"><label>Оператор</label><select id="rr-op" class="wide"><option>=</option><option ${r.operator==='IN'?'selected':''}>IN</option></select></div><div><div class="field"><label>Целевой тип</label><select id="rr-tt" class="wide">${typeOptions(r.targetType)}</select></div><div class="field"><label>Целевой атрибут</label><select id="rr-ta" class="wide">${attrOptions(r.targetType,r.targetAttr)}</select></div></div></div><div class="separator"></div><h3>2. Семантика связи</h3><div class="row"><div class="field"><label>Тип связи</label><select id="rr-rel" class="wide">${relationTypes.filter(t=>t.active).map(t=>`<option value="${t.id}" ${t.id===r.relationTypeId?'selected':''}>${t.name}</option>`).join('')}</select></div><div class="box" style="margin:0"><b>Направление:</b> Исходный → Целевой<div class="hint">Parent/Child не используется.</div></div></div><div id="rr-preview" class="rule-preview"></div><div class="separator"></div><h3>3. Множественность</h3><div class="row"><label class="card"><div class="card-main"><input class="checkbox" type="radio" name="rr-mult" value="one" ${r.multiplicity==='one'?'checked':''}><div><b>Только один</b><div class="meta">0 — нет связи; 1 — связь; &gt;1 — неоднозначность</div></div></div></label><label class="card"><div class="card-main"><input class="checkbox" type="radio" name="rr-mult" value="many" ${r.multiplicity==='many'?'checked':''}><div><b>Один или несколько</b><div class="meta">0 — нет связей; N — N связей</div></div></div></label></div><div class="separator"></div><h3>4. Проверка</h3><button class="outline" onclick="testRelationRule()">▶ Проверить на данных реестра</button><div id="rr-test"></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveRelationRule(${q(id)})">Сохранить</button>`);const upd=()=>{$('rr-preview').innerHTML=`<div class="rule-preview-line"><span class="rule-node">${$('rr-st').value}</span><span class="rule-arrow">── ${relationTypes.find(t=>t.id===$('rr-rel').value)?.name||''} ──►</span><span class="rule-node">${$('rr-tt').value}</span></div><div class="rule-code">${$('rr-st').value}.${$('rr-sa').value} ${$('rr-op').value} ${$('rr-tt').value}.${$('rr-ta').value}</div>`};$('rr-st').onchange=()=>{$('rr-sa').innerHTML=attrOptions($('rr-st').value,'');upd()};$('rr-tt').onchange=()=>{$('rr-ta').innerHTML=attrOptions($('rr-tt').value,'');upd()};['rr-sa','rr-ta','rr-op','rr-rel'].forEach(x=>$(x).onchange=upd);upd()}
function testRelationRule(){$('rr-test').innerHTML=`<div class="stats" style="padding:12px 0;background:#fff"><div class="stat"><label>Связь сформирована</label><b>1 180</b></div><div class="stat"><label>Цель не найдена</label><b>61</b></div><div class="stat"><label>Неоднозначно</label><b>13</b></div><div class="stat"><label>Всего проверено</label><b>1 254</b></div></div>`}
function saveRelationRule(id){const old=id?relationRules.find(x=>x.id===id):null,d={id:old?.id||uid('RR'),name:$('rr-name').value.trim()||'Без названия',sourceType:$('rr-st').value,sourceAttr:$('rr-sa').value,operator:$('rr-op').value,targetType:$('rr-tt').value,targetAttr:$('rr-ta').value,relationTypeId:$('rr-rel').value,multiplicity:document.querySelector('input[name="rr-mult"]:checked').value,active:true,formed:old?.formed||0,missing:old?.missing||0,ambiguous:old?.ambiguous||0};if(old)relationRules[relationRules.indexOf(old)]=d;else relationRules.push(d);closeModal();renderAdmin();toast(old?'Правило обновлено':'Правило создано')}

document.querySelectorAll('.product-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.product-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.app-section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('product-'+b.dataset.product).classList.add('active');if(b.dataset.product==='registry')renderRegistry();if(b.dataset.product==='admin')renderAdmin()});
loadState();renderAll();renderRegistry();renderAdmin();
</script>
</body>
</html>
