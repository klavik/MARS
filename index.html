function renderHostTable(arr){const cols=getVisibleColumns(),pages=Math.max(1,Math.ceil(arr.length/hostTable.pageSize));if(hostTable.page>pages)hostTable.page=pages;const start=(hostTable.page-1)*hostTable.pageSize,items=arr.slice(start,start+hostTable.pageSize),allChecked=items.length&&items.every(h=>selectedHostIds.has(h.id));return `<div class="table-wrap"><table><thead><tr><th style="width:42px"><input class="checkbox" type="checkbox" ${allChecked?'checked':''} onchange="togglePageHosts(this.checked,${esc(JSON.stringify(items.map(h=>h.id)))})"></th>${cols.map(c=>`<th class="sort" onclick="sortHosts(${q(c)})">${esc(COLS[c].label)} ${hostTable.sortKey===c?(hostTable.sortDirection==='asc'?'↑':'↓'):''}</th>`).join('')}<th>Действия</th></tr></thead><tbody>${items.length?items.map(h=>`<tr class="data-row" onclick="openHostDetails(${q(h.id)})"><td onclick="event.stopPropagation()"><input class="checkbox" type="checkbox" ${selectedHostIds.has(h.id)?'checked':''} onchange="toggleHostSelection(${q(h.id)},this.checked)"></td>${cols.map(c=>`<td>${COLS[c].cell(h)}</td>`).join('')}<td onclick="event.stopPropagation()"><div class="actions"><button class="xs outline" onclick="openHostDetails(${q(h.id)})">Детали</button>${canAttachAny()?`<button class="xs" onclick="openAttachModal(${q(h.id)})">＋ Сервис</button>`:''}${canCloneHost(h)?`<button class="xs outline" onclick="openCloneHost(${q(h.id)})">⧉</button>`:''}${canDeleteHost(h)?`<button class="xs danger" onclick="openDeleteHostModal(${q(h.id)})">🗑️</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="${cols.length+2}" class="empty">Хосты не найдены</td></tr>`}</tbody></table></div><div class="table-footer"><div class="muted">Показано ${items.length?start+1:0}–${Math.min(start+hostTable.pageSize,arr.length)} из ${arr.length}</div><div class="pagination"><select onchange="changeHostPageSize(this.value)">${[10,25,50,100].map(n=>`<option value="${n}" ${n===hostTable.pageSize?'selected':''}>${n} / стр.</option>`).join('')}</select><button class="xs outline" onclick="changeHostPage(-1)" ${hostTable.page<=1?'disabled':''}>←</button><span class="muted">${hostTable.page} / ${pages}</span><button class="xs outline" onclick="changeHostPage(1)" ${hostTable.page>=pages?'disabled':''}>→</button></div></div>`}
function toggleHostSelection(id,checked){checked?selectedHostIds.add(id):selectedHostIds.delete(id);renderHosts()}function togglePageHosts(checked,ids){ids.forEach(id=>checked?selectedHostIds.add(id):selectedHostIds.delete(id));renderHosts()}function clearHostSelection(){selectedHostIds.clear();renderHosts()}
function changeHostPage(d){hostTable.page=Math.max(1,hostTable.page+d);renderHosts()}function changeHostPageSize(v){hostTable.pageSize=Number(v);hostTable.page=1;renderHosts()}
function filterFieldLabel(k){return({source:'Источник',addressType:'Тип адреса',proxy:'Группа прокси',status:'Статус',serviceGroup:'Группа сервиса',service:'Сервис',collection:'Коллекция',cmdb:'CMDB / External ID',owner:'Группа создателя',lifecycle:'Состояние',name:'Имя',address:'IP / FQDN',id:'Host ID'})[k]||k}function filterValueLabel(r){if(r.field==='source')return r.value==='catalog'?'Справочник':r.value==='manual'?'Ручной':'Ручной · prefill';if(r.field==='proxy')return proxyName(r.value);if(r.field==='serviceGroup')return groupById(r.value)?.name||r.value;if(r.field==='service')return serviceById(r.value)?.name||r.value;if(r.field==='collection')return collectionById(r.value)?.name||r.value;if(r.field==='owner')return groupById(r.value)?.name||r.value;if(r.field==='lifecycle')return r.value==='catalog'?'Справочник':r.value==='without-services'?'Без сервисов':'Подключён';if(r.field==='cmdb')return r.value==='none'?'Без связи с CMDB':r.value;if(['name','address','id'].includes(r.field)){const op={contains:'содержит',equals:'равно',starts:'начинается с',not_contains:'не содержит',not_starts:'не начинается с'}[r.operator]||'содержит';return `${op} «${r.value||''}»`}return r.value}

function filterValueControl(r,index){const opts=(items)=>items.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(r.value)?'selected':''}>${esc(x.name)}</option>`).join('');if(r.field==='source')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="catalog" ${r.value==='catalog'?'selected':''}>Справочник</option><option value="manual" ${r.value==='manual'?'selected':''}>Ручной</option><option value="manual-prefill" ${r.value==='manual-prefill'?'selected':''}>Ручной · prefill</option></select>`;if(r.field==='addressType')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="ip" ${r.value==='ip'?'selected':''}>IP</option><option value="fqdn" ${r.value==='fqdn'?'selected':''}>FQDN</option></select>`;if(r.field==='proxy')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.proxyGroups)}</select>`;if(r.field==='status')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="UP" ${r.value==='UP'?'selected':''}>UP</option><option value="WARN" ${r.value==='WARN'?'selected':''}>WARN</option></select>`;if(r.field==='serviceGroup')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.groups)}</select>`;if(r.field==='service')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.services)}</select>`;if(r.field==='collection')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(visibleCollections())}</select>`;if(r.field==='owner')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.groups)}</select>`;if(r.field==='lifecycle')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="connected" ${r.value==='connected'?'selected':''}>Подключён</option><option value="without-services" ${r.value==='without-services'?'selected':''}>Без сервисов</option><option value="catalog" ${r.value==='catalog'?'selected':''}>Справочник</option></select>`;if(r.field==='cmdb')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="none" ${r.value==='none'?'selected':''}>Без связи с CMDB</option>${state.catalogHosts.map(h=>`<option value="${esc(h.externalId)}" ${h.externalId===r.value?'selected':''}>${esc(h.name)} · ${esc(h.externalId)}</option>`).join('')}</select>`;return `<input value="${esc(r.value||'')}" placeholder="Значение" oninput="setFilterDraftValue(${index},this.value)">`}
function renderHostFilters(){openModal('Фильтры хостов','Поиск по любому полю. Для справочных значений доступен выбор из списка.',`<div class="box blue-box">Все условия объединяются через «И». Поиск в верхней строке ищет сразу по всем полям, включая скрытые столбцы.</div><div id="filter-draft-list">${hostFilterDraft.length?hostFilterDraft.map((r,i)=>`<div class="row" style="align-items:end"><div class="field"><label>Поле</label><select onchange="setFilterDraftField(${i},this.value)">${['source','addressType','proxy','status','serviceGroup','service','collection','owner','lifecycle','cmdb','name','address','id'].map(k=>`<option value="${k}" ${r.field===k?'selected':''}>${filterFieldLabel(k)}</option>`).join('')}</select></div><div class="field"><label>Условие / значение</label><div class="actions">${['name','address','id'].includes(r.field)?`<select onchange="setFilterDraftOperator(${i},this.value)"><option value="contains" ${r.operator==='contains'?'selected':''}>содержит</option><option value="equals" ${r.operator==='equals'?'selected':''}>равно</option><option value="starts" ${r.operator==='starts'?'selected':''}>начинается с</option>${r.field==='name'?`<option value="not_contains" ${r.operator==='not_contains'?'selected':''}>не содержит</option><option value="not_starts" ${r.operator==='not_starts'?'selected':''}>не начинается с</option>`:''}</select>`:''}${filterValueControl(r,i)}<button class="xs danger" onclick="removeFilterDraft(${i})">✕</button></div></div></div>`).join(''):'<div class="empty">Фильтры не заданы</div>'}</div><button class="sm outline" onclick="addFilterDraft()">＋ Добавить условие</button>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="hostFilterDraft=[];renderHostFilters()">Очистить</button><button onclick="applyHostFilters()">Применить</button>`) }
function defaultFilterValue(field){if(field==='source')return'catalog';if(field==='addressType')return'ip';if(field==='proxy')return state.proxyGroups[0]?.id||'';if(field==='status')return'UP';if(field==='serviceGroup')return state.groups[0]?.id||'';if(field==='service')return state.services[0]?.id||'';if(field==='collection')return visibleCollections()[0]?.id||'';if(field==='owner')return state.groups[0]?.id||'';if(field==='lifecycle')return'connected';if(field==='cmdb')return'none';return''}function addFilterDraft(){hostFilterDraft.push({field:'source',operator:'equals',value:'catalog'});renderHostFilters()}function removeFilterDraft(i){hostFilterDraft.splice(i,1);renderHostFilters()}function setFilterDraftField(i,v){hostFilterDraft[i].field=v;hostFilterDraft[i].operator=['name','address','id'].includes(v)?'contains':'equals';hostFilterDraft[i].value=defaultFilterValue(v);renderHostFilters()}function setFilterDraftValue(i,v){hostFilterDraft[i].value=v}function setFilterDraftOperator(i,v){hostFilterDraft[i].operator=v}function applyHostFilters(){hostFilter.rules=hostFilterDraft.map(x=>({...x}));if(hostFilter.rules.some(r=>r.field==='lifecycle'&&r.value==='without-services'))showHostsWithoutServices=true;hostTable.page=1;closeModal();renderHosts()}function removeHostFilter(i){hostFilter.rules.splice(i,1);hostTable.page=1;renderHosts()}function clearHostFilters(){hostFilter.rules=[];hostFilter.query='';hostTable.page=1;renderHosts()}
function openColumnSettings(){const all=hostTable.columns;openModal('Столбцы таблицы','Скрывайте необязательные столбцы и меняйте порядок отображения.',`<div>${all.map((k,i)=>`<div class="card" style="align-items:center"><div class="card-main"><input class="checkbox" type="checkbox" ${!hostTable.hidden.includes(k)?'checked':''} onchange="toggleColumn(${q(k)},this.checked)"><div><div class="card-title">${esc(COLS[k].label)}</div><div class="meta">${k==='id'?'Сгенерированный уникальный идентификатор':'Поле таблицы'}</div></div></div><div class="actions"><button class="xs outline" onclick="moveColumn(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="xs outline" onclick="moveColumn(${i},1)" ${i===all.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`,`<button onclick="closeModal()">Готово</button>`,true)}
function toggleColumn(k,shown){if(shown)hostTable.hidden=hostTable.hidden.filter(x=>x!==k);else if(hostTable.hidden.length<hostTable.columns.length-1)hostTable.hidden.push(k);openColumnSettings();renderHosts()}function moveColumn(i,d){const j=i+d;if(j<0||j>=hostTable.columns.length)return;const a=hostTable.columns;[a[i],a[j]]=[a[j],a[i]];openColumnSettings();renderHosts()}
function canAttachAny(){return state.services.some(canAttachService)}
function openHostDetails(id){const h=state.hosts.find(x=>x.id===id);if(!h)return;const allowed=isAdmin()?h.attachments:ownAttachments(h);const foreign=isAdmin()?[]:foreignEndpointServices(h);const owner=h.sourceType==='catalog'?'':`<div class="box blue-box"><b>Группа создателя:</b> ${esc(groupById(h.ownerGroupId)?.name||'—')}<br><span class="hint">Создатель и его одногрупники с permission «Постановка на мониторинг» могут редактировать общие поля ручного Host. Подключение сервисов других групп это право не меняет.</span></div>`;const source=h.sourceType==='catalog'?`<div class="box violet-box"><b>Источник: ${esc(state.catalogSources.find(s=>s.id===h.catalogBinding?.sourceId)?.name||'CMDB')}</b><br>External ID: <span class="mono">${esc(h.catalogBinding?.externalId||'—')}</span><br><span class="hint">Имя хоста и IP/FQDN обновляются синхронизацией из справочника.</span></div>`:h.sourceType==='manual-prefill'?`<div class="box amber-box"><b>Ручной хост, разово заполненный из справочника.</b><br>Автоматическая синхронизация выключена.</div>`:`<div class="box"><b>Источник: ручной ввод.</b><br><span class="hint">Хост не появляется во вкладке «Хосты из справочника».</span></div>`;const noServices=isManualHost(h)&&isOwnedForUser(h)&&!h.attachments.length;const links=visibleHostCollectionLinks(h);const collectionsBlock=`<h3 style="margin:18px 0 8px">Привязанные коллекции</h3>${links.length?links.map(l=>{const c=collectionById(l.collectionId),g=groupById(l.attachedByGroupId);return `<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c?.name||'Коллекция')}</div><div class="meta">Группа: <b>${esc(g?.name||'—')}</b> · актуальный состав: ${c?.serviceIds.length||0} сервисов</div><div class="hint">Изменения состава коллекции автоматически применяются к этому Host.</div></div></div>${c&&canManageCollection(c)?`<button class="xs outline" onclick="requestUnlinkCollection(${q(h.id)},${q(c.id)})">Отвязать коллекцию</button>`:''}</div>`}).join(''):'<div class="empty">Коллекции ваших групп к хосту не привязаны.</div>'}`;openModal(`Хост: ${h.name}`,`${h.id} · имя не является уникальным`,`${owner}${source}<div class="row"><div class="box"><b>Адрес</b><br>${addressBadge(h)} <span class="mono">${esc(h.address)}</span></div><div class="box"><b>Группа прокси</b><br>${esc(proxyName(h.proxyGroup))}</div></div>${noServices?`<div class="box amber-box"><b>На хосте нет подключённых сервисов.</b><br><span class="hint">Он скрыт из «Подключённых хостов» по умолчанию. Включите фильтр «Показывать хосты без сервисов», чтобы видеть такие Host. Группа создателя может удалить пустой ручной Host.</span></div>`:''}${collectionsBlock}<h3 style="margin:18px 0 8px">Подключения моих групп</h3>${allowed.length?allowed.map((a,i)=>attachmentDetail(h,a,i)).join(''):'<div class="empty">У ваших групп нет подключённых сервисов на этом хосте.</div>'}${foreign.length?foreignEndpointBlock(h,foreign):''}`,`<button class="ghost" onclick="closeModal()">Закрыть</button>${canAttachAny()?`<button class="outline" onclick="openAttachModal(${q(h.id)})">＋ Подключить сервис</button><button class="outline" onclick="openAttachCollectionModal(${q(h.id)})">📦 Подключить коллекцию</button>`:''}${canCloneHost(h)?`<button class="outline" onclick="openCloneHost(${q(h.id)})">⧉ Клонировать</button>`:''}${canEditHost(h)?`<button class="outline" onclick="openHostEditModal(${q(h.id)})">✏️ Редактировать</button>`:''}${canDeleteHost(h)?`<button class="danger" onclick="openDeleteHostModal(${q(h.id)})">☠ Удалить объект</button>`:''}`)}
function attachmentDetail(h,a,i){const s=serviceById(a.serviceId),g=groupById(a.attachedByGroupId),port=a.portOverride||s?.defaultPort||'—',can=canDetach(a),activeCollections=(a.collectionIds||[]).map(collectionById).filter(Boolean),memberCollections=serviceCollections(a.serviceId);return `<div class="card"><div class="card-main"><span class="icon">${esc(s?.icon||'🔌')}</span><div><div class="card-title">${esc(s?.name||'Сервис')}</div><div class="meta">Подключён от имени группы: <b>${esc(g?.name||'—')}</b> · Target: <span class="mono">${esc(h.address)}:${esc(port)}</span></div><div class="pill-row"><span class="badge">${esc(s?.type||'')}</span><span class="badge b-blue">${esc(s?.protocol||'http').toUpperCase()}</span>${a.portOverride?'<span class="badge b-amber">порт переопределён</span>':''}${a.direct?'<span class="badge b-blue">Самостоятельно</span>':''}${activeCollections.map(c=>`<span class="badge b-green">📦 ${esc(c.name)}</span>`).join('')}</div>${memberCollections.length?`<div class="hint">Сервис входит в коллекции: ${memberCollections.map(c=>esc(c.name)).join(', ')}</div>`:''}${!a.direct&&activeCollections.length?'<div class="hint">Подключение управляется коллекцией. Самостоятельно отвязать сервис нельзя — измените состав коллекции или отвяжите коллекцию.</div>':''}</div></div><div class="actions"><button class="xs outline" onclick="openPortModal(${q(h.id)},${q(a.id)})" ${can?'':'disabled'}>Порт</button><button class="xs danger" onclick="requestDetachAttachment(${q(h.id)},${q(a.id)})" ${can&&a.direct?'':'disabled'}>Отвязать</button></div></div>`}
function foreignEndpointServices(h){const own=userGroupIds(),key=endpointKey(h),map=new Map();state.hosts.filter(x=>endpointKey(x)===key).flatMap(x=>x.attachments).filter(a=>!own.has(a.attachedByGroupId)).forEach(a=>{const gid=a.attachedByGroupId,sid=a.serviceId;if(!map.has(gid))map.set(gid,new Set());map.get(gid).add(sid)});return [...map.entries()].map(([gid,set])=>({gid,serviceIds:[...set]}))}
function foreignEndpointBlock(h,items){return `<div class="box blue-box" style="margin-top:16px"><b>Справка по тому же адресу</b><div class="hint">Для хостов MARS с ${h.addressType==='ip'?'тем же IP-адресом':'тем же FQDN'} <span class="mono">${esc(h.address)}</span> уже настроен мониторинг:</div>${items.map(x=>`<div style="margin-top:10px"><b>${esc(groupById(x.gid)?.name||'Группа')}</b><div class="pill-row" style="margin-top:5px">${x.serviceIds.map(id=>{const s=serviceById(id);return `<span class="badge b-violet">${esc(s?.icon||'🔌')} ${esc(s?.name||'Сервис')}</span>`}).join('')}</div></div>`).join('')}<div class="hint">Порты, параметры сборов и другие детали чужих подключений не раскрываются.</div></div>`}
function normalizeEndpointValue(type,address){const v=String(address||'').trim().toLowerCase();return type==='fqdn'?v.replace(/\.+$/,''):v}
function matchingHostsByEndpoint(type,address,excludeId=''){const normalized=normalizeEndpointValue(type,address);if(!normalized)return[];return state.hosts.filter(h=>h.id!==excludeId&&h.addressType===type&&normalizeEndpointValue(type,h.address)===normalized)}
function canReferenceExistingHost(h){return !!h&&(isAdmin()||h.sourceType==='catalog'||h.attachments.some(a=>userGroupIds().has(a.attachedByGroupId))||(isManualHost(h)&&h.ownerGroupId&&userGroupIds().has(h.ownerGroupId)))}

function openEditTemplate(id){const t=templateById(id);if(!t)return;if(!canManageTemplate(t))return toast('Редактировать шаблон может только его группа-владелец');const g=groupById(t.ownerGroupId);openModal('Редактировать шаблон сервиса','Шаблон публичен для всех пользователей MARS. Авторизация и секреты в нём не хранятся.',`<div class="box blue-box"><b>Группа-владелец:</b> ${esc(g?.name||'—')}<br><span class="hint">Группа-владелец не меняется при редактировании.</span></div><div class="field"><label>Название *</label><input id="edit-template-name" class="wide" value="${esc(t.name)}"></div><div class="row3"><div class="field"><label>Тип</label><select id="edit-template-type" class="wide"><option ${t.type==='ExporterScrape'?'selected':''}>ExporterScrape</option><option ${t.type==='SQL'?'selected':''}>SQL</option><option ${t.type==='BlackBox'?'selected':''}>BlackBox</option></select></div><div class="field"><label>Иконка</label><input id="edit-template-icon" class="wide" value="${esc(t.icon||'🔌')}"></div><div class="field"><label>Порт</label><input id="edit-template-port" class="wide" type="number" min="1" max="65535" value="${esc(t.defaultPort)}"></div></div><div class="row"><div class="field"><label>Путь метрик</label><input id="edit-template-metrics" class="wide mono" value="${esc(t.metrics||'/metrics')}"></div><div class="field"><label>Протокол</label><select id="edit-template-protocol" class="wide"><option value="http" ${(t.protocol||'http')==='http'?'selected':''}>HTTP</option><option value="https" ${(t.protocol||'http')==='https'?'selected':''}>HTTPS</option></select></div></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveTemplate(${q(id)})">Сохранить</button>`)}
function saveTemplate(id){const t=templateById(id);if(!t||!canManageTemplate(t))return toast('Недостаточно прав');const name=$('edit-template-name')?.value.trim()||'';const port=Number($('edit-template-port')?.value);if(!name)return toast('Введите название шаблона');if(!templateNameAvailable(name,id))return toast('Шаблон с таким названием уже существует');if(!Number.isInteger(port)||port<1||port>65535)return toast('Некорректный порт');t.name=name;t.type=$('edit-template-type').value;t.icon=$('edit-template-icon').value.trim()||'🔌';t.defaultPort=port;t.metrics=$('edit-template-metrics').value.trim()||'/metrics';t.protocol=$('edit-template-protocol').value;saveState();closeModal();renderAll();toast('Шаблон обновлён')}
function openDeleteTemplate(id){const t=templateById(id);if(!t)return;if(!canManageTemplate(t))return toast('Удалить шаблон может только его группа-владелец');confirmModal('Удалить шаблон',`Удалить публичный шаблон <b>${esc(t.name)}</b>?<br><span class="muted">Уже созданные из него сервисы не изменятся.</span>`,'confirmDeleteTemplate',q(id))}

function canCreateCollection(){return manageableGroups().length>0}
function collectionNameAvailable(name,ownerGroupId,editId=''){const n=String(name||'').trim().toLowerCase();return !!n&&!state.collections.some(c=>c.id!==editId&&c.ownerGroupId===ownerGroupId&&String(c.name||'').trim().toLowerCase()===n)}
function renderCollections(){const arr=visibleCollections(),canCreate=canCreateCollection();page('collections','📦 Коллекции','Живые групповые конфигурации: состав коллекции автоматически поддерживается на всех привязанных к ней хостах.',`<button onclick="openCollectionModal()" ${canCreate?'':'disabled'}>➕ Создать коллекцию</button>`,`<div class="panel"><div class="info"><b>Коллекция — desired state.</b> Она принадлежит группе и содержит сервисы этой группы. Если добавить сервис в коллекцию, MARS автоматически добавит его на все Host, к которым коллекция привязана. При удалении сервиса можно либо снять его с хостов, либо оставить самостоятельным. Один и тот же сервис на Host не дублируется.</div><div class="content">${arr.map(collectionCard).join('')||'<div class="empty">В ваших группах пока нет коллекций</div>'}</div></div>`) }
function collectionCard(c){const g=groupById(c.ownerGroupId),svcs=c.serviceIds.map(serviceById).filter(Boolean),can=canManageCollection(c),hosts=collectionHostCount(c);return `<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c.name)}</div><div class="meta">${esc(c.description||'Без описания')}</div><div class="pill-row"><span class="badge b-blue">👥 ${esc(g?.name||'—')}</span><span class="badge">${svcs.length} сервисов</span><span class="badge b-violet">🖥️ ${hosts} хостов</span>${svcs.map(s=>`<span class="badge b-green">${esc(s.icon)} ${esc(s.name)}</span>`).join('')}</div></div></div><div class="actions">${can?`<button class="xs outline" onclick="openCollectionModal(${q(c.id)})">✏️ Редактировать</button><button class="xs danger" onclick="openDeleteCollection(${q(c.id)})">🗑️ Удалить</button>`:''}</div></div>`}
function openCollectionModal(id=''){const c=id?collectionById(id):null;if(c&&!canManageCollection(c))return toast('Редактировать коллекцию может только её группа-владелец');const groups=manageableGroups();if(!c&&!groups.length)return toast('Нет группы с permission «Постановка на мониторинг»');collectionDraft=c?{id:c.id,name:c.name,description:c.description||'',ownerGroupId:c.ownerGroupId,serviceIds:[...c.serviceIds],originalServiceIds:[...c.serviceIds]}:{id:null,name:'',description:'',ownerGroupId:groups[0]?.id||'',serviceIds:[],originalServiceIds:[]};renderCollectionModal()}
function preserveCollectionDraftFields(){collectionDraft.name=$('collection-name')?.value??collectionDraft.name;collectionDraft.description=$('collection-description')?.value??collectionDraft.description}
function renderCollectionModal(){const editing=!!collectionDraft.id,groups=manageableGroups(),ownerGroupId=collectionDraft.ownerGroupId||groups[0]?.id||'',g=groupById(ownerGroupId);collectionDraft.ownerGroupId=ownerGroupId;if(editing){const c=collectionById(collectionDraft.id);if(!c)return closeModal();const linkedHosts=collectionHostCount(c),services=c.serviceIds.map(serviceById).filter(Boolean),available=state.services.filter(s=>s.ownerGroupId===ownerGroupId&&canManageService(s)&&!c.serviceIds.includes(s.id));openModal('Редактировать коллекцию',`Изменение состава применяется к ${linkedHosts} привязанным хостам сразу.`,`<div class="box blue-box"><b>Группа-владелец:</b> ${esc(g?.name||'—')} · <b>привязано хостов: ${linkedHosts}</b><br><span class="hint">Название и описание сохраняются отдельно. Добавление и удаление сервисов — самостоятельные действия с немедленным применением к связанным Host.</span></div><div class="field"><label>Название *</label><input id="collection-name" class="wide" value="${esc(collectionDraft.name)}" oninput="collectionDraft.name=this.value"></div><div class="field"><label>Описание</label><textarea id="collection-description" class="wide" rows="2" oninput="collectionDraft.description=this.value">${esc(collectionDraft.description)}</textarea></div><div class="separator"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h3 style="margin:0">Сервисы коллекции</h3><div class="hint">Текущий состав desired state коллекции.</div></div><button class="sm" onclick="openAddCollectionServices(${q(c.id)})" ${available.length?'':'disabled'}>＋ Добавить сервисы</button></div><div style="margin-top:12px">${services.length?services.map(s=>{const impact=collectionServiceRemovalImpact(c,s.id);return `<div class="card"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)} · порт ${s.defaultPort} · коллекция управляет сервисом на ${linkedHosts} Host</div></div></div><button class="xs danger" onclick="requestRemoveCollectionService(${q(c.id)},${q(s.id)})">Удалить</button></div>`}).join(''):'<div class="empty">В коллекции нет сервисов</div>'}</div>`,`<button class="ghost" onclick="closeModal()">Закрыть</button><button onclick="saveCollectionMetadata()">Сохранить название и описание</button>`);return}
const services=state.services.filter(s=>s.ownerGroupId===ownerGroupId&&canManageService(s));collectionDraft.serviceIds=collectionDraft.serviceIds.filter(id=>services.some(s=>s.id===id));openModal('Создать коллекцию','Для новой коллекции выберите группу, название и начальный состав сервисов.',`<div class="field"><label>Группа-владелец *</label><select id="collection-owner" class="wide" onchange="changeCollectionOwner(this.value)">${groups.map(x=>`<option value="${esc(x.id)}" ${x.id===ownerGroupId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Название *</label><input id="collection-name" class="wide" value="${esc(collectionDraft.name)}" oninput="collectionDraft.name=this.value"></div><div class="field"><label>Описание</label><textarea id="collection-description" class="wide" rows="2" oninput="collectionDraft.description=this.value">${esc(collectionDraft.description)}</textarea></div><div class="separator"></div><h3 style="margin:0 0 8px">Начальный состав</h3><div class="hint">Можно добавлять только сервисы группы «${esc(g?.name||'—')}». После создания состав меняется отдельными действиями.</div><div class="service-picker" style="margin-top:10px">${services.map(s=>{const checked=collectionDraft.serviceIds.includes(s.id);return `<label class="card ${checked?'selected':''}" style="cursor:pointer"><div class="card-main"><input class="checkbox" type="checkbox" ${checked?'checked':''} onchange="toggleCollectionService(${q(s.id)},this.checked)"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)} · порт ${s.defaultPort}</div></div></div></label>`}).join('')||'<div class="empty">В выбранной группе пока нет сервисов</div>'}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveCollection()">Создать коллекцию</button>`) }
function changeCollectionOwner(gid){collectionDraft.name=$('collection-name')?.value??collectionDraft.name;collectionDraft.description=$('collection-description')?.value??collectionDraft.description;collectionDraft.ownerGroupId=gid;collectionDraft.serviceIds=[];collectionDraft.originalServiceIds=[];renderCollectionModal()}
function toggleCollectionService(id,checked){collectionDraft.name=$('collection-name')?.value??collectionDraft.name;collectionDraft.description=$('collection-description')?.value??collectionDraft.description;if(checked){if(!collectionDraft.serviceIds.includes(id))collectionDraft.serviceIds.push(id)}else collectionDraft.serviceIds=collectionDraft.serviceIds.filter(x=>x!==id);renderCollectionModal()}
function saveCollection(){collectionDraft.name=$('collection-name')?.value.trim()||collectionDraft.name.trim();collectionDraft.description=$('collection-description')?.value.trim()??collectionDraft.description.trim();const gid=collectionDraft.ownerGroupId;if(!gid||!hasMonitoringPermission(gid))return toast('Недостаточно прав на группу');if(!collectionDraft.name)return toast('Введите название коллекции');if(!collectionNameAvailable(collectionDraft.name,gid,collectionDraft.id||''))return toast('Коллекция с таким названием уже существует в этой группе');if(collectionDraft.id)return saveCollectionMetadata();const validIds=collectionDraft.serviceIds.filter(id=>{const s=serviceById(id);return s&&s.ownerGroupId===gid&&canManageService(s)});if(!validIds.length)return toast('Для новой коллекции добавьте хотя бы один сервис');state.collections.push({id:uid('col'),name:collectionDraft.name,description:collectionDraft.description,ownerGroupId:gid,createdBy:currentUser().id,serviceIds:[...validIds]});saveState();closeModal();renderAll();toast('Коллекция создана')}
function saveCollectionMetadata(){if(!collectionDraft.id)return saveCollection();preserveCollectionDraftFields();const c=collectionById(collectionDraft.id);if(!c||!canManageCollection(c))return toast('Недостаточно прав');const name=String(collectionDraft.name||'').trim();if(!name)return toast('Введите название коллекции');if(!collectionNameAvailable(name,c.ownerGroupId,c.id))return toast('Коллекция с таким названием уже существует в этой группе');c.name=name;c.description=String(collectionDraft.description||'').trim();collectionDraft.name=c.name;collectionDraft.description=c.description;saveState();renderAll();renderCollectionModal();toast('Название и описание сохранены')}
function collectionServiceAddImpact(c,serviceId){let added=0,marked=0;state.hosts.filter(h=>hostCollectionLinks(h).some(l=>l.collectionId===c.id)).forEach(h=>{const a=findHostServiceAttachment(h,serviceId,c.ownerGroupId);if(a){if(!(a.collectionIds||[]).includes(c.id))marked++}else added++});return{added,marked,total:added+marked}}
function collectionServiceRemovalImpact(c,serviceId){let detached=0,kept=0,total=0;state.hosts.filter(h=>hostCollectionLinks(h).some(l=>l.collectionId===c.id)).forEach(h=>{const a=findHostServiceAttachment(h,serviceId,c.ownerGroupId);if(!a)return;total++;const other=(a.collectionIds||[]).filter(id=>id!==c.id);if(!a.direct&&!other.length)detached++;else kept++});return{detached,kept,total}}
function openAddCollectionServices(collectionId){preserveCollectionDraftFields();const c=collectionById(collectionId);if(!c||!canManageCollection(c))return toast('Недостаточно прав');collectionServicePickerIds=new Set();renderAddCollectionServices(collectionId)}
function renderAddCollectionServices(collectionId){const c=collectionById(collectionId);if(!c)return;const available=state.services.filter(s=>s.ownerGroupId===c.ownerGroupId&&canManageService(s)&&!c.serviceIds.includes(s.id)),selected=[...collectionServicePickerIds].filter(id=>available.some(s=>s.id===id));collectionServicePickerIds=new Set(selected);const all=available.length&&available.every(s=>collectionServicePickerIds.has(s.id));const totals=selected.reduce((acc,id)=>{const r=collectionServiceAddImpact(c,id);acc.added+=r.added;acc.marked+=r.marked;return acc},{added:0,marked:0});openModal('Добавить сервисы в коллекцию',`${c.name} · изменение будет применено сразу`,`<div class="box blue-box"><b>Desired state:</b> выбранные сервисы будут добавлены в коллекцию и автоматически применены ко всем ${collectionHostCount(c)} связанным Host. Дубли не создаются.</div>${available.length?`<label class="box" style="display:flex;align-items:center;gap:10px;cursor:pointer"><input class="checkbox" type="checkbox" ${all?'checked':''} onchange="toggleAllCollectionServicePicker(this.checked,${q(collectionId)})"><b>Выбрать все доступные</b><span class="muted">${available.length}</span></label><div>${available.map(s=>{const checked=collectionServicePickerIds.has(s.id),r=collectionServiceAddImpact(c,s.id);return `<label class="card ${checked?'selected':''}" style="cursor:pointer"><div class="card-main"><input class="checkbox" type="checkbox" ${checked?'checked':''} onchange="toggleCollectionServicePicker(${q(s.id)},this.checked,${q(collectionId)})"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)} · порт ${s.defaultPort} · новых подключений: ${r.added}${r.marked?` · существующих будет включено в коллекцию: ${r.marked}`:''}</div></div></div></label>`}).join('')}</div>`:'<div class="empty">Все сервисы группы уже входят в коллекцию</div>'}${selected.length?`<div class="box amber-box"><b>Выбрано сервисов: ${selected.length}</b><br>Будет создано новых Host-Service: ${totals.added}${totals.marked?`<br>Существующих Host-Service получат связь с коллекцией: ${totals.marked}`:''}</div>`:''}`,`<button class="outline" onclick="renderCollectionModal()">Назад</button><button onclick="applyAddedCollectionServices(${q(collectionId)})" ${selected.length?'':'disabled'}>Добавить выбранные</button>`)}
function toggleCollectionServicePicker(id,checked,collectionId){checked?collectionServicePickerIds.add(id):collectionServicePickerIds.delete(id);renderAddCollectionServices(collectionId)}
function toggleAllCollectionServicePicker(checked,collectionId){const c=collectionById(collectionId);if(!c)return;state.services.filter(s=>s.ownerGroupId===c.ownerGroupId&&canManageService(s)&&!c.serviceIds.includes(s.id)).forEach(s=>checked?collectionServicePickerIds.add(s.id):collectionServicePickerIds.delete(s.id));renderAddCollectionServices(collectionId)}
function applyAddedCollectionServices(collectionId){const c=collectionById(collectionId);if(!c||!canManageCollection(c))return toast('Недостаточно прав');const ids=[...collectionServicePickerIds].filter(id=>{const s=serviceById(id);return s&&s.ownerGroupId===c.ownerGroupId&&!c.serviceIds.includes(id)});if(!ids.length)return toast('Выберите хотя бы один сервис');let added=0,marked=0;ids.forEach(id=>{c.serviceIds.push(id);const r=syncAddedCollectionService(c,id);added+=r.added;marked+=r.marked});saveState();renderAll();collectionServicePickerIds.clear();renderCollectionModal();toast(`Добавлено сервисов: ${ids.length} · новых подключений: ${added}${marked?` · существующих включено в коллекцию: ${marked}`:''}`)}
function requestRemoveCollectionService(collectionId,serviceId){preserveCollectionDraftFields();const c=collectionById(collectionId),s=serviceById(serviceId);if(!c||!s||!canManageCollection(c))return toast('Недостаточно прав');const r=collectionServiceRemovalImpact(c,serviceId);openModal('Удалить сервис из коллекции',`${s.name} · ${c.name}`,`<div class="box amber-box">Сервис будет удалён из состава коллекции сразу. Коллекция привязана к <b>${collectionHostCount(c)}</b> Host.</div><div class="card"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">Если снять управляемое подключение: сервис будет удалён с ${r.detached} Host и останется на ${r.kept} Host, где он подключён самостоятельно или поддерживается другой коллекцией.</div></div></div></div><div class="box"><b>Удалить из коллекции и снять с хостов</b><br><span class="hint">MARS снимет сервис только там, где после удаления этой коллекции не останется другой причины для его существования.</span></div><div class="box blue-box"><b>Удалить из коллекции, оставить на хостах</b><br><span class="hint">На связанных Host сервис станет самостоятельным и больше не будет управляться этой коллекцией.</span></div>`,`<button class="ghost" onclick="renderCollectionModal()">Отмена</button><button class="outline" onclick="removeCollectionServiceWithMode(${q(collectionId)},${q(serviceId)},'keep')">Оставить на хостах</button><button class="danger" onclick="removeCollectionServiceWithMode(${q(collectionId)},${q(serviceId)},'delete')">Снять с хостов</button>`)}
function removeCollectionServiceWithMode(collectionId,serviceId,mode){const c=collectionById(collectionId),s=serviceById(serviceId);if(!c||!s||!canManageCollection(c))return toast('Недостаточно прав');if(!c.serviceIds.includes(serviceId))return renderCollectionModal();c.serviceIds=c.serviceIds.filter(id=>id!==serviceId);const r=applyCollectionServiceRemoval(c,serviceId,mode);saveState();renderAll();renderCollectionModal();toast(mode==='keep'?`«${s.name}» удалён из коллекции и оставлен на хостах самостоятельным`:`«${s.name}» удалён из коллекции · снято с хостов: ${r.detached}${r.kept?` · осталось: ${r.kept}`:''}`)}
function renderCollectionRemovalChoices(validIds,removed){const c=collectionById(collectionDraft.id),hostCount=collectionHostCount(c);openModal('Как удалить сервисы из коллекции?',`${c?.name||''} · привязано хостов: ${hostCount}`,`<div class="box amber-box">Этот экран оставлен для совместимости со старыми сценариями редактирования.</div>${removed.map(id=>{const s=serviceById(id);return `<div class="card"><div class="card-main"><span class="icon">${esc(s?.icon||'🔌')}</span><div><div class="card-title">${esc(s?.name||id)}</div></div></div></div>`}).join('')}`,`<button class="outline" onclick="renderCollectionModal()">Назад</button>`)}

function openDeleteCollection(id){const c=collectionById(id);if(!c||!canManageCollection(c))return toast('Удалить коллекцию может только её группа-владелец');const hosts=collectionHostCount(c);if(!hosts)return confirmModal('Удалить коллекцию',`Удалить коллекцию <b>${esc(c.name)}</b>?`,'confirmDeleteCollection',q(id));openModal('Удалить коллекцию',`${c.name} · привязано хостов: ${hosts}`,`<div class="box red-box">Коллекция перестанет быть привязана к ${hosts} хостам. Выберите, что сделать с сервисами, которые поддерживались этой коллекцией.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="deleteCollectionWithMode(${q(id)},'keep')">Удалить коллекцию, сервисы оставить</button><button class="danger" onclick="deleteCollectionWithMode(${q(id)},'delete')">Удалить коллекцию и снять её сервисы</button>`,true)}
function confirmDeleteCollection(id){deleteCollectionWithMode(id,'keep')}
function deleteCollectionWithMode(id,mode){const c=collectionById(id);if(!c||!canManageCollection(c))return toast('Недостаточно прав');state.hosts.forEach(h=>{if(!hostCollectionLinks(h).some(l=>l.collectionId===id))return;h.collectionLinks=h.collectionLinks.filter(l=>l.collectionId!==id);h.attachments.forEach(a=>{if(!(a.collectionIds||[]).includes(id))return;a.collectionIds=a.collectionIds.filter(cid=>cid!==id);if(mode==='keep')a.direct=true});h.attachments=h.attachments.filter(a=>a.direct||(a.collectionIds||[]).length)});state.collections=state.collections.filter(x=>x.id!==id);saveState();closeModal();renderAll();toast(mode==='keep'?'Коллекция удалена, сервисы оставлены самостоятельными':'Коллекция и управляемые ею подключения удалены')}
function applicableCollections(){return visibleCollections().filter(c=>canManageCollection(c)&&c.serviceIds.some(id=>{const s=serviceById(id);return s&&canAttachService(s)}))}
function openAttachCollectionModal(hostId){const h=state.hosts.find(x=>x.id===hostId);if(!h)return;renderAttachCollectionModal([hostId])}
function openBulkAttachCollectionModal(){const ids=[...selectedHostIds].filter(id=>state.hosts.some(h=>h.id===id));if(!ids.length)return toast('Выберите хотя бы один хост');renderAttachCollectionModal(ids)}
function renderAttachCollectionModal(hostIds){const hosts=hostIds.map(id=>state.hosts.find(h=>h.id===id)).filter(Boolean),cols=applicableCollections();openModal(hosts.length>1?'Массовое подключение коллекции':'Подключить коллекцию',hosts.length>1?`Выбрано хостов: ${hosts.length}`:`${hosts[0]?.name||''} · ${hosts[0]?.id||''}`,`<div class="box blue-box"><b>Коллекция остаётся привязанной к Host.</b><br>Её состав автоматически поддерживается на этих хостах. Если сервис уже подключён самостоятельно, дубль не создаётся — к нему добавляется управление коллекцией.</div>${cols.length?cols.map(c=>{const g=groupById(c.ownerGroupId),svcs=c.serviceIds.map(serviceById).filter(Boolean),linked=hosts.filter(h=>hostCollectionLinks(h).some(l=>l.collectionId===c.id)).length;return `<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c.name)}</div><div class="meta">${esc(g?.name||'—')} · ${svcs.length} сервисов${linked?` · уже привязана к ${linked} выбранным Host`:''}</div><div class="pill-row">${svcs.map(s=>`<span class="badge b-green">${esc(s.icon)} ${esc(s.name)}</span>`).join('')}</div></div></div><button class="sm" onclick="applyCollectionToHosts(${q(c.id)},${esc(JSON.stringify(hostIds))})">${linked===hosts.length?'Синхронизировать':'Привязать'}</button></div>`}).join(''):'<div class="empty">Нет доступных коллекций ваших групп</div>'}`,`<button class="ghost" onclick="closeModal()">Закрыть</button>`,true)}
function applyCollectionToHosts(collectionId,hostIds){const c=collectionById(collectionId);if(!c||!canManageCollection(c))return toast('Недостаточно прав на коллекцию');let links=0,added=0,marked=0;hostIds.forEach(hostId=>{const h=state.hosts.find(x=>x.id===hostId);if(!h)return;const had=hostCollectionLinks(h).some(l=>l.collectionId===c.id);const r=linkCollectionToHost(h,c);if(!had)links++;added+=r.added;marked+=r.marked});saveState();closeModal();renderAll();toast(`Коллекция привязана к новым Host: ${links} · новых сервисов: ${added}${marked?` · существующих сервисов включено в коллекцию: ${marked}`:''}`)}
function requestUnlinkCollection(hostId,collectionId){const h=state.hosts.find(x=>x.id===hostId),c=collectionById(collectionId);if(!h||!c||!canManageCollection(c))return toast('Недостаточно прав на коллекцию');openModal('Отвязать коллекцию от хоста',`${c.name} → ${h.name}`,`<div class="box amber-box">После отвязки изменения коллекции больше не будут применяться к этому Host. Выберите судьбу сервисов этой коллекции.</div>`,`<button class="ghost" onclick="openHostDetails(${q(hostId)})">Отмена</button><button class="outline" onclick="unlinkCollectionFromHost(${q(hostId)},${q(collectionId)},'keep')">Оставить сервисы самостоятельными</button><button class="danger" onclick="unlinkCollectionFromHost(${q(hostId)},${q(collectionId)},'delete')">Снять сервисы коллекции</button>`,true)}
function unlinkCollectionFromHost(hostId,collectionId,mode){const h=state.hosts.find(x=>x.id===hostId),c=collectionById(collectionId);if(!h||!c||!canManageCollection(c))return;h.collectionLinks=h.collectionLinks.filter(l=>l.collectionId!==collectionId);h.attachments.forEach(a=>{if(!(a.collectionIds||[]).includes(collectionId))return;a.collectionIds=a.collectionIds.filter(id=>id!==collectionId);if(mode==='keep')a.direct=true});h.attachments=h.attachments.filter(a=>a.direct||(a.collectionIds||[]).length);saveState();renderHosts();openHostDetails(hostId);toast(mode==='keep'?'Коллекция отвязана, сервисы оставлены самостоятельными':'Коллекция и её управляемые подключения сняты с хоста')}
function renderAccess(){const rules=[['Идентичность Host','Имя не уникально. Устойчивый идентификатор — сгенерированный Host ID.'],['Создать manual Host','Пользователь с permission «Постановка на мониторинг» выбирает группу создателя и может создать Host без сервисов. Подключение сервисов при создании необязательно.'],['Видимость «Подключённые хосты»','По умолчанию видны Host с attachment от одной из групп пользователя, а группе создателя — также её ручные Host, которые используются другими группами. Фильтр «Показывать хосты без сервисов» добавляет пустые manual Host группы создателя.'],['Группа создателя manual Host','Фиксируется при создании. Участники этой группы с permission «Постановка на мониторинг» могут редактировать и клонировать manual Host. Подключение чужих сервисов это право не меняет.'],['Редактировать manual Host','Создатель и его одногрупники с permission «Постановка на мониторинг». Чужой attachment права не даёт, а его появление не ограничивает права группы создателя.'],['Клонировать manual Host','Создатель и его одногрупники с permission «Постановка на мониторинг» могут создать новый Host с новым ID и предзаполненными полями. Сервисы при клонировании также необязательны.'],['Редактировать catalog Host','Имя, IP/FQDN и CMDB-поля меняются только синхронизацией.'],['Удалить пустой manual Host','Создатель и его одногрупники с permission «Постановка на мониторинг» могут удалить ручной Host только если на нём нет ни одного attachment любых групп.'],['Удалить Host с сервисами','Обычному пользователю нельзя. Сначала должны быть отсоединены все сервисы. MARS admin сохраняет административное право удалить Host.'],['Удалить catalog Host','Обычному пользователю нельзя; административное действие доступно MARS admin.'],['Отвязать сервис','Только пользователь с permission «Постановка на мониторинг» в группе attachment’а.'],['Массовые действия','Подключение и отсоединение сервисов к выбранным хостам с проверкой прав по группе attachment’а. Коллекцию можно привязать к одному или нескольким Host; затем её состав автоматически поддерживается на них.'],['Коллекции','Коллекция принадлежит группе и является desired state. Добавление сервиса автоматически применяет его ко всем привязанным Host. При удалении сервиса можно снять его с Host или оставить самостоятельным. Дубли Host+Service не создаются.'],['Чужие подключения','В деталях не раскрываются; по совпадающему IP/FQDN доступна справка «группа → сервисы».'],['Проверка при создании manual Host','После ввода IP/FQDN MARS ищет Host с тем же endpoint, показывает группы и сервисы и предлагает использовать доступный существующий Host. Совпадение не блокирует создание нового Host.']];page('access','👥 Доступ','Демонстрационная модель пользователей, групп и прав.','',`<div class="panel"><div class="info"><b>Выбранный вариант:</b> имя хоста не уникально. Единственная техническая идентичность — сгенерированный Host ID.</div><div class="content"><h3>Пользователи</h3>${state.users.map(u=>`<div class="card"><div class="card-main"><span class="avatar">${esc(u.initials)}</span><div><div class="card-title">${esc(u.name)} ${u.id===currentUser().id?'<span class="badge b-blue">текущий</span>':''}</div><div class="meta">${u.isAdmin?'MARS admin':'Пользователь'}</div><div class="pill-row">${u.groups.map(g=>`<span class="badge b-blue">${esc(groupById(g)?.name||g)}${u.permissions?.[g]?.includes('monitoring.manage')?' · monitoring.manage':''}</span>`).join('')}</div></div></div><button class="xs outline" onclick="switchUser(${q(u.id)})">Переключиться</button></div>`).join('')}<h3>Правила</h3><div class="box"><table style="min-width:0"><tbody>${rules.map(r=>`<tr><td style="padding:8px;border-bottom:1px solid #e2e8f0;font-weight:800">${r[0]}</td><td style="padding:8px;border-bottom:1px solid #e2e8f0">${r[1]}</td></tr>`).join('')}</tbody></table></div></div></div>`)}
loadState();renderAll();
</script>
</body>
</html>
