<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARS — Система мониторинга</title>
  <style>
    :root {
      --primary:#3B82F6; --primary-hover:#2563EB; --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
      --slate-50:#F8FAFC; --slate-100:#F1F5F9; --slate-200:#E2E8F0; --slate-300:#CBD5E1;
      --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#475569; --slate-700:#334155;
      --slate-800:#1E293B; --slate-900:#0F172A; --blue-50:#EFF6FF; --blue-100:#DBEAFE;
      --blue-200:#BFDBFE; --blue-700:#1D4ED8; --blue-800:#1E40AF; --green-50:#F0FDF4;
      --green-100:#DCFCE7; --green-700:#15803D; --amber-50:#FFFBEB; --amber-100:#FEF3C7;
      --amber-200:#FDE68A; --amber-700:#B45309; --amber-800:#92400E; --purple-50:#FAF5FF;
      --purple-100:#EDE9FE; --purple-600:#7C3AED; --purple-700:#6D28D9; --red-50:#FEF2F2;
      --red-100:#FEE2E2; --red-200:#FECACA; --red-700:#B91C1C;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--slate-100); color:var(--slate-800);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    nav { position:sticky; top:0; z-index:20; background:white; border-bottom:1px solid var(--slate-200); }
    .nav-container {
      max-width:1280px; margin:0 auto; min-height:64px; padding:0 24px;
      display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    }
    .nav-left { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
    .brand { font-size:20px; font-weight:800; color:var(--slate-900); }
    .tabs { display:flex; gap:4px; flex-wrap:wrap; }
    .nav-tab {
      padding:12px 14px; color:var(--slate-600); cursor:pointer; font-size:14px;
      border-bottom:2px solid transparent; transition:.2s;
    }
    .nav-tab:hover { color:var(--primary); }
    .nav-tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:700; }
    .user-switcher { display:flex; align-items:center; gap:10px; }
    .avatar {
      width:34px; height:34px; border-radius:999px; background:var(--primary); color:white;
      display:grid; place-items:center; font-weight:800; font-size:14px;
    }
    .main { max-width:1280px; margin:0 auto; padding:24px; }
    .section { display:none; }
    .section.active { display:block; }
    .page-header {
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;
    }
    .page-title { margin:0; font-size:24px; font-weight:750; }
    .page-subtitle { color:var(--slate-500); font-size:14px; margin-top:4px; }
    .panel { background:white; border:1px solid var(--slate-200); border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); overflow:hidden; }
    .panel-info { padding:14px 20px; background:var(--blue-50); border-bottom:1px solid var(--blue-200); color:var(--blue-800); font-size:14px; }
    .panel-toolbar, .panel-filters {
      padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
      background:var(--slate-50); border-bottom:1px solid var(--slate-200);
    }
    .panel-filters { justify-content:flex-start; background:white; }
    .panel-content { padding:16px 20px; max-height:740px; overflow:auto; }
    .panel-footer { padding:14px 20px; border-top:1px solid var(--green-100); background:var(--green-50); color:var(--green-700); font-size:14px; }
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:14px 20px; background:var(--slate-50); border-bottom:1px solid var(--slate-200); }
    .stats-grid.three { grid-template-columns:repeat(3,1fr); }
    .stat-card { background:white; border:1px solid var(--slate-200); border-radius:12px; padding:14px; }
    .stat-label { color:var(--slate-500); font-size:13px; margin-bottom:5px; }
    .stat-value { font-size:24px; font-weight:850; color:var(--slate-800); }
    button {
      border:none; border-radius:9px; padding:8px 14px; background:var(--primary); color:white;
      font-weight:650; font-size:14px; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:7px;
    }
    button:hover { background:var(--primary-hover); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .btn-outline { background:white; color:var(--slate-700); border:1px solid var(--slate-300); }
    .btn-outline:hover { background:var(--slate-50); }
    .btn-ghost { background:transparent; color:var(--slate-700); }
    .btn-ghost:hover { background:var(--slate-100); }
    .btn-danger { background:var(--danger); }
    .btn-success { background:var(--success); }
    .btn-purple { background:var(--purple-600); }
    .btn-purple:hover { background:var(--purple-700); }
    .btn-sm { padding:5px 10px; font-size:12px; }
    .btn-xs { padding:4px 8px; font-size:11px; }
    input, select, textarea {
      padding:9px 11px; border:1px solid var(--slate-300); border-radius:9px;
      font-size:14px; outline:none; background:white;
    }
    textarea { resize:vertical; }
    input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .input { width:260px; }
    .wide { width:100%; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
    .muted { color:var(--slate-500); }
    .text-danger { color:var(--danger); }
    .text-success { color:var(--success); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    .form-group { margin-bottom:16px; }
    .form-label { display:block; font-size:14px; font-weight:700; margin-bottom:7px; color:var(--slate-700); }
    .hint { font-size:12px; color:var(--slate-500); margin-top:5px; line-height:1.45; }
    .box { border:1px solid var(--slate-200); background:var(--slate-50); border-radius:12px; padding:14px; margin:12px 0; }
    .box-blue { background:var(--blue-50); border-color:var(--blue-200); color:var(--blue-800); }
    .box-amber { background:var(--amber-50); border-color:var(--amber-200); color:var(--amber-800); }
    .box-purple { background:var(--purple-50); border-color:var(--purple-100); }
    .card {
      background:white; border:1px solid var(--slate-200); border-radius:12px; padding:14px; margin-bottom:12px;
      display:flex; justify-content:space-between; align-items:center; gap:14px; transition:.2s;
    }
    .card:hover { border-color:var(--primary); box-shadow:0 2px 8px rgba(59,130,246,.12); }
    .card.selected { background:var(--blue-50); border-color:var(--primary); }
    .card.clickable { cursor:pointer; }
    .card-main { display:flex; align-items:flex-start; gap:13px; flex:1; min-width:0; }
    .icon { font-size:28px; line-height:1; }
    .card-title { font-weight:800; font-size:16px; color:var(--slate-900); }
    .card-meta { color:var(--slate-500); font-size:13px; margin-top:5px; line-height:1.55; }
    .card-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    .badge {
      display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:7px;
      font-size:12px; font-weight:700; background:var(--slate-100); color:var(--slate-700);
    }
    .badge-blue { background:var(--blue-100); color:var(--blue-700); }
    .badge-green { background:var(--green-100); color:var(--green-700); }
    .badge-amber { background:var(--amber-100); color:var(--amber-700); }
    .badge-purple { background:var(--purple-100); color:var(--purple-700); }
    .badge-red { background:var(--red-100); color:var(--red-700); }
    .pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .collections-line { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
    .collections-label { color:var(--slate-500); font-weight:700; font-size:12px; }
    .checkbox { width:18px; height:18px; accent-color:var(--primary); flex:0 0 auto; }
    .details { display:none; border-top:1px solid var(--slate-200); margin-top:12px; padding-top:12px; width:100%; }
    .details.open { display:block; }
    .host-card { display:block; }
    .host-card-top { display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .service-attachment { border:1px solid var(--slate-200); border-radius:12px; padding:14px; margin-bottom:10px; background:white; }
    .port-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:11px; padding-top:11px; border-top:1px dashed var(--slate-200); }
    .port-row input { width:90px; text-align:center; }
    .addr-badge { font-size:10px; border-radius:5px; padding:2px 6px; font-weight:800; margin-right:6px; }
    .addr-ip { background:var(--blue-100); color:var(--blue-700); }
    .addr-fqdn { background:var(--green-100); color:var(--green-700); }
    .empty { text-align:center; color:var(--slate-500); padding:34px; }
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(15,23,42,.62); backdrop-filter:blur(4px);
      z-index:50; align-items:center; justify-content:center; padding:18px;
    }
    .modal-overlay.show { display:flex; }
    .modal {
      width:100%; max-width:850px; max-height:92vh; background:white; border-radius:14px;
      box-shadow:0 25px 60px rgba(0,0,0,.28); overflow:hidden; display:flex; flex-direction:column;
    }
    .modal.small { max-width:560px; }
    .modal-header, .modal-footer {
      padding:16px 20px; background:var(--slate-50); border-bottom:1px solid var(--slate-200);
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .modal-footer { border-top:1px solid var(--slate-200); border-bottom:0; }
    .modal-title { font-size:18px; font-weight:850; }
    .modal-subtitle { color:var(--slate-500); font-size:13px; margin-top:3px; }
    .modal-body { padding:20px; overflow:auto; }
    .modal-footer-right { display:flex; gap:8px; flex-wrap:wrap; }
    .toast {
      position:fixed; right:20px; bottom:20px; z-index:80; background:var(--slate-800); color:white;
      padding:14px 18px; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,.25);
      opacity:0; transform:translateY(70px); transition:.25s;
    }
    .toast.show { opacity:1; transform:none; }
    .hidden { display:none !important; }
    @media (max-width:900px) {
      .main { padding:14px; }
      .row, .row3, .stats-grid, .stats-grid.three { grid-template-columns:1fr; }
      .card, .host-card-top { align-items:stretch; flex-direction:column; }
      .card-actions { justify-content:flex-start; }
      .input { width:100%; }
    }
  </style>
</head>
<body>
<nav>
  <div class="nav-container">
    <div class="nav-left">
      <div class="brand">🖥️ MARS</div>
      <div class="tabs">
        <div class="nav-tab active" id="nav-hosts" onclick="switchSection('hosts')">Хосты</div>
        <div class="nav-tab" id="nav-services" onclick="switchSection('services')">🔌 Сервисы</div>
        <div class="nav-tab" id="nav-templates" onclick="switchSection('templates')">🧩 Шаблоны сервисов</div>
        <div class="nav-tab" id="nav-collections" onclick="switchSection('collections')">📦 Коллекции</div>
        <div class="nav-tab" id="nav-access" onclick="switchSection('access')">👥 Доступ</div>
      </div>
    </div>
    <div class="user-switcher">
      <select id="current-user" onchange="switchUser(this.value)"></select>
      <div class="avatar" id="user-avatar">A</div>
    </div>
  </div>
</nav>

<div class="main">
  <section id="section-hosts" class="section active"></section>
  <section id="section-services" class="section"></section>
  <section id="section-templates" class="section"></section>
  <section id="section-collections" class="section"></section>
  <section id="section-access" class="section"></section>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'mars-ui-state-v13';
const LEGACY_KEYS = [
  'mars-ui-state-v12','mars-ui-state-v11','mars-ui-state-v10','mars-ui-state-v9',
  'mars-ui-state-v8','mars-ui-state-v7','mars-ui-state-v6','mars-ui-state-v5',
  'mars-ui-state-v4','mars-ui-state-v3','mars-ui-state-v2','mars-ui-state'
];

let state = null;
let activeSection = 'hosts';
let selectedHosts = new Set();
let selectedServices = new Set();
let selectedTemplates = new Set();
let expandedHostId = null;
let editingHostId = null;
let editingServiceId = null;
let editingTemplateId = null;
let activeAttachment = null;
let collectionDraft = { name: '', description: '', serviceIds: [] };

const $ = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));

function makeId(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

function demoState() {
  return {
    currentUserId: 'u-admin',
    proxyGroups: [
      { id: 'prod-dmz', name: 'Production DMZ' },
      { id: 'analytics', name: 'Analytics' },
      { id: 'k8s', name: 'K8s Cluster' }
    ],
    groups: [
      { id: 'grp-infra', name: 'Team-Infra', description: 'Инфраструктурные сервисы и exporter-мониторинг' },
      { id: 'grp-data', name: 'Team-Data', description: 'Базы данных и аналитика' },
      { id: 'grp-platform', name: 'Team-Platform', description: 'Платформа и Kubernetes' }
    ],
    users: [
      { id: 'u-admin', name: 'Alice Admin', initials: 'A', isAdmin: true, canMonitor: true, groups: ['grp-infra', 'grp-data', 'grp-platform'] },
      { id: 'u-infra', name: 'Ivan Infra', initials: 'I', isAdmin: false, canMonitor: true, groups: ['grp-infra'] },
      { id: 'u-data', name: 'Daria Data', initials: 'D', isAdmin: false, canMonitor: true, groups: ['grp-data'] },
      { id: 'u-viewer', name: 'Victor Viewer', initials: 'V', isAdmin: false, canMonitor: false, groups: ['grp-platform'] }
    ],
    services: [
      {
        id: 'svc-1', name: 'PostgreSQL', type: 'SQL', icon: '🐘', port: 5432, metrics: '/metrics',
        groupId: 'grp-data', createdBy: 'u-data', auth: { mode: 'basic', username: 'monitor', password: '' },
        protocol: null, tls: null
      },
      {
        id: 'svc-2', name: 'Nginx', type: 'ExporterScrape', icon: '🌐', port: 80, metrics: '/nginx_metrics',
        groupId: 'grp-infra', createdBy: 'u-infra', auth: { mode: 'none' },
        protocol: 'http', tls: null
      },
      {
        id: 'svc-3', name: 'Redis Cache', type: 'ExporterScrape', icon: '🔴', port: 6379, metrics: '/metrics',
        groupId: 'grp-platform', createdBy: 'u-admin', auth: { mode: 'bearer', token: '' },
        protocol: 'http', tls: null
      },
      {
        id: 'svc-4', name: 'Secure Nginx', type: 'ExporterScrape', icon: '🔒', port: 443, metrics: '/metrics',
        groupId: 'grp-infra', createdBy: 'u-admin', auth: { mode: 'none' },
        protocol: 'https', tls: { clientCert: '-----BEGIN CERTIFICATE-----\\nMIID...demo...\\n-----END CERTIFICATE-----', skipServerVerify: false }
      }
    ],
    serviceTemplates: [
      {
        id: 'tpl-1', name: 'Шаблон "Nginx Standard"', type: 'ExporterScrape', icon: '🌐', port: 80, metrics: '/metrics',
        groupId: 'grp-infra', createdBy: 'u-admin', protocol: 'http', tls: null
      },
      {
        id: 'tpl-2', name: 'Шаблон "PostgreSQL Advanced"', type: 'SQL', icon: '🐘', port: 5432, metrics: '/metrics',
        groupId: 'grp-data', createdBy: 'u-admin', protocol: null, tls: null
      }
    ],
    collections: [
      { id: 'col-1', name: 'Web Stack', description: 'Nginx + PostgreSQL', serviceIds: ['svc-1', 'svc-2'], createdBy: 'u-admin', usedBy: 12 },
      { id: 'col-2', name: 'Cache Stack', description: 'Redis + Nginx', serviceIds: ['svc-2', 'svc-3'], createdBy: 'u-infra', usedBy: 8 }
    ],
    hosts: [
      {
        id: 'host-1', name: 'web-prod-01', addressType: 'ip', address: '10.0.1.50', proxyGroup: 'prod-dmz',
        status: 'UP', createdBy: 'u-infra',
        attachments: [
          { id: 'att-1', serviceId: 'svc-1', portOverride: null, auth: { mode: 'basic', username: 'admin', password: 'secret' }, attachedBy: 'u-admin' },
          { id: 'att-2', serviceId: 'svc-2', portOverride: null, auth: null, attachedBy: 'u-infra' }
        ]
      },
      {
        id: 'host-2', name: 'db-analytics', addressType: 'fqdn', address: 'db-analytics.internal.example.com', proxyGroup: 'analytics',
        status: 'WARN', createdBy: 'u-data',
        attachments: [
          { id: 'att-3', serviceId: 'svc-1', portOverride: null, auth: { mode: 'basic', username: 'admin', password: 'pass123' }, attachedBy: 'u-data' }
        ]
      },
      {
        id: 'host-3', name: 'cache-01', addressType: 'ip', address: '192.168.1.10', proxyGroup: 'k8s',
        status: 'UP', createdBy: 'u-admin',
        attachments: [
          { id: 'att-4', serviceId: 'svc-3', portOverride: null, auth: null, attachedBy: 'u-admin' }
        ]
      }
    ]
  };
}

function normalizeAuth(auth) {
  if (!auth || auth.mode === 'none' || auth === false) return { mode: 'none' };
  if (auth.mode === 'basic' || auth.username !== undefined || auth.user !== undefined) {
    return {
      mode: 'basic',
      username: auth.username ?? auth.user ?? '',
      password: auth.password ?? auth.pass ?? ''
    };
  }
  if (auth.mode === 'bearer' || auth.token !== undefined) {
    return { mode: 'bearer', token: auth.token ?? '' };
  }
  return { mode: 'none' };
}

function normalizeTls(tls) {
  if (!tls) return null;
  return {
    clientCert: tls.clientCert ?? tls.cert ?? '',
    skipServerVerify: !!(tls.skipServerVerify ?? tls.skip)
  };
}

function normalizeState(raw) {
  const base = demoState();
  if (!raw || typeof raw !== 'object') return base;

  const groups = Array.isArray(raw.groups) && raw.groups.length ? raw.groups.map((g, index) => ({
    id: g.id || `grp-${index}`,
    name: g.name || `Group ${index + 1}`,
    description: g.description || ''
  })) : base.groups;

  const users = Array.isArray(raw.users) && raw.users.length ? raw.users.map((u, index) => ({
    id: u.id || `user-${index}`,
    name: u.name || `User ${index + 1}`,
    initials: u.initials || (u.name || 'U').slice(0, 1).toUpperCase(),
    isAdmin: !!u.isAdmin,
    canMonitor: !!u.canMonitor,
    groups: Array.isArray(u.groups) ? u.groups : []
  })) : base.users;

  const proxyGroups = Array.isArray(raw.proxyGroups) && raw.proxyGroups.length
    ? raw.proxyGroups
    : (Array.isArray(raw.segments) ? raw.segments.map(x => ({ id: x.id || x, name: x.name || x })) : base.proxyGroups);

  const rawServices = Array.isArray(raw.services) ? raw.services : [];
  const rawTemplates = Array.isArray(raw.serviceTemplates) ? raw.serviceTemplates : rawServices.filter(s => s.template || s.isTemplate);

  const services = rawServices.filter(s => !(s.template || s.isTemplate)).map((s, index) => ({
    id: s.id || `svc-${index}`,
    name: s.name || `Service ${index + 1}`,
    type: s.type || s.agent || 'ExporterScrape',
    icon: s.icon || '🔌',
    port: Number(s.port ?? s.defaultPort ?? 80),
    metrics: s.metrics || '/metrics',
    groupId: s.groupId || s.group || groups[0].id,
    createdBy: s.createdBy || s.by || users[0].id,
    auth: normalizeAuth(s.auth),
    protocol: (s.type || s.agent) === 'ExporterScrape' ? (s.protocol || 'http') : null,
    tls: normalizeTls(s.tls)
  }));

  const serviceTemplates = rawTemplates.map((t, index) => ({
    id: t.id || `tpl-${index}`,
    name: t.name || `Шаблон "${t.serviceName || index + 1}"`,
    type: t.type || t.agent || 'ExporterScrape',
    icon: t.icon || '🧩',
    port: Number(t.port ?? t.defaultPort ?? 80),
    metrics: t.metrics || '/metrics',
    groupId: t.groupId || t.group || groups[0].id,
    createdBy: t.createdBy || t.by || users[0].id,
    protocol: (t.type || t.agent) === 'ExporterScrape' ? (t.protocol || 'http') : null,
    tls: normalizeTls(t.tls)
  })).map(t => ({ ...t, auth: undefined }));

  const collections = Array.isArray(raw.collections) ? raw.collections.map((c, index) => ({
    id: c.id || `col-${index}`,
    name: c.name || `Collection ${index + 1}`,
    description: c.description || c.desc || '',
    serviceIds: Array.isArray(c.serviceIds) ? c.serviceIds : (Array.isArray(c.services) ? c.services : []),
    createdBy: c.createdBy || c.by || users[0].id,
    usedBy: Number(c.usedBy ?? c.used ?? 0)
  })) : base.collections;

  const hosts = Array.isArray(raw.hosts) ? raw.hosts.map((h, index) => ({
    id: String(h.id || `host-${index}`),
    name: h.name || `host-${index + 1}`,
    addressType: h.addressType || (String(h.address || h.addr || '').match(/^[0-9.]+$/) ? 'ip' : 'fqdn'),
    address: h.address || h.addr || '',
    proxyGroup: h.proxyGroup || h.seg || h.segment || proxyGroups[0].id,
    status: h.status || 'UP',
    createdBy: h.createdBy || h.by || users[0].id,
    attachments: (Array.isArray(h.attachments) ? h.attachments : (Array.isArray(h.att) ? h.att : [])).map((a, aIndex) => ({
      id: a.id || `att-${index}-${aIndex}`,
      serviceId: a.serviceId || a.sid,
      portOverride: a.portOverride ?? a.port ?? null,
      auth: a.auth ? normalizeAuth(a.auth) : null,
      attachedBy: a.attachedBy || a.by || users[0].id
    })).filter(a => a.serviceId)
  })) : base.hosts;

  const currentUserId = raw.currentUserId || raw.cur || users[0].id;

  return {
    currentUserId,
    users,
    groups,
    proxyGroups,
    services,
    serviceTemplates,
    collections,
    hosts
  };
}

function loadState() {
  const keys = [STORE_KEY, ...LEGACY_KEYS];
  for (const key of keys) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      state = normalizeState(JSON.parse(raw));
      saveState();
      return;
    } catch (error) {
      console.warn('Cannot load state from', key, error);
    }
  }
  state = demoState();
  saveState();
}

function saveState() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function currentUser() {
  return state.users.find(u => u.id === state.currentUserId) || state.users[0];
}

function isAdmin() {
  return !!currentUser().isAdmin;
}

function canMonitor() {
  return !!currentUser().canMonitor;
}

function canManageGroup(groupId) {
  return isAdmin() || currentUser().groups.includes(groupId);
}

function canManageService(service) {
  return !!service && canManageGroup(service.groupId);
}

function canDeleteHost(host) {
  return !!host && (isAdmin() || host.createdBy === state.currentUserId);
}

function canEditHost(host) {
  return canDeleteHost(host);
}

function userName(userId) {
  return state.users.find(u => u.id === userId)?.name || '—';
}

function groupName(groupId) {
  return state.groups.find(g => g.id === groupId)?.name || groupId || '—';
}

function proxyGroupName(id) {
  return state.proxyGroups.find(g => g.id === id)?.name || id || '—';
}

function authLabel(auth) {
  const normalized = normalizeAuth(auth);
  if (normalized.mode === 'basic') return 'Basic Auth';
  if (normalized.mode === 'bearer') return 'Bearer Token';
  return 'Без авторизации';
}

function hasAuth(auth) {
  return normalizeAuth(auth).mode !== 'none';
}

function serviceCollections(serviceId) {
  return state.collections.filter(collection => collection.serviceIds.includes(serviceId));
}

function collectionsHtml(serviceId) {
  const collections = serviceCollections(serviceId);
  return `
    <div class="collections-line">
      <span class="collections-label">Коллекции:</span>
      ${collections.length ? collections.map(c => `<span class="badge badge-purple">📦 ${escapeHtml(c.name)}</span>`).join('') : '<span class="badge">—</span>'}
    </div>
  `;
}

function tlsBadge(item) {
  if (item.type !== 'ExporterScrape') return '';
  const protocol = item.protocol || 'http';
  if (protocol === 'http') {
    return '<span class="badge badge-blue">HTTP</span>';
  }
  const cert = item.tls?.clientCert ? '<span class="badge badge-purple">client cert</span>' : '';
  const skip = item.tls?.skipServerVerify ? '<span class="badge badge-amber">skip server cert verify</span>' : '';
  return `<span class="badge badge-blue">HTTPS</span>${cert}${skip}`;
}

function serviceMeta(service, showAuth = true) {
  return `
    <div class="card-meta">
      Тип: <b>${escapeHtml(service.type)}</b> · Порт: <code>${service.port}</code> · Метрики: <code>${escapeHtml(service.metrics)}</code> · Группа: <b>${escapeHtml(groupName(service.groupId))}</b>
    </div>
    <div class="pills">
      ${tlsBadge(service)}
      ${showAuth ? `<span class="badge ${hasAuth(service.auth) ? 'badge-amber' : 'badge-green'}">${hasAuth(service.auth) ? '🔐' : '🔓'} ${escapeHtml(authLabel(service.auth))}</span>` : ''}
    </div>
  `;
}

function switchSection(section) {
  activeSection = section;
  document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  $(`section-${section}`).classList.add('active');
  $(`nav-${section}`).classList.add('active');
  render();
}

function render() {
  renderUserSwitcher();
  renderHosts();
  renderServices();
  renderTemplates();
  renderCollections();
  renderAccess();
}

function renderUserSwitcher() {
  $('current-user').innerHTML = state.users.map(user => `
    <option value="${user.id}" ${user.id === state.currentUserId ? 'selected' : ''}>${escapeHtml(user.name)}${user.isAdmin ? ' · admin' : ''}</option>
  `).join('');
  const user = currentUser();
  $('user-avatar').textContent = user.initials || user.name.slice(0, 1).toUpperCase();
}

function switchUser(userId) {
  state.currentUserId = userId;
  selectedHosts.clear();
  selectedServices.clear();
  selectedTemplates.clear();
  saveState();
  render();
  showToast(`Текущий пользователь: ${currentUser().name}`);
}

function page(section, title, subtitle, actions, content) {
  $(`section-${section}`).innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">${title}</h1>
        <div class="page-subtitle">${subtitle}</div>
      </div>
      <div class="card-actions">${actions || ''}</div>
    </div>
    ${content}
  `;
}

/* HOSTS */

function filteredHosts() {
  const search = ($('host-search')?.value || '').toLowerCase();
  const group = $('host-proxy-filter')?.value || 'all';
  return state.hosts.filter(host => {
    const matchesSearch = host.name.toLowerCase().includes(search) || host.address.toLowerCase().includes(search);
    const matchesGroup = group === 'all' || host.proxyGroup === group;
    return matchesSearch && matchesGroup;
  });
}

function renderHosts() {
  const hosts = filteredHosts();
  const actions = `
    <button class="btn-outline" onclick="resetDemo()">↺ Сбросить демо</button>
    <button onclick="openHostForm()" ${canMonitor() ? '' : 'disabled'}>➕ Создать хост</button>
  `;

  const content = `
    <div class="panel">
      <div class="panel-info"><b>Контекст: Хост.</b> Хосты уникальны, глобальны и видны всем пользователям MARS.</div>
      <div class="panel-toolbar">
        <div>
          <input class="checkbox" type="checkbox" onchange="toggleAllHosts(this.checked)" ${hosts.length && hosts.every(h => selectedHosts.has(h.id)) ? 'checked' : ''}>
          <span class="muted">Выбрано: <b>${selectedHosts.size}</b> из <b>${hosts.length}</b></span>
        </div>
        <div class="card-actions">
          <button class="btn-sm btn-ghost" onclick="openAttachWizard('service')" ${canMonitor() && selectedHosts.size === 1 ? '' : 'disabled'}>⚡ Присоединить сервис</button>
          <button class="btn-sm btn-ghost" onclick="openAttachWizard('collection')" ${canMonitor() && selectedHosts.size === 1 ? '' : 'disabled'}>📦 Присоединить коллекцию</button>
          <button class="btn-sm btn-danger" onclick="deleteSelectedHosts()" ${selectedHosts.size ? '' : 'disabled'}>🗑️ Удалить</button>
        </div>
      </div>
      <div class="panel-filters">
        <span>🔍</span>
        <input id="host-search" class="input" value="${escapeHtml($('host-search')?.value || '')}" oninput="renderHosts()" placeholder="Поиск по имени или адресу...">
        <select id="host-proxy-filter" onchange="renderHosts()">
          <option value="all">Все группы прокси</option>
          ${state.proxyGroups.map(group => `<option value="${group.id}" ${($('host-proxy-filter')?.value || 'all') === group.id ? 'selected' : ''}>${escapeHtml(group.name)}</option>`).join('')}
        </select>
      </div>
      <div class="panel-content">${hosts.length ? hosts.map(hostCardHtml).join('') : '<div class="empty">Хосты не найдены</div>'}</div>
      <div class="panel-footer">Присоединённые к хосту сервисы видны всем пользователям MARS.</div>
    </div>
  `;

  page('hosts', 'Управление хостами', 'Постановка на мониторинг и присоединение сервисов/коллекций', actions, content);
}

function hostCardHtml(host) {
  const isOpen = expandedHostId === host.id;
  const isSelected = selectedHosts.has(host.id);
  const addressBadge = host.addressType === 'fqdn'
    ? '<span class="addr-badge addr-fqdn">FQDN</span>'
    : '<span class="addr-badge addr-ip">IP</span>';

  const attachmentsHtml = host.attachments.length
    ? host.attachments.map((attachment, index) => hostAttachmentHtml(host, attachment, index)).join('')
    : '<div class="muted">Нет присоединённых сервисов.</div>';

  return `
    <div class="card host-card ${isSelected ? 'selected' : ''}">
      <div class="host-card-top">
        <div class="card-main">
          <input class="checkbox" type="checkbox" onchange="toggleHost('${host.id}')" ${isSelected ? 'checked' : ''}>
          <span class="icon">🖥️</span>
          <div>
            <div class="card-title mono">${escapeHtml(host.name)}</div>
            <div class="card-meta">${addressBadge}${escapeHtml(host.address)}</div>
            <div class="pills">
              <span class="badge">Группа прокси: ${escapeHtml(proxyGroupName(host.proxyGroup))}</span>
              <span class="badge ${host.status === 'UP' ? 'badge-green' : 'badge-amber'}">${host.status === 'UP' ? '🟢 UP' : '🟡 WARN'}</span>
              <span class="badge">Создал: ${escapeHtml(userName(host.createdBy))}</span>
              <span class="badge badge-blue">${host.attachments.length} сервисов</span>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-xs btn-outline" onclick="toggleHostDetails('${host.id}')">${isOpen ? '▲ Свернуть' : '→ Детали'}</button>
          <button class="btn-xs btn-outline" onclick="openHostForm('${host.id}')" ${canEditHost(host) ? '' : 'disabled'}>✏️ Редактировать</button>
          <button class="btn-xs btn-danger" onclick="deleteHost('${host.id}')" ${canDeleteHost(host) ? '' : 'disabled'}>🗑️ Удалить</button>
        </div>
      </div>
      <div class="details ${isOpen ? 'open' : ''}">
        <div class="box box-blue">
          <b>${escapeHtml(host.name)}</b> · ${addressBadge}${escapeHtml(host.address)} · Группа прокси: <b>${escapeHtml(proxyGroupName(host.proxyGroup))}</b>
        </div>
        ${attachmentsHtml}
      </div>
    </div>
  `;
}

function hostAttachmentHtml(host, attachment, index) {
  const service = state.services.find(item => item.id === attachment.serviceId);
  if (!service) return '';
  const effectivePort = attachment.portOverride || service.port;
  const effectiveAuth = attachment.auth || service.auth;

  return `
    <div class="service-attachment">
      <div class="card-main">
        <span class="icon">${service.icon}</span>
        <div>
          <div class="card-title">${escapeHtml(service.name)}</div>
          <div class="card-meta mono">Target: ${escapeHtml(host.address)}:${effectivePort}</div>
          ${serviceMeta(service, false)}
          ${collectionsHtml(service.id)}
          <div class="pills">
            <span class="badge ${hasAuth(effectiveAuth) ? 'badge-amber' : 'badge-green'}">${hasAuth(effectiveAuth) ? '🔐' : '🔓'} ${escapeHtml(authLabel(effectiveAuth))}</span>
            <span class="badge">Присоединил: ${escapeHtml(userName(attachment.attachedBy))}</span>
          </div>
        </div>
      </div>
      <div class="port-row">
        <span class="muted">Порт:</span>
        <input id="port-${host.id}-${index}" type="number" min="1" max="65535" value="${effectivePort}">
        <button class="btn-xs btn-success" onclick="applyPortOverride('${host.id}', ${index})" ${canMonitor() ? '' : 'disabled'}>✓ Применить</button>
        <button class="btn-xs btn-outline" onclick="resetPortOverride('${host.id}', ${index})" ${canMonitor() ? '' : 'disabled'}>↺ Сбросить</button>
        <button class="btn-xs btn-danger" onclick="detachService('${host.id}', ${index})" ${canMonitor() ? '' : 'disabled'}>Отсоединить</button>
        <span class="hint">${attachment.portOverride ? `переопределён: ${attachment.portOverride}` : `по умолчанию: ${service.port}`}</span>
      </div>
    </div>
  `;
}

function toggleHost(id) {
  selectedHosts.has(id) ? selectedHosts.delete(id) : selectedHosts.add(id);
  renderHosts();
}

function toggleAllHosts(checked) {
  filteredHosts().forEach(host => checked ? selectedHosts.add(host.id) : selectedHosts.delete(host.id));
  renderHosts();
}

function toggleHostDetails(id) {
  expandedHostId = expandedHostId === id ? null : id;
  renderHosts();
}

function validateIp(value) {
  const parts = value.split('.');
  return parts.length === 4 && parts.every(part => /^\d+$/.test(part) && Number(part) >= 0 && Number(part) <= 255);
}

function validateFqdn(value) {
  return /^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/.test(value);
}

function hostNameUnique(name, skipId = null) {
  const lowered = name.trim().toLowerCase();
  return !!lowered && !state.hosts.some(host => host.id !== skipId && host.name.toLowerCase() === lowered);
}

function hostAddressUnique(address, skipId = null) {
  const lowered = address.trim().toLowerCase();
  return !!lowered && !state.hosts.some(host => host.id !== skipId && host.address.toLowerCase() === lowered);
}

function openHostForm(hostId = null) {
  if (hostId) {
    const host = state.hosts.find(item => item.id === hostId);
    if (!canEditHost(host)) return showToast('Редактировать хост может создатель или MARS admin');
    editingHostId = hostId;
  } else {
    if (!canMonitor()) return showToast('Нет разрешения на постановку на мониторинг');
    editingHostId = null;
  }

  const host = hostId ? state.hosts.find(item => item.id === hostId) : {
    name: '', addressType: 'ip', address: '', proxyGroup: state.proxyGroups[0].id
  };

  openModal(
    hostId ? 'Редактирование хоста' : 'Создание хоста',
    hostId ? 'Можно изменить имя, тип адреса, IP/FQDN и группу прокси' : 'Хосты уникальны и видны всем пользователям MARS',
    `
      <div class="form-group">
        <label class="form-label">Имя хоста *</label>
        <input id="host-name" class="wide mono" value="${escapeHtml(host.name)}" oninput="checkHostForm()">
        <div id="host-name-hint" class="hint"></div>
      </div>
      <div class="row">
        <div class="form-group">
          <label class="form-label">Тип адреса *</label>
          <select id="host-address-type" class="wide" onchange="checkHostForm()">
            <option value="ip" ${host.addressType === 'ip' ? 'selected' : ''}>🌐 IP-адрес</option>
            <option value="fqdn" ${host.addressType === 'fqdn' ? 'selected' : ''}>🔗 FQDN</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">IP/FQDN хоста *</label>
          <input id="host-address" class="wide mono" value="${escapeHtml(host.address)}" oninput="checkHostForm()" placeholder="10.0.1.50 или server.example.com">
          <div id="host-address-hint" class="hint"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Группа прокси *</label>
        <select id="host-proxy-group" class="wide" onchange="checkHostForm()">
          ${state.proxyGroups.map(group => `<option value="${group.id}" ${host.proxyGroup === group.id ? 'selected' : ''}>${escapeHtml(group.name)}</option>`).join('')}
        </select>
      </div>
    `,
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="host-save-btn" onclick="saveHost()">${hostId ? 'Сохранить' : 'Создать хост'}</button></div>
    `
  );
  checkHostForm();
}

function checkHostForm() {
  const name = $('host-name')?.value.trim() || '';
  const addressType = $('host-address-type')?.value || 'ip';
  const address = $('host-address')?.value.trim() || '';
  const nameHint = $('host-name-hint');
  const addressHint = $('host-address-hint');
  const saveButton = $('host-save-btn');

  let nameOk = hostNameUnique(name, editingHostId);
  let addressFormatOk = addressType === 'ip' ? validateIp(address) : validateFqdn(address);
  let addressUniqueOk = hostAddressUnique(address, editingHostId);

  if (nameHint) {
    if (!name) {
      nameHint.textContent = 'Имя обязательно';
      nameHint.className = 'hint text-danger';
    } else if (!/^[a-zA-Z0-9-]+$/.test(name)) {
      nameHint.textContent = 'Только латиница, цифры и дефис';
      nameHint.className = 'hint text-danger';
      nameOk = false;
    } else if (!nameOk) {
      nameHint.textContent = 'Хост с таким именем уже существует';
      nameHint.className = 'hint text-danger';
    } else {
      nameHint.textContent = 'Имя свободно';
      nameHint.className = 'hint text-success';
    }
  }

  if (addressHint) {
    if (!address) {
      addressHint.textContent = 'Адрес обязателен';
      addressHint.className = 'hint text-danger';
    } else if (!addressFormatOk) {
      addressHint.textContent = addressType === 'ip' ? 'Некорректный IP-адрес' : 'Некорректный FQDN';
      addressHint.className = 'hint text-danger';
    } else if (!addressUniqueOk) {
      addressHint.textContent = 'Хост с таким адресом уже существует';
      addressHint.className = 'hint text-danger';
    } else {
      addressHint.textContent = 'Адрес корректен и свободен';
      addressHint.className = 'hint text-success';
    }
  }

  if (saveButton) {
    saveButton.disabled = !(nameOk && addressFormatOk && addressUniqueOk && $('host-proxy-group')?.value);
  }
}

function saveHost() {
  const data = {
    name: $('host-name').value.trim(),
    addressType: $('host-address-type').value,
    address: $('host-address').value.trim(),
    proxyGroup: $('host-proxy-group').value
  };

  if (editingHostId) {
    const host = state.hosts.find(item => item.id === editingHostId);
    if (!canEditHost(host)) return showToast('Редактировать хост может создатель или MARS admin');
    Object.assign(host, data);
    showToast('Хост обновлён');
  } else {
    if (!canMonitor()) return showToast('Нет разрешения на постановку на мониторинг');
    state.hosts.push({
      id: makeId('host'),
      ...data,
      status: 'UP',
      createdBy: state.currentUserId,
      attachments: []
    });
    showToast('Хост создан');
  }

  saveState();
  closeModal();
  render();
}

function deleteHost(hostId) {
  const host = state.hosts.find(item => item.id === hostId);
  if (!canDeleteHost(host)) return showToast('Удалить хост может создатель или MARS admin');
  confirmAction('Удаление хоста', `Удалить хост <b>${escapeHtml(host.name)}</b>? Все присоединённые сервисы будут отсоединены.`, () => {
    state.hosts = state.hosts.filter(item => item.id !== hostId);
    selectedHosts.delete(hostId);
    if (expandedHostId === hostId) expandedHostId = null;
    saveState();
    render();
    showToast('Хост удалён');
  });
}

function deleteSelectedHosts() {
  const ids = Array.from(selectedHosts);
  if (!ids.length) return;
  const denied = ids.some(id => !canDeleteHost(state.hosts.find(host => host.id === id)));
  if (denied) return showToast('В выборе есть хосты, которые вы не можете удалить');

  confirmAction('Массовое удаление хостов', `Удалить выбранные хосты: <b>${ids.length}</b>?`, () => {
    state.hosts = state.hosts.filter(host => !selectedHosts.has(host.id));
    selectedHosts.clear();
    expandedHostId = null;
    saveState();
    render();
    showToast('Хосты удалены');
  });
}

function applyPortOverride(hostId, index) {
  const host = state.hosts.find(item => item.id === hostId);
  if (!host || !canMonitor()) return;
  const value = Number($(`port-${hostId}-${index}`).value);
  if (!value || value < 1 || value > 65535) return showToast('Некорректный порт');
  const service = state.services.find(item => item.id === host.attachments[index].serviceId);
  host.attachments[index].portOverride = value === service.port ? null : value;
  saveState();
  renderHosts();
  showToast('Порт обновлён');
}

function resetPortOverride(hostId, index) {
  const host = state.hosts.find(item => item.id === hostId);
  if (!host || !canMonitor()) return;
  host.attachments[index].portOverride = null;
  saveState();
  renderHosts();
  showToast('Порт сброшен');
}

function detachService(hostId, index) {
  const host = state.hosts.find(item => item.id === hostId);
  if (!host || !canMonitor()) return;
  const attachment = host.attachments[index];
  const service = state.services.find(item => item.id === attachment.serviceId);
  host.attachments.splice(index, 1);
  saveState();
  renderHosts();
  showToast(`Сервис "${service?.name || '—'}" отсоединён`);
}

/* SERVICES */

function renderServices() {
  const services = state.services;
  const content = `
    <div class="panel">
      <div class="panel-info"><b>Сервисы.</b> Сервис принадлежит группе. Создать, редактировать и удалить его может участник группы-владельца или MARS admin.</div>
      <div class="panel-toolbar">
        <div>
          <input class="checkbox" type="checkbox" onchange="toggleAllServices(this.checked)" ${services.length && services.every(s => selectedServices.has(s.id)) ? 'checked' : ''}>
          <span class="muted">Выбрано: <b>${selectedServices.size}</b> из <b>${services.length}</b></span>
        </div>
        <div class="card-actions">
          <button class="btn-sm btn-danger" onclick="deleteSelectedServices()" ${selectedServices.size ? '' : 'disabled'}>🗑️ Удалить выбранные</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Сервисов</div><div class="stat-value">${services.length}</div></div>
        <div class="stat-card"><div class="stat-label">Используется на хостах</div><div class="stat-value">${services.reduce((sum, service) => sum + serviceUsageCount(service.id), 0)}</div></div>
        <div class="stat-card"><div class="stat-label">С auth</div><div class="stat-value">${services.filter(service => hasAuth(service.auth)).length}</div></div>
        <div class="stat-card"><div class="stat-label">HTTPS</div><div class="stat-value">${services.filter(service => service.protocol === 'https').length}</div></div>
      </div>
      <div class="panel-content">${services.length ? services.map(serviceCardHtml).join('') : '<div class="empty">Нет сервисов</div>'}</div>
    </div>
  `;

  page('services', '🔌 Библиотека сервисов', 'Настрой один раз — применяй везде', `<button onclick="openServiceForm()">➕ Создать сервис</button>`, content);
}

function serviceCardHtml(service) {
  const selected = selectedServices.has(service.id);
  return `
    <div class="card ${selected ? 'selected' : ''}">
      <div class="card-main">
        <input class="checkbox" type="checkbox" onchange="toggleService('${service.id}')" ${selected ? 'checked' : ''}>
        <span class="icon">${service.icon}</span>
        <div>
          <div class="card-title">${escapeHtml(service.name)} <span class="badge badge-blue">Сервис</span></div>
          ${serviceMeta(service, true)}
          ${collectionsHtml(service.id)}
          <div class="pills">
            <span class="badge">Создал: ${escapeHtml(userName(service.createdBy))}</span>
            <span class="badge">Используется: ${serviceUsageCount(service.id)} хостов</span>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-xs btn-outline" onclick="openServiceForm('${service.id}')" ${canManageService(service) ? '' : 'disabled'}>✏️ Редактировать</button>
        <button class="btn-xs btn-outline" onclick="openCloneServiceModal('${service.id}')" ${canManageService(service) ? '' : 'disabled'}>⧉ Клонировать</button>
        <button class="btn-xs btn-purple" onclick="openTemplateFromServiceModal('${service.id}')" ${canManageService(service) ? '' : 'disabled'}>🧩 Создать шаблон</button>
        <button class="btn-xs btn-danger" onclick="deleteService('${service.id}')" ${canManageService(service) ? '' : 'disabled'}>🗑️ Удалить</button>
      </div>
    </div>
  `;
}

function serviceUsageCount(serviceId) {
  return state.hosts.reduce((count, host) => count + host.attachments.filter(attachment => attachment.serviceId === serviceId).length, 0);
}

function toggleService(id) {
  selectedServices.has(id) ? selectedServices.delete(id) : selectedServices.add(id);
  renderServices();
}

function toggleAllServices(checked) {
  state.services.forEach(service => checked ? selectedServices.add(service.id) : selectedServices.delete(service.id));
  renderServices();
}

function serviceNameUnique(name, skipId = null) {
  const lowered = name.trim().toLowerCase();
  return !!lowered && !state.services.some(service => service.id !== skipId && service.name.toLowerCase() === lowered);
}

function templateNameUnique(name, skipId = null) {
  const lowered = name.trim().toLowerCase();
  return !!lowered && !state.serviceTemplates.some(template => template.id !== skipId && template.name.toLowerCase() === lowered);
}

function groupOptions(selectedGroupId) {
  return state.groups.map(group => `
    <option value="${group.id}" ${selectedGroupId === group.id ? 'selected' : ''} ${canManageGroup(group.id) ? '' : 'disabled'}>
      ${escapeHtml(group.name)}${canManageGroup(group.id) ? '' : ' · нет доступа'}
    </option>
  `).join('');
}

function serviceFormHtml(prefix, item = {}, includeAuth = true) {
  const selectedGroupId = item.groupId || currentUser().groups[0] || state.groups[0].id;
  return `
    <div class="row">
      <div class="form-group">
        <label class="form-label">Название *</label>
        <input id="${prefix}-name" class="wide" value="${escapeHtml(item.name || '')}" oninput="checkServiceForm('${prefix}', ${includeAuth})">
        <div id="${prefix}-name-hint" class="hint"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Группа-владелец *</label>
        <select id="${prefix}-group" class="wide" onchange="checkServiceForm('${prefix}', ${includeAuth})">
          ${groupOptions(selectedGroupId)}
        </select>
      </div>
    </div>

    <div class="row3">
      <div class="form-group">
        <label class="form-label">Тип *</label>
        <select id="${prefix}-type" class="wide" onchange="updateTypeUi('${prefix}'); checkServiceForm('${prefix}', ${includeAuth})">
          ${['ExporterScrape', 'SQL', 'BlackBox'].map(type => `<option value="${type}" ${item.type === type ? 'selected' : ''}>${type}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Иконка</label>
        <select id="${prefix}-icon" class="wide">
          ${['🌐', '🐘', '🔴', '📊', '🐰', '🔒', '🧩'].map(icon => `<option value="${icon}" ${item.icon === icon ? 'selected' : ''}>${icon}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Порт *</label>
        <input id="${prefix}-port" type="number" min="1" max="65535" class="wide" value="${item.port || 80}" oninput="checkServiceForm('${prefix}', ${includeAuth})">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Путь к метрикам</label>
      <input id="${prefix}-metrics" class="wide mono" value="${escapeHtml(item.metrics || '/metrics')}">
    </div>

    <div class="box" id="${prefix}-protocol-box">
      <div class="form-group">
        <label class="form-label">Протокол сбора</label>
        <select id="${prefix}-protocol" class="wide" onchange="updateTypeUi('${prefix}')">
          <option value="http" ${(item.protocol || 'http') === 'http' ? 'selected' : ''}>HTTP</option>
          <option value="https" ${item.protocol === 'https' ? 'selected' : ''}>HTTPS</option>
        </select>
        <div class="hint">Настройка доступна для типа ExporterScrape.</div>
      </div>

      <div id="${prefix}-tls-box">
        <div class="form-group">
          <label class="form-label">Клиентский сертификат как строка</label>
          <textarea id="${prefix}-client-cert" class="wide mono" rows="6" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----">${escapeHtml(item.tls?.clientCert || '')}</textarea>
          <div class="hint">Это текстовое поле показывается только для HTTPS. Для HTTP оно скрыто.</div>
        </div>
        <label>
          <input id="${prefix}-skip-server-verify" class="checkbox" type="checkbox" ${item.tls?.skipServerVerify ? 'checked' : ''}>
          Пропустить проверку серверного сертификата
        </label>
      </div>
    </div>

    ${includeAuth ? `
      <div class="box">
        <div class="form-group">
          <label class="form-label">Авторизация</label>
          <select id="${prefix}-auth-mode" class="wide" onchange="updateAuthUi('${prefix}')">
            <option value="none">Без авторизации</option>
            <option value="basic">Basic Auth</option>
            <option value="bearer">Bearer Token</option>
          </select>
        </div>
        <div class="row" id="${prefix}-basic-auth">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input id="${prefix}-auth-username" class="wide" value="${escapeHtml(item.auth?.username || '')}">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input id="${prefix}-auth-password" type="password" class="wide" value="${escapeHtml(item.auth?.password || '')}">
          </div>
        </div>
        <div class="form-group" id="${prefix}-bearer-auth">
          <label class="form-label">Token</label>
          <input id="${prefix}-auth-token" type="password" class="wide" value="${escapeHtml(item.auth?.token || '')}">
        </div>
      </div>
    ` : ''}
  `;
}

function fillAuthMode(prefix, item) {
  const modeSelect = $(`${prefix}-auth-mode`);
  if (!modeSelect) return;
  modeSelect.value = normalizeAuth(item.auth).mode;
  updateAuthUi(prefix);
}

function updateTypeUi(prefix) {
  const type = $(`${prefix}-type`)?.value;
  const protocolBox = $(`${prefix}-protocol-box`);
  const tlsBox = $(`${prefix}-tls-box`);
  const protocol = $(`${prefix}-protocol`)?.value || 'http';

  if (protocolBox) protocolBox.style.display = type === 'ExporterScrape' ? 'block' : 'none';
  if (tlsBox) tlsBox.style.display = type === 'ExporterScrape' && protocol === 'https' ? 'block' : 'none';
}

function updateAuthUi(prefix) {
  const mode = $(`${prefix}-auth-mode`)?.value || 'none';
  const basic = $(`${prefix}-basic-auth`);
  const bearer = $(`${prefix}-bearer-auth`);
  if (basic) basic.style.display = mode === 'basic' ? 'grid' : 'none';
  if (bearer) bearer.style.display = mode === 'bearer' ? 'block' : 'none';
}

function collectServiceForm(prefix, includeAuth = true) {
  const type = $(`${prefix}-type`).value;
  const protocol = type === 'ExporterScrape' ? $(`${prefix}-protocol`).value : null;
  const tls = type === 'ExporterScrape' && protocol === 'https'
    ? {
      clientCert: $(`${prefix}-client-cert`)?.value || '',
      skipServerVerify: !!$(`${prefix}-skip-server-verify`)?.checked
    }
    : null;

  let auth = { mode: 'none' };
  if (includeAuth && $(`${prefix}-auth-mode`)) {
    const mode = $(`${prefix}-auth-mode`).value;
    if (mode === 'basic') {
      auth = {
        mode: 'basic',
        username: $(`${prefix}-auth-username`).value,
        password: $(`${prefix}-auth-password`).value
      };
    } else if (mode === 'bearer') {
      auth = {
        mode: 'bearer',
        token: $(`${prefix}-auth-token`).value
      };
    }
  }

  return {
    name: $(`${prefix}-name`).value.trim(),
    groupId: $(`${prefix}-group`).value,
    type,
    icon: $(`${prefix}-icon`).value,
    port: Number($(`${prefix}-port`).value),
    metrics: $(`${prefix}-metrics`).value.trim() || '/metrics',
    protocol,
    tls,
    ...(includeAuth ? { auth } : {})
  };
}

function checkServiceForm(prefix, includeAuth = true, skipId = null, isTemplate = false) {
  const name = $(`${prefix}-name`)?.value.trim() || '';
  const groupId = $(`${prefix}-group`)?.value;
  const port = Number($(`${prefix}-port`)?.value);
  const nameHint = $(`${prefix}-name-hint`);
  const saveButton = $(`${prefix}-save-button`);

  const unique = isTemplate ? templateNameUnique(name, skipId) : serviceNameUnique(name, skipId);
  const validName = !!name && unique;
  const validPort = port >= 1 && port <= 65535;
  const validGroup = !!groupId && canManageGroup(groupId);

  if (nameHint) {
    if (!name) {
      nameHint.textContent = 'Название обязательно';
      nameHint.className = 'hint text-danger';
    } else if (!unique) {
      nameHint.textContent = isTemplate ? 'Шаблон с таким именем уже существует' : 'Сервис с таким именем уже существует';
      nameHint.className = 'hint text-danger';
    } else {
      nameHint.textContent = 'Название свободно';
      nameHint.className = 'hint text-success';
    }
  }

  if (saveButton) saveButton.disabled = !(validName && validPort && validGroup);
}

function openServiceForm(serviceId = null) {
  const service = serviceId ? state.services.find(item => item.id === serviceId) : null;
  if (service && !canManageService(service)) return showToast('Нет прав на сервис');

  editingServiceId = serviceId;
  const draft = service || {
    name: '',
    type: 'ExporterScrape',
    icon: '🌐',
    port: 80,
    metrics: '/metrics',
    groupId: currentUser().groups[0] || state.groups[0].id,
    auth: { mode: 'none' },
    protocol: 'http',
    tls: null
  };

  openModal(
    serviceId ? 'Редактирование сервиса' : 'Создание сервиса',
    serviceId ? 'Измените параметры сервиса' : 'Настрой один раз — применяй везде',
    serviceFormHtml('service', draft, true),
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="service-save-button" onclick="saveService()">${serviceId ? 'Сохранить' : 'Создать сервис'}</button></div>
    `
  );

  fillAuthMode('service', draft);
  updateTypeUi('service');
  checkServiceForm('service', true, serviceId, false);
}

function saveService() {
  const data = collectServiceForm('service', true);
  if (!data.name || !canManageGroup(data.groupId)) return showToast('Нет прав на группу или пустое название');

  if (editingServiceId) {
    const service = state.services.find(item => item.id === editingServiceId);
    if (!canManageService(service)) return showToast('Нет прав на сервис');
    Object.assign(service, data);
    showToast('Сервис обновлён');
  } else {
    state.services.push({
      id: makeId('svc'),
      ...data,
      createdBy: state.currentUserId
    });
    showToast('Сервис создан');
  }

  saveState();
  closeModal();
  render();
}

function deleteService(serviceId) {
  const service = state.services.find(item => item.id === serviceId);
  if (!canManageService(service)) return showToast('Нет прав на сервис');

  confirmAction('Удаление сервиса', `Удалить сервис <b>${escapeHtml(service.name)}</b>? Он будет удалён из коллекций и отсоединён от хостов.`, () => {
    removeService(serviceId);
    saveState();
    render();
    showToast('Сервис удалён');
  });
}

function removeService(serviceId) {
  state.services = state.services.filter(service => service.id !== serviceId);
  state.collections.forEach(collection => {
    collection.serviceIds = collection.serviceIds.filter(id => id !== serviceId);
  });
  state.hosts.forEach(host => {
    host.attachments = host.attachments.filter(attachment => attachment.serviceId !== serviceId);
  });
  selectedServices.delete(serviceId);
}

function deleteSelectedServices() {
  const ids = Array.from(selectedServices);
  if (!ids.length) return;
  const denied = ids.some(id => !canManageService(state.services.find(service => service.id === id)));
  if (denied) return showToast('В выборе есть сервисы без прав удаления');

  confirmAction('Массовое удаление сервисов', `Удалить выбранные сервисы: <b>${ids.length}</b>?`, () => {
    ids.forEach(removeService);
    saveState();
    render();
    showToast('Сервисы удалены');
  });
}

function openCloneServiceModal(serviceId) {
  const service = state.services.find(item => item.id === serviceId);
  if (!canManageService(service)) return showToast('Нет прав на сервис');

  openModal(
    'Клонирование сервиса',
    service.name,
    `
      <div class="form-group">
        <label class="form-label">Имя нового сервиса *</label>
        <input id="clone-service-name" class="wide" value="${escapeHtml(`Копия ${service.name}`)}" oninput="checkCloneName()">
        <div id="clone-service-name-hint" class="hint"></div>
      </div>
      <div class="box">
        <b>Исходный сервис</b>
        ${serviceMeta(service, true)}
        ${collectionsHtml(service.id)}
      </div>
    `,
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="clone-service-button" onclick="saveClonedService('${serviceId}')">Клонировать</button></div>
    `,
    true
  );
  checkCloneName();
}

function checkCloneName() {
  const name = $('clone-service-name')?.value.trim() || '';
  const hint = $('clone-service-name-hint');
  const button = $('clone-service-button');
  const unique = serviceNameUnique(name);
  if (hint) {
    hint.textContent = !name ? 'Имя обязательно' : (unique ? 'Имя свободно' : 'Сервис с таким именем уже существует');
    hint.className = `hint ${name && unique ? 'text-success' : 'text-danger'}`;
  }
  if (button) button.disabled = !(name && unique);
}

function saveClonedService(serviceId) {
  const service = state.services.find(item => item.id === serviceId);
  const name = $('clone-service-name').value.trim();
  if (!service || !name || !serviceNameUnique(name)) return;
  if (!canManageService(service)) return showToast('Нет прав на сервис');

  state.services.push({
    ...JSON.parse(JSON.stringify(service)),
    id: makeId('svc'),
    name,
    createdBy: state.currentUserId
  });
  saveState();
  closeModal();
  render();
  showToast('Сервис склонирован');
}

function openTemplateFromServiceModal(serviceId) {
  const service = state.services.find(item => item.id === serviceId);
  if (!canManageService(service)) return showToast('Нет прав на сервис');

  openModal(
    'Создание шаблона сервиса',
    service.name,
    `
      <div class="form-group">
        <label class="form-label">Название шаблона *</label>
        <input id="template-from-service-name" class="wide" value="${escapeHtml(`Шаблон "${service.name}"`)}" oninput="checkTemplateFromServiceName()">
        <div id="template-from-service-name-hint" class="hint"></div>
      </div>
      <div class="box box-purple">
        <b>Шаблон скопирует:</b>
        <div class="hint">тип, порт, путь метрик, группу-владельца, HTTP/HTTPS и TLS-настройки. Авторизация в шаблон не переносится.</div>
        ${serviceMeta(service, false)}
      </div>
    `,
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="template-from-service-button" class="btn-purple" onclick="saveTemplateFromService('${serviceId}')">🧩 Создать шаблон</button></div>
    `,
    true
  );
  checkTemplateFromServiceName();
}

function checkTemplateFromServiceName() {
  const name = $('template-from-service-name')?.value.trim() || '';
  const hint = $('template-from-service-name-hint');
  const button = $('template-from-service-button');
  const unique = templateNameUnique(name);
  if (hint) {
    hint.textContent = !name ? 'Название обязательно' : (unique ? 'Имя шаблона свободно' : 'Шаблон с таким именем уже существует');
    hint.className = `hint ${name && unique ? 'text-success' : 'text-danger'}`;
  }
  if (button) button.disabled = !(name && unique);
}

function saveTemplateFromService(serviceId) {
  const service = state.services.find(item => item.id === serviceId);
  const name = $('template-from-service-name').value.trim();
  if (!service || !name || !templateNameUnique(name)) return;
  if (!canManageService(service)) return showToast('Нет прав на сервис');

  state.serviceTemplates.push({
    id: makeId('tpl'),
    name,
    type: service.type,
    icon: service.icon,
    port: service.port,
    metrics: service.metrics,
    groupId: service.groupId,
    createdBy: state.currentUserId,
    protocol: service.protocol,
    tls: service.tls ? JSON.parse(JSON.stringify(service.tls)) : null
  });

  saveState();
  closeModal();
  render();
  showToast('Шаблон создан');
}

/* TEMPLATES */

function renderTemplates() {
  const templates = state.serviceTemplates;
  const content = `
    <div class="panel">
      <div class="panel-info"><b>Шаблоны сервисов.</b> Заготовки типа, порта, метрик и TLS-настроек. В шаблонах нет аутентификации.</div>
      <div class="panel-toolbar">
        <div>
          <input class="checkbox" type="checkbox" onchange="toggleAllTemplates(this.checked)" ${templates.length && templates.every(t => selectedTemplates.has(t.id)) ? 'checked' : ''}>
          <span class="muted">Выбрано: <b>${selectedTemplates.size}</b> из <b>${templates.length}</b></span>
        </div>
        <button class="btn-sm btn-danger" onclick="deleteSelectedTemplates()" ${selectedTemplates.size ? '' : 'disabled'}>🗑️ Удалить выбранные</button>
      </div>
      <div class="stats-grid three">
        <div class="stat-card"><div class="stat-label">Шаблонов</div><div class="stat-value">${templates.length}</div></div>
        <div class="stat-card"><div class="stat-label">HTTPS</div><div class="stat-value">${templates.filter(template => template.protocol === 'https').length}</div></div>
        <div class="stat-card"><div class="stat-label">Групп</div><div class="stat-value">${new Set(templates.map(template => template.groupId)).size}</div></div>
      </div>
      <div class="panel-content">${templates.length ? templates.map(templateCardHtml).join('') : '<div class="empty">Нет шаблонов</div>'}</div>
    </div>
  `;

  page('templates', '🧩 Шаблоны сервисов', 'Клик по шаблону создаёт сервис на его основе', '', content);
}

function templateCardHtml(template) {
  const selected = selectedTemplates.has(template.id);
  return `
    <div class="card clickable ${selected ? 'selected' : ''}" onclick="openCreateServiceFromTemplateModal('${template.id}')">
      <div class="card-main">
        <input class="checkbox" type="checkbox" onclick="event.stopPropagation()" onchange="toggleTemplate('${template.id}')" ${selected ? 'checked' : ''}>
        <span class="icon">${template.icon}</span>
        <div>
          <div class="card-title">${escapeHtml(template.name)} <span class="badge badge-purple">Шаблон</span></div>
          ${serviceMeta(template, false)}
          <div class="pills">
            <span class="badge">Создал: ${escapeHtml(userName(template.createdBy))}</span>
            <span class="badge badge-blue">Нажмите, чтобы создать сервис</span>
          </div>
        </div>
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn-xs btn-outline" onclick="openTemplateForm('${template.id}')" ${canManageService(template) ? '' : 'disabled'}>✏️ Редактировать</button>
        <button class="btn-xs btn-danger" onclick="deleteTemplate('${template.id}')" ${canManageService(template) ? '' : 'disabled'}>🗑️ Удалить</button>
      </div>
    </div>
  `;
}

function toggleTemplate(id) {
  selectedTemplates.has(id) ? selectedTemplates.delete(id) : selectedTemplates.add(id);
  renderTemplates();
}

function toggleAllTemplates(checked) {
  state.serviceTemplates.forEach(template => checked ? selectedTemplates.add(template.id) : selectedTemplates.delete(template.id));
  renderTemplates();
}

function openTemplateForm(templateId) {
  const template = state.serviceTemplates.find(item => item.id === templateId);
  if (!canManageService(template)) return showToast('Нет прав на шаблон');

  editingTemplateId = templateId;

  openModal(
    'Редактирование шаблона сервиса',
    'В шаблоне нет параметров аутентификации',
    serviceFormHtml('template', template, false),
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="template-save-button" onclick="saveTemplate()">Сохранить шаблон</button></div>
    `
  );

  updateTypeUi('template');
  checkServiceForm('template', false, templateId, true);
}

function saveTemplate() {
  const data = collectServiceForm('template', false);
  const template = state.serviceTemplates.find(item => item.id === editingTemplateId);
  if (!template || !canManageService(template)) return showToast('Нет прав на шаблон');
  if (!templateNameUnique(data.name, editingTemplateId)) return showToast('Шаблон с таким именем уже существует');

  Object.assign(template, data);
  saveState();
  closeModal();
  render();
  showToast('Шаблон обновлён');
}

function deleteTemplate(templateId) {
  const template = state.serviceTemplates.find(item => item.id === templateId);
  if (!canManageService(template)) return showToast('Нет прав на шаблон');

  confirmAction('Удаление шаблона', `Удалить шаблон <b>${escapeHtml(template.name)}</b>?`, () => {
    state.serviceTemplates = state.serviceTemplates.filter(item => item.id !== templateId);
    selectedTemplates.delete(templateId);
    saveState();
    render();
    showToast('Шаблон удалён');
  });
}

function deleteSelectedTemplates() {
  const ids = Array.from(selectedTemplates);
  if (!ids.length) return;
  const denied = ids.some(id => !canManageService(state.serviceTemplates.find(template => template.id === id)));
  if (denied) return showToast('В выборе есть шаблоны без прав удаления');

  confirmAction('Массовое удаление шаблонов', `Удалить выбранные шаблоны: <b>${ids.length}</b>?`, () => {
    state.serviceTemplates = state.serviceTemplates.filter(template => !selectedTemplates.has(template.id));
    selectedTemplates.clear();
    saveState();
    render();
    showToast('Шаблоны удалены');
  });
}

function openCreateServiceFromTemplateModal(templateId) {
  const template = state.serviceTemplates.find(item => item.id === templateId);
  const defaultName = template.name.replace(/^Шаблон\s*/i, '').replace(/^"|"$/g, '');

  openModal(
    'Создание сервиса из шаблона',
    template.name,
    `
      <div class="form-group">
        <label class="form-label">Имя нового сервиса *</label>
        <input id="service-from-template-name" class="wide" value="${escapeHtml(defaultName)}" oninput="checkServiceFromTemplateName()">
        <div id="service-from-template-name-hint" class="hint"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Группа-владелец *</label>
        <select id="service-from-template-group" class="wide" onchange="checkServiceFromTemplateName()">
          ${groupOptions(currentUser().groups[0] || template.groupId)}
        </select>
      </div>
      <div class="box">
        <b>Предпросмотр конфигурации</b>
        ${serviceMeta(template, false)}
        <div class="hint">Сервис будет создан без авторизации. Её можно настроить после создания в разделе «Сервисы».</div>
      </div>
    `,
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="service-from-template-button" onclick="saveServiceFromTemplate('${templateId}')">Создать сервис</button></div>
    `,
    true
  );
  checkServiceFromTemplateName();
}

function checkServiceFromTemplateName() {
  const name = $('service-from-template-name')?.value.trim() || '';
  const groupId = $('service-from-template-group')?.value;
  const hint = $('service-from-template-name-hint');
  const button = $('service-from-template-button');
  const unique = serviceNameUnique(name);
  const groupOk = canManageGroup(groupId);
  if (hint) {
    if (!name) {
      hint.textContent = 'Имя обязательно';
      hint.className = 'hint text-danger';
    } else if (!unique) {
      hint.textContent = 'Сервис с таким именем уже существует';
      hint.className = 'hint text-danger';
    } else if (!groupOk) {
      hint.textContent = 'Нет прав на выбранную группу';
      hint.className = 'hint text-danger';
    } else {
      hint.textContent = 'Имя свободно';
      hint.className = 'hint text-success';
    }
  }
  if (button) button.disabled = !(name && unique && groupOk);
}

function saveServiceFromTemplate(templateId) {
  const template = state.serviceTemplates.find(item => item.id === templateId);
  const name = $('service-from-template-name').value.trim();
  const groupId = $('service-from-template-group').value;
  if (!template || !name || !serviceNameUnique(name) || !canManageGroup(groupId)) return;

  state.services.push({
    id: makeId('svc'),
    name,
    type: template.type,
    icon: template.icon,
    port: template.port,
    metrics: template.metrics,
    groupId,
    createdBy: state.currentUserId,
    protocol: template.protocol,
    tls: template.tls ? JSON.parse(JSON.stringify(template.tls)) : null,
    auth: { mode: 'none' }
  });

  saveState();
  closeModal();
  render();
  showToast('Сервис создан из шаблона');
}

/* COLLECTIONS */

function renderCollections() {
  const collections = state.collections;
  const content = `
    <div class="panel">
      <div class="panel-info"><b>Коллекции.</b> Наборы сервисов для пакетного присоединения.</div>
      <div class="stats-grid three">
        <div class="stat-card"><div class="stat-label">Коллекций</div><div class="stat-value">${collections.length}</div></div>
        <div class="stat-card"><div class="stat-label">Используется</div><div class="stat-value">${collections.reduce((sum, c) => sum + (c.usedBy || 0), 0)}</div></div>
        <div class="stat-card"><div class="stat-label">Среднее сервисов</div><div class="stat-value">${collections.length ? (collections.reduce((sum, c) => sum + c.serviceIds.length, 0) / collections.length).toFixed(1) : 0}</div></div>
      </div>
      <div class="panel-content">${collections.length ? collections.map(collectionCardHtml).join('') : '<div class="empty">Нет коллекций</div>'}</div>
    </div>
  `;

  page('collections', '📦 Библиотека коллекций', 'Группы сервисов для пакетного присоединения', `<button onclick="openCollectionForm()">➕ Создать коллекцию</button>`, content);
}

function collectionCardHtml(collection) {
  const services = collection.serviceIds.map(id => state.services.find(service => service.id === id)).filter(Boolean);
  return `
    <div class="card">
      <div class="card-main">
        <span class="icon">📦</span>
        <div>
          <div class="card-title">${escapeHtml(collection.name)} <span class="badge badge-blue">${services.length} сервисов</span></div>
          <div class="card-meta">${escapeHtml(collection.description || '')}</div>
          <div class="collections-line">
            <span class="collections-label">Сервисы:</span>
            ${services.length ? services.map(service => `<span class="badge">${service.icon} ${escapeHtml(service.name)}</span>`).join('') : '<span class="badge">—</span>'}
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-xs btn-danger" onclick="deleteCollection('${collection.id}')">🗑️ Удалить</button>
      </div>
    </div>
  `;
}

function openCollectionForm() {
  collectionDraft = { name: '', description: '', serviceIds: [] };
  renderCollectionForm();
}

function renderCollectionForm() {
  openModal(
    'Создание коллекции',
    'Выберите сервисы из библиотеки',
    `
      <div class="form-group">
        <label class="form-label">Название *</label>
        <input id="collection-name" class="wide" value="${escapeHtml(collectionDraft.name)}" oninput="collectionDraft.name=this.value; checkCollectionForm()">
      </div>
      <div class="form-group">
        <label class="form-label">Описание</label>
        <textarea id="collection-description" class="wide" rows="2" oninput="collectionDraft.description=this.value">${escapeHtml(collectionDraft.description)}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Состав коллекции</label>
        <div class="box" id="collection-picked-services"></div>
        <button class="btn-outline" onclick="openServicePickerForCollection()">➕ Добавить сервис</button>
      </div>
    `,
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button id="collection-save-button" onclick="saveCollection()">Сохранить</button></div>
    `
  );
  renderPickedServices();
  checkCollectionForm();
}

function renderPickedServices() {
  const container = $('collection-picked-services');
  if (!container) return;

  const services = collectionDraft.serviceIds.map(id => state.services.find(service => service.id === id)).filter(Boolean);
  container.innerHTML = services.length
    ? services.map(service => `
      <div class="card">
        <div class="card-main">
          <span class="icon">${service.icon}</span>
          <div>
            <div class="card-title">${escapeHtml(service.name)}</div>
            ${serviceMeta(service, true)}
            ${collectionsHtml(service.id)}
          </div>
        </div>
        <button class="btn-xs btn-danger" onclick="removeServiceFromCollectionDraft('${service.id}')">✕</button>
      </div>
    `).join('')
    : '<div class="muted">Коллекция пуста</div>';
}

function openServicePickerForCollection() {
  collectionDraft.name = $('collection-name')?.value || collectionDraft.name;
  collectionDraft.description = $('collection-description')?.value || collectionDraft.description;

  openModal(
    'Выберите сервис',
    'Добавление в коллекцию',
    `
      <div class="form-group">
        <input id="service-picker-search" class="wide" placeholder="Поиск..." oninput="renderServicePickerList()">
      </div>
      <div id="service-picker-list"></div>
    `,
    `<button class="btn-outline" onclick="renderCollectionForm()">Назад</button>`
  );

  renderServicePickerList();
}

function renderServicePickerList() {
  const search = ($('service-picker-search')?.value || '').toLowerCase();
  const services = state.services.filter(service => service.name.toLowerCase().includes(search));
  $('service-picker-list').innerHTML = services.map(service => {
    const added = collectionDraft.serviceIds.includes(service.id);
    return `
      <div class="card clickable ${added ? 'selected' : ''}" onclick="${added ? '' : `addServiceToCollectionDraft('${service.id}')`}">
        <div class="card-main">
          <span class="icon">${service.icon}</span>
          <div>
            <div class="card-title">${escapeHtml(service.name)}</div>
            ${serviceMeta(service, true)}
            ${collectionsHtml(service.id)}
          </div>
        </div>
        <span class="badge ${added ? 'badge-green' : 'badge-blue'}">${added ? '✓ Добавлен' : '➕ Добавить'}</span>
      </div>
    `;
  }).join('') || '<div class="empty">Сервисы не найдены</div>';
}

function addServiceToCollectionDraft(serviceId) {
  if (!collectionDraft.serviceIds.includes(serviceId)) collectionDraft.serviceIds.push(serviceId);
  renderCollectionForm();
}

function removeServiceFromCollectionDraft(serviceId) {
  collectionDraft.serviceIds = collectionDraft.serviceIds.filter(id => id !== serviceId);
  renderPickedServices();
  checkCollectionForm();
}

function checkCollectionForm() {
  const name = $('collection-name')?.value.trim() || collectionDraft.name.trim();
  const button = $('collection-save-button');
  if (button) button.disabled = !(name && collectionDraft.serviceIds.length);
}

function saveCollection() {
  const name = $('collection-name').value.trim();
  const description = $('collection-description').value.trim();
  if (!name || !collectionDraft.serviceIds.length) return showToast('Заполните название и добавьте сервисы');

  state.collections.push({
    id: makeId('col'),
    name,
    description,
    serviceIds: [...collectionDraft.serviceIds],
    createdBy: state.currentUserId,
    usedBy: 0
  });

  saveState();
  closeModal();
  render();
  showToast('Коллекция создана');
}

function deleteCollection(collectionId) {
  const collection = state.collections.find(item => item.id === collectionId);
  confirmAction('Удаление коллекции', `Удалить коллекцию <b>${escapeHtml(collection.name)}</b>?`, () => {
    state.collections = state.collections.filter(item => item.id !== collectionId);
    saveState();
    render();
    showToast('Коллекция удалена');
  });
}

/* ATTACH */

function openAttachWizard(type) {
  if (!canMonitor()) return showToast('Нет разрешения на постановку на мониторинг');
  if (selectedHosts.size !== 1) return showToast('Выберите один хост');

  activeAttachment = {
    type,
    hostId: Array.from(selectedHosts)[0],
    itemId: null
  };

  const host = state.hosts.find(item => item.id === activeAttachment.hostId);
  const items = type === 'service' ? state.services : state.collections;

  openModal(
    type === 'service' ? 'Присоединение сервиса' : 'Присоединение коллекции',
    `Хост: ${host.name} (${host.address})`,
    items.length ? items.map(item => attachItemHtml(type, item)).join('') : '<div class="empty">Нет элементов</div>',
    `<button class="btn-outline" onclick="closeModal()">Отмена</button>`
  );
}

function attachItemHtml(type, item) {
  if (type === 'service') {
    return `
      <div class="card clickable" onclick="selectAttachItem('${item.id}')">
        <div class="card-main">
          <span class="icon">${item.icon}</span>
          <div>
            <div class="card-title">${escapeHtml(item.name)}</div>
            ${serviceMeta(item, true)}
            ${collectionsHtml(item.id)}
          </div>
        </div>
      </div>
    `;
  }

  const services = item.serviceIds.map(id => state.services.find(service => service.id === id)).filter(Boolean);
  return `
    <div class="card clickable" onclick="selectAttachItem('${item.id}')">
      <div class="card-main">
        <span class="icon">📦</span>
        <div>
          <div class="card-title">${escapeHtml(item.name)}</div>
          <div class="card-meta">${escapeHtml(item.description || '')}</div>
          <div class="collections-line">
            <span class="collections-label">Сервисы:</span>
            ${services.map(service => `<span class="badge">${service.icon} ${escapeHtml(service.name)}</span>`).join('') || '<span class="badge">—</span>'}
          </div>
        </div>
      </div>
    </div>
  `;
}

function selectAttachItem(itemId) {
  activeAttachment.itemId = itemId;
