function loadState(){
  let raw=localStorage.getItem(STORE_KEY);
  if(!raw){for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break}}
  if(raw){try{state=normalizeState(JSON.parse(raw))}catch(e){state=demoState()}}else state=demoState();
  state=normalizeState(state);saveState()
}
function normalizeState(s){
  const d=demoState(),ns={...d,...s};
  ns.groups=(Array.isArray(ns.groups)&&ns.groups.length?ns.groups:d.groups).map(g=>({
    id:g.id||uid('g'),

function hostMatchesRule(h,rule){
  const field=rule.field||'visibleName';
  const needle=filterText(rule.value);
  if(!needle)return true;
  if(field==='services'){
    const serviceIds=(h.attachments||[]).map(a=>String(a.serviceId));
    const present=needle==='__none__'?serviceIds.length===0:serviceIds.some(id=>filterText(id)===needle);
    return rule.operator==='not_contains'?!present:present;
  }
  const value=hostFilterValue(h,field);
  switch(rule.operator){
    case 'equals': return value===needle;
    case 'not_equals': return value!==needle;
    case 'not_contains': return !value.includes(needle);
    case 'starts_with': return value.startsWith(needle);
    case 'ends_with': return value.endsWith(needle);
    default: return value.includes(needle)
  }
}
function filteredHosts(){
  const query=String(hostFilterState.query||'').trim().toLocaleLowerCase('ru-RU');
  const rules=(hostFilterState.rules||[]).filter(r=>String(r.value||'').trim());
  return state.hosts.filter(h=>{
    if(query&&!hostSearchText(h).includes(query))return false;
    return rules.every(rule=>hostMatchesRule(h,rule))
  })

  return [...items].sort((a,b)=>String(column.value(a)).localeCompare(String(column.value(b)),'ru',{numeric:true,sensitivity:'base'})*multiplier)
}
function hostTableData(){

  if(hostTableView.page>pageCount)hostTableView.page=pageCount;
  const start=(hostTableView.page-1)*hostTableView.pageSize;
  return {filtered,pageCount,start,items:filtered.slice(start,start+hostTableView.pageSize)}
}
function activeHostFilterChips(){

    const operatorLabel=Object.fromEntries(hostFilterOperatorItems(r.field||'visibleName'))[r.operator]||'содержит';
    chips.push({kind:'rule',index,text:`${HOST_TABLE_COLUMNS[r.field]?.label||r.field} · ${operatorLabel} · ${hostFilterValueLabel(r.field||'visibleName',r.value)}`})
  });
  return chips
}

function createTemplateFromService(id){const s=state.services.find(x=>x.id===id);if(!s||!validateTemplateName())return;state.serviceTemplates.push({id:uid('tpl'),name:$('tpl-name').value.trim(),type:s.type,icon:s.icon,defaultPort:s.defaultPort,metrics:s.metrics,protocol:s.protocol||'http',skipServerCertCheck:!!s.skipServerCertCheck,ownerGroupId:s.ownerGroupId,createdBy:currentUser().id,usedBy:0});saveState();closeModal();renderAll();toast('Шаблон создан')}
function openServiceFromTemplate(id){const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;const s={name:t.name.replace(/^Шаблон\s+"(.+)"$/,'$1'),type:t.type,icon:t.icon,defaultPort:t.defaultPort,metrics:t.metrics,ownerGroupId:canManageGroup(t.ownerGroupId)?t.ownerGroupId:(isAdmin()?state.groups[0]?.id:currentUser().groups[0])||'g-infra',authMode:'none',basicUsername:'',basicPassword:'',bearerToken:'',protocol:t.protocol||'http',clientCertificate:'',skipServerCertCheck:!!t.skipServerCertCheck};openServiceModal('',s)}
function openEditTemplate(id){const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;openModal('Редактировать шаблон сервиса','Без настроек auth',`<div class="box blue-box">Шаблон не содержит авторизацию.</div><div class="field"><label>Название *</label><input id="tpl-name" class="wide" value="${esc(t.name)}" oninput="validateTemplateName(${q(id)})"><div id="tpl-val" class="hint"></div></div><div class="row3"><div class="field"><label>Тип</label><select id="tpl-type" class="wide">${typeOptions(t.type)}</select></div><div class="field"><label>Иконка</label><select id="tpl-icon" class="wide">${iconOptions(t.icon)}</select></div><div class="field"><label>Порт</label><input id="tpl-port" type="number" min="1" max="65535" class="wide" value="${t.defaultPort}"></div></div><div class="field"><label>Метрики</label><input id="tpl-metrics" class="wide mono" value="${esc(t.metrics)}"></div><div class="field"><label>Протокол для ExporterScrape</label><select id="tpl-protocol" class="wide">${selectOption('http','HTTP',t.protocol||'http')}${selectOption('https','HTTPS',t.protocol||'http')}</select></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveTemplate(${q(id)})">Сохранить</button>`);validateTemplateName(id)}
function saveTemplate(id){if(!validateTemplateName(id))return;const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;t.name=$('tpl-name').value.trim();t.type=$('tpl-type').value;t.icon=$('tpl-icon').value;t.defaultPort=num($('tpl-port').value,80);t.metrics=$('tpl-metrics').value.trim()||'/metrics';t.protocol=$('tpl-protocol').value;saveState();closeModal();renderAll();toast('Шаблон обновлён')}
function openDeleteTemplate(id){const t=state.serviceTemplates.find(x=>x.id===id);if(!t)return;confirmModal('Удаление шаблона',`Удалить шаблон <b>${esc(t.name)}</b>?`,'deleteTemplate',q(id))}
function deleteTemplate(id){state.serviceTemplates=state.serviceTemplates.filter(t=>t.id!==id);selectedTemplateIds.delete(id);saveState();renderAll();toast('Шаблон удалён')}
function openBulkDeleteTemplates(){openModal('Массовое удаление шаблонов','Подтвердите действие',`<div class="box red-box">Удалить шаблонов: ${selectedTemplateIds.size}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="bulkDeleteTemplates()">Удалить</button>`,true)}
function bulkDeleteTemplates(){state.serviceTemplates=state.serviceTemplates.filter(t=>!selectedTemplateIds.has(t.id));selectedTemplateIds.clear();saveState();closeModal();renderAll();toast('Шаблоны удалены')}

function renderCollections(){const avg=state.collections.length?(state.collections.reduce((s,c)=>s+c.serviceIds.length,0)/state.collections.length).toFixed(1):'0';const body=`<div class="panel"><div class="info"><b>Коллекция</b> хранит ссылки на сервисы. В карточках сервисов видно, в каких коллекциях они используются.</div><div class="stats three"><div class="stat"><div class="stat-label">Коллекций</div><div class="stat-value">${state.collections.length}</div></div><div class="stat"><div class="stat-label">Используется на хостах</div><div class="stat-value">${state.collections.reduce((s,c)=>s+c.usedBy,0)}</div></div><div class="stat"><div class="stat-label">Среднее сервисов</div><div class="stat-value">${avg}</div></div></div><div class="content">${state.collections.length?state.collections.map(collectionCard).join(''):'<div class="empty">Нет коллекций</div>'}</div></div>`;page('collections','📦 Коллекции','Группы сервисов для пакетного присоединения к хостам.',`<button onclick="openCollectionModal()">➕ Создать коллекцию</button>`,body)}
function collectionCard(c){const svcs=c.serviceIds.map(id=>state.services.find(s=>s.id===id)).filter(Boolean);return`<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c.name)} <span class="badge b-blue">${svcs.length} сервисов</span></div><div class="meta">${esc(c.description||'')}</div><div class="line"><span class="line-label">Сервисы:</span>${svcs.length?svcs.map(s=>`<span class="badge">${esc(s.icon)} ${esc(s.name)}</span>`).join(''):'<span class="muted">—</span>'}</div></div></div><div class="actions"><button class="xs danger" onclick="deleteCollection(${q(c.id)})">🗑️ Удалить</button></div></div>`}
function openCollectionModal(){collectionDraftIds=[];collectionDraftName='';collectionDraftDesc='';renderCollectionModal()}
function renderCollectionModal(){openModal('Создать коллекцию','Выберите сервисы из библиотеки',`<div class="field"><label>Название *</label><input id="col-name" class="wide" value="${esc(collectionDraftName)}" oninput="collectionDraftName=this.value"></div><div class="field"><label>Описание</label><textarea id="col-desc" rows="2" class="wide" oninput="collectionDraftDesc=this.value">${esc(collectionDraftDesc)}</textarea></div><div class="box"><b>Сервисы коллекции</b><div id="col-picked" style="margin-top:10px">${collectionDraftIds.length?collectionDraftIds.map(id=>{const s=state.services.find(x=>x.id===id);return s?`<span class="badge" style="margin:3px">${esc(s.icon)} ${esc(s.name)} <button class="xs ghost" onclick="removeFromCollectionDraft(${q(id)})">✕</button></span>`:''}).join(''):'<div class="muted">Коллекция пуста</div>'}</div><button class="outline" onclick="openServicePicker()">➕ Добавить сервис</button></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveCollection()">Сохранить</button>`)}
function openServicePicker(){const items=state.services.filter(s=>!collectionDraftIds.includes(s.id));openModal('Добавить сервис в коллекцию','Выберите сервис',items.length?items.map(s=>`<div class="card clickable" onclick="addToCollectionDraft(${q(s.id)})"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)} · ${s.defaultPort}</div></div></div></div>`).join(''):'<div class="empty">Все сервисы уже добавлены</div>',`<button class="ghost" onclick="renderCollectionModal()">Назад</button>`,true)}
function addToCollectionDraft(id){if(!collectionDraftIds.includes(id))collectionDraftIds.push(id);renderCollectionModal()}
function removeFromCollectionDraft(id){collectionDraftIds=collectionDraftIds.filter(x=>x!==id);renderCollectionModal()}
function saveCollection(){collectionDraftName=$('col-name')?.value.trim()||collectionDraftName;collectionDraftDesc=$('col-desc')?.value.trim()||collectionDraftDesc;if(!collectionDraftName||!collectionDraftIds.length)return toast('Введите название и добавьте сервисы');state.collections.push({id:uid('col'),name:collectionDraftName,description:collectionDraftDesc,serviceIds:[...collectionDraftIds],usedBy:0});saveState();closeModal();renderAll();toast('Коллекция создана')}
function deleteCollection(id){state.collections=state.collections.filter(c=>c.id!==id);saveState();renderAll();toast('Коллекция удалена')}

function openAttachModal(type){
  if(selectedHostIds.size!==1)return toast('Выберите один хост');
  const host=selectedHost();
  if(!host)return toast('Хост не найден');
  if(!canManageMonitoringHost(host))return toast('Нет permission «Постановка на мониторинг» в группе-владельце');
  const items=type==='service'?state.services:state.collections;
  openModal(type==='service'?'Присоединить сервис':'Присоединить коллекцию','Attachment будет принадлежать группе хоста',`<div class="box blue-box">Хост: <b>${esc(hostDisplayName(host))}</b> · группа: <b>${esc(groupName(host.ownerGroupId))}</b><br><span class="mono">${esc(host.targetKey)}</span> · ${esc(host.address)}</div>${items.length?items.map(i=>`<div class="card clickable" onclick="attachItem(${q(type)},${q(i.id)})"><div class="card-main"><span class="icon">${type==='service'?esc(i.icon):'📦'}</span><div><div class="card-title">${esc(i.name)}</div><div class="meta">${type==='service'?esc(i.type)+' · '+i.defaultPort:i.serviceIds.length+' сервисов'}</div></div></div></div>`).join(''):'<div class="empty">Нет доступных элементов</div>'}`,`<button class="ghost" onclick="closeModal()">Отмена</button>`)
}
function attachItem(type,itemId){
  const host=selectedHost();if(!host||!canManageMonitoringHost(host))return toast('Недостаточно прав');
  const ids=type==='service'?[itemId]:(state.collections.find(c=>c.id===itemId)?.serviceIds||[]);
  let added=0;
  ids.forEach(id=>{
    const s=state.services.find(x=>x.id===id);
    if(!s||host.attachments.some(a=>a.serviceId===id))return;
    host.attachments.push({serviceId:id,createdBy:currentUser().id,ownerGroupId:host.ownerGroupId,portOverride:null});
    added++
  });
  if(type==='collection'){const c=state.collections.find(x=>x.id===itemId);if(c)c.usedBy++}
  else{const s=state.services.find(x=>x.id===itemId);if(s)s.usedBy++}
  saveState();closeModal();expandedHostId=hostKey(host.id);renderAll();toast(`Присоединено сервисов: ${added}`)
}
function detachService(hostId,i){
  const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostId)),a=h?.attachments[i];
  if(!h||!a)return;
  if(!canManageAttachment(a,h))return toast('Нет permission «Постановка на мониторинг» в группе-владельце');
  h.attachments.splice(i,1);saveState();renderAll();toast('Сервис отсоединён')
}
function applyPort(hostId,i){
  const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostId)),a=h?.attachments[i];
  if(!a||!canManageAttachment(a,h))return toast('Недостаточно прав');
  const val=$(`port-${hostKey(hostId)}-${i}`).value.trim();
  if(!val)a.portOverride=null;else{const p=num(val,0);if(p<1||p>65535)return toast('Некорректный порт');a.portOverride=p}
  saveState();renderAll();toast('Порт обновлён')
}
function resetPort(hostId,i){
  const h=state.hosts.find(x=>hostKey(x.id)===hostKey(hostId)),a=h?.attachments[i];
  if(!a||!canManageAttachment(a,h))return toast('Недостаточно прав');
  a.portOverride=null;saveState();renderAll();toast('Порт сброшен')
}

function renderAccess(){
  const rows=[
    ['Видимость','Все пользователи MARS видят объекты мониторинга всех групп и их attachment’ы.'],
    ['Создать хост','Пользователь с permission «Постановка на мониторинг» в выбранной группе.'],
    ['Редактировать / удалить хост','Любой пользователь с этим permission в группе-владельце. Создатель — только аудит.'],
    ['Присоединить / отсоединить сервис','Любой пользователь с этим permission в группе хоста.'],
    ['Manual host','IP/FQDN, visible name и группа прокси ведутся в MARS. CMDB не требуется.'],
    ['Catalog host','CMDB обновляет только IP/FQDN. Visible name и группа прокси ведёт группа MARS.'],
    ['Уникальность visible name','Только в пределах группы: UNIQUE(ownerGroupId, lower(visibleName)).'],
    ['Техническое имя','Автоматически: groupKey:visibleName. Внутренний immutable ID хоста остаётся отдельным.']
  ];
  const body=`<div class="panel"><div class="info"><b>Ключевая идея:</b> «Хост» в MARS — это объект постановки на мониторинг конкретной группы. Он не является глобальной записью о физическом сервере. Связь с CMDB, если она есть, используется для адресации.</div><div class="content">
    <h3>Пользователи и permission</h3>
    ${state.users.map(u=>{
      const permissions=(u.groups||[]).map(gid=>{
        const can=u.isAdmin||((u.groupPermissions?.[gid]||[]).includes('monitoring.manage'));
        return `<span class="badge ${can?'b-green':'b-red'}">${esc(groupName(gid))}: ${can?'постановка на мониторинг':'только просмотр'}</span>`
      }).join('');
      return `<div class="card"><div class="card-main"><span class="avatar" style="background:${u.isAdmin?'#7C3AED':'var(--primary)'}">${esc(u.initials)}</span><div><div class="card-title">${esc(u.name)} ${u.id===state.currentUserId?'<span class="badge b-blue">текущий</span>':''}</div><div class="meta">${u.isAdmin?'MARS admin':'Пользователь'}</div><div class="pills">${permissions||'<span class="muted">Нет групп</span>'}</div></div></div><button class="sm outline" onclick="switchUser(${q(u.id)})">Переключиться</button></div>`
    }).join('')}
    <h3>Группы</h3>
    ${state.groups.map(g=>`<div class="card"><div class="card-main"><span class="icon">👥</span><div><div class="card-title">${esc(g.name)}</div><div class="meta">Ключ группы: <span class="mono">${esc(g.key)}</span> · Участники: ${state.users.filter(u=>(u.groups||[]).includes(g.id)).map(u=>esc(u.name)).join(', ')||'—'}</div></div></div></div>`).join('')}
    <h3>Правила</h3>
    <div class="box"><table style="width:100%;border-collapse:collapse"><tbody>${rows.map(r=>`<tr><td style="padding:8px;border-bottom:1px solid var(--slate-200);font-weight:800">${r[0]}</td><td style="padding:8px;border-bottom:1px solid var(--slate-200)">${r[1]}</td></tr>`).join('')}</tbody></table></div>
  </div></div>`;
  page('access','👥 Доступ','Проверка групповых permission и модели объектов мониторинга.','',body)
}


loadHostTableView();loadState();renderAll();
</script>
</body>
