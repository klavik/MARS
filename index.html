const SERVICE_COLS=[['name','Название'],['type','Тип сервиса'],['port','Порт'],['description','Описание'],['group','Группа-владелец'],['metrics','Путь метрик'],['hosts','Host'],['collections','Коллекции'],['protocol','Протокол'],['auth','Авторизация'],['mtls','mTLS'],['updated','Создан/изменён'],['author','Автор']];
function applyServiceFilters(arr){const f=monUi.services,qv=f.search.trim().toLowerCase();return arr.filter(s=>{const u=serviceUsage(s.id);return(!qv||SERVICE_COLS.some(([id])=>String({name:s.name,type:s.type,port:s.defaultPort,description:s.description,group:groupById(s.ownerGroupId)?.name,metrics:s.metrics,hosts:u.hosts.length,collections:u.collections.length,protocol:s.protocol,auth:s.authMode,mtls:s.clientCert?'Есть':'Нет',updated:s.updatedAt,author:userById(s.updatedBy||s.createdBy)?.name}[id]||'').toLowerCase().includes(qv)))&&(f.type==='all'||s.type===f.type)&&(f.protocol==='all'||s.protocol===f.protocol)&&(f.auth==='all'||(f.auth==='yes'?s.authMode!=='none':s.authMode==='none'))&&(f.mtls==='all'||(f.mtls==='yes'?!!s.clientCert:!s.clientCert))&&(f.group==='all'||s.ownerGroupId===f.group)&&(f.author==='all'||(s.updatedBy||s.createdBy)===f.author)&&(f.collection==='all'||u.collections.some(c=>c.id===f.collection))&&(!f.port||String(s.defaultPort).includes(f.port))})}
function serviceToolbar(){const f=monUi.services;return`<div class="toolbar"><div class="actions"><input style="min-width:260px" placeholder="Поиск по видимым столбцам" value="${esc(f.search)}" oninput="monUi.services.search=this.value;monUi.services.page=1;renderServices()"><button class="outline" onclick="openServiceFilters()">⚙ Фильтры</button><button class="outline" onclick="openColumnsModal('services',SERVICE_COLS,['name'])">Столбцы</button><button class="ghost" onclick="resetServiceFilters()">Очистить</button></div><div class="actions">${monUi.selectedServices.size?`<span class="muted">Выбрано: ${monUi.selectedServices.size}</span><button class="danger" onclick="bulkDeleteServicesV08()">Удалить</button><button class="ghost" onclick="monUi.selectedServices.clear();renderServices()">Снять выбор</button>`:''}</div></div>`}
function openServiceFilters(){const f=monUi.services;openModal('Фильтры сервисов','Фильтры применяются на пересечение',`<div class="row3"><div class="field"><label>Тип</label><select id="sf-type" class="wide"><option value="all">Все</option>${SERVICE_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Протокол</label><select id="sf-protocol" class="wide" ${f.type!=='ExporterScrapeAgent'?'disabled':''}><option value="all">Все</option><option value="http" ${f.protocol==='http'?'selected':''}>http</option><option value="https" ${f.protocol==='https'?'selected':''}>https</option></select></div><div class="field"><label>mTLS</label><select id="sf-mtls" class="wide" ${!(f.type==='ExporterScrapeAgent'&&f.protocol==='https')?'disabled':''}><option value="all">Все</option><option value="yes" ${f.mtls==='yes'?'selected':''}>Есть</option><option value="no" ${f.mtls==='no'?'selected':''}>Нет</option></select></div></div><div class="row3"><div class="field"><label>Авторизация</label><select id="sf-auth" class="wide"><option value="all">Все</option><option value="yes" ${f.auth==='yes'?'selected':''}>С авторизацией</option><option value="no" ${f.auth==='no'?'selected':''}>Без авторизации</option></select></div><div class="field"><label>Коллекция</label><select id="sf-col" class="wide"><option value="all">Все</option>${visibleCollections().map(c=>`<option value="${c.id}" ${f.collection===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Группа</label><select id="sf-group" class="wide"><option value="all">Все</option>${state.groups.filter(g=>isAdmin()||userGroupIds().has(g.id)).map(g=>`<option value="${g.id}" ${f.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Автор</label><select id="sf-author" class="wide"><option value="all">Все</option>${state.users.map(u=>`<option value="${u.id}" ${f.author===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Порт содержит</label><input id="sf-port" class="wide" value="${esc(f.port)}"></div></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="applyServiceFilterModal()">Применить</button>`)}
function applyServiceFilterModal(){Object.assign(monUi.services,{type:$('sf-type').value,protocol:$('sf-protocol').value,mtls:$('sf-mtls').value,auth:$('sf-auth').value,collection:$('sf-col').value,group:$('sf-group').value,author:$('sf-author').value,port:$('sf-port').value,page:1});closeModal();renderServices()}
function resetServiceFilters(){Object.assign(monUi.services,{search:'',type:'all',protocol:'all',mtls:'all',auth:'all',collection:'all',group:'all',author:'all',port:'',page:1});renderServices()}
function renderServices(){monitoringGate('services',()=>{const arr=applyServiceFilters(visibleServices()),p=paginate(arr,monUi.services.page);monUi.services.page=p.page;const createOk=hasAnyMonitoringPermission()&&configuredTypes().length>0;page('services','🔌 Сервисы','Конфигурации сбора метрик, доступные вашей группе.',`<button ${createOk?'':'disabled'} onclick="openServiceModal()">➕ Добавить сервис</button>`,`<div class="panel">${roNote()}<div class="info"><b>Тип сервиса можно создать только при наличии глобальной настройки в «Сбор данных».</b> Настроены: ${configuredTypes().map(t=>`<span class="badge b-green">${t}</span>`).join(' ')||'нет'}.</div>${serviceToolbar()}${serviceTableV08(p.items)}${pagerHtml('services',p)}</div>`)} )}
function serviceTableV08(arr){const c=monUi.services.cols,th=(id,l)=>c.includes(id)?`<th>${l}</th>`:'',td=(id,x)=>c.includes(id)?`<td>${x}</td>`:'';return`<div class="table-wrap"><table><thead><tr><th></th>${SERVICE_COLS.map(x=>th(x[0],x[1])).join('')}<th>Действия</th></tr></thead><tbody>${arr.length?arr.map(s=>{const u=serviceUsage(s.id);return`<tr class="data-row" onclick="openServiceDetails(${q(s.id)})"><td onclick="event.stopPropagation()"><input class="checkbox" type="checkbox" ${monUi.selectedServices.has(s.id)?'checked':''} onchange="this.checked?monUi.selectedServices.add(${q(s.id)}):monUi.selectedServices.delete(${q(s.id)});renderServices()"></td>${td('name',`<b>${esc(s.name)}</b>`)}${td('type',esc(s.type))}${td('port',s.defaultPort)}${td('description',esc(s.description||'—'))}${td('group',esc(groupById(s.ownerGroupId)?.name||'—'))}${td('metrics',`<span class="mono">${esc(s.metrics||'—')}</span>`)}${td('hosts',`<span class="badge">${u.hosts.length}</span>`)}${td('collections',`<span class="badge">${u.collections.length}</span>`)}${td('protocol',esc((s.protocol||'—').toUpperCase()))}${td('auth',esc(s.authMode==='none'?'Нет':s.authMode))}${td('mtls',s.clientCert?'Есть':'Нет')}${td('updated',esc(s.updatedAt||s.createdAt||'—'))}${td('author',esc(userById(s.updatedBy||s.createdBy)?.name||'—'))}<td onclick="event.stopPropagation()"><button class="xs outline" onclick="openServiceDetails(${q(s.id)})">Детали</button></td></tr>`}).join(''):`<tr><td colspan="20" class="empty">Нет данных для отображения</td></tr>`}</tbody></table></div>`}
function openServiceDetails(id){const s=serviceById(id);if(!s)return;const u=serviceUsage(id),can=canManageService(s);openModal(`Сервис: ${s.name}`,`${s.type} · ${groupById(s.ownerGroupId)?.name||''}`,`<div class="row"><div class="box"><b>Порт</b><br>${s.defaultPort}</div><div class="box"><b>Путь к метрикам</b><br><span class="mono">${esc(s.metrics||'—')}</span></div><div class="box"><b>Протокол</b><br>${esc((s.protocol||'—').toUpperCase())}</div></div><div class="box"><b>Описание</b><br>${esc(s.description||'—')}</div><div class="box"><b>Авторизация</b><br>${s.authMode==='basic'?`Basic Auth · ${esc(s.authUsername||'—')} / ${masked(s.authSecret)}`:s.authMode==='bearer'?`Bearer Token · ${masked(s.authSecret)}`:'No Auth'}</div>${s.protocol==='https'?`<div class="box"><b>HTTPS / mTLS</b><br>Skip verify: ${s.skipVerify?'Да':'Нет'} · Client cert: ${s.clientCert?'Есть':'Нет'} · Client key: ${s.clientKey?'Есть':'Нет'} · CA: ${s.caCert?'Есть':'Нет'}</div>`:''}<h3>Связи</h3><div class="box">Host: ${u.hosts.map(h=>esc(h.name)).join(', ')||'—'}<br>Коллекции: ${u.collections.map(c=>esc(c.name)).join(', ')||'—'}</div>`,`<button class="ghost" onclick="closeModal()">Закрыть</button>${canCreateTemplate()?`<button class="outline" onclick="openTemplateFromService(${q(id)})">Добавить шаблон</button>`:''}${can?`<button class="outline" onclick="openServiceModal(${q(id)})">Изменить</button><button class="outline" onclick="cloneServiceV08(${q(id)})">Клонировать</button><button class="danger" onclick="requestDeleteServiceV08(${q(id)})">Удалить</button>`:''}`)}
function serviceFormTypeOptions(current){return SERVICE_TYPES.map(t=>`<option value="${t}" ${current===t?'selected':''} ${configuredTypes().includes(t)?'':'disabled'}>${t}${configuredTypes().includes(t)?'':' · глобальные настройки отсутствуют'}</option>`).join('')}
function openServiceModal(id='',seed=null){if(!hasAnyMonitoringPermission())return toast('Нет права «Постановка на мониторинг»');const x=id?serviceById(id):null;let s=seed||x||{name:'',type:configuredTypes()[0]||'',defaultPort:80,metrics:'/metrics',description:'',ownerGroupId:manageableGroups()[0]?.id||'',authMode:'none',protocol:'http',skipVerify:false,clientCert:'',clientKey:'',caCert:'',expertConfig:'{}'};if(!x&&!configuredTypes().length)return toast('Нет настроенных типов сервисов');const editing=!!x,groupSelect=isAdmin()||!editing;openModal(editing?'Изменить сервис':seed?'Создать сервис из шаблона':'Добавить сервис','',`<div class="toolbar"><div><b>Режим настройки</b></div><label class="badge"><input id="svc-expert-toggle" type="checkbox" onchange="toggleServiceExpertV08(this.checked)"> Экспертный режим</label></div><div id="svc-standard"><div class="row"><div class="field"><label>Название</label><input id="svc-name" class="wide" value="${esc(editing?s.name:(s.name||''))}" ${editing?'disabled':''}><div class="hint">Уникальное имя, минимум 3 символа.</div></div><div class="field"><label>Группа-владелец</label>${groupSelect?`<select id="svc-group" class="wide">${(isAdmin()?state.groups:manageableGroups()).map(g=>`<option value="${g.id}" ${g.id===s.ownerGroupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`:`<input id="svc-group-ro" class="wide" disabled value="${esc(groupById(s.ownerGroupId)?.name||'')}">`}</div></div><div class="row3"><div class="field"><label>Тип</label><select id="svc-type" class="wide" ${editing?'disabled':''} onchange="renderServiceDependentV08()">${serviceFormTypeOptions(s.type)}</select></div><div class="field"><label>Порт</label><input id="svc-port" class="wide" type="number" min="1" max="65535" value="${s.defaultPort}"></div><div class="field"><label>Путь к метрикам</label><input id="svc-metrics" class="wide mono" value="${esc(s.metrics||'/metrics')}"></div></div><div class="field"><label>Описание</label><textarea id="svc-desc" class="wide">${esc(s.description||'')}</textarea></div><div id="svc-dependent"></div></div><div id="svc-expert" style="display:none"><div class="field"><label>JSON-конфигурация</label><textarea id="svc-json" class="wide mono" style="min-height:220px">${esc(s.expertConfig||'{}')}</textarea></div></div>${editing&&serviceUsage(id).hosts.length?'<div class="box amber-box"><b>Сервис используется на Host.</b> Изменения конфигурации повлияют на действующие подключения.</div>':''}`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveServiceV08(${q(id)},${seed?'true':'false'})">${editing?'Изменить':'Добавить'}</button>`);setTimeout(()=>{renderServiceDependentV08(s)},0)}
function renderServiceDependentV08(seed){const type=$('svc-type')?.value||seed?.type;if(type!=='ExporterScrapeAgent'){if($('svc-dependent'))$('svc-dependent').innerHTML='<div class="info">Для этого типа отображается индивидуальный набор полей. Детальная спецификация будет добавляться по мере готовности требований.</div>';return}const s=seed||{};$('svc-dependent').innerHTML=`<div class="row"><div class="field"><label>Протокол</label><select id="svc-protocol" class="wide" onchange="renderHttpsFieldsV08(${q(s.clientCert||'')},${q(s.clientKey||'')},${q(s.caCert||'')})"><option value="http" ${s.protocol!=='https'?'selected':''}>http</option><option value="https" ${s.protocol==='https'?'selected':''}>https</option></select></div><div class="field"><label>Авторизация</label><select id="svc-auth" class="wide" onchange="renderAuthFieldsV08(${q(s.authUsername||'')})"><option value="none" ${s.authMode==='none'?'selected':''}>No Auth</option><option value="basic" ${s.authMode==='basic'?'selected':''}>Basic Auth</option><option value="bearer" ${s.authMode==='bearer'?'selected':''}>Bearer Token</option></select></div></div><div id="svc-auth-fields"></div><div id="svc-https-fields"></div>`;renderAuthFieldsV08(s.authUsername||'');renderHttpsFieldsV08(s.clientCert||'',s.clientKey||'',s.caCert||'',s.skipVerify)}
function renderAuthFieldsV08(username=''){const a=$('svc-auth')?.value,el=$('svc-auth-fields');if(!el)return;el.innerHTML=a==='basic'?`<div class="row"><div class="field"><label>Имя пользователя</label><input id="svc-auth-user" class="wide" value="${esc(username)}"></div><div class="field"><label>Пароль</label><input id="svc-auth-secret" type="password" class="wide" placeholder="Оставьте пустым, чтобы не менять"></div></div>`:a==='bearer'?`<div class="field"><label>Bearer Token</label><input id="svc-auth-secret" type="password" class="wide" placeholder="Оставьте пустым, чтобы не менять"></div>`:''}
function renderHttpsFieldsV08(cert='',key='',ca='',skip=false){const el=$('svc-https-fields');if(!el)return;el.innerHTML=$('svc-protocol')?.value==='https'?`<label class="badge"><input id="svc-skip" type="checkbox" ${skip?'checked':''}> Пропускать проверку серверного сертификата</label><div class="row3"><div class="field"><label>Клиентский сертификат</label><textarea id="svc-cert" class="wide">${esc(cert)}</textarea></div><div class="field"><label>Закрытый ключ клиента</label><textarea id="svc-key" class="wide">${esc(key)}</textarea></div><div class="field"><label>Сертификат CA</label><textarea id="svc-ca" class="wide">${esc(ca)}</textarea></div></div>`:''}
function toggleServiceExpertV08(on){$('svc-standard').style.display=on?'none':'';$('svc-expert').style.display=on?'':'none'}
function saveServiceV08(id='',fromTemplate=false){const old=id?serviceById(id):null,expert=$('svc-expert-toggle')?.checked;let name=old?.name||$('svc-name')?.value.trim();if(!name||name.length<3)return toast('Введите уникальное название от 3 символов');if(state.services.some(s=>s.id!==id&&s.name.toLowerCase()===name.toLowerCase()))return toast('Сервис с таким именем уже существует');const type=old?.type||$('svc-type').value;if(!configuredTypes().includes(type))return toast(`Невозможно создать сервис типа ${type}: глобальные настройки не заполнены`);const port=Number($('svc-port')?.value||old?.defaultPort||0);if(!Number.isInteger(port)||port<1||port>65535)return toast('Порт должен быть от 1 до 65535');const owner=old&&!isAdmin()?old.ownerGroupId:($('svc-group')?.value||old?.ownerGroupId);let d={id:id||uid('svc'),name,type,ownerGroupId:owner,defaultPort:port,metrics:$('svc-metrics')?.value.trim()||'/metrics',description:$('svc-desc')?.value.trim()||'',icon:({ExporterScrapeAgent:'🌐',SQLAgent:'🗄️',SimpleExporter:'🔌',SNMPAgent:'📡'}[type]||'🔌'),createdBy:old?.createdBy||currentUser().id,createdAt:old?.createdAt||now(),updatedBy:currentUser().id,updatedAt:now(),expertConfig:expert?$('svc-json').value:(old?.expertConfig||'{}')};if(type==='ExporterScrapeAgent'&&!expert){d.protocol=$('svc-protocol').value;d.authMode=$('svc-auth').value;d.authUsername=d.authMode==='basic'?($('svc-auth-user')?.value.trim()||''):'';const secret=$('svc-auth-secret')?.value||'';d.authSecret=d.authMode==='none'?'':(secret||((old&&old.authMode===d.authMode)?old.authSecret:''));d.skipVerify=!!$('svc-skip')?.checked;d.clientCert=$('svc-cert')?.value||'';d.clientKey=$('svc-key')?.value||'';d.caCert=$('svc-ca')?.value||''}else{Object.assign(d,{protocol:old?.protocol||'http',authMode:old?.authMode||'none',authUsername:old?.authUsername||'',authSecret:old?.authSecret||'',skipVerify:!!old?.skipVerify,clientCert:old?.clientCert||'',clientKey:old?.clientKey||'',caCert:old?.caCert||''})}if(old&&old.authMode!==d.authMode){d.authSecret=$('svc-auth-secret')?.value||''}if(old)state.services[state.services.findIndex(s=>s.id===id)]={...old,...d};else state.services.push(d);auditMon(old?'Обновление сервиса мониторинга':'Создание сервиса мониторинга',{service:name,type});saveState();closeModal();renderServices();toast(old?'Сервис обновлён':'Сервис создан')}
function cloneServiceV08(id){const s=serviceById(id);if(!s)return;closeModal();const seed={...s,name:'',ownerGroupId:s.ownerGroupId,authSecret:'',clientCert:s.clientCert,clientKey:s.clientKey,caCert:s.caCert};openServiceModal('',seed)}
function requestDeleteServiceV08(id){const s=serviceById(id),u=serviceUsage(id);if(!s||!canManageService(s))return;if(u.hosts.length||u.collections.length)return openModal('Удаление сервиса недоступно','Сначала устраните зависимости',`<div class="box amber-box"><b>Host:</b> ${u.hosts.map(h=>esc(h.name)).join(', ')||'—'}<br><b>Коллекции:</b> ${u.collections.map(c=>esc(c.name)).join(', ')||'—'}</div>`,`<button onclick="closeModal()">Закрыть</button>`,true);confirmModal('Удалить сервис',`Удалить <b>${esc(s.name)}</b>?`,'deleteServiceV08',q(id))}
function deleteServiceV08(id){const s=serviceById(id),u=serviceUsage(id);if(!s||u.hosts.length||u.collections.length)return toast('Сервис используется и не может быть удалён');state.services=state.services.filter(x=>x.id!==id);auditMon('Удаление сервиса мониторинга',{service:s.name});saveState();renderServices();toast('Сервис удалён')}
function bulkDeleteServicesV08(){const ids=[...monUi.selectedServices],allowed=[],blocked=[];ids.forEach(id=>{const s=serviceById(id),u=serviceUsage(id);if(s&&canManageService(s)&&!u.hosts.length&&!u.collections.length)allowed.push(id);else blocked.push(id)});openModal('Массовое удаление сервисов','Частичное выполнение разрешено',`<div class="box">Будет удалено: <b>${allowed.length}</b><br>Будет пропущено: <b>${blocked.length}</b></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" ${allowed.length?'':'disabled'} onclick="applyBulkDeleteServicesV08(${JSON.stringify(allowed).replace(/"/g,'&quot;')})">Удалить доступные</button>`,true)}
function applyBulkDeleteServicesV08(ids){ids.forEach(id=>{const s=serviceById(id);state.services=state.services.filter(x=>x.id!==id);if(s)auditMon('Удаление сервиса мониторинга',{service:s.name})});monUi.selectedServices.clear();saveState();closeModal();renderServices();toast('Массовое удаление завершено')}

// TEMPLATES
const TEMPLATE_COLS=[['name','Название'],['type','Тип сервиса'],['protocol','Протокол'],['port','Порт'],['metrics','Путь до метрик'],['description','Описание'],['author','Автор'],['updated','Создан/изменён']];
function applyTemplateFilters(arr){const f=monUi.templates,qv=f.search.trim().toLowerCase();return arr.filter(t=>(!qv||[t.name,t.type,t.protocol,t.defaultPort,t.metrics,t.description,userById(t.updatedBy||t.createdBy)?.name].some(v=>String(v||'').toLowerCase().includes(qv)))&&(f.type==='all'||t.type===f.type)&&(f.protocol==='all'||t.protocol===f.protocol)&&(f.author==='all'||(t.updatedBy||t.createdBy)===f.author)&&(!f.port||String(t.defaultPort).includes(f.port)))}
function renderTemplates(){monitoringGate('templates',()=>{const arr=applyTemplateFilters(visibleTemplates()),p=paginate(arr,monUi.templates.page);monUi.templates.page=p.page;page('templates','🧩 Шаблоны сервисов','Публичная библиотека заготовок для создания сервисов.',`<button ${canCreateTemplate()?'':'disabled'} onclick="chooseServiceForTemplateV08()">➕ Добавить шаблон</button>`,`<div class="panel">${roNote()}${!state.templates.length?`<div class="empty"><h3>Шаблоны ещё не созданы</h3><p>Для создания шаблона сначала создайте или выберите существующий сервис.</p><button onclick="switchSection('services')">Перейти к сервисам</button></div>`:`${templateToolbarV08()}${templateTableV08(p.items)}${pagerHtml('templates',p)}`}</div>`)} )}
function templateToolbarV08(){const f=monUi.templates;return`<div class="toolbar"><div class="actions"><input style="min-width:260px" placeholder="Поиск" value="${esc(f.search)}" oninput="monUi.templates.search=this.value;monUi.templates.page=1;renderTemplates()"><select onchange="monUi.templates.type=this.value;renderTemplates()"><option value="all">Все типы</option>${SERVICE_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select><select onchange="monUi.templates.protocol=this.value;renderTemplates()"><option value="all">Все протоколы</option><option value="http" ${f.protocol==='http'?'selected':''}>http</option><option value="https" ${f.protocol==='https'?'selected':''}>https</option></select><button class="outline" onclick="openColumnsModal('templates',TEMPLATE_COLS,['name'])">Столбцы</button></div><div class="actions">${monUi.selectedTemplates.size?`<span>Выбрано: ${monUi.selectedTemplates.size}</span><button class="danger" onclick="bulkDeleteTemplatesV08()">Удалить</button><button class="ghost" onclick="monUi.selectedTemplates.clear();renderTemplates()">Снять выбор</button>`:''}</div></div>`}

function chooseServiceForTemplateV08(){const arr=visibleServices().filter(s=>canManageService(s));openModal('Добавить шаблон','Сначала выберите существующий сервис',arr.map(s=>`<div class="card"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)}</div></div></div><button onclick="openTemplateFromService(${q(s.id)})">Выбрать</button></div>`).join('')||'<div class="empty">Нет доступных сервисов. Сначала создайте сервис.</div>',`<button onclick="closeModal()">Закрыть</button>`)}
function openTemplateFromService(sid){const s=serviceById(sid);if(!s)return;openModal('Создать шаблон',`На основе сервиса: ${s.name}`,`<div class="row"><div class="field"><label>Название шаблона</label><input id="tpl-name" class="wide" value="${esc(s.name+' template')}"></div><div class="field"><label>Тип</label><input class="wide" disabled value="${esc(s.type)}"></div></div><div class="row3"><div class="field"><label>Порт</label><input id="tpl-port" class="wide" type="number" value="${s.defaultPort}"></div><div class="field"><label>Путь до метрик</label><input id="tpl-metrics" class="wide" value="${esc(s.metrics||'/metrics')}"></div><div class="field"><label>Протокол</label><input id="tpl-protocol" class="wide" value="${esc(s.protocol||'http')}"></div></div><div class="field"><label>Описание</label><textarea id="tpl-desc" class="wide">${esc(s.description||'')}</textarea></div><div class="info">Группа сервиса, авторизация, связи с Host/коллекциями и история не копируются.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveTemplateFromServiceV08(${q(sid)})">Добавить</button>`)}
function saveTemplateFromServiceV08(sid){const s=serviceById(sid),name=$('tpl-name').value.trim();if(!name||name.length<3)return toast('Введите название шаблона');if(state.templates.some(t=>t.name.toLowerCase()===name.toLowerCase()))return toast('Шаблон с таким именем уже существует');state.templates.push({id:uid('tpl'),name,type:s.type,defaultPort:Number($('tpl-port').value)||s.defaultPort,metrics:$('tpl-metrics').value.trim()||s.metrics,protocol:$('tpl-protocol').value.trim()||s.protocol,description:$('tpl-desc').value.trim(),createdBy:currentUser().id,createdAt:now(),updatedBy:currentUser().id,updatedAt:now()});saveState();closeModal();renderTemplates();toast('Шаблон создан')}
function openTemplateDetailsV08(id){const t=templateById(id);if(!t)return;openModal(`Шаблон: ${t.name}`,'Заготовка для создания сервиса',`<div class="row3"><div class="box"><b>Тип</b><br>${esc(t.type)}</div><div class="box"><b>Порт</b><br>${t.defaultPort}</div><div class="box"><b>Протокол</b><br>${esc(t.protocol||'—')}</div></div><div class="box"><b>Путь до метрик</b><br><span class="mono">${esc(t.metrics||'—')}</span></div><div class="box"><b>Описание</b><br>${esc(t.description||'—')}</div><div class="box"><b>Автор</b><br>${esc(userById(t.createdBy)?.name||'—')}</div>`,`<button class="ghost" onclick="closeModal()">Закрыть</button><button onclick="createServiceFromTemplate(${q(id)})">Добавить сервис</button>${canManageTemplate(t)?`<button class="outline" onclick="editTemplateV08(${q(id)})">Изменить</button><button class="danger" onclick="deleteTemplateV08(${q(id)})">Удалить</button>`:''}`)}
function editTemplateV08(id){const t=templateById(id);if(!t||!canManageTemplate(t))return;openModal('Изменить шаблон',t.name,`<div class="field"><label>Название</label><input id="tpl-edit-name" class="wide" value="${esc(t.name)}"></div><div class="row3"><div class="field"><label>Порт</label><input id="tpl-edit-port" class="wide" type="number" value="${t.defaultPort}"></div><div class="field"><label>Путь до метрик</label><input id="tpl-edit-metrics" class="wide" value="${esc(t.metrics||'')}"></div><div class="field"><label>Протокол</label><input id="tpl-edit-protocol" class="wide" value="${esc(t.protocol||'http')}"></div></div><div class="field"><label>Описание</label><textarea id="tpl-edit-desc" class="wide">${esc(t.description||'')}</textarea></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveTemplateEditV08(${q(id)})">Изменить</button>`)}
function saveTemplateEditV08(id){const t=templateById(id),name=$('tpl-edit-name').value.trim();if(state.templates.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Шаблон с таким именем уже существует');Object.assign(t,{name,defaultPort:Number($('tpl-edit-port').value)||t.defaultPort,metrics:$('tpl-edit-metrics').value.trim(),protocol:$('tpl-edit-protocol').value.trim(),description:$('tpl-edit-desc').value.trim(),updatedBy:currentUser().id,updatedAt:now()});saveState();closeModal();renderTemplates();toast('Шаблон обновлён')}
function deleteTemplateV08(id){const t=templateById(id);if(!t||!canManageTemplate(t))return;state.templates=state.templates.filter(x=>x.id!==id);saveState();closeModal();renderTemplates();toast('Шаблон удалён. Созданные из него сервисы не изменены')}
function bulkDeleteTemplatesV08(){const ids=[...monUi.selectedTemplates],allowed=ids.filter(id=>canManageTemplate(templateById(id)));openModal('Массовое удаление шаблонов','Будут удалены только шаблоны, где вы автор или MARS Admin',`<div class="box">Выбрано: ${ids.length}<br>Можно удалить: ${allowed.length}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="danger" onclick="applyBulkDeleteTemplatesV08(${JSON.stringify(allowed).replace(/"/g,'&quot;')})">Удалить</button>`,true)}
function applyBulkDeleteTemplatesV08(ids){state.templates=state.templates.filter(t=>!ids.includes(t.id));monUi.selectedTemplates.clear();saveState();closeModal();renderTemplates();toast('Шаблоны удалены')}
function createServiceFromTemplate(id){const t=templateById(id);if(!t)return;closeModal();openServiceModal('',{name:'',type:t.type,defaultPort:t.defaultPort,metrics:t.metrics,description:t.description,protocol:t.protocol,ownerGroupId:manageableGroups()[0]?.id||'',authMode:'none',authUsername:'',authSecret:'',clientCert:'',clientKey:'',caCert:'',skipVerify:false,expertConfig:'{}'})}

// COLLECTIONS
const COLLECTION_COLS=[['name','Название'],['description','Описание'],['group','Группа-владелец'],['services','Сервисы'],['hosts','Host'],['author','Автор'],['updated','Создан/изменён']];
function applyCollectionFilters(arr){const f=monUi.collections,qv=f.search.trim().toLowerCase();return arr.filter(c=>(!qv||c.name.toLowerCase().includes(qv))&&(f.author==='all'||(c.updatedBy||c.createdBy)===f.author)&&(f.service==='all'||c.serviceIds.includes(f.service)))}
function renderCollections(){monitoringGate('collections',()=>{const arr=applyCollectionFilters(visibleCollections()),p=paginate(arr,monUi.collections.page);monUi.collections.page=p.page;page('collections','📦 Коллекции','Живые desired-state конфигурации сервисов для Host.',`<button ${hasAnyMonitoringPermission()?'':'disabled'} onclick="openCollectionModal()">➕ Добавить коллекцию</button>`,`<div class="panel">${roNote()}<div class="info"><b>Коллекцию можно создать пустой.</b> Изменение состава автоматически применяется к привязанным Host без дублей Host–Service.</div>${collectionToolbarV08()}${collectionTableV08(p.items)}${pagerHtml('collections',p)}</div>`)} )}
function collectionToolbarV08(){const f=monUi.collections;return`<div class="toolbar"><div class="actions"><input style="min-width:260px" placeholder="Поиск по названию" value="${esc(f.search)}" oninput="monUi.collections.search=this.value;monUi.collections.page=1;renderCollections()"><select onchange="monUi.collections.author=this.value;renderCollections()"><option value="all">Все пользователи</option>${state.users.map(u=>`<option value="${u.id}" ${f.author===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><select onchange="monUi.collections.service=this.value;renderCollections()"><option value="all">Все сервисы</option>${visibleServices().map(s=>`<option value="${s.id}" ${f.service===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="outline" onclick="openColumnsModal('collections',COLLECTION_COLS,['name'])">Столбцы</button><button class="ghost" onclick="Object.assign(monUi.collections,{search:'',author:'all',service:'all',page:1});renderCollections()">Очистить</button></div><div class="actions">${monUi.selectedCollections.size?`<span>Выбрано: ${monUi.selectedCollections.size}</span><button class="danger" onclick="bulkDeleteCollectionsV08()">Удалить</button><button class="ghost" onclick="monUi.selectedCollections.clear();renderCollections()">Снять выбор</button>`:''}</div></div>`}
function collectionTableV08(arr){const c=monUi.collections.cols,th=(id,l)=>c.includes(id)?`<th>${l}</th>`:'',td=(id,x)=>c.includes(id)?`<td>${x}</td>`:'';return`<div class="table-wrap"><table><thead><tr><th></th>${COLLECTION_COLS.map(x=>th(x[0],x[1])).join('')}<th>Действия</th></tr></thead><tbody>${arr.map(x=>`<tr class="data-row" onclick="openCollectionDetailsV08(${q(x.id)})"><td onclick="event.stopPropagation()"><input class="checkbox" type="checkbox" ${monUi.selectedCollections.has(x.id)?'checked':''} onchange="this.checked?monUi.selectedCollections.add(${q(x.id)}):monUi.selectedCollections.delete(${q(x.id)});renderCollections()"></td>${td('name',`<b>${esc(x.name)}</b>`)}${td('description',esc(x.description||'—'))}${td('group',esc(groupById(x.ownerGroupId)?.name||'—'))}${td('services',`<button class="xs outline" onclick="event.stopPropagation();openCollectionDetailsV08(${q(x.id)})">${x.serviceIds.length}</button>`)}${td('hosts',`<span class="badge">${collectionHostCount(x)}</span>`)}${td('author',esc(userById(x.updatedBy||x.createdBy)?.name||'—'))}${td('updated',esc(x.updatedAt||x.createdAt||'—'))}<td onclick="event.stopPropagation()">${canManageCollection(x)?`<button class="xs outline" onclick="openCollectionModal(${q(x.id)})">Изменить</button><button class="xs danger" onclick="requestDeleteCollectionV08(${q(x.id)})">Удалить</button>`:''}</td></tr>`).join('')||'<tr><td colspan="12" class="empty">Нет данных для отображения</td></tr>'}</tbody></table></div>`}
function openCollectionDetailsV08(id){const c=collectionById(id);if(!c)return;openModal(`Коллекция: ${c.name}`,`${groupById(c.ownerGroupId)?.name||''} · Host: ${collectionHostCount(c)}`,`<div class="box"><b>Описание</b><br>${esc(c.description||'—')}</div><h3>Сервисы</h3>${c.serviceIds.map(id=>serviceById(id)).filter(Boolean).map(s=>`<div class="card"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><b>${esc(s.name)}</b><div class="meta">${esc(s.type)} · порт ${s.defaultPort}</div></div></div></div>`).join('')||'<div class="empty">Коллекция пустая</div>'}`,`<button class="ghost" onclick="closeModal()">Закрыть</button>${canManageCollection(c)?`<button class="outline" onclick="openCollectionModal(${q(id)})">Изменить</button><button class="danger" onclick="requestDeleteCollectionV08(${q(id)})">Удалить</button>`:''}`)}
function openCollectionModal(id=''){const c=id?collectionById(id):null;if(c&&!canManageCollection(c))return toast('Недостаточно прав');const group=c?.ownerGroupId||manageableGroups()[0]?.id||'';collectionDraft=c?{id:c.id,name:c.name,description:c.description,ownerGroupId:c.ownerGroupId,serviceIds:[...c.serviceIds],originalServiceIds:[...c.serviceIds]}:{id:null,name:'',description:'',ownerGroupId:group,serviceIds:[],originalServiceIds:[]};const groups=isAdmin()?state.groups:manageableGroups();openModal(c?'Изменить коллекцию':'Добавить коллекцию',c?`Привязано Host: ${collectionHostCount(c)}`:'Можно сохранить без сервисов',`<div class="row"><div class="field"><label>Название</label><input id="col-name" class="wide" value="${esc(collectionDraft.name)}"></div><div class="field"><label>Группа-владелец</label>${!c||isAdmin()?`<select id="col-owner" class="wide" onchange="collectionDraft.ownerGroupId=this.value;renderCollectionServicePickerV08()">${groups.map(g=>`<option value="${g.id}" ${g.id===group?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`:`<input class="wide" disabled value="${esc(groupById(group)?.name||'')}">`}</div></div><div class="field"><label>Описание</label><textarea id="col-desc" class="wide">${esc(collectionDraft.description)}</textarea></div><h3>Сервисы</h3><div id="col-service-picker"></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveCollectionV08()">Сохранить</button>`);setTimeout(renderCollectionServicePickerV08,0)}
function renderCollectionServicePickerV08(){const el=$('col-service-picker');if(!el)return;const arr=state.services.filter(s=>s.ownerGroupId===collectionDraft.ownerGroupId&&(isAdmin()||userGroupIds().has(s.ownerGroupId)));el.innerHTML=arr.map(s=>`<label class="card"><div class="card-main"><input class="checkbox" type="checkbox" ${collectionDraft.serviceIds.includes(s.id)?'checked':''} onchange="this.checked?collectionDraft.serviceIds.push(${q(s.id)}):collectionDraft.serviceIds=collectionDraft.serviceIds.filter(x=>x!==${q(s.id)})"><span class="icon">${esc(s.icon)}</span><div><b>${esc(s.name)}</b><div class="meta">${esc(s.type)}</div></div></div></label>`).join('')||'<div class="empty">Нет сервисов группы. Коллекцию всё равно можно сохранить пустой.</div>'}
function saveCollectionV08(){const name=$('col-name').value.trim();if(!name)return toast('Введите название коллекции');collectionDraft.serviceIds=[...new Set(collectionDraft.serviceIds)];const old=collectionDraft.id?collectionById(collectionDraft.id):null,newIds=[...collectionDraft.serviceIds],owner=$('col-owner')?.value||collectionDraft.ownerGroupId;if(old){const added=newIds.filter(x=>!old.serviceIds.includes(x)),removed=old.serviceIds.filter(x=>!newIds.includes(x));old.name=name;old.description=$('col-desc').value.trim();if(isAdmin())old.ownerGroupId=owner;old.serviceIds=newIds;old.updatedAt=now();old.updatedBy=currentUser().id;added.forEach(sid=>syncAddedCollectionService(old,sid));saveState();if(removed.length){closeModal();return openCollectionRemovalDecisionV08(old,removed)}auditMon('Обновление коллекции',{collection:old.name})}else{const c={id:uid('col'),name,description:$('col-desc').value.trim(),ownerGroupId:owner,createdBy:currentUser().id,createdAt:now(),updatedBy:currentUser().id,updatedAt:now(),serviceIds:newIds};state.collections.push(c);auditMon('Создание коллекции',{collection:name})}saveState();closeModal();renderCollections();toast('Коллекция сохранена')}
function openCollectionRemovalDecisionV08(c,ids){openModal('Сервисы удаляются из коллекции','По умолчанию сервисы остаются на Host самостоятельными',`<div class="box amber-box">Удаляется сервисов: ${ids.length}. Выберите судьбу подключения на Host.</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="applyCollectionRemoval(${q(c.id)},${JSON.stringify(ids).replace(/"/g,'&quot;')},'keep')">Оставить на Host · по умолчанию</button><button class="danger" onclick="applyCollectionRemoval(${q(c.id)},${JSON.stringify(ids).replace(/"/g,'&quot;')},'delete')">Снять с Host</button>`,true)}
function requestDeleteCollectionV08(id){const c=collectionById(id);if(!c||!canManageCollection(c))return;if(!c.serviceIds.length)return confirmModal('Удалить коллекцию',`Удалить пустую коллекцию <b>${esc(c.name)}</b>?`,'deleteCollectionV08',`${q(id)},${q('delete')}`);openModal('Удалить коллекцию','Выберите поведение сервисов на Host',`<div class="box red-box"><b>${esc(c.name)}</b><br>Сервисов: ${c.serviceIds.length} · Host: ${collectionHostCount(c)}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="deleteCollectionV08(${q(id)},'keep')">Удалить, сервисы оставить самостоятельными</button><button class="danger" onclick="deleteCollectionV08(${q(id)},'delete')">Удалить и снять сервисы с Host</button>`,true)}
function deleteCollectionV08(id,mode='delete',silent=false){const c=collectionById(id);if(!c)return;state.hosts.filter(h=>h.collectionLinks.some(l=>l.collectionId===id)).forEach(h=>{h.collectionLinks=h.collectionLinks.filter(l=>l.collectionId!==id);h.attachments.forEach(a=>{if(!(a.collectionIds||[]).includes(id))return;a.collectionIds=a.collectionIds.filter(x=>x!==id);if(mode==='keep')a.direct=true});h.attachments=h.attachments.filter(a=>a.direct||a.collectionIds.length)});state.collections=state.collections.filter(x=>x.id!==id);auditMon('Удаление коллекции',{collection:c.name,mode});saveState();if(!silent){closeModal();renderCollections();renderHosts();toast(mode==='keep'?'Коллекция удалена. Сервисы оставлены самостоятельными':'Коллекция удалена. Сервисы сняты с Host') }}
function bulkDeleteCollectionsV08(){const ids=[...monUi.selectedCollections].filter(id=>canManageCollection(collectionById(id)));openModal('Массовое удаление коллекций','Один режим применяется ко всем выбранным коллекциям',`<div class="box">Доступно к удалению: <b>${ids.length}</b></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="applyBulkDeleteCollectionsV08(${JSON.stringify(ids).replace(/"/g,'&quot;')},'keep')">Удалить, сервисы оставить</button><button class="danger" onclick="applyBulkDeleteCollectionsV08(${JSON.stringify(ids).replace(/"/g,'&quot;')},'delete')">Удалить и снять сервисы</button>`,true)}
function applyBulkDeleteCollectionsV08(ids,mode){ids.forEach(id=>deleteCollectionV08(id,mode,true));monUi.selectedCollections.clear();saveState();closeModal();renderCollections();renderHosts();toast('Массовое удаление коллекций завершено')}

function saveProxyGroupV08(id){const name=$('pg-name').value.trim();if(!name)return toast('Введите название');if(state.proxyGroups.some(g=>g.id!==id&&g.name.toLowerCase()===name.toLowerCase()))return toast('Группа прокси с таким названием уже существует');const old=id?state.proxyGroups.find(g=>g.id===id):null,d={name,description:$('pg-desc').value.trim(),domains:$('pg-domains').value.split(',').map(x=>x.trim()).filter(Boolean),networks:$('pg-networks').value.split(',').map(x=>x.trim()).filter(Boolean),timeoutSec:Number($('pg-timeout').value)||30,auth:$('pg-auth').value,mode:old?.proxies.length?old.mode:$('pg-mode').value,updatedAt:now(),updatedBy:currentUser().id};if(old)Object.assign(old,d);else state.proxyGroups.push({id:uid('pg'),...d,createdAt:now(),proxies:[]});auditMon(old?'Обновление группы прокси':'Создание группы прокси',{name});saveState();closeModal();renderAdmin();renderHosts();toast('Группа прокси сохранена')}

function saveProxyV08(gid,pid){const g=state.proxyGroups.find(x=>x.id===gid),name=$('px-name').value.trim(),address=$('px-address').value.trim();if(!name||!address)return toast('Название и адрес обязательны');const p=pid?g.proxies.find(x=>x.id===pid):null,d={name,description:$('px-desc').value.trim(),address,enabled:$('px-enabled').checked,updatedAt:now(),updatedBy:currentUser().id,lastContact:p?.lastContact||'—'};if(p)Object.assign(p,d);else g.proxies.push({id:uid('px'),...d,createdAt:now()});auditMon(p?'Обновление прокси':'Создание прокси',{group:g.name,proxy:name});saveState();closeModal();openProxyGroupDetailsV08(gid);toast('Прокси сохранён')}

function renderCollectorSettingsAdminV08(){const x=state.dataAdmin.collectorSettings;return`<div class="grid3cards">${SERVICE_TYPES.map(t=>{const s=x[t];return`<div class="card"><div class="card-main"><span class="icon">${s.configured?'✅':'⚪'}</span><div><div class="card-title">${t}</div><div class="meta">${s.configured?'Настроено':'Глобальные настройки отсутствуют'}</div>${s.updatedAt?`<div class="hint">${esc(s.updatedAt)} · ${esc(userById(s.updatedBy)?.name||'')}</div>`:''}</div></div><button class="xs ${s.configured?'outline':''}" onclick="openCollectorSettingV08(${q(t)})">${s.configured?'Изменить':'Настроить'}</button></div>`}).join('')}</div>`}

function saveExporterSettingV08(){const i=Number($('cs-int').value),t=Number($('cs-timeout').value);if(i<5||i>600)return toast('scrape_interval: 5–600 секунд');if(t<1||t>30)return toast('scrape_timeout: 1–30 секунд');if(t>i)return toast('scrape_timeout не может превышать scrape_interval');const rows=$('cs-labels').value.split('\n').map(x=>x.trim()).filter(Boolean);if(rows.length>3)return toast('Не более 3 глобальных лейблов');const labels=[],keys=new Set();for(const r of rows){const k=r.split(':')[0],v=r.slice(r.indexOf(':')+1);if(!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(k)||!v)return toast('Лейбл должен иметь формат корректный_ключ:значение');if(keys.has(k))return toast('Ключи лейблов должны быть уникальными');keys.add(k);labels.push({key:k,value:v})}state.dataAdmin.collectorSettings.ExporterScrapeAgent={configured:true,scrapeInterval:i,scrapeTimeout:t,labels,updatedAt:now(),updatedBy:currentUser().id};auditMon('Обновление глобальной конфигурации',{type:'ExporterScrapeAgent'});saveState();closeModal();renderAdmin();renderAll();toast('Настройки ExporterScrapeAgent сохранены')}
