  openAttachPreview();
}

function selectedAttachServiceIds() {
  if (activeAttachment.type === 'service') return [activeAttachment.itemId];
  const collection = state.collections.find(item => item.id === activeAttachment.itemId);
  return collection?.serviceIds || [];
}

function openAttachPreview() {
  const host = state.hosts.find(item => item.id === activeAttachment.hostId);
  const services = selectedAttachServiceIds().map(id => state.services.find(service => service.id === id)).filter(Boolean);

  const authFields = services.filter(service => hasAuth(service.auth)).map(service => {
    const auth = normalizeAuth(service.auth);
    if (auth.mode === 'basic') {
      return `
        <div class="box">
          <b>${service.icon} ${escapeHtml(service.name)} — Basic Auth</b>
          <div class="row" style="margin-top:10px">
            <input id="attach-auth-user-${service.id}" placeholder="${escapeHtml(auth.username || 'username')}">
            <input id="attach-auth-pass-${service.id}" type="password" placeholder="••••••">
          </div>
        </div>
      `;
    }

    if (auth.mode === 'bearer') {
      return `
        <div class="box">
          <b>${service.icon} ${escapeHtml(service.name)} — Bearer Token</b>
          <input id="attach-auth-token-${service.id}" class="wide" type="password" placeholder="Bearer token" style="margin-top:10px">
        </div>
      `;
    }
    return '';
  }).join('');

  openModal(
    'Предпросмотр присоединения',
    `Хост: ${host.name}`,
    `
      <div class="box box-blue">
        Адрес: <b>${escapeHtml(host.address)}</b> · Группа прокси: <b>${escapeHtml(proxyGroupName(host.proxyGroup))}</b>
      </div>
      ${services.map(service => `
        <div class="card">
          <div class="card-main">
            <span class="icon">${service.icon}</span>
            <div>
              <div class="card-title">${escapeHtml(service.name)}</div>
              <div class="card-meta mono">Target: ${escapeHtml(host.address)}:${service.port}</div>
              ${serviceMeta(service, true)}
              ${collectionsHtml(service.id)}
            </div>
          </div>
        </div>
      `).join('')}
      ${authFields || '<div class="box box-blue">Дополнительные параметры авторизации не требуются.</div>'}
    `,
    `
      <button class="btn-outline" onclick="openAttachWizard('${activeAttachment.type}')">Назад</button>
      <div class="modal-footer-right"><button onclick="confirmAttach()">Применить</button></div>
    `
  );
}

function confirmAttach() {
  const host = state.hosts.find(item => item.id === activeAttachment.hostId);
  const services = selectedAttachServiceIds().map(id => state.services.find(service => service.id === id)).filter(Boolean);

  services.forEach(service => {
    const baseAuth = normalizeAuth(service.auth);
    let authOverride = null;

    if (baseAuth.mode === 'basic') {
      authOverride = {
        mode: 'basic',
        username: $(`attach-auth-user-${service.id}`)?.value || baseAuth.username,
        password: $(`attach-auth-pass-${service.id}`)?.value || baseAuth.password
      };
    } else if (baseAuth.mode === 'bearer') {
      authOverride = {
        mode: 'bearer',
        token: $(`attach-auth-token-${service.id}`)?.value || baseAuth.token
      };
    }

    const existing = host.attachments.find(attachment => attachment.serviceId === service.id);
    if (existing) {
      existing.auth = authOverride || existing.auth;
    } else {
      host.attachments.push({
        id: makeId('att'),
        serviceId: service.id,
        portOverride: null,
        auth: authOverride,
        attachedBy: state.currentUserId
      });
    }
  });

  if (activeAttachment.type === 'collection') {
    const collection = state.collections.find(item => item.id === activeAttachment.itemId);
    if (collection) collection.usedBy = (collection.usedBy || 0) + 1;
  }

  saveState();
  closeModal();
  render();
  showToast('Сервис(ы) присоединены');
}

/* ACCESS */

function renderAccess() {
  const user = currentUser();
  const content = `
    <div class="panel">
      <div class="panel-info">
        <b>Правила доступа.</b>
        Сервисом управляет участник группы-владельца. Хосты видны всем. Удалить хост может создатель или MARS admin.
        Присоединять сервисы может пользователь с разрешением на постановку на мониторинг.
      </div>
      <div class="stats-grid three">
        <div class="stat-card"><div class="stat-label">Текущий пользователь</div><div class="stat-value" style="font-size:18px">${escapeHtml(user.name)}</div></div>
        <div class="stat-card"><div class="stat-label">Постановка на мониторинг</div><div class="stat-value" style="font-size:18px">${canMonitor() ? 'Да' : 'Нет'}</div></div>
        <div class="stat-card"><div class="stat-label">MARS admin</div><div class="stat-value" style="font-size:18px">${isAdmin() ? 'Да' : 'Нет'}</div></div>
      </div>
      <div class="panel-content">
        <h3>Пользователи</h3>
        ${state.users.map(u => `
          <div class="card">
            <div class="card-main">
              <span class="icon">👤</span>
              <div>
                <div class="card-title">${escapeHtml(u.name)} ${u.id === state.currentUserId ? '<span class="badge badge-blue">текущий</span>' : ''} ${u.isAdmin ? '<span class="badge badge-red">MARS admin</span>' : ''}</div>
                <div class="card-meta">Группы: ${u.groups.map(groupName).map(escapeHtml).join(', ') || '—'}</div>
                <div class="pills"><span class="badge ${u.canMonitor ? 'badge-green' : 'badge-red'}">Мониторинг: ${u.canMonitor ? 'разрешён' : 'нет'}</span></div>
              </div>
            </div>
            <button class="btn-xs btn-outline" onclick="switchUser('${u.id}')">Переключиться</button>
          </div>
        `).join('')}
        <h3>Группы</h3>
        ${state.groups.map(group => `
          <div class="card">
            <div class="card-main">
              <span class="icon">👥</span>
              <div>
                <div class="card-title">${escapeHtml(group.name)}</div>
                <div class="card-meta">${escapeHtml(group.description || '')}</div>
                <div class="card-meta">Участники: ${state.users.filter(u => u.groups.includes(group.id)).map(u => escapeHtml(u.name)).join(', ') || '—'}</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  page('access', '👥 Пользователи и группы', 'Демо-модель доступа MARS', '', content);
}

/* MODAL / TOAST */

function openModal(title, subtitle, body, footer, small = false) {
  $('modal-title').innerHTML = title;
  $('modal-subtitle').innerHTML = subtitle || '';
  $('modal-body').innerHTML = body || '';
  $('modal-footer').innerHTML = footer || '<button onclick="closeModal()">Закрыть</button>';
  $('modal').className = `modal ${small ? 'small' : ''}`;
  $('modal-overlay').classList.add('show');
}

function closeModal() {
  $('modal-overlay').classList.remove('show');
}

function confirmAction(title, message, onConfirm) {
  window.__marsConfirm = onConfirm;
  openModal(
    title,
    'Подтверждение',
    `<div class="box box-amber">${message}</div>`,
    `
      <button class="btn-outline" onclick="closeModal()">Отмена</button>
      <div class="modal-footer-right"><button class="btn-danger" onclick="window.__marsConfirm(); closeModal()">Удалить</button></div>
    `,
    true
  );
}

function showToast(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2600);
}

function resetDemo() {
  confirmAction('Сброс демо-данных', 'Вернуть исходные демо-данные? Локальные изменения будут удалены.', () => {
    state = demoState();
    selectedHosts.clear();
    selectedServices.clear();
    selectedTemplates.clear();
    expandedHostId = null;
    saveState();
    render();
    showToast('Демо-данные сброшены');
  });
}

loadState();
render();
</script>
