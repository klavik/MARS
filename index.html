function normalizeState(s){const d=demoState(),n={...d,...s};n.users=Array.isArray(n.users)&&n.users.length?n.users:d.users;n.groups=Array.isArray(n.groups)&&n.groups.length?n.groups:d.groups;n.proxyGroups=Array.isArray(n.proxyGroups)&&n.proxyGroups.length?n.proxyGroups:d.proxyGroups;n.catalogHosts=Array.isArray(n.catalogHosts)&&n.catalogHosts.length?n.catalogHosts:d.catalogHosts;n.catalogSources=Array.isArray(n.catalogSources)&&n.catalogSources.length?n.catalogSources:d.catalogSources;n.services=Array.isArray(n.services)&&n.services.length?n.services:d.services;n.templates=Array.isArray(n.templates)&&n.templates.length?n.templates:d.templates;n.collections=Array.isArray(n.collections)&&n.collections.length?n.collections:d.collections;n.hosts=(Array.isArray(n.hosts)&&n.hosts.length?n.hosts:d.hosts).map(h=>({id:h.id||uid('H'),name:h.name||h.visibleName||'Без имени',addressType:h.addressType||'ip',address:h.address||'127.0.0.1',proxyGroup:h.proxyGroup||'prod-dmz',status:h.status||'UP',sourceType:h.sourceType==='catalog'?'catalog':(h.sourceType||'manual'),createdBy:h.createdBy||n.currentUserId,createdAt:h.createdAt||now(),catalogBinding:h.sourceType==='catalog'?(h.catalogBinding||null):null,prefilledFromCatalog:h.prefilledFromCatalog||null,attachments:(h.attachments||[]).map(a=>({id:a.id||uid('att'),serviceId:a.serviceId,attachedByGroupId:a.attachedByGroupId||a.ownerGroupId||(n.services.find(s=>s.id===a.serviceId)||{}).ownerGroupId||'',attachedByUserId:a.attachedByUserId||a.createdBy||n.currentUserId,attachedAt:a.attachedAt||now(),portOverride:a.portOverride??null}))}));if(!n.users.some(u=>u.id===n.currentUserId))n.currentUserId=n.users[0].id;return n}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);state=raw?normalizeState(JSON.parse(raw)):demoState()}catch(e){state=demoState()}saveState()}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function resetDemo(){localStorage.removeItem(STORE_KEY);state=demoState();hostFilter={query:'',rules:[]};hostTable={columns:['id','name','address','source','cmdb','proxy','status','services','createdAt'],hidden:[],sortKey:'name',sortDirection:'asc',page:1,pageSize:25};saveState();renderAll();toast('Демо-данные сброшены')}
function currentUser(){return state.users.find(u=>u.id===state.currentUserId)||state.users[0]}function userById(id){return state.users.find(u=>u.id===id)}function groupById(id){return state.groups.find(g=>g.id===id)}function serviceById(id){return state.services.find(s=>s.id===id)}function isAdmin(){return !!currentUser().isAdmin}function userGroupIds(){return new Set(currentUser().groups||[])}function hasMonitoringPermission(gid){return !!currentUser().permissions?.[gid]?.includes('monitoring.manage')}function canManageService(s){return !!s&&(isAdmin()||hasMonitoringPermission(s.ownerGroupId))}function canAttachService(s){return canManageService(s)}function canDetach(a){return hasMonitoringPermission(a.attachedByGroupId)}function canEditHost(h){return isAdmin()||(!h.attachments.length&&h.sourceType!=='catalog'&&h.createdBy===currentUser().id)}function canDeleteHost(){return isAdmin()}
function sourceLabel(h){return h.sourceType==='catalog'?'Справочник':h.sourceType==='manual-prefill'?'Ручной · prefill':'Ручной'}function sourceBadge(h){return h.sourceType==='catalog'?'<span class="badge b-violet">📚 Справочник</span>':h.sourceType==='manual-prefill'?'<span class="badge b-amber">📋 Ручной · prefill</span>':'<span class="badge b-blue">✍️ Ручной</span>'}function addressBadge(h){return h.addressType==='fqdn'?'<span class="badge b-green">FQDN</span>':'<span class="badge b-blue">IP</span>'}function proxyName(id){return state.proxyGroups.find(x=>x.id===id)?.name||id}
function endpointKey(h){return `${h.addressType}:${String(h.address||'').trim().toLowerCase().replace(/\.$/,'')}`}function ownAttachments(h){return h.attachments.filter(a=>isAdmin()||userGroupIds().has(a.attachedByGroupId))}function connectedHosts(){return isAdmin()?state.hosts.filter(h=>h.attachments.length):state.hosts.filter(h=>h.attachments.some(a=>userGroupIds().has(a.attachedByGroupId)))}function catalogHosts(){return state.hosts.filter(h=>h.sourceType==='catalog')}
function switchSection(sec){activeSection=sec;document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab').forEach(s=>s.classList.remove('active'));$('section-'+sec).classList.add('active');$('nav-'+sec).classList.add('active');renderAll()}
function switchUser(id){state.currentUserId=id;hostTable.page=1;saveState();renderAll()}
function renderAll(){renderUserSwitcher();renderHosts();renderServices();renderTemplates();renderCollections();renderAccess()}
function renderUserSwitcher(){$('current-user').innerHTML=state.users.map(u=>`<option value="${esc(u.id)}" ${u.id===state.currentUserId?'selected':''}>${esc(u.name)}${u.isAdmin?' · admin':''}</option>`).join('');$('avatar').textContent=currentUser().initials||'U'}
function page(sec,title,sub,actions,body){$('section-'+sec).innerHTML=`<div class="page-head"><div><h1 class="title">${title}</h1><div class="sub">${sub||''}</div></div><div class="actions">${actions||''}</div></div>${body}`}
const COLS={id:{label:'Host ID',value:h=>h.id,cell:h=>`<div class="cell-title mono">${esc(h.id)}</div><div class="cell-sub">Сгенерирован при создании</div>`},name:{label:'Имя',value:h=>h.name,cell:h=>`<div class="cell-title">${esc(h.name)}</div><div class="cell-sub">Имя может повторяться</div>`},address:{label:'IP / FQDN',value:h=>h.address,cell:h=>`<div class="cell-title mono">${addressBadge(h)} ${esc(h.address)}</div>`},source:{label:'Источник',value:h=>sourceLabel(h),cell:h=>sourceBadge(h)},cmdb:{label:'CMDB / External ID',value:h=>h.catalogBinding?.externalId||'',cell:h=>h.catalogBinding?`<div class="mono">${esc(h.catalogBinding.externalId)}</div><div class="cell-sub">${esc(state.catalogSources.find(s=>s.id===h.catalogBinding.sourceId)?.name||'CMDB')}</div>`:'<span class="muted">—</span>'},proxy:{label:'Группа прокси',value:h=>proxyName(h.proxyGroup),cell:h=>esc(proxyName(h.proxyGroup))},status:{label:'Статус',value:h=>h.status,cell:h=>`<span class="badge ${h.status==='UP'?'b-green':'b-amber'}">${h.status==='UP'?'● UP':'● WARN'}</span>`},services:{label:'Сервисы моих групп',value:h=>ownAttachments(h).map(a=>serviceById(a.serviceId)?.name||'').join(' '),cell:h=>{const a=ownAttachments(h);return a.length?`<div class="pill-row">${a.slice(0,3).map(x=>{const s=serviceById(x.serviceId);return `<span class="badge b-blue">${esc(s?.icon||'🔌')} ${esc(s?.name||'Сервис')}</span>`}).join('')}${a.length>3?`<span class="badge">+${a.length-3}</span>`:''}</div>`:'<span class="muted">Нет подключений моих групп</span>'}},createdAt:{label:'Создан',value:h=>h.createdAt,cell:h=>`<div>${esc(h.createdAt)}</div><div class="cell-sub">${esc(userById(h.createdBy)?.name||'—')}</div>`}};
function getVisibleColumns(){return hostTable.columns.filter(k=>!hostTable.hidden.includes(k)&&COLS[k])}
function allHostSearchValue(h){return [h.id,h.name,h.address,h.addressType,sourceLabel(h),h.catalogBinding?.externalId||'',proxyName(h.proxyGroup),h.status,h.createdAt,userById(h.createdBy)?.name||'',...h.attachments.flatMap(a=>[groupById(a.attachedByGroupId)?.name||'',serviceById(a.serviceId)?.name||''])].join(' ').toLowerCase()}
function ruleValue(h,key){switch(key){case'source':return h.sourceType;case'addressType':return h.addressType;case'proxy':return h.proxyGroup;case'status':return h.status;case'serviceGroup':return h.attachments.map(a=>a.attachedByGroupId);case'service':return h.attachments.map(a=>a.serviceId);case'cmdb':return h.catalogBinding?.externalId||'none';case'name':return h.name;case'address':return h.address;case'id':return h.id;default:return ''}}
function passesRule(h,r){const v=ruleValue(h,r.field);if(Array.isArray(v))return v.some(x=>String(x)===String(r.value));const text=String(v||'').toLowerCase(),needle=String(r.value||'').toLowerCase();if(r.operator==='equals')return text===needle;if(r.operator==='starts')return text.startsWith(needle);return text.includes(needle)}
function filteredHostList(mode){let arr=(mode==='catalog'?catalogHosts():connectedHosts()).filter(h=>!hostFilter.query||allHostSearchValue(h).includes(hostFilter.query.toLowerCase()));arr=arr.filter(h=>hostFilter.rules.every(r=>passesRule(h,r)));const {sortKey,sortDirection}=hostTable;arr.sort((a,b)=>String(COLS[sortKey]?.value(a)||'').localeCompare(String(COLS[sortKey]?.value(b)||''),'ru',{numeric:true})*(sortDirection==='asc'?1:-1));return arr}
function renderHosts(){const title=hostView==='connected'?'Подключённые хосты':'Хосты из справочника';const sub=hostView==='connected'?'Хосты, на которых подключены сервисы ваших групп.':'Только хосты, синхронизируемые из внешнего справочника. Ручные хосты здесь не отображаются.';const canCreate=[...userGroupIds()].some(hasMonitoringPermission);const arr=filteredHostList(hostView);const total=hostView==='connected'?connectedHosts().length:catalogHosts().length;const body=`<div class="panel"><div class="host-switch"><button class="${hostView==='connected'?'active':''}" onclick="setHostView('connected')">🔗 Подключённые хосты</button><button class="${hostView==='catalog'?'active':''}" onclick="setHostView('catalog')">📚 Хосты из справочника</button></div><div class="info">${hostView==='connected'?'<b>Видимость:</b> вы видите хост только при наличии подключения от одной из ваших групп. В деталях доступны только attachment’ы ваших групп.':'<b>Каталог инфраструктуры:</b> здесь отображаются только синхронизируемые CMDB-хосты. Для подключения выберите строку и добавьте сервис своей группы.'}</div><div class="toolbar"><div class="actions"><input id="host-search" class="input" value="${esc(hostFilter.query)}" placeholder="Поиск по всем полям…" oninput="setGlobalHostSearch(this.value)"><button class="sm outline" onclick="openHostFilters()">⚲ Фильтры${hostFilter.rules.length?` (${hostFilter.rules.length})`:''}</button><button class="sm outline" onclick="openColumnSettings()">☷ Столбцы</button></div><div class="actions">${hostView==='connected'?`<button ${canCreate?'':'disabled'} onclick="openHostCreateModal()">➕ Создать хост</button>`:'<button class="outline" onclick="syncCatalogHosts()">🔄 Синхронизировать</button>'}</div></div>${hostFilter.rules.length?`<div class="filter-summary"><div class="filters-list">${hostFilter.rules.map((r,i)=>`<span class="filter-chip">${esc(filterFieldLabel(r.field))}: ${esc(filterValueLabel(r))} <button class="ghost xs" onclick="removeHostFilter(${i})">✕</button></span>`).join('')}<button class="ghost xs" onclick="clearHostFilters()">Очистить</button></div></div>`:''}<div class="stats"><div class="stat"><label>В представлении</label><b>${total}</b></div><div class="stat"><label>После фильтра</label><b>${arr.length}</b></div><div class="stat"><label>Справочные</label><b>${(hostView==='catalog'?catalogHosts():connectedHosts()).filter(h=>h.sourceType==='catalog').length}</b></div><div class="stat"><label>Ручные</label><b>${(hostView==='catalog'?catalogHosts():connectedHosts()).filter(h=>h.sourceType!=='catalog').length}</b></div></div>${renderHostTable(arr)}</div>`;page('hosts',title,sub,`<button class="outline" onclick="resetDemo()">↺ Сбросить демо</button>`,body)}
function setHostView(v){hostView=v;hostTable.page=1;renderHosts()}function setGlobalHostSearch(v){hostFilter.query=v;hostTable.page=1;renderHosts()}function sortHosts(key){if(hostTable.sortKey===key)hostTable.sortDirection=hostTable.sortDirection==='asc'?'desc':'asc';else{hostTable.sortKey=key;hostTable.sortDirection='asc'}renderHosts()}
function renderHostTable(arr){const cols=getVisibleColumns(),pages=Math.max(1,Math.ceil(arr.length/hostTable.pageSize));if(hostTable.page>pages)hostTable.page=pages;const start=(hostTable.page-1)*hostTable.pageSize,items=arr.slice(start,start+hostTable.pageSize);return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th class="sort" onclick="sortHosts(${q(c)})">${esc(COLS[c].label)} ${hostTable.sortKey===c?(hostTable.sortDirection==='asc'?'↑':'↓'):''}</th>`).join('')}<th>Действия</th></tr></thead><tbody>${items.length?items.map(h=>`<tr class="data-row" onclick="openHostDetails(${q(h.id)})">${cols.map(c=>`<td>${COLS[c].cell(h)}</td>`).join('')}<td onclick="event.stopPropagation()"><div class="actions"><button class="xs outline" onclick="openHostDetails(${q(h.id)})">Детали</button>${canAttachAny()?`<button class="xs" onclick="openAttachModal(${q(h.id)})">＋ Сервис</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">Хосты не найдены</td></tr>`}</tbody></table></div><div class="table-footer"><div class="muted">Показано ${items.length?start+1:0}–${Math.min(start+hostTable.pageSize,arr.length)} из ${arr.length}</div><div class="pagination"><select onchange="changeHostPageSize(this.value)">${[10,25,50,100].map(n=>`<option value="${n}" ${n===hostTable.pageSize?'selected':''}>${n} / стр.</option>`).join('')}</select><button class="xs outline" onclick="changeHostPage(-1)" ${hostTable.page<=1?'disabled':''}>←</button><span class="muted">${hostTable.page} / ${pages}</span><button class="xs outline" onclick="changeHostPage(1)" ${hostTable.page>=pages?'disabled':''}>→</button></div></div>`}
function changeHostPage(d){hostTable.page=Math.max(1,hostTable.page+d);renderHosts()}function changeHostPageSize(v){hostTable.pageSize=Number(v);hostTable.page=1;renderHosts()}
function filterFieldLabel(k){return({source:'Источник',addressType:'Тип адреса',proxy:'Группа прокси',status:'Статус',serviceGroup:'Группа сервиса',service:'Сервис',cmdb:'CMDB / External ID',name:'Имя',address:'IP / FQDN',id:'Host ID'})[k]||k}function filterValueLabel(r){if(r.field==='source')return r.value==='catalog'?'Справочник':r.value==='manual'?'Ручной':'Ручной · prefill';if(r.field==='proxy')return proxyName(r.value);if(r.field==='serviceGroup')return groupById(r.value)?.name||r.value;if(r.field==='service')return serviceById(r.value)?.name||r.value;if(r.field==='cmdb')return r.value==='none'?'Без связи с CMDB':r.value;return r.value}
function openHostFilters(){hostFilterDraft=hostFilter.rules.map(x=>({...x}));renderHostFilters()}
function filterValueControl(r,index){const opts=(items)=>items.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(r.value)?'selected':''}>${esc(x.name)}</option>`).join('');if(r.field==='source')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="catalog" ${r.value==='catalog'?'selected':''}>Справочник</option><option value="manual" ${r.value==='manual'?'selected':''}>Ручной</option><option value="manual-prefill" ${r.value==='manual-prefill'?'selected':''}>Ручной · prefill</option></select>`;if(r.field==='addressType')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="ip" ${r.value==='ip'?'selected':''}>IP</option><option value="fqdn" ${r.value==='fqdn'?'selected':''}>FQDN</option></select>`;if(r.field==='proxy')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.proxyGroups)}</select>`;if(r.field==='status')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="UP" ${r.value==='UP'?'selected':''}>UP</option><option value="WARN" ${r.value==='WARN'?'selected':''}>WARN</option></select>`;if(r.field==='serviceGroup')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.groups)}</select>`;if(r.field==='service')return `<select onchange="setFilterDraftValue(${index},this.value)">${opts(state.services)}</select>`;if(r.field==='cmdb')return `<select onchange="setFilterDraftValue(${index},this.value)"><option value="none" ${r.value==='none'?'selected':''}>Без связи с CMDB</option>${state.catalogHosts.map(h=>`<option value="${esc(h.externalId)}" ${h.externalId===r.value?'selected':''}>${esc(h.name)} · ${esc(h.externalId)}</option>`).join('')}</select>`;return `<input value="${esc(r.value||'')}" placeholder="Значение" oninput="setFilterDraftValue(${index},this.value)">`}
function renderHostFilters(){openModal('Фильтры хостов','Поиск по любому полю. Для справочных значений доступен выбор из списка.',`<div class="box blue-box">Все условия объединяются через «И». Поиск в верхней строке ищет сразу по всем полям, включая скрытые столбцы.</div><div id="filter-draft-list">${hostFilterDraft.length?hostFilterDraft.map((r,i)=>`<div class="row" style="align-items:end"><div class="field"><label>Поле</label><select onchange="setFilterDraftField(${i},this.value)">${['source','addressType','proxy','status','serviceGroup','service','cmdb','name','address','id'].map(k=>`<option value="${k}" ${r.field===k?'selected':''}>${filterFieldLabel(k)}</option>`).join('')}</select></div><div class="field"><label>Условие / значение</label><div class="actions">${['name','address','id'].includes(r.field)?`<select onchange="setFilterDraftOperator(${i},this.value)"><option value="contains" ${r.operator==='contains'?'selected':''}>содержит</option><option value="equals" ${r.operator==='equals'?'selected':''}>равно</option><option value="starts" ${r.operator==='starts'?'selected':''}>начинается с</option></select>`:''}${filterValueControl(r,i)}<button class="xs danger" onclick="removeFilterDraft(${i})">✕</button></div></div></div>`).join(''):'<div class="empty">Фильтры не заданы</div>'}</div><button class="sm outline" onclick="addFilterDraft()">＋ Добавить условие</button>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="hostFilterDraft=[];renderHostFilters()">Очистить</button><button onclick="applyHostFilters()">Применить</button>`)}
function defaultFilterValue(field){if(field==='source')return'catalog';if(field==='addressType')return'ip';if(field==='proxy')return state.proxyGroups[0]?.id||'';if(field==='status')return'UP';if(field==='serviceGroup')return state.groups[0]?.id||'';if(field==='service')return state.services[0]?.id||'';if(field==='cmdb')return'none';return''}function addFilterDraft(){hostFilterDraft.push({field:'source',operator:'equals',value:'catalog'});renderHostFilters()}function removeFilterDraft(i){hostFilterDraft.splice(i,1);renderHostFilters()}function setFilterDraftField(i,v){hostFilterDraft[i].field=v;hostFilterDraft[i].operator=['name','address','id'].includes(v)?'contains':'equals';hostFilterDraft[i].value=defaultFilterValue(v);renderHostFilters()}function setFilterDraftValue(i,v){hostFilterDraft[i].value=v}function setFilterDraftOperator(i,v){hostFilterDraft[i].operator=v}function applyHostFilters(){hostFilter.rules=hostFilterDraft.map(x=>({...x}));hostTable.page=1;closeModal();renderHosts()}function removeHostFilter(i){hostFilter.rules.splice(i,1);hostTable.page=1;renderHosts()}function clearHostFilters(){hostFilter.rules=[];hostFilter.query='';hostTable.page=1;renderHosts()}
function openColumnSettings(){const all=hostTable.columns;openModal('Столбцы таблицы','Скрывайте необязательные столбцы и меняйте порядок отображения.',`<div>${all.map((k,i)=>`<div class="card" style="align-items:center"><div class="card-main"><input class="checkbox" type="checkbox" ${!hostTable.hidden.includes(k)?'checked':''} onchange="toggleColumn(${q(k)},this.checked)"><div><div class="card-title">${esc(COLS[k].label)}</div><div class="meta">${k==='id'?'Сгенерированный уникальный идентификатор':'Поле таблицы'}</div></div></div><div class="actions"><button class="xs outline" onclick="moveColumn(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="xs outline" onclick="moveColumn(${i},1)" ${i===all.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`,`<button onclick="closeModal()">Готово</button>`,true)}
function toggleColumn(k,shown){if(shown)hostTable.hidden=hostTable.hidden.filter(x=>x!==k);else if(hostTable.hidden.length<hostTable.columns.length-1)hostTable.hidden.push(k);openColumnSettings();renderHosts()}function moveColumn(i,d){const j=i+d;if(j<0||j>=hostTable.columns.length)return;const a=hostTable.columns;[a[i],a[j]]=[a[j],a[i]];openColumnSettings();renderHosts()}
function canAttachAny(){return state.services.some(canAttachService)}
function openHostDetails(id){const h=state.hosts.find(x=>x.id===id);if(!h)return;const allowed=isAdmin()?h.attachments:ownAttachments(h);const foreign=isAdmin()?[]:foreignEndpointServices(h);const source=h.sourceType==='catalog'?`<div class="box violet-box"><b>Источник: ${esc(state.catalogSources.find(s=>s.id===h.catalogBinding?.sourceId)?.name||'CMDB')}</b><br>External ID: <span class="mono">${esc(h.catalogBinding?.externalId||'—')}</span><br><span class="hint">IP/FQDN обновляются синхронизацией.</span></div>`:h.sourceType==='manual-prefill'?`<div class="box amber-box"><b>Ручной хост, разово заполненный из справочника.</b><br>Автоматическая синхронизация выключена.</div>`:`<div class="box"><b>Источник: ручной ввод.</b><br><span class="hint">Хост не появляется во вкладке «Хосты из справочника».</span></div>`;openModal(`Хост: ${h.name}`,`${h.id} · имя не является уникальным`,`${source}<div class="row"><div class="box"><b>Адрес</b><br>${addressBadge(h)} <span class="mono">${esc(h.address)}</span></div><div class="box"><b>Группа прокси</b><br>${esc(proxyName(h.proxyGroup))}</div></div><h3 style="margin:18px 0 8px">Подключения моих групп</h3>${allowed.length?allowed.map((a,i)=>attachmentDetail(h,a,i)).join(''):'<div class="empty">У ваших групп нет подключённых сервисов на этом хосте.</div>'}${foreign.length?foreignEndpointBlock(h,foreign):''}`,`<button class="ghost" onclick="closeModal()">Закрыть</button>${canAttachAny()?`<button class="outline" onclick="openAttachModal(${q(h.id)})">＋ Подключить сервис</button>`:''}${canEditHost(h)?`<button class="outline" onclick="openHostEditModal(${q(h.id)})">✏️ Редактировать</button>`:''}${canDeleteHost(h)?`<button class="danger" onclick="openDeleteHostModal(${q(h.id)})">🗑️ Удалить хост</button>`:''}`)}
function attachmentDetail(h,a,i){const s=serviceById(a.serviceId),g=groupById(a.attachedByGroupId),port=a.portOverride||s?.defaultPort||'—',can=canDetach(a);return `<div class="card"><div class="card-main"><span class="icon">${esc(s?.icon||'🔌')}</span><div><div class="card-title">${esc(s?.name||'Сервис')}</div><div class="meta">Подключён от имени группы: <b>${esc(g?.name||'—')}</b> · Target: <span class="mono">${esc(h.address)}:${esc(port)}</span></div><div class="pill-row"><span class="badge">${esc(s?.type||'')}</span><span class="badge b-blue">${esc(s?.protocol||'http').toUpperCase()}</span>${a.portOverride?'<span class="badge b-amber">порт переопределён</span>':''}</div></div></div><div class="actions"><button class="xs outline" onclick="openPortModal(${q(h.id)},${q(a.id)})" ${can?'':'disabled'}>Порт</button><button class="xs danger" onclick="detachAttachment(${q(h.id)},${q(a.id)})" ${can?'':'disabled'}>Отвязать</button></div></div>`}
function foreignEndpointServices(h){const own=userGroupIds(),key=endpointKey(h),map=new Map();state.hosts.filter(x=>endpointKey(x)===key).flatMap(x=>x.attachments).filter(a=>!own.has(a.attachedByGroupId)).forEach(a=>{const gid=a.attachedByGroupId,sid=a.serviceId;if(!map.has(gid))map.set(gid,new Set());map.get(gid).add(sid)});return [...map.entries()].map(([gid,set])=>({gid,serviceIds:[...set]}))}
function foreignEndpointBlock(h,items){return `<div class="box blue-box" style="margin-top:16px"><b>Справка по тому же адресу</b><div class="hint">Для хостов MARS с ${h.addressType==='ip'?'тем же IP-адресом':'тем же FQDN'} <span class="mono">${esc(h.address)}</span> уже настроен мониторинг:</div>${items.map(x=>`<div style="margin-top:10px"><b>${esc(groupById(x.gid)?.name||'Группа')}</b><div class="pill-row" style="margin-top:5px">${x.serviceIds.map(id=>{const s=serviceById(id);return `<span class="badge b-violet">${esc(s?.icon||'🔌')} ${esc(s?.name||'Сервис')}</span>`}).join('')}</div></div>`).join('')}<div class="hint">Порты, параметры сборов и другие детали чужих подключений не раскрываются.</div></div>`}
function openAttachModal(hostId){const h=state.hosts.find(x=>x.id===hostId);if(!h)return;const permitted=state.services.filter(canAttachService);openModal('Подключить сервис',`${h.name} · ${h.id}`,`<div class="box blue-box">Группа подключения определяется владельцем выбранного сервиса. Подключить можно только сервис вашей группы с permission «Постановка на мониторинг».</div><div class="service-picker">${permitted.length?permitted.map(s=>{const already=h.attachments.some(a=>a.serviceId===s.id&&a.attachedByGroupId===s.ownerGroupId);return `<div class="card"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">Группа: ${esc(groupById(s.ownerGroupId)?.name||'—')} · ${esc(s.type)} · порт ${s.defaultPort}</div></div></div><button class="sm" onclick="attachService(${q(h.id)},${q(s.id)})" ${already?'disabled':''}>${already?'Уже подключён':'Подключить'}</button></div>`}).join(''):'<div class="empty">Нет сервисов, которые доступны для подключения.</div>'}</div>`,`<button onclick="closeModal()">Готово</button>`,true)}
function attachService(hostId,serviceId){const h=state.hosts.find(x=>x.id===hostId),s=serviceById(serviceId);if(!h||!s||!canAttachService(s))return toast('Недостаточно прав');if(h.attachments.some(a=>a.serviceId===serviceId&&a.attachedByGroupId===s.ownerGroupId))return toast('Сервис уже подключён этой группой');h.attachments.push({id:uid('att'),serviceId,attachedByGroupId:s.ownerGroupId,attachedByUserId:currentUser().id,attachedAt:now(),portOverride:null});saveState();openHostDetails(hostId);renderHosts();toast('Сервис подключён')}
function detachAttachment(hostId,aid){const h=state.hosts.find(x=>x.id===hostId),a=h?.attachments.find(x=>x.id===aid);if(!h||!a||!canDetach(a))return toast('Отвязать может только группа, подключившая сервис');h.attachments=h.attachments.filter(x=>x.id!==aid);saveState();closeModal();renderHosts();toast('Сервис отвязан. Хост исчезнет из вашего списка, если это было последнее подключение вашей группы.')}
function openPortModal(hostId,aid){const h=state.hosts.find(x=>x.id===hostId),a=h?.attachments.find(x=>x.id===aid),s=serviceById(a?.serviceId);if(!h||!a||!canDetach(a))return;openModal('Порт подключения',`${s?.name||'Сервис'} → ${h.name}`,`<div class="field"><label>Порт</label><input id="override-port" class="wide" type="number" min="1" max="65535" value="${esc(a.portOverride||s?.defaultPort||'')}"><div class="hint">Оставьте пустым для порта по умолчанию: ${s?.defaultPort||'—'}.</div></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button class="outline" onclick="savePortOverride(${q(hostId)},${q(aid)},true)">Сбросить</button><button onclick="savePortOverride(${q(hostId)},${q(aid)},false)">Сохранить</button>`,true)}
function savePortOverride(hostId,aid,reset){const h=state.hosts.find(x=>x.id===hostId),a=h?.attachments.find(x=>x.id===aid);if(!a||!canDetach(a))return;if(reset)a.portOverride=null;else{const v=$('override-port').value.trim();if(!v)a.portOverride=null;else{const n=Number(v);if(!Number.isInteger(n)||n<1||n>65535)return toast('Введите порт от 1 до 65535');a.portOverride=n}}saveState();openHostDetails(hostId);renderHosts();toast('Порт обновлён')}
function openHostCreateModal(){if(!canAttachAny())return toast('Нет permission «Постановка на мониторинг» ни в одной группе');hostDraft={mode:'manual',catalogId:'',selectedServiceIds:[],editingId:null};renderHostCreateModal()}
function renderHostCreateModal(){const cat=state.catalogHosts.find(x=>x.externalId===hostDraft.catalogId),p=hostDraft.mode==='prefill'&&cat?cat:{name:'',addressType:'ip',address:'',proxyGroup:state.proxyGroups[0]?.id||''};openModal('Создать ручной хост','Для обычного пользователя требуется минимум один сервис для первичного подключения.',`<div class="field"><label>Источник полей</label><select id="create-mode" class="wide" onchange="hostDraft.mode=this.value;hostDraft.catalogId='';renderHostCreateModal()"><option value="manual" ${hostDraft.mode==='manual'?'selected':''}>Ввести вручную</option><option value="prefill" ${hostDraft.mode==='prefill'?'selected':''}>Заполнить из справочника, но оставить ручным</option></select></div>${hostDraft.mode==='prefill'?catalogSelectBlock():''}<div class="row"><div class="field"><label>Имя хоста</label><input id="new-host-name" class="wide" value="${esc(p.name)}"><div class="hint">Не уникально: одинаковые имена разрешены даже в одной группе.</div></div><div class="field"><label>Группа прокси</label><select id="new-host-proxy" class="wide">${state.proxyGroups.map(g=>`<option value="${esc(g.id)}" ${g.id===p.proxyGroup?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Тип адреса</label><select id="new-host-type" class="wide"><option value="ip" ${p.addressType==='ip'?'selected':''}>IP-адрес</option><option value="fqdn" ${p.addressType==='fqdn'?'selected':''}>FQDN</option></select></div><div class="field"><label>IP / FQDN</label><input id="new-host-address" class="wide mono" value="${esc(p.address)}"></div></div><div class="separator"></div><h3>Первичное подключение</h3><div class="hint">Нужно выбрать хотя бы один сервис. Группа подключения определяется группой-владельцем сервиса.</div><div class="service-picker" style="margin-top:10px">${state.services.filter(canAttachService).map(s=>`<label class="card" style="cursor:pointer"><div class="card-main"><input type="checkbox" class="checkbox" ${hostDraft.selectedServiceIds.includes(s.id)?'checked':''} onchange="toggleDraftService(${q(s.id)},this.checked)"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">Подключится от имени: ${esc(groupById(s.ownerGroupId)?.name||'—')} · порт ${s.defaultPort}</div></div></div></label>`).join('')}</div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="createManualHost()">Создать и подключить</button>`)}
function catalogSelectBlock(){const list=state.catalogHosts;return `<div class="box"><b>Выберите запись справочника</b><div class="service-picker" style="margin-top:9px">${list.map(c=>`<div class="card" style="cursor:pointer" onclick="hostDraft.catalogId=${q(c.externalId)};renderHostCreateModal()"><div class="card-main"><span class="icon">📚</span><div><div class="card-title">${esc(c.name)}</div><div class="meta mono">${esc(c.address)} · ${esc(c.externalId)}</div></div></div>${hostDraft.catalogId===c.externalId?'<span class="badge b-green">✓ выбрано</span>':''}</div>`).join('')}</div></div>`}
function toggleDraftService(id,checked){if(checked){if(!hostDraft.selectedServiceIds.includes(id))hostDraft.selectedServiceIds.push(id)}else hostDraft.selectedServiceIds=hostDraft.selectedServiceIds.filter(x=>x!==id)}
function createManualHost(){const name=$('new-host-name')?.value.trim(),address=$('new-host-address')?.value.trim();if(!name||!address)return toast('Заполните имя и IP/FQDN');if(!hostDraft.selectedServiceIds.length&&!isAdmin())return toast('Обычный пользователь должен подключить минимум один сервис');if(hostDraft.mode==='prefill'&&!hostDraft.catalogId)return toast('Выберите запись справочника');const cat=state.catalogHosts.find(x=>x.externalId===hostDraft.catalogId);const h={id:'H-'+Math.random().toString(36).slice(2,10).toUpperCase(),name,addressType:$('new-host-type').value,address,proxyGroup:$('new-host-proxy').value,status:'UP',sourceType:hostDraft.mode==='prefill'?'manual-prefill':'manual',createdBy:currentUser().id,createdAt:now(),catalogBinding:null,prefilledFromCatalog:cat?{sourceId:cat.sourceId,externalId:cat.externalId,copiedAt:now()}:null,attachments:hostDraft.selectedServiceIds.map(sid=>{const s=serviceById(sid);return{id:uid('att'),serviceId:sid,attachedByGroupId:s.ownerGroupId,attachedByUserId:currentUser().id,attachedAt:now(),portOverride:null}})};state.hosts.push(h);saveState();closeModal();hostView='connected';renderHosts();toast('Ручной хост создан и сервисы подключены')}
function openHostEditModal(id){const h=state.hosts.find(x=>x.id===id);if(!h||!canEditHost(h))return toast('Изменение недоступно');openModal('Редактировать хост',h.id,`<div class="box amber-box">Изменение глобального хоста ограничено: у ручного хоста без подключений — создатель или администратор; у используемого или справочного — только администратор.</div><div class="row"><div class="field"><label>Имя</label><input id="edit-host-name" class="wide" value="${esc(h.name)}"></div><div class="field"><label>Группа прокси</label><select id="edit-host-proxy" class="wide">${state.proxyGroups.map(g=>`<option value="${esc(g.id)}" ${g.id===h.proxyGroup?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Тип адреса</label><select id="edit-host-type" class="wide"><option value="ip" ${h.addressType==='ip'?'selected':''}>IP</option><option value="fqdn" ${h.addressType==='fqdn'?'selected':''}>FQDN</option></select></div><div class="field"><label>IP / FQDN</label><input id="edit-host-address" class="wide mono" value="${esc(h.address)}"></div></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveHostEdit(${q(h.id)})">Сохранить</button>`)}
function saveHostEdit(id){const h=state.hosts.find(x=>x.id===id);if(!h||!canEditHost(h))return;h.name=$('edit-host-name').value.trim()||h.name;h.proxyGroup=$('edit-host-proxy').value;h.addressType=$('edit-host-type').value;h.address=$('edit-host-address').value.trim()||h.address;saveState();openHostDetails(id);renderHosts();toast('Хост обновлён')}
function openDeleteHostModal(id){const h=state.hosts.find(x=>x.id===id);if(!h||!canDeleteHost(h))return toast('Удалить хост может только MARS admin');confirmModal('Удалить глобальный хост',`Удалить <b>${esc(h.name)}</b> (<span class="mono">${esc(h.id)}</span>)?<br>Будет удалено подключений: ${h.attachments.length}.`,'deleteHost',q(id))}
function deleteHost(id){if(!isAdmin())return;state.hosts=state.hosts.filter(h=>h.id!==id);saveState();closeModal();renderHosts();toast('Хост удалён')}
function syncCatalogHosts(){let count=0;state.hosts.filter(h=>h.sourceType==='catalog').forEach(h=>{const c=state.catalogHosts.find(x=>x.sourceId===h.catalogBinding?.sourceId&&x.externalId===h.catalogBinding?.externalId);if(c){h.name=c.name;h.addressType=c.addressType;h.address=c.address;h.catalogBinding.lastSyncAt=now();h.catalogBinding.syncStatus='synced';count++}});saveState();renderHosts();toast(`Синхронизировано: ${count}`)}
function renderServices(){const arr=state.services;page('services','🔌 Сервисы','Сервис принадлежит группе. При подключении к хосту группа attachment определяется владельцем сервиса.',`<button onclick="openServiceModal()">➕ Создать сервис</button>`,`<div class="panel"><div class="info"><b>Группа подключения:</b> сервис подключается к хосту от имени своей группы-владельца. Это значение сохраняется в attachment для аудита.</div><div class="content">${arr.map(serviceCard).join('')||'<div class="empty">Нет сервисов</div>'}</div></div>`)}
function serviceCard(s){const g=groupById(s.ownerGroupId),can=canManageService(s),usage=state.hosts.reduce((n,h)=>n+h.attachments.filter(a=>a.serviceId===s.id).length,0);return `<div class="card"><div class="card-main"><span class="icon">${esc(s.icon)}</span><div><div class="card-title">${esc(s.name)}</div><div class="meta">${esc(s.type)} · ${String(s.protocol||'http').toUpperCase()} · порт <span class="mono">${s.defaultPort}</span> · ${esc(s.metrics||'/metrics')}</div><div class="pill-row"><span class="badge b-blue">👥 ${esc(g?.name||'—')}</span><span class="badge">${usage} подключений</span><span class="badge">${s.authMode==='none'?'Без auth':s.authMode==='basic'?'Basic Auth':'Bearer Token'}</span></div></div></div><div class="actions"><button class="xs outline" onclick="openCloneService(${q(s.id)})" ${can?'':'disabled'}>⧉ Клонировать</button><button class="xs outline" onclick="openServiceModal(${q(s.id)})" ${can?'':'disabled'}>✏️</button><button class="xs danger" onclick="deleteService(${q(s.id)})" ${can?'':'disabled'}>🗑️</button></div></div>`}
function groupOptions(selected){const gs=isAdmin()?state.groups:state.groups.filter(g=>hasMonitoringPermission(g.id));return gs.map(g=>`<option value="${esc(g.id)}" ${g.id===selected?'selected':''}>${esc(g.name)}</option>`).join('')}
function openServiceModal(id=''){const x=id?serviceById(id):null;if(x&&!canManageService(x))return toast('Недостаточно прав');const s=x||{name:'',type:'ExporterScrape',icon:'🔌',defaultPort:80,metrics:'/metrics',ownerGroupId:state.groups.find(g=>hasMonitoringPermission(g.id))?.id||'',authMode:'none',protocol:'http'};openModal(x?'Редактировать сервис':'Создать сервис','Сервис определяет группу будущего attachment’а.',`<div class="row"><div class="field"><label>Название</label><input id="svc-name" class="wide" value="${esc(s.name)}"></div><div class="field"><label>Группа-владелец</label><select id="svc-group" class="wide">${groupOptions(s.ownerGroupId)}</select></div></div><div class="row3"><div class="field"><label>Тип</label><select id="svc-type" class="wide"><option ${s.type==='ExporterScrape'?'selected':''}>ExporterScrape</option><option ${s.type==='SQL'?'selected':''}>SQL</option><option ${s.type==='BlackBox'?'selected':''}>BlackBox</option></select></div><div class="field"><label>Иконка</label><input id="svc-icon" class="wide" value="${esc(s.icon)}"></div><div class="field"><label>Порт</label><input id="svc-port" class="wide" type="number" value="${esc(s.defaultPort)}"></div></div><div class="row"><div class="field"><label>Путь метрик</label><input id="svc-metrics" class="wide mono" value="${esc(s.metrics)}"></div><div class="field"><label>Авторизация</label><select id="svc-auth" class="wide"><option value="none" ${s.authMode==='none'?'selected':''}>Без авторизации</option><option value="basic" ${s.authMode==='basic'?'selected':''}>Basic Auth</option><option value="bearer" ${s.authMode==='bearer'?'selected':''}>Bearer Token</option></select></div></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="saveService(${q(id)})">${id?'Сохранить':'Создать'}</button>`)}
function saveService(id=''){const s={id:id||uid('svc'),name:$('svc-name').value.trim(),type:$('svc-type').value,icon:$('svc-icon').value||'🔌',defaultPort:Number($('svc-port').value),metrics:$('svc-metrics').value.trim()||'/metrics',ownerGroupId:$('svc-group').value,authMode:$('svc-auth').value,protocol:'http',createdBy:id?serviceById(id)?.createdBy:currentUser().id};if(!s.name||!s.ownerGroupId||!Number.isInteger(s.defaultPort)||s.defaultPort<1)return toast('Заполните обязательные поля');if(!isAdmin()&&!hasMonitoringPermission(s.ownerGroupId))return toast('Нет права на группу');if(id){state.services[state.services.findIndex(x=>x.id===id)]={...serviceById(id),...s}}else state.services.push(s);saveState();closeModal();renderServices();toast(id?'Сервис обновлён':'Сервис создан')}
function openCloneService(id){const s=serviceById(id);if(!s||!canManageService(s))return;openModal('Клонировать сервис',s.name,`<div class="field"><label>Имя копии</label><input id="clone-service-name" class="wide" value="${esc(s.name+' copy')}"></div>`,`<button class="ghost" onclick="closeModal()">Отмена</button><button onclick="cloneService(${q(id)})">Создать</button>`,true)}function cloneService(id){const s=serviceById(id),name=$('clone-service-name').value.trim();if(!name)return toast('Введите имя');state.services.push({...s,id:uid('svc'),name,createdBy:currentUser().id});saveState();closeModal();renderServices();toast('Сервис склонирован')}
function deleteService(id){const s=serviceById(id);if(!s||!canManageService(s))return;confirmModal('Удалить сервис',`Удалить <b>${esc(s.name)}</b>? Все его attachment’ы будут удалены.`,'confirmDeleteService',q(id))}function confirmDeleteService(id){state.hosts.forEach(h=>h.attachments=h.attachments.filter(a=>a.serviceId!==id));state.collections.forEach(c=>c.serviceIds=c.serviceIds.filter(x=>x!==id));state.services=state.services.filter(s=>s.id!==id);saveState();renderAll();toast('Сервис удалён')}
function renderTemplates(){page('templates','🧩 Шаблоны сервисов','Шаблон задаёт базовую конфигурацию сервиса без параметров аутентификации.','',`<div class="panel"><div class="content">${state.templates.map(t=>{const g=groupById(t.ownerGroupId);return `<div class="card"><div class="card-main"><span class="icon">${esc(t.icon)}</span><div><div class="card-title">${esc(t.name)}</div><div class="meta">${esc(t.type)} · порт ${t.defaultPort} · ${esc(t.metrics)}</div><div class="pill-row"><span class="badge b-blue">${esc(g?.name||'—')}</span></div></div></div><button class="xs" onclick="createServiceFromTemplate(${q(t.id)})">Создать сервис</button></div>`}).join('')}</div></div>`)}
function createServiceFromTemplate(id){const t=state.templates.find(x=>x.id===id);if(!t)return;state.services.push({id:uid('svc'),name:t.name.replace(/^Шаблон\s*[«"]?(.+?)[»"]?$/,'$1'),type:t.type,icon:t.icon,defaultPort:t.defaultPort,metrics:t.metrics,ownerGroupId:t.ownerGroupId,authMode:'none',protocol:t.protocol||'http',createdBy:currentUser().id});saveState();switchSection('services');toast('Сервис создан из шаблона')}
function renderCollections(){page('collections','📦 Коллекции','Наборы сервисов для пакетного подключения к хостам.','',`<div class="panel"><div class="content">${state.collections.map(c=>`<div class="card"><div class="card-main"><span class="icon">📦</span><div><div class="card-title">${esc(c.name)}</div><div class="meta">${esc(c.description||'')}</div><div class="pill-row">${c.serviceIds.map(id=>{const s=serviceById(id);return s?`<span class="badge">${esc(s.icon)} ${esc(s.name)}</span>`:''}).join('')}</div></div></div></div>`).join('')}</div></div>`)}
function renderAccess(){const rules=[['Видимость «Подключённые хосты»','Есть attachment от одной из групп пользователя.'],['«Хосты из справочника»','Только Host с sourceType = catalog; ручные не показываются.'],['Создание ручного хоста','Обычный пользователь создаёт Host только вместе минимум с одним attachment.'],['Отвязать сервис','Только пользователь с permission «Постановка на мониторинг» в группе attachment’а.'],['Удалить Host','Только MARS admin.'],['Чужие подключения','В деталях не раскрываются; по совпадающему IP/FQDN доступна справка «группа → сервисы».']];page('access','👥 Доступ','Демонстрационная модель пользователей, групп и прав.','',`<div class="panel"><div class="info"><b>Выбранный вариант:</b> имя хоста не уникально. Единственная техническая идентичность — сгенерированный Host ID.</div><div class="content"><h3>Пользователи</h3>${state.users.map(u=>`<div class="card"><div class="card-main"><span class="avatar">${esc(u.initials)}</span><div><div class="card-title">${esc(u.name)} ${u.id===currentUser().id?'<span class="badge b-blue">текущий</span>':''}</div><div class="meta">${u.isAdmin?'MARS admin':'Пользователь'}</div><div class="pill-row">${u.groups.map(g=>`<span class="badge b-blue">${esc(groupById(g)?.name||g)}${u.permissions?.[g]?.includes('monitoring.manage')?' · monitoring.manage':''}</span>`).join('')}</div></div></div><button class="xs outline" onclick="switchUser(${q(u.id)})">Переключиться</button></div>`).join('')}<h3>Правила</h3><div class="box"><table style="min-width:0"><tbody>${rules.map(r=>`<tr><td style="padding:8px;border-bottom:1px solid #e2e8f0;font-weight:800">${r[0]}</td><td style="padding:8px;border-bottom:1px solid #e2e8f0">${r[1]}</td></tr>`).join('')}</tbody></table></div></div></div>`)}
loadState();renderAll();
</script>
</body>
</html>
